<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPM · Plataforma de Auditorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--dk:#0B2D50;--dk2:#123E69;--mid:#0E75BC;--cy:#42C6FF;--lt:#CFE2F1;--pale:#EAF1F7;--amb:#C87F0A;--grn:#16834E;--red:#D7263D;--gray:#5A6C7E;--txt:#10263B;--bd:#D7E1EB}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'IBM Plex Sans','Noto Sans KR','Malgun Gothic',Arial,sans-serif;color:var(--txt);font-size:14px;line-height:1.45;min-height:100vh;
background:radial-gradient(circle at 8% 3%,rgba(66,198,255,.16),transparent 27rem),radial-gradient(circle at 96% 12%,rgba(14,117,188,.13),transparent 30rem),linear-gradient(145deg,#f7fafc 0%,#eaf1f7 52%,#dce8f2 100%);background-attachment:fixed}
.mono{font-family:'IBM Plex Mono',monospace}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.hero{width:min(1180px,calc(100% - 32px));margin:18px auto 0;padding:18px 22px;border-radius:18px;border:1px solid rgba(255,255,255,.2);border-bottom:4px solid var(--red);background:linear-gradient(118deg,rgba(7,35,62,.98),rgba(11,63,105,.95) 62%,rgba(14,117,188,.9));box-shadow:0 18px 48px rgba(5,35,61,.22);color:#fff}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-box{width:190px;min-width:190px;height:74px;padding:11px 15px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(0,0,0,.22)}
.logo-box img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.brand-copy{flex:1;min-width:220px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:#8EDCFF;text-transform:uppercase;margin-bottom:4px}
.brand-copy h1{margin:0;font-size:clamp(19px,2.5vw,29px);font-weight:700;letter-spacing:-.02em}
.brand-sub{margin-top:4px;color:#D5E8F7;font-size:12px}
.hstat{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#D4E7F5;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:6px 10px;border-radius:8px;text-align:right;max-width:100%}
.pill.b{background:rgba(66,198,255,.14);border-color:rgba(142,220,255,.3);color:#F5FBFF;font-family:inherit;font-weight:600}
.langs{display:flex;gap:5px}.langs button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px}.langs button.sel{background:#fff;color:var(--dk)}
main{width:min(1180px,calc(100% - 32px));margin:14px auto 40px;display:grid;gap:14px}
/* ---- 07 carrusel curvo ---- */
.stage{position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 44px rgba(22,59,88,.22);isolation:isolate}
.s-curve{background:radial-gradient(70% 90% at 50% 0%,#0f3a63 0,#07203a 55%,#04111f 100%);height:clamp(440px,50vw,520px);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.s-curve.drag{cursor:grabbing}
.curve-head{position:absolute;left:24px;top:20px;z-index:3;max-width:48ch;pointer-events:none}
.curve-head b{display:block;font-weight:600;color:#f2f7fb;font-size:15px}
.curve-head span{color:#8fb0cc;font-size:12.5px}
.curve-scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%}
.ring{position:absolute;left:50%;top:54%;width:0;height:0;transform-style:preserve-3d}
.cc{position:absolute;width:224px;height:292px;left:-112px;top:-146px;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 20px 40px -18px rgba(0,0,0,.6);cursor:pointer}
.cc.light{color:var(--txt)}
.cc .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cc h3{margin:6px 0 4px;font-size:20px;line-height:1.1;letter-spacing:-.02em}
.cc p{margin:0;font-size:11.5px;opacity:.8}
.cc .prog{display:grid;gap:5px}
.cc .prog .row{display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:11px}
.cc .prog .row b{font-size:24px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;white-space:nowrap}.cc .prog .row span{white-space:nowrap}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}.cc.light .bar{background:rgba(11,45,80,.15)}
.bar i{display:block;height:100%;background:#7ee0a8;border-radius:9px;transition:width .5s}
.cc .go{margin-top:8px;border-radius:9px;padding:8px 10px;text-align:center;font-weight:700;font-size:12.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}.cc.light .go{background:rgba(11,45,80,.1);border-color:rgba(11,45,80,.25)}.cc.sel .go{background:#fff;color:var(--dk)}
.cc.sel{box-shadow:inset 0 0 0 2px var(--cy),0 24px 50px -18px rgba(66,198,255,.5)}
.carr-ctl{position:absolute;left:0;right:0;bottom:14px;z-index:3;display:flex;justify-content:center;align-items:center;gap:12px}
.carr-ctl button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:16px}
.carr-ctl button:hover{background:rgba(255,255,255,.22)}
.dots{display:flex;gap:7px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:.25s;cursor:pointer}.dots i.on{background:var(--cy);transform:scale(1.35)}
@media (max-width:600px){.cc{width:176px;height:240px;left:-88px;top:-120px;padding:13px}.cc h3{font-size:17px}.curve-head{left:16px}}
/* ---- paneles ---- */
.panel{background:rgba(255,255,255,.92);border:1px solid var(--bd);border-radius:16px;padding:20px 22px;box-shadow:0 10px 28px rgba(22,59,88,.1)}
.det{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;animation:fin .4s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:820px){.det{grid-template-columns:1fr}}
.det h2{margin:2px 0 6px;font-size:24px;letter-spacing:-.02em}
.ref{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mid);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.det p{color:#3d5368;margin:6px 0 12px}
.det ul{margin:0 0 14px;padding-left:18px;color:#3d5368}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--pale);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);font-weight:600}
.kpi b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi b.sm{font-size:15px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:13.5px;background:var(--dk);color:#fff;transition:.2s}
.btn:hover{background:var(--mid)}
.btn.sec{background:#fff;color:var(--dk);border:1px solid var(--bd)}.btn.sec:hover{background:var(--pale)}
.btn.red{background:#fff;color:var(--red);border:1px solid #f0c3c9}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.gauge{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px}
.gauge svg{flex:none;transform:rotate(-90deg)}
.gauge .gt b{display:block;font-size:15px}.gauge .gt span{font-size:12px;color:var(--gray)}
/* ---- vistas de módulo ---- */
.view{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(145deg,#f7fafc 0%,#eaf1f7 52%,#dce8f2 100%)}
.view[hidden]{display:none}
.vbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(118deg,#07233e,#0b3f69);color:#fff;border-bottom:3px solid var(--red)}
.vbar .back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px}
.vbar .back:hover{background:rgba(255,255,255,.25)}
.vbar h2{margin:0;font-size:16px;flex:1}.vbar .eyebrow{margin:0}
.vbar img{height:30px;background:#fff;border-radius:6px;padding:3px 6px}
#view-iatf{overflow:hidden}
#view-iatf iframe{display:block;width:100%;height:calc(100vh - 56px);border:0;background:#fff}
.wrapm{width:min(1100px,calc(100% - 28px));margin:14px auto 60px;display:grid;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;color:var(--gray)}
.tabs button.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.08);font-size:11px;margin-right:7px}
.tabs button.on .n{background:rgba(255,255,255,.2)}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--dk)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:block;font-size:11px;font-weight:600;color:var(--gray);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;font:inherit;background:#fcfdfe;color:var(--txt)}
textarea{min-height:58px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--gray)}
.chip.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.side{position:sticky;top:70px;display:grid;gap:6px}
@media (max-width:820px){.side{position:static;grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}}
.sb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--txt)}
.sb.on{border-color:var(--mid);box-shadow:inset 3px 0 0 var(--mid);background:#f4f9fd}
.sb .pc{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gray);white-space:nowrap}
.q{background:#fff;border:1px solid var(--bd);border-left:5px solid #c4d1de;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.q.bad{border-left-color:var(--red)}.q.mid{border-left-color:var(--amb)}.q.good{border-left-color:var(--grn)}
.q .qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qid{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--mid);font-size:12px}
.star{color:var(--red);font-weight:700;font-size:11px;background:#fdecee;border-radius:6px;padding:1px 7px}
.q h4{margin:4px 0 2px;font-size:14.5px;font-weight:600;flex-basis:100%}
.q .en{font-size:12px;color:var(--gray);margin:0 0 8px}
details{margin:6px 0;border:1px solid var(--bd);border-radius:9px;background:#f6fafd}
details summary{cursor:pointer;padding:7px 11px;font-size:12px;font-weight:600;color:var(--dk)}
details .dd{padding:2px 14px 10px;font-size:12px;color:#3d5368}
details ul{margin:4px 0;padding-left:16px}
.scale{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sc{min-width:52px;border:1px solid var(--bd);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;font-size:14px;color:var(--gray);font-family:'IBM Plex Mono',monospace}
.sc.on.r{background:var(--red);border-color:var(--red);color:#fff}.sc.on.a{background:var(--amb);border-color:var(--amb);color:#fff}.sc.on.g{background:var(--grn);border-color:var(--grn);color:#fff}.sc.on.n{background:var(--gray);border-color:var(--gray);color:#fff}
.crit{display:grid;gap:6px;margin:8px 0}
.cr{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--txt);align-items:flex-start}
.cr .p{flex:none;min-width:46px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;border-radius:7px;background:var(--pale);padding:2px 6px}
.cr.on{border-color:var(--mid);background:#eef6fc}.cr.on .p{background:var(--dk);color:#fff}
.hint{font-size:12px;color:var(--gray)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:var(--dk);color:#fff;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table.t td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
table.t tr:nth-child(even) td{background:#f6fafd}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;color:#fff}
.alert{border-radius:10px;padding:10px 14px;font-size:12.5px;border:1px solid}
.alert.w{background:#fff8e6;border-color:#f0d9a8;color:#7a5006}.alert.r{background:#fdecee;border-color:#f0c3c9;color:#8f1a2b}.alert.i{background:#eaf4fc;border-color:#bcd9ee;color:#12476f}.alert.g{background:#e8f6ee;border-color:#b5e0c7;color:#0d5a34}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.row-in{display:flex;gap:8px;margin-bottom:6px}
.row-in input{flex:1}
.x{border:1px solid var(--bd);background:#fff;border-radius:9px;width:36px;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1}
/* ---- módulos con diseño IATF ---- */
.mhero{width:min(1180px,calc(100% - 32px));margin:14px auto 0;padding:18px 22px;border-radius:18px;border:1px solid rgba(255,255,255,.2);border-bottom:4px solid var(--red);background:linear-gradient(118deg,rgba(7,35,62,.98),rgba(11,63,105,.95) 62%,rgba(14,117,188,.9));box-shadow:0 18px 48px rgba(5,35,61,.22);color:#fff}
.mhero .brand{align-items:center}
.mback{width:min(1180px,calc(100% - 32px));margin:12px auto 0;display:flex}
.mback button{background:#fff;border:1px solid var(--bd);color:var(--dk);border-radius:10px;padding:8px 14px;font-weight:700;font-size:12.5px;box-shadow:0 6px 18px rgba(22,59,88,.08)}
.mback button:hover{background:var(--pale)}
.showcase{position:relative;overflow:hidden;width:min(1180px,calc(100% - 32px));margin:14px auto 0;border-radius:18px;border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 44px rgba(22,59,88,.17);min-height:190px}
.showcase img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 52%}
.showcase .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,31,54,.94) 0%,rgba(7,45,77,.84) 38%,rgba(8,48,79,.28) 72%,rgba(4,24,43,.56) 100%)}
.showcase .ct{position:relative;z-index:1;padding:26px 30px;color:#fff;max-width:620px}
.showcase .ti{font-size:clamp(20px,2.6vw,30px);font-weight:700;line-height:1.1}
.showcase .de{margin-top:9px;color:#D6E8F5;font-size:13px;line-height:1.5}
.mnav{display:flex;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(22,59,88,.1);position:sticky;top:8px;z-index:5;overflow-x:auto;width:min(1180px,calc(100% - 32px));margin:14px auto 0}
.mnav button{flex:1;min-width:130px;border:0;background:none;padding:12px 8px;font-weight:700;color:var(--gray);border-bottom:3px solid transparent;white-space:nowrap}
.mnav button .n{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--lt);color:var(--dk);margin-right:6px;font-size:12px;text-align:center}
.mnav button.on{color:var(--dk);border-bottom-color:var(--red);background:var(--pale)}
.mnav button.on .n{background:var(--dk);color:#fff}
.wrapm{width:min(1180px,calc(100% - 32px))}
.card{box-shadow:0 6px 18px rgba(22,59,88,.06);padding:18px}
.card h3{font-size:18px}
.card .sub{color:var(--gray);margin:-6px 0 14px;font-size:13px}
label.f{text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:700}
@media print{body{background:#fff}.hero,main,.vbar,.tabs,.side,.btns,.noprint,.mback,.mnav,.showcase,.mhero .langs{display:none!important}.view{position:static;overflow:visible}.view[hidden]{display:none!important}.wrapm{width:100%;margin:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

"use strict";
const SQD=[{"id":"1-1","c":"Ⅰ Común · Partes subcontratadas","k":false,"t":"Status of Outsourced Part / Raw Material Inspection Agreement and Suitability Control of Inspection Standard","es":"Acuerdo de inspección de partes subcontratadas / materia prima e idoneidad del estándar de inspección","rq":"▷ Status of Outsourced Part / Raw Material Inspection Agreement\n     - Receive / Maintain a copy of 1st tier supplier inspection agreement for the customer supplied parts.\n     - Substitute inspection agreement with inspection standard when difficult to implement inspection agreement \n       (Example:  Raw material supplied by large corporations, plating industry, etc.)\n ▷ Suitability of Inspection Standard of Outsourced Part / Raw Material (Inspection Item, Inspection and Measurement Period, \n                                                                                                                   Mesurement Method, etc.)\n     - Establishemt and implementation of inspection standard for the customer supplied parts\n     - Mill Sheet receiving status and periodic material property inspection status\n ▷ Control plan implementation status for inspection items within the inspection agreement (including customer supplied items)","cr":[["Outsourced Part / Raw Material Inspection Agreement and Inspection Standard not established",0],["Outsource Part / Raw Material Inspection Agreement / Standard implemented, but some key items omitted causing quality issues",0.5],["Outsourced Part / Raw Material Inspection Agreement / Standard implemented, but some items do not correspond with control plans and other standards.",1],["Outsourced Part / Raw Material Inspection Agreement has been implemented.  Inspection Standard and other related standards have been prepared and the details are satisfactory",1.5],["Inspection Agreement has been implemented, and all details of Inspection standards and other related standards are satisfactory.  Excellent revision control implemented.",2]]},{"id":"1-2","c":"Ⅰ Común · Partes subcontratadas","k":false,"t":"Income & Periodic Inspection Implementation Status for Outsourced Part / Raw Material","es":"Inspección de recibo y periódica de partes subcontratadas / materia prima","rq":"▷ Income Inspection Log List Control Status\n ▷ Daily Inspection, Periodic Inspection Standard / Procedure Preparation and Compliance Status\n ▷ Pre / Post Inspection Identification and FIFO Control\n ▷ Inspection Master (Master Sample) Control Status, Packaging Condition of Packaged Parts\n ▷ Measuring Instrument / Inspection Equipment Retention and Utilization Status \n ▷ Outsourced Part Inspection Result Control (Daily, Periodic, Reliability Inspection) and Assurance of Inspection Capability\n ▷ Non-conforming Part Handling Procedure and the Countermeasure Preparation Status (Non-conforming Part Containment Control)\n ▷ Outsourced Part incoming Inspection/annual inspection Control (Mill sheet received/verify, self insepction report , 3rd part lab report)","cr":[["Outsourced Part / Raw Material receiving inspection standard and procedure not implemented, and any inspection is not being carried out for all parts",0],["Outsourced Part / Raw Material receiving inspection and periodic inspection requirements are insufficient, and inspection is not being carried out for some of the parts",1],["Outsourced Part / Raw Material receiving inspection and periodic inspection requirements are satisfactory, but some of the inspection have been omitted",1.5],["Outsourced Part / Raw Material receiving inspection and periodic inspection requirements are satisfactory",2.5],["Receiving Inspection and Periodic Inspection requirements are satisfactory.  Excellent countermeasure preparation and its effectiveness verification",3]]},{"id":"1-3","c":"Ⅰ Común · Partes subcontratadas","k":false,"t":"Outsourced Part / Raw Material Storage Condition (Contamination of Foreign Objects, Damage Prevention, FIFO, Inventory Control, etc.)","es":"Condiciones de almacenamiento de partes / materia prima (objetos extraños, prevención de daños, PEPS, control de inventario)","rq":"▷ Warehouse Layout Status Map, FIFO Structure (Structural System, Receiving / Issuing Process Display)\n ▷ Outsourced Part / Raw Material Management Condition (Damage, Corrosion, etc.)\n ▷ Outsourced Part / Raw Material Identification Control (Inspection Status, Material Grade, Material of Long-term disuse, etc.)\n ▷ Outsourced Part / Raw Material Storage Condition (Contamination of Foreign Object, packae damage, \n      Use of packaging material from the raw material manufacturer)\n ▷ Residual quantity control status after a process input (Storage condition / Identification Indication / expiration date, etc.)","cr":[["Outsourced Part / Raw Material Control / Identification / Storage Standard, etc. procedure not established",0],["Outsourced Part / Raw Material Control / Identification / Storage Standard have been established, but not properly controlled due to incompliance of standards",1],["Outsourced Part / Raw Material Control / Identification / Storage Standard have been established, but some modifications to requirements are necessary",1.5],["Outsourced Part / Raw Material Control / Identification / Storage Standard satisfy requirements",2.5],["Outsourced Part / Raw Material Control / Identification / Storage Standard satisfy requirements, and controlled in conjunction with computer system",3]]},{"id":"2-1","c":"Ⅰ Común · Control de proceso","k":false,"t":"Standards (Control Plan, Inspection Standard, Work Standard) Preparation and Revision History Implementation Status","es":"Elaboración de estándares (Plan de Control, estándar de inspección, instrucción de trabajo) e historial de revisiones","rq":"▷ Document Control Condition such as Control Plan / Work Standard Preparation and Revision Control\n   - Condition Control / Self Inspection Item, Specification, Period, Control Assignment, Record Control, Non-Conformance Handling\n      (Including Verification of Key Requirement/Necessity Item Omission Status)\n ▷ Conformity and Connection Status between Work Standards, Control Plans and Inspection Standards\n ▷ Process FMEA Preparation and Verify in connection with Quality Document Details (Recommandation)","cr":[["Standards such as Control Plan, Work Standard, Inspection Standard, etc. not prepared",0],["Control Plan, Work Standard, Inspection Standard have been prepared, but key inspection items / standards haven been ommitted",1],["Control Plan, Work Standard, Inspection Standard have been prepared / displayed, but not corresponding with the actual control conditions",1.5],["Control Plan, Work Standard, Inspection Standard, Process FMEA, etc. satisfy requirements",2.5],["Control Plan, Work Standard, Inspection Standard, Process FMES, etc. satisfy requirements.  Excellent document revision history control",3]]},{"id":"2-2","c":"Ⅰ Común · Control de proceso","k":false,"t":"Container Load Standard per Part and Handling Status, Part Container Control Status, Process 3P5C","es":"Estándar de carga de contenedor por parte, manejo y control de contenedores; 3P5C del proceso","rq":"▷ Suitability of Display and Identification of Part Identification Tag / Process Transfer Tag for Prevention of Part Mixing\n    - Lot Control Status such as the Identification of Inspection Status of Completed Part, etc.\n ▷ Standardization of Completed Part Container per Part and Customer Approval Control (Load Quantity / Weight)\n    - Industries that are, realistically, hard to standardize and approve container shall establish own control standard (Verify control status)\n       (Verify Container Control and Handling Condition, ex: Surface Treatment, Heat Treatment, \n        Same Container for Receiving / Shipping from Suppliers)\n    - Container Selection considering the characteristics of Part (Prevention of Inflow of Foreign Object, Contamination Prevention Cover, etc.)\n    - Multi-Level Loading and Plant Floor Storage Condition (Paper Box, Plastic Box, Designated Container, etc.)\n ▷ Periodic Inspection of Illumination Level in the work areas / inspection areas\n    - Illumination Level Control Standard Preparation / Implementation Status (Measuring area: Illuminatino Level of each Key Processes)\n ▷ Periodic 3C5S checks to Improve Plant Floor \n    - Objective Evaluation through Utilization of Check Sheet and Point System (Recommendation)\n\n ※3P : Proper Items, Proper Quantity, Proper Place\n     5C :composition / coordination / cleaning / cleanliness / carriage of attitude","cr":[["Standardization of Part Handling, Part Identification and Customer Approval Control not implemented",0],["Standardization of Part Handling, Part Identification and Customer Approval control implemented but not complied appropriately",1],["Some of the requirements for standardization of part handling, part identification, customer approval control, illumination level control, etc. are not satisfactory",1.5],["The requirements for standardization of part handling, part identification, customer approval control, illumination level control, etc. are satisfactory",2.5],["All above requirements are satisfactory, and implemented excellent periodic checks and improvement activities for 3C5S",3]]},{"id":"2-3","c":"Ⅰ Común · Control de proceso","k":true,"t":"Lot Traceability Control (Raw Material~Completed Part, Completed Part Shipping, etc.)","es":"Control de trazabilidad por lote (materia prima → pieza terminada → embarque)","rq":"▷ Preparation, Control and Record Condition for Lot Traceability of Outsourced Part / Raw Material, Subsidiary Part and Completed Part\n    - Suitability of Process Transfer Tag Utilization / Control and Record Condition\n    - Part / Press Die Lot No. Control Status, Part Container Identification Status, Long-Term In-Process Part, etc.\n    - Prevention of Residual Part Inflow and FIFO\n    - FIFO plan preparation and compliance status when Bar-Code system is Implemented\n ▷ For Security / Safety Part, Security / Safety Process shall be indicated to be identified on the Part (Lot Mark, Identification Mark, etc.)","cr":[["Lot Traceability Control Standard not prepared, and Record Control not implemented",0],["Lot Traceability Control Standard prepared, but Record Control not implemented",1.5],["Lot Traceability Control prepared and implemented, but traceability not verified due to partially omitted record control",3],["Requirements for Lot Traceability Control Standard and Security / Safety Part are satisfactory",4.5],["Requirements for Lot Traceability Control Standard and Security / Safety Part are satisfactory, and controlled in conjunction with computer system such as the barcode system",6]]},{"id":"2-4","c":"Ⅰ Común · Control de proceso","k":false,"t":"Key Process Quality Status Display Preparation/Display and Control Status","es":"Exhibición y control del estado de calidad de procesos clave","rq":"▷ Key Process Quality Status Board Preparation Details and Display Locations\n     - Details : IQS Improvement, Field Claims, Advance Verification Part, Non-conforming Part found at Customer/HKMC location\n     - Location : Display in Relevant Process\n       (Example: Receiving Inspection Process, Relevant Process of Quality Issue Occurrence, Completed Part Inspection Process)\n ▷ Prepare / Update the most updated quality status board with most recent quality issues(Verify update status:  minimum 1 / month) \n ▷ Display Key Process Quality Status Board.  Verify the information understanding level of team members and \n      managers for the relevant process\n ▷ Identification of Critical Process and Key Control Process in Work standard, Inspection Standard","cr":[["Critical Process and Key Control Process not identified, nor displayed, in Work Standard or Inspection Standard",0],["Critical Process and Key Control Process identified, but Quality Status Board not prepared / displayed",0.5],["Requirements for quality status preparation / display sati s of Equipment installed gauges and operation switches\n ▷ Measurement Gauge Inspection / Calibration Status (Internal and Comparison Inspection / Calibration Capability)\n ▷ Equipment Oil and Coolant Leak Control Status\n ▷ Prevent any random change of equipment settings by operators","cr":[["Equipment daily inspection control standard not established and the daily inspection not performed",0],["Equipment daily inspection control standard established and the inspection being performed, but some inspection items omitted",1],["Equipment daily inspection  and gauge verification / calibration being performed, but some of the requirements are not satisfactory",1.5],["Equipment daily inspection and gauge verification / calibration requirements are satisfactory",2.5],["Equipment daily inspection and gauge verification / calibration requirements are satisfactory.  Excellent improvement activities",3]]},{"id":"3-2","c":"Ⅰ Común · Control de equipo","k":false,"t":"Periodic Inspection for Equipment Preventive Maintenance Activities and Spare Part Control Status","es":"Inspección periódica y mantenimiento preventivo del equipo; control de refacciones","rq":"▷ Equipment Periodic Inspection Plan Establishment and Implementation Status\n ▷ Key Equipment Periodic Inspection Standard Establishement and Utilization Status\n ▷ Consumable and Spare Part Control Status (Safety Stock Control)\n ▷ Improvement Activity Implementation Status according to the Equipment Maintenance Activity","cr":[["Equipment Periodic Inspection Plan Not Established",0],["Equipment Periodic Inspection Plan established, but for some equipment, the plan not yet established for some equipment",1],["Equipment Periodic Inspection being implemented as planned,m but maintenance / repair required for some equipment",1.5],["Equipment Periodic Inspection and Spare Part Control requirements are satisfactory",2.5],["Equipment Periodic Inspection and Spare Part Control requirements are satisfactory.  Improvement activities to prevent reoccurrence are continually performed",3]]},{"id":"4-1","c":"Ⅰ Común · Inspección/Prueba","k":false,"t":"1st Tier Supplier Inspection Agreement conclusion and implementation status of Periodic Inspection/Test","es":"Acuerdo de inspección con proveedor de 1er nivel e implementación de inspección/pruebas periódicas","rq":"▷ Inspection Agreement and Approved Copy Retention Status per Part\n ▷ Inspection Criteria / Period Implementation Status (Control Plan, Work Standard, Inspection Standard)\n ▷ Annual Periodic Inspection / Reliability Testing Performance and the Result Maintenance Status\n ▷ Environmental Restriction (Heavy Metal) Related Periodic Testing Performance Status: Request made to \n     1st tier supplier or Authorized / Approved Testing Institution","cr":[["Inspection standard not prepared and implemented because the Inspection Agreement, per part, has not been concluded",0],["Insufficient inspection standard preparation and implementation because the inspection agreement has not been concluded for some parts",1],["Inspection agreement has been concluded, but some of the requirements for the completed part inspection standard and the periodic inspection are omitted",2],["Inspection agreement has been concluded and the requirements for the completed part inspection standard and the periodic inspection are satisfactory",3.5],["Inspection agreement has been concluded and the requirements for the completed part inspection standard and the periodic inspection are satisfactory.  Excellent revision history control",4]]},{"id":"4-2","c":"Ⅰ Común · Inspección/Prueba","k":false,"t":"Measuring Equipment Preparation/Control Status, Verification/Calibration Status (Including Gauge R&R)","es":"Equipo de medición: preparación, control, verificación/calibración (incluye Gage R&R)","rq":"▷ Mesuring Equipment and Inspection Fixture Reliability Assurance Status \n     (Verification/Calibration Period Set, Calibration Condition)\n ▷ Mesuring Equipment Verification/Calibration Schedule vs. Result Control Status \n     (Measuring Equipment Verification/Calibration Report, Tag Attachement Status, etc.)\n ▷ Periodic Gauge R&R Performance Status\n ▷ For High-Priced Measuring Equipment, Certification from the 1st Tier Supplier or Approved Testing Institution Required\n    (Example: CMM, Chemical Component Analyzer, etc.)","cr":[["Necessary measuring equipment not prepared and verification/calibration not performed (including externally performed verification/calibration)",0],["Some necessary measuring equipments available, but verification/calibration not performed for the equipments",1],["Necessary measuring equipments available and verification/calibration performed for the equipment, but the gauge R&R not performed.",2],["Necessary measuring equipments available, and the verification/calibration performance condition is satisfactory.  Gauge R&R performed",3.5],["Necessary measuring equipments available.  Excellent verification/calibration and gauge R&R performance status (Good Post-Countermeasure and Countermeasure Implementation History)",4]]},{"id":"5-1","c":"Ⅰ Común · Gestión de calidad","k":false,"t":"Organizational Status for Establishing / Maintaining Quality Management System and Job Assignment Control Status","es":"Organización para establecer y mantener el SGC y control de asignación de puestos","rq":"▷ Internal Quality Management System Establishement and Implementation Status\n   - Quality Manual/Procedure/Instruction Availability and Implementation Status\n   - Team Organization Status for Set-Up / Stablization\n   - Detailed Job Assignment Preparation Status\n ▷ Basis for Quality Management System Implementation Target and Improvement Activities to Achieve the Target (Post-action)","cr":[["Team / Department for setting-up / implement QMS not organized",0],["Team / Department for setting-up / implement QMS organized, but the job assignment not prepared",0.5],["Team organized for maintaining QMS and job assignment prepared, but the QMS target set only in formality",1],["Team organized for maintaining QMS and job assignment prepared.  The target / result control is satisfactory",1.5],["Works are processed in accordance with the organization set-up / job assignment.  Excellent improvement activities for achieving targets",2]]},{"id":"5-2","c":"Ⅰ Común · Gestión de calidad","k":false,"t":"New/Transferred Team Member and Management Training (Including Special Characteristics Process and Foreign Operator","es":"Capacitación de personal nuevo/transferido (incluye procesos de características especiales y operadores extranjeros)","rq":"▷ Realization / Control of Processes with Special Characteristics\n   - Qualification Certification Standard Establishment and Qualification Granting and Renewing Status for Operators / Inspectors / Testers in Key Processes\n      ⇒ Qualification Certification Standard:  Training, Experience, Relevant Evaluation (Written/Skill Test) and Refresher Training\n ▷ Documentation of Training Procedure \n   - for New/Transferred/Key and Special Characteristic Process Operator and Foreign Operator, etc.\n ▷ When Quality Issue Occurs, Field Training, Reoccurrence Prevention Training performed for Operators\n ▷(Main Security/Special characteristics Process)  (operator & inspector)'s real name register / contorl","cr":[["No training performed because of no documentation of training procedure nor training plan establishment",0],["Annual internal/external training plan established, but not implemented as planned",0.5],["Annual internal/external training plan established, but the training plan is insufficient and some trainings are not performed",1],["Annual internal/external training performed as planned, and the qualification certification control status is satisfactory",1.5],["Excellent annual training performance, and the qualification certification control for the key process operators and inspectors is satisfactory",2]]},{"id":"5-3","c":"Ⅰ Común · Gestión de calidad","k":false,"t":"Control Status of Vulnerable Time Period for Quality Control (Late Night, Before and After Shift Changes, etc.)","es":"Control de periodos vulnerables de calidad (madrugada, antes/después de cambio de turno, etc.)","rq":"▷ Key Verification Item\n   - Verify Cleanliness of Plant Floor, Outsourced Part / Raw Material Control, Equipment / Process Control, \n     Quality Control System\n\n ▷ Control Standard Establishment and Control Status\n   - Establishment and Control Status of Control Standard for Pre-Operation Daily Check Up (Day / Night Shift), \n    Self Inspection and Rounding Inspection.\n   - Non-Conformance Control Standard Establishment and Control Standard","cr":[["Control Standard not established for Quality Control during vulnerable time period",0],["Control Standard established, but the standards are insufficient and not well controlled",0.5],["Control Standard is satisfactory, but countermeasures not implemented and insufficiently controlled when non-conformance occurs",1],["Control Standard and Control Status satisfactory",1.5],["Control Standard and Control Status satisfactory.  Excellnet analysis / improvement measure performed when problems occur",2]]},{"id":"5-4","c":"Ⅰ Común · Gestión de calidad","k":false,"t":"Process / Customer Defect Correction and Countermeasure, Effectiveness Evaluation (Including Quality Target/Result)","es":"Corrección y contramedidas de defectos de proceso/cliente y evaluación de eficacia (incluye objetivos y resultados de calidad)","rq":"▷ Establishment of Quality Targets and Detailed Implementation Plan.  Notification of Daily Quality Result and Monthly\n     Comprehensive Result to 1st Tier Supplier\n   - Result Control in comparison with the Targets from Previous Year (Input into VAATZ system lead by 1st Tier Supplier)\n      ⇒ Process Defect (Production Quantity, Defect Quantity, PPM), Customer Defect (Delivery Quantity, Defect Quantity, PPM), Outsourcing Defect (Receiving Quantity, Defect Quantity, PPM)\n   - Establish Improvement Measure and Continual Result Control for Target Shortfalls\n ▷ Periodic Process/Customer Defect Cause Analysis/Corrective Action/Effectiveness Verification/Horizontal Deployment\n      Implementation Status\n ▷ Process defect part's storage box must be on the factory seperately(RED BOX)\n     - Daily cross check quantity between occured defect parts and actual confirm parts","cr":[["Process/Customer/Outsourcing Defect Status Summary Control not performed",0],["Process/Customer/Outsourcing Defect Status is controlled, but the basis for target setting is insufficient.  Some result control have been omitted.",1],["Process/Customer/Outsourcing defect Status is being summarized, but the quality issue improvement activity is insufficient",2],["Process/Customer/Outsourcing Defect Status summarization and Improvement activity satisfy requirements",3.5],["Process/Customer/Outsourcing Defect summarization and Improvement activity satisfy requirements, and horizontal deployment activity to other car models is excellent",4]]},{"id":"6-1","c":"Ⅱ Inyección · Materiales","k":false,"t":"Production by Item, management status of raw materials use and setting of the basic unit weight control standards","es":"Producción por ítem, control del uso de materia prima y estándar de peso unitario base","rq":"▷ Reference with weight unit criteria per production item(the amount of resin input and scrap)\n ▷ Scrap disposal reference data(Record of scrap disposal, scrap mix and etc.) \n ▷ Improvement activity data to reduce usage of material","cr":[["Without weight unit criteria per production item",0],["with weight unit criteria per production item, no set up an amount of scrap per item",1],["with weight unit criteria per production item, some are left out by the criteria(Need revised management)",1.5],["With weight unit criteria per production item, set up an amount of scrap per item",2.5],["With weight unit criteria per production item and satisfy above condition",3]]},{"id":"6-2","c":"Ⅱ Inyección · Materiales","k":false,"t":"F/P. Raw material dryers, Feeder utilization and filter Maintenance status","es":"F/P. Secadores de materia prima, uso de alimentadores y mantenimiento de filtros","rq":"▷ Water content criteria per material, setting standard of drying temperature and time (test evidence must be needed)\n ▷ Water measurement data after drying material (approve only from tester)(Demand sample test)\n ▷ Manage replacement record of dryer and feeder's filter and clean the feeder, Height sensor for material\n ▷ (F/P) Measure water content in material before putting into injection mold (To prevent watering, alarm when material put into)\n     - The time material water content : Restart dry hopper and change material\n     - Alarming when not enough material in dry hopper\n    -  Measuring material's water content before putting into injection mold, computer (keep test report)\n       * Computer record : Able to look up data on a computer\n         ex) Scan, Excel[MS office doc], Auto recording, etc.\n    - Able to set up the sensor in feeder","cr":[["Without water content criteria per material and standard of drying",0],["With water content criteria per material and setting up drying criteria but not measuring water content",1],["With water content criteria per material and setting up drying criteria, insufficient to manage replacement record of filter",2],["With water content criteria per material and setting up drying criteria, manage replacement and cleaning filter and feeder",3.5],["With water content criteria per material and setting up drying criteria and satisfy above condition",4]]},{"id":"6-3","c":"Ⅱ Inyección · Materiales","k":true,"t":"Virgin resin, scrap Mix Standard setting and compliance","es":"Estándar y cumplimiento de mezcla de resina virgen / scrap","rq":"▷ Mixture standard for resin and scrap per material and item & daily record\n ▷ Test material about properties of scrap mixture and customer approval file\n ▷ Condition of scrap blender (Auto blender, timer)\n ▷ Verification material about regular ratio or mixture (Demand test a sample)\n ▷ Operation state of isolated blender and utilization state of blender per material\n ▷ Inspection standard of blender blade and debris, recording\n ▷ Take low grade when sub contractor use secondary material ( except for operating their own recycle process)","cr":[["Without mixture standard for resin and scrap per material and item",0],["With mixture standard for resin and scrap per material and item, not managing mixture record",1.5],["With mixture standard for resin and scrap per material and item, managing mixture record, not checking mixture periodically",3],["With mixture standard for resin and scrap per material and item, managing mixture record, checking mixture periodically",4.5],["With mixture standard for resin and scrap per material and item and satisfy above conditions",6]]},{"id":"7-1","c":"Ⅱ Inyección · Gestión de proceso","k":false,"t":"F/P.Molding condition setting, compliance and record status","es":"F/P. Condiciones de moldeo: ajuste, cumplimiento y registro","rq":"▷ Main control point : Temp , time, pressure, velocity, hold pressure, cushions, etc.\n ▷ Alarming when there is a trouble on control point & recording worked condition\n ▷ (F/P) Recording molding condition on a computer & Setting up alarm\n   - Operating light bar when molding condition can't satisfy the standard\n   - Mold condition every unit in the beginning, middle and last. recording whenever changing the condition\n     *  Computer record : Able to look up data on a computer \n         Ex) Scan, Excel[Ms office doc], Auto recording, etc.\n   -  Mold condition( standard of molding condition per item)\n      * Compulsory installation  → Nozzle temp(resin temp) : ±5℃ / Hydraulic temp : ±5℃ \n      * Coolant (Facility/mold) inflow/outflow temp management \n             → Record examination with naked eye when inspecting facility : ±3℃ (alarm system)\n      * Other mold condition(pressure, velocity, location, weighing, time, etc.) : ±5%","cr":[["Without molding condition criteria per item",0],["With molding condition criteria per item, not following and recording",1],["With molding condition criteria per item, following and recording partially",2],["With molding condition criteria per item, following and recording well",3.5],["With molding condition criteria per item, following and recording well and timely alarm system",4]]},{"id":"7-2","c":"Ⅱ Inyección · Gestión de proceso","k":false,"t":"Initial allowed defectiveness each item standard setting and compliance","es":"Estándar y cumplimiento de defectuosos iniciales permitidos por ítem","rq":"▷ Keep the reference permissible sub-quality criteria per item in the beginning (T/OUT report)\n ▷ Following permissible defect criteria when changing molding condition and recording \n   -  Work procedure, record( Work daily or self-inspection sheet)","cr":[["Without permissible defect criteria per item",0],["With permissible defect criteria per item, no reference(T/OUT report)",1],["With permissible defect criteria per item, not enough reference and following",2],["With permissible defect criteria per item (include reference) and following well",3.5],["With permissible defect criteria per item and following well and satisfy above condition",4]]},{"id":"7-3","c":"Ⅱ Inyección · Gestión de proceso","k":false,"t":"Product take-out devices and mold protection device utilization status","es":"Uso de dispositivos de extracción de producto y de protección del molde","rq":"▷ Operate take-out device(take-out robot, automatic unload, take-out by hand) & prevent transformation\n ▷ Setting up a mold protection and management condition(work condition , regular check-up)","cr":[["Able to transform an item because of not managing take-out procedure",0],["Managing take-out procedure but still transforming some parts of an item",1],["Managing take-out procedure, but not fully setting up a mold protection",1.5],["Managing take-out procedure and setting up a mold protection well",2.5],["Managing take-out procedure and operating mold protection and satisfy above conditions",3]]},{"id":"7-4","c":"Ⅱ Inyección · Gestión de proceso","k":true,"t":"F/P. Frequent inspection standards setting and compliance, records state","es":"F/P. Estándares de inspección frecuente: definición, cumplimiento y registros","rq":"▷ Post major quality characteristic , set up limit sample, possess measuring instrument\n ▷ (Computer processing) Set up self-inspection and record test result on a computer\n    - Each Beginning, middle, last item exterior, weight, dimension( examine safety, security and      \n       important thing per cavity)\n    -  Post major quality characteristic, set up limit sample, possess measuring instrument\n    -  Record self-inspection on a computer, List and record of correction defective product\n     * Computer record : Able to look up data on a computer \n         Ex) Scan, Excel[Ms office doc], Auto recording, etc.\n\n ※ if supplier have plastic welding parts\n ▷ Reflect self inspection for welding Item & it must be conduct over 4 points \n    ex) When measuring welding height, variation must be checked by measuring multi points","cr":[["Without self-inspection criteria",0],["With self-inspection criteria , but not following well and recording",1.5],["With self-inspection criteria , not fully inspection and not enough reliability of data",3],["With self-inspection criteria , recording and following well",4.5],["With self-inspection criteria , recording and following well and satisfy above conditions",6]]},{"id":"8-1","c":"Ⅱ Inyección · Gestión de molde","k":true,"t":"F/P.standardized mold preheating time and compliance","es":"F/P. Tiempo estandarizado de precalentamiento del molde y cumplimiento","rq":"▷ Secure mold preheater and preheating place\n ▷ Set up a preheating time and record per item and material\n ▷ (F/P) Secure mold preheater and set up an alarm\n   - Able to connect things within thermo capa\n   - Preheating : Setting value ±3℃","cr":[["Without preheating time criteria per item and material",0],["With preheating time criteria per item and material, but not having extra heater",1],["With preheating time criteria per item and material and having extra but not recording",1.5],["With preheating time criteria per item and material and having extra and recording well",2.5],["With preheating time criteria per item and material and satisfy above conditions",3]]},{"id":"8-2","c":"Ⅱ Inyección · Gestión de molde","k":false,"t":"Mold design / production management / project injection / inspection record management status","es":"Diseño de molde / gestión de producción / inyección de prueba / registros de inspección","rq":"▷ Test injection (T/OUT) report about making new mold and data of molding/strength analysis  \n ▷ Examine problem of a test injection, improvement activity data","cr":[["Without a test injection report when making a new mold",0],["With a test injection report, not doing improvement activity",1],["With a test injection report, not enough improvement activity",1.5],["With a test injection report, doing improvement activity well",2.5],["With a test injection report, doing improvement activity well and satisfy above conditions",3]]},{"id":"8-3","c":"Ⅱ Inyección · Gestión de molde","k":false,"t":"Keep mold, status management and repair / inspection management status","es":"Resguardo de moldes, gestión de estado y de reparación/inspección","rq":"▷ Management of rack for mold, status board and prevention to something into the mold, dehydration state of coolant\n ▷ Making standard of regular cleaning, inspection, repair, life management(History of mold management)\n ▷ Secure S/part for the repair and workers, need a reference production item after repair the mold\n ▷ Managing regular sanding/corrosion for the EMBO mold and verified data (Glossy, color)\n ▷ Check-up and recording the number of shot [lifetime] and set up inspection term & cleaning","cr":[["Without rack for the mold, not maintaining present condition",0],["With rack for the mold, maintaining present condition but not enough to prevent something into the mold and manage coolant",1],["Prevent something into the mold and manage coolant well, insufficient to cleaning, inspection, repair, life management [including sanding/corrosion]",2],["Prevent something into the mold and manage coolant well, and those things cleaning, inspection, repair, life management [including sanding/corrosion] are good",3.5],["Improvement activity are done well with regular mold inspection and satisfy above conditions",4]]},{"id":"8-4","c":"Ⅱ Inyección · Gestión de molde","k":true,"t":"F/P.Mold surface temperature Management standards setting, Compliance status and Around equipment Obtain state","es":"F/P. Control de temperatura superficial del molde: estándares, cumplimiento y equipos periféricos","rq":"▷ Set up the surface temp criteria per mold and recording status (Demand sample test)\n   - Measuring over 2 points, the fixed point/movement point and etc. (Below 600t이하 : temp deviation within ±2.5℃,  above 600t : within ±5℃)\n   - Measuring period : minimum 1 test when changing mold condition or item\n ▷ Secure facilities for the maintenance (chiller, water heater, oil heater, thermostat, thermometer)\n ▷ (F/P) Set up the automatic mold thermostat and alarm  [Check the temp on real time and increase the effectiveness of measuring]\n     - Install the temp sensor in the mold and automatic measuring, install the light bar :  ±2.5℃ ~ 5℃) \n     - Reflect the mold for a new type of car [from 2013, 3]\n     - Install related facilities depend on the time of installation mold for the new type of car\n ▷ (F/P) Secure the mold thermostat and install the alarm,[prevent defect by securing the facilities able to keep the mold temp]\n     - Thermostat is able to connect things within the thermal capacity\n     - Install a light bar for the thermostat : Setting value ±3℃\n ▷ All mold must be linked with temp. controller ( Water heater, Oil heater, Chiller etc. )\n ▷ Mold sensor must be installed over 2 points for each side \n    ( Big temp. variation Item must be checked → Adapt new mold since 2016 )","cr":[["The surface temperature each mold of the management standards not set",0],["With the surface temp criteria for the mold, but not doing extra examine and recording",1.5],["Measuring the surface temp per mold and recording, but not doing regular, Doesn't have reliability",2.5],["Surface temperature each mold setting management standards measure and record still looks good.",4],["Criteria on the surface temp, measuring and recording are satisfied and facilities are secured well",5]]},{"id":"9-1","c":"Ⅱ Inyección · Inspección final","k":true,"t":"Final product inspection standard setting and compliance","es":"Estándar de inspección del producto final y cumplimiento","rq":"▷ Set up the inspection criteria for the final product and also quality characteristic, limit sample\n    - Inspection of exterior, dimension, cross section on the weak part, assembly (Demand sample test)\n ▷ Inspector must have the qualification and also renew his qualification\n ▷ Inspector work both daytime and night\n\n※ if supplier have plastic welding parts\n\n ▷ Leak test must be needed for all welding section\n ▷ Strength test must be needed ( Min. first / mid / final )\n ▷ Welding height inspection ( Min. first / mid / final ) & Cross cutting inspection needed\n    ( Min 1 time/week for each machine ) → Inspection points must be over 4 points\n ▷ Leak tester must be checked by NG master daily & calibration conduct periodically","cr":[["Without inspection criteria for the final product",0],["With inspection criteria for the final product but not inspect",1.5],["With inspection criteria for the final product but not data is not perfect and not enough reliability",2.5],["With inspection criteria for the final product and following the inspection well, also recording",4],["With inspection the final product well, recording well, inspectors work both daytime and night",5]]}], VDAD=[{"id":"P2.1","k":false,"q":"Has a project management strategy (including a project organization) been established?","es":"¿Se estableció una estrategia de gestión de proyecto (incluida la organización del proyecto)?","rq":["There is a project management process.","An interdisciplinary project organization is specified.","The responsibilities and authorizations of the project leader and team members are defined.","The customer and the supplier have been informed who the contact persons are.","The project organization and the associated escalation management meet the customer requirements.","Escalation criteria (including escalation in supplier management) have been specified, and measures are derived in case of non-compliance with the specifications.","Roles are defined in accordance with the development method or collaboration model (agile or not agile).","Experiences (especially lessons learned) from ongoing or previous projects with a comparable scope of products are taken into account.","Project risks have been identified, assessed, and have been mitigated by means of appropriate measures."],"ex":" The roles, tasks, competences and responsibilities of the project manager/technical experts have been defined  Project interfaces in multi-site projects  Organizational chart for the project  Composition of the project team  Evidence of qualifications  Special customer requirements regarding project management  In case of an agile approach: Definition of the escalation mechanism (e.g. the Scrum Master escalates to the Product Owner)  Contact persons/decisionmakers in the escalation process have been defined  Records of milestone assessments, including measures"},{"id":"P2.2","k":true,"q":"Are all resources required for project implementation planned and available, and are changes reported?","es":"¿Están planificados y disponibles todos los recursos para el proyecto y se reportan los cambios?","rq":["The resource planning takes the customer requirements into account and is based on the project agreement.","Resource planning for project team members has been established and implemented.","The staff workload is taken into account.","A review and (where necessary) an adjustment of the resource planning is carried out when changes occur (deadlines, scope of development performance etc.).","The critical path is given special consideration within the resource planning.","The necessary project budget for personnel and equipment is planned and released.","Changes to the project organization (interface with customer) are reported.","The resources for software-specific activities have been planned."],"ex":" Evidence of resource planning (taking other projects into account)  Resource planning for equipment (e.g. development test stand, inspection and laboratory facilities)  Resource planning by the Scrum Master  Resource planning for integration and tests"},{"id":"P2.3","k":false,"q":"Has project management been implemented and is there a project plan that has been agreed upon with the customer?","es":"¿Se implementó la gestión del proyecto y existe un plan acordado con el cliente?","rq":["The project plan meets the specific customer requirements.","All internal and customer defined milestones are fully incorporated in the project plan.","A review is carried out at the milestones defined in the project plan to check that all planned activities are carried out and that the required maturity level is reached.","If a statutory authorization procedure for a product is specifically required, the duration of this procedure is included in the project plan.","In-house communication is ensured when changes are made to the project plan.","Changes to the project plan which affect the customer are coordinated with the customer.","Project changes that have an impact on the overall schedule have been taken in account in the escalation process (risk management).","The critical path is generated from the project plan and takes account of the associated delivery items.","Quality-related project activities as well as procurement activities must be part of the project plan.","A separate, detailed plan can be referred to in the project plan.","The plans must take prototypes and pre-launch parts into account.","The scope of software required at the respective times has been planned."],"ex":" Project plan with milestones  Specific customer requirements regarding technologies xand/or product groups  Customer project plan  Customer deadlines  Customer milestones  Targets set by the customer (measurements within the individual milestones)  Milestone assessments (reviews)  QM plan (e.g. from VDA MLA or APQP)  Country-specific certification requirements (ECE, SAE, DOT, CCC, INMETRO, KBA etc.)  Legal and regulatory approval processes relating to critical systems (environmental requirements, among other things)  Release planning regarding basic functions and milestones  Software project plan  Software milestones  Basic Rollout Plan (BROP)  Feature Rollout Plan (FROP)  Planning of the ASPICE assessment, including the definition of levels and the scope in accordance with the agreed customer requirements"},{"id":"P2.4","k":false,"q":"Have the quality-related project activities been planned, and are they monitored for compliance?","es":"¿Las actividades de calidad del proyecto están planificadas y se monitorea su cumplimiento?","rq":["The quality-related project activities meet the specific customer requirements.","Both product and process assurance measures are part of the quality-related activities.","Verification and validation of the product and process requirements are included in the planning.","The planning also addresses critical components and supply items (internal and external suppliers).","The planning is regularly monitored for compliance and for target achievement.","The quality-related activities relevant to software have been taken into account."],"ex":" Project plan  Customer milestones  Customer requirements with regard to quality plans  Quality plan (audits, reviews and VDA MLA)  Customer specifications  Specific software milestones  Reviews, e.g. of code and models  Test case creation and validation (verification?)  KPIs relevant to software (metrics, test coverage, level of test automation, rate of error reduction etc.)  Software-specific assessment planning and assessment levels  SW-Q release  Risk assessments (special characteristics, cyber security)"},{"id":"P2.5","k":false,"q":"Are the procurement activities of the project included in the project planning?","es":"¿Las actividades de compras están incluidas en la planificación del proyecto?","rq":["The supplier selection process and the target dates for contract awards are contained in the project plan for all types of suppliers.","The suppliers of plants, machines, tools, measuring and inspection systems as well as the service providers are integrated in the planning."],"ex":"   Project plan    Milestone plan    Make-or-buy decision    Service providers (e.g. development, laboratories, maintenance, software)"},{"id":"P2.6","k":true,"q":"Is change management within the project ensured by the project organization?","es":"¿La organización del proyecto asegura la gestión de cambios dentro del proyecto?","rq":["Change management within the project meets the customer’s specific requirements.","Changes (initiated by the supplier, internally or by the customer) must be evaluated.","If necessary, the project plan must be adapted.","This evaluation must include the risk assessment for product quality as well as the deadlines.","Suppliers are actively involved in change management.","It must be ensured that specified design freezes are observed.","Exceptions must be agreed upon between the customer and the supplier and must be documented.","All changes must be documented.","The persons responsible for change management are defined for the customer, internally and to suppliers."],"ex":"   Change management    Process description    Schedules    Change forms    Change history for the product and the process    Evaluation of changes    Approvals of changes    Software: Change request, change management    Change due to fault elimination, changes to the architecture and the requirements"},{"id":"P3.1","k":false,"q":"Have the product/process-specific requirements been specified?","es":"¿Se especificaron los requisitos específicos de producto y proceso?","rq":["The functional and non-functional requirements, including the customer’s requirements as well as statutory and regulatory requirements that apply to the product (and software) to be developed as well as to the production process have to be determined.","The organization must identify and take into account the product and process requirements known from previous experience.","Special characteristics must be identified on the basis of the organization’s own requirements, customer requirements, statutory and regulatory requirements, manufacturing technology and characteristics that arise from the purpose/use of the product.","Customer requirements regarding the selection of suppliers or primary materials must be documented.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are available.","The customer’s requirements regarding the documentation and release of Free and Open Source Software (FOSS) must be taken into account."],"ex":"Product/process development  Requirements regarding the interfaces between hardware and software (products with integrated/embedded software)  Inquiry and contract documents, including requirement specifications  Traceability concept  Ordering and inspection requirements  Catalog of characteristics/reference samples  Product/process characteristics, including characteristics regarding functional safety  Purchasing conditions  Logistics requirements (packaging, JIT, JIS, on consignment)  Quality agreements, including QM-specific requirements  Schedules  Portals/information platforms on the Internet  Lessons Learned  Environmental aspects, recycling requirements  Capability requirements  Requirements regarding release Product development  Specifications, drawings  Software specifications Process development  Requirements regarding facilities, tools and inspection equipment as well as workplace and test station layout  Requirements regarding handling, packaging, storage and identification  Requirements for identification, configuration and ensuring correct installation of the software"},{"id":"P3.2","k":true,"q":"Has the feasibility been comprehensively evaluated according to the product and process requirements?","es":"¿Se evaluó integralmente la factibilidad según los requisitos de producto y proceso?","rq":["ment An interdisciplinary procedure for evaluating feasibility (including potential production locations) must be used.","All determined product/process-specific requirements (technology, function, quality, logistics, software, etc.) must be checked for feasibility.","Material and personnel resources must be considered in the feasibility study.","The results of the feasibility study must be available before tendering.","The feasibility of critical purchased parts must be ensured.","If customer requirements cannot be fulfilled, the customer must be notified or non-conformities approved by the customer prior to the contract being awarded.","A flash concept is available for programming at the plant and updates in the field (if required)."],"ex":"Product/process development  Customer requirements and standards  Schedules, time frame  Regulations, standards, legislation, environmental impact  Requirements from product liability  Traceability concept  Buildings, premises  CAM, CAQ  Product/process innovation  Interdisciplinary feasibility analysis (for example, sales, development, purchasing, production planning, production, QM planning, logistics) Product development  Laboratory/test equipment  Parallel software development / prototyping Process development  Capacity monitoring  Availability of primary materials  Manufacturing options, manufacturing locations  Equipment, tools, production/inspection equipment, auxiliary materials, laboratory facilities, means of transport, containers, storage"},{"id":"P3.3","k":false,"q":"Are the activities for product and process development planned in detail?","es":"¿Las actividades de desarrollo de producto y proceso están planificadas en detalle?","rq":["When planning the product and process development, the level of detail depends on the component, software and complexity of the process.","In the development phase, suitable risk mitigation measures must be used for product and process development assurance, so that the product meets the required operational conditions when goes into series production (function, reliability, safety).","In case of product and process innovations, there is a fallback concept.","Risk analyses are part of the planning.","The inspection planning concept includes the requirements regarding series production, product audits and requalification.","The schedules contain all information regarding product and process development (including deadlines and duration, milestones according to the overall project plan, performance testing, PPA date, software standards…).","The methods and evidence for development release meet the customer requirements and clarification must be sought with the customer if non-conformities occur.","The software engineering process has been specified and meets the customer’s requirements.","The software development progress must also be taken into consideration in the planning, such that the required software functions are tested and available at the required point in time."],"ex":"Product/process development  Overall project plan including all deadlines  Customer requirements  Customer schedule  Lead times  Risk mitigation measures (including backup strategy and cybersecurity)  (QFD, FMEA, HARA etc.)  Prototype/pre-launch planning  Regular status checks on the progress of the development (reviews)  Project plans for investment items (facilities and equipment)  Logistics planning for all phases of product and process development, including packaging  Spare parts concept Product development  Reliability testing, functional testing, trial plan"},{"id":"P3.4","k":true,"q":"Have the procurement activities been planned, and are they monitored for compliance?","es":"¿Se planificaron las actividades de compras y se monitorea su cumplimiento?","rq":["Selection criteria are defined to ensure that the selected suppliers are able to meet the quality requirements.","A potential analysis has been planned or has been carried out for new suppliers not appointed by the customer, new locations or new technologies.","The scope of the planning activities after contract award is based on the risk classification of the purchased products/services.","There are clear rules for the communication of customer requirements along the supply chain.","Customer requirements also include requirements arising from the drawing, the parts, software or component specifications, the delivery quantity, the deadlines, QM agreements and applicable regulations.","Agreements regarding suppliers appointed by the customer (directed suppliers) are defined on a project-specific basis.","The activities in terms of purchasing plants, machines, tools, measuring and inspection equipment as well as services have been determined and planned (selection, contract award, verification and approval).","The progress of the supplier activities (such as contract awards, deadlines, customer and supplier milestones) is monitored."],"ex":"Product / process development  Supplier selection criteria  VDA 6.3 potential analysis and/or comparable method for software  VDA 6.3 audit planning  Management (supplier development, forwarding customer requirements) of the suppliers, PPA procedures, failure analysis, quality, warranty, communication  Interface agreement (services according to DIA or interface agreement)  List of suppliers for the project, including service providers (e.g. development, laboratories, maintenance, software)  Risk classification for the scope of supply of the project and the activities derived (VDA MLA)  Third-party software  Criteria for the release of FOSS"},{"id":"P3.5","k":false,"q":"Have the necessary resources been taken into account for product and process development planning?","es":"¿Se consideraron los recursos necesarios en la planificación del desarrollo de producto y proceso?","rq":["ment The required resources for the project have been determined and documented.","Capacity for the implementation of prototypes and prototype construction, pilot production, performance tests and series production must be planned.","Resource planning is regularly adapted to changes in the project and potential bottlenecks must be addressed.","When introducing new technologies and products, consistent employee training must be planned, and it must be ensured that the necessary infrastructure is created.","Means of transport for in-house transportation, such as packaging and special load carriers have been planned and the relevant quantities have been determined."],"ex":"Product/process development  Planning of staff training, customer service (0km and field), among other things  Qualification matrix  CAx equipment  Availability of qualified personnel for the respective tasks  Budget, infrastructure, e.g. buildings, inspection equipment (hardware and software), laboratory equipment, machines, plants etc.  Capacity planning for all resources  Performance test, Run@Rate, 2-day production, stress test  Provision and distribution of software  Tool chain planning (software development tools) Product development  Test/inspection/laboratory facilities (internal and external)  Resources for planning and conducting tests as well as fixing bugs  Resources for installing the software on the hardware (e.g. flashing, coding, programming) Process development  Production locations, tools, production and inspection equipment, infrastructure"},{"id":"P3.6","k":false,"q":"Have the activities for customer care/customer satisfaction/customer service and field failure analysis been planned?","es":"¿Se planificaron las actividades de atención/satisfacción/servicio al cliente y análisis de fallas en campo?","rq":["The customer requirements are taken into account in the concept for parts supply across the product life cycle, including spare parts supply.","Contingency plans to continually ensure series supply must be included in the concept.","The analysis process for 0-km and field complaints has been planned for the scope of delivery and the supply chain.","The customer requirements regarding field failure analysis are taken into account.","Interfaces to the complaints process have been planned.","An access control concept for software has been established and is maintained.","An analysis of all stakeholders has been carried out.","Communication and escalation paths have been specified."],"ex":"Product/process development  Investment planning Product development  Interfaces to analysis centers for customer complaints, including the relevant software  Access for diagnosis  Access control lists Process development  Inspection planning for standard and stress testing  Triggering criteria are defined  NTF process  Spare parts supply concepts  Contingency plans"},{"id":"P4.1","k":true,"q":"Are the actions from the product and process development plans implemented?","es":"¿Se implementan las acciones de los planes de desarrollo de producto y proceso?","rq":["ment Product and process development activities defined in the development planning are implemented in such a way as to ensure that the operational conditions are met (function, reliability, safety).","The risk analysis (e.g.","FMEA, HARA) is conducted on a multidisciplinary basis and is continuously revised in accordance with the progress of the project.","Defined measures are implemented in accordance with the planning and are checked for effectiveness.","Special characteristics are defined and identified in the relevant documents (FMEA etc.), and measures are implemented to ensure conformity."],"ex":"Product/process development  Methods to minimize risk (e.g. FMEA, HARA, FTA)  Design of experiments (e.g. DoE, Shainin, Taguchi…)  Poka-Yoke principles Product development  Test planning  Assembly test and system test  A, B, C, D samples  Endurance tests  Environmental simulation test (e.g. salt spray test)  Automotive SPICE assessments in accordance with the planning  Code, software release management  Traceability, fallback concept  Variant management  Analysis of requirements, architecture design, implementation and test in accordance with the planning Process development  Control plan/inspection plan"},{"id":"P4.2","k":false,"q":"Are personnel resources available and are the personnel qualified to ensure product and process implementation?","es":"¿Hay recursos de personal disponibles y calificados para asegurar la realización de producto y proceso?","rq":["A staff schedule must be available.","The employees’ tasks, responsibilities and authorizations are defined and allocated.","This also applies to the staff of external service providers.","Appropriate evidence must be available.","It must be ensured that needs assessments is carried out regularly during product and process development with regard to potentially emerging bottlenecks and additional requirements.","Qualified personnel are available during all phases of product and process implementation, and the requirements regarding the series production personnel have been derived.","Processes that have been outsourced must be taken into account."],"ex":"Product/process development  Customer requirements  Requirements profile for the relevant jobs  Determination of the need for training  Evidence of training  Knowledge of methods  Knowledge of foreign languages  Software development: Qualified software testers, integration managers, etc.  Agile development due to qualified roles (DevOps Manager, Release Train Manager, etc.)"},{"id":"P4.3","k":false,"q":"Are the material/immaterial resources available and are they suitable to ensure product and process implementation?","es":"¿Los recursos materiales/inmateriales están disponibles y son adecuados para la realización?","rq":["ment A process to determine resources has been implemented.","The provision of resources refers to the availability of buildings, measuring and inspection equipment, laboratory equipment, machinery, plants, IT systems and infrastructure as well as their utilization.","Processes that have been outsourced must be taken into account.","Regular needs assessment must be carried out during product and process development with regard to potentially emerging bottlenecks and additional requirements.","Material/immaterial resources are available for all phases of product and process implementation, and the requirements for series production have been derived.","Equipment for in-house transport, such as packaging and special load carriers, has been defined and is available in sufficient quantities."],"ex":"Product/process development  Customer requirements  Technical interface to the customer and suppliers  ERP systems  Supporting processes, e.g. from logistics and IT Product development  Resources for verification and validation  Test setups, e.g. Hardware in the Loop (HIL), test boards, evaluation boards  Development tools, provision of the tool chain for software development Process development  Facility p
