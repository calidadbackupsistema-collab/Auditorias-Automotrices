lanning  Facility layout  Release of plants and machines, line clearance  Quantities and throughput times  Transport routes  Transport, containers, storage  Capacity before the start of series production (initial stock)"},{"id":"P4.4","k":true,"q":"Are the required proofs of capability and releases for product and process development available?","es":"¿Existen las pruebas de capacidad y liberaciones requeridas para el desarrollo de producto y proceso?","rq":["The releases and proofs of capability are available for all items, assemblies, software versions and purchased products/services in accordance with development schedules.","The capability of the measuring and inspection equipment has been proven.","The material data has been confirmed and released.","The measures from the risk analyses (e.g.","FMEA, HARA) have been included in the product and process implementation, and their effectiveness has been confirmed.","In case of products with integrated (embedded) software, the software-related aspects according to VDA Volume 2 have to be taken into account.","The production process and product approval (PPA) must be available on the agreed date.","The tolerances of process parameters for the production of special characteristics have to be verified."],"ex":"Product/process development  PPA results, in particular confirmation of conformity with statutory and regulatory requirements  PPA results for purchased products and services  Development releases from customers Process development  Process parameters and their tolerances  Confirmed logistics concept (e.g. suitability of packaging through sample shipping)  Proofs of capability  Capacity studies  Plant and tool releases Software  Recommendations for use (release notes) for each release  Release of third-party software and FOSS in accordance with customer requirements  Provision of test results and test evaluations"},{"id":"P4.5","k":false,"q":"Have the planned procurement activities been implemented?","es":"¿Se implementaron las actividades de compras planificadas?","rq":["The planned procurement activities have been implemented.","This includes risk assessments, the project plan, the maturity level, releases and observing deadlines.","The planning activities according to the risk classification have been implemented; measures have been derived and their implementation is monitored.","The required proofs of capability and releases (process and product release) for the purchased products and services are available in accordance with the project schedule.","The material data has been confirmed and released.","The relevant project-specific customer requirements have been taken into account.","The processes for ensuring customer care/customer satisfaction/customer service as well as field failure analysis have been established."],"ex":" PPA release  FMEA, HARA  VDA 6.3 audit, potential analysis etc.  Releases, evidence and performance tests in accordance with the coordinated PPA procedure  NTF process, triggering criteria for stress tests have been defined  Spare parts supply concepts  Contingency plans  Interface agreement (services according to DIA or interface agreement)  Sub-supplier management by auditee for off-the-shelf components, engineering assignments (no personnel leasing)  Reference to the ASPICE Acquisition Process Group, ACQ2, ACQ.3, ACQ.4"},{"id":"P4.6","k":false,"q":"Are the manufacturing and inspection specifications derived from product and process development and are they implemented?","es":"¿Las especificaciones de manufactura e inspección se derivan del desarrollo y están implementadas?","rq":["The manufacturing and inspection specifications contain all inspection characteristics from product and process development (including special characteristics).","These must take into account all the components, assemblies, sub-assemblies, and materials, including the processes for manufacturing the products.","The results of the risk analysis are considered (e.g.","FMEA, HARA).","A production control plan is available.","It must be available throughout the prototype phase (if required by the customer), the pre-launch phase and the series production phase.","The scope and the elements of product audits and requalification tests have been defined.","Maintenance specifications are available.","All test cases are described in accordance with the test levels and the customer requirements (e.g.","VModel).","The software functions required at the respective times are released."],"ex":"Product/process development  Risk analyses Product development  Product audit plan  Requalification planning Process development  Inspection instruction  Work instruction  Reaction plans  Production release (first and last piece, repeat release)  In-line inspections Software  Requirements for ensuring correct installation of the software  Release criteria in the production test"},{"id":"P4.7","k":false,"q":"Is a performance test carried out under series conditions for the series release?","es":"¿Se realiza una prueba de desempeño en condiciones de serie para la liberación a serie?","rq":["A performance test must be carried out under series conditions to confirm that the required quantity can be produced for the customer with the resources used, within the specified period of time and in accordance with the specifications.","If the performance test fails to confirm this, measures must be defined.","The installation of the software in the components must be taken into account when determining the cycle times/throughput times.","Note: Depending on the time of the audit, some parts of the relevant production test could still be at the planning stage! The question is not relevant for product development!"],"ex":"Process development  Series production conditions: e.g. tools, plants, cycle time, personnel, production and inspection specifications, measuring and inspection equipment  Customer requirements  Performance test, Run@Rate  Determination of minimum quantities (production peak and agreed flexibility)  Series production maturity of equipment and facilities (measurement report)  Staff concept for series production  Packaging requirements Software  Flash times, including test, ROM programming"},{"id":"P4.8","k":false,"q":"Have the processes for ensuring customer care/customer satisfaction/customer service as well as the field failure analysis been established?","es":"¿Se establecieron los procesos de atención/satisfacción/servicio al cliente y análisis de fallas en campo?","rq":["ment The customer requirements regarding the supply of parts throughout the product life cycle are established in the processes.","The planned processes for the continuous series supply including safety margins for emergencies are available.","The analysis process for 0-km and field complaints is established for the scope of delivery.","The customer requirements regarding field failure analysis are taken into account.","The requirements for the analysis capability at the site have been agreed with the customer.","If external sites are used for analysis, the interfaces are defined and evidence of the availability of the required equipment and capacity is available.","New technologies and products are also taken into account in customer support.","The employees designated for these processes are qualified.","The infrastructure is available.","Processes for product monitoring in the field have been specified.","There must be processes for error analysis and diagnosis (embedded software in control unit).","If agreed, processes for over-the-air (OTA) software updates have been specified."],"ex":"Product/process development  Inspection equipment for standard and stress tests  Triggering criteria are defined  Inspection plans for failure analysis  NTF process Process development  Qualification matrix and evidence of training  Inspection equipment  Service agreements with external analysis sites  Spare parts supply concepts  Contingency plans"},{"id":"P4.9","k":true,"q":"Is there a controlled method for the project handover from development to series production?","es":"¿Existe un método controlado para el traspaso del proyecto de desarrollo a producción en serie?","rq":["ment There is a process for transferring work results from the project to series production.","The activities specified in the project plan have been implemented.","Deadlines have been set for aspects that are still to be clarified, and responsible persons have been appointed.","Successful internal release and customer release is a prerequisite for a series delivery release.","Measures resulting from internal and external releases are implemented on time.","Personnel are available in accordance with the planning and are qualified.","The material resources for series production are available in accordance with the planning.","Measures to secure the production start-up have been specified and introduced.","For products with integrated (embedded) software, the results from development (including intermediate results and their documentation) are recorded.","The industrialization is ensured."],"ex":"Product/process development  Customer requirements  PPA records  Handover protocols/checklists with handover criteria, acceptance reports  Parts history  Key production figures such as OEE, ppm, reject rate, etc.  Experiences from the ongoing project  Personnel resources (production staff, process engineers, maintenance, etc.)  Material resources (machines and plants, buildings, access routes, inspection facilities, load carriers, packaging, etc.)  Change log, Release Note  Industrialization of software: includes flashing software onto the control unit in series production and coding"},{"id":"P5.1","k":false,"q":"Are only approved suppliers used who are able to meet the quality requirements?","es":"¿Solo se usan proveedores aprobados capaces de cumplir los requisitos de calidad?","rq":["ment In series production, it must be ensured that only approved suppliers are used.","The relevant approval criteria have been defined.","When selecting suppliers and in order to assess their ability to meet quality requirements, a process audit must be planned and carried out depending on the risk classification of the component.","Evaluations of the quality performance of existing suppliers have been taken into consideration.","Risks in the supply chain (internal/external) have been identified, evaluated and mitigated using suitable measures.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":"   Defined criteria for the selection of suppliers    QM agreements    In case of criteria that have not been met: evidence of measures being implemented in order to mitigate risks    Assessment of the suppliers’ ability to meet quality requirements, e.g. by means of KPI (ppm, delivery performance), escalation level    Self-Assessment, audit results of the suppliers    ASPICE assessment results    VDA 6.3-Process Audit    VDA 6.3-Potential Analysis"},{"id":"P5.2","k":false,"q":"Are the customer requirements taken into account in the supply chain?","es":"¿Se consideran los requisitos del cliente en la cadena de suministro?","rq":["ment The communication of customer requirements must be regulated and traceable.","Change management must also be taken into account during series production.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Requirements from: drawings, components, software or component specifications, milestone plans, QM agreements or other valid standards  Special characteristics  Requalification requirements  Forwarding of complaints, including measures  Statutory and regulatory requirements"},{"id":"P5.3","k":false,"q":"Have targets for supplier performance been agreed upon, and is the achievement of these targets regularly assessed?","es":"¿Se acordaron metas de desempeño con proveedores y se evalúa su logro periódicamente?","rq":["ment Target agreements regarding delivery performance must be made with all direct suppliers and must be implemented.","Supplier performance must be checked and evaluated within defined periods and according to defined criteria.","If the agreed targets are not met, measures must be defined and their implementation including deadlines must be monitored.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Measurable targets: Delivery quantity, punctuality, failure rate, PPM, special deliveries, rejects, lead times for complaints  Escalation criteria according to QM agreements  Evidence of measures (development programs) being implemented in case of suppliers that do not meet the required delivery performance"},{"id":"P5.4","k":true,"q":"Are the necessary releases available for purchased products and services?","es":"¿Existen las liberaciones necesarias para productos y servicios comprados?","rq":["Prior to using new or changed products/processes in series production, a release must be available for all purchased products and services as agreed upon with the customer.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Report regarding the coordination of the PPA procedure  PPA reports  Reference parts for the PPA procedure  Boundary sample  Product and process changes in the supply chain  Release agreement for small series and individual needs"},{"id":"P5.5","k":true,"q":"Is it ensured that the purchased products and services are of the agreedupon quality?","es":"¿Se asegura que los productos y servicios comprados tengan la calidad acordada?","rq":["To monitor the quality of purchased products and services, inspections are carried out, documented and evaluated in accordance with the inspection planning.","If the quality requirements are not met, a standard complaints process is followed.","Inspection and measuring equipment for purchased products and services must be sufficiently available and must be stored appropriately.","Inspection stations must be laid out appropriately (e.g. climate control, lighting conditions, cleanliness, and protection against damage and contamination)."],"ex":" Released inspection procedure  Sample size (e.g. Skip Lot)  Boundary sample  PPM evaluations, 8D reports  Improvement programs  Material certificates in accordance with DIN EN 10204  Gauges/fixtures  Drawings/specifications  Ordering and packaging specifications"},{"id":"P5.6","k":false,"q":"Are incoming goods delivered and stored appropriately?","es":"¿Los bienes entrantes se entregan y almacenan de forma adecuada?","rq":["Primary materials and load carriers must be stored in accordance with their release status so that they cannot be damaged or mixed.","For materials that could be damaged by temperature, humidity, vibration, etc. and affect the quality of the final product, the transport and storage conditions must be defined and evidence shown. “Suspicious”/quarantined materials must be clearly labeled protected against unauthorized access.","FIFO/FEFO (shelf-life requirements) and batch traceability must be ensured when the materials are further processed.","This equally applies to residual quantities.","Material stock figures in the warehouse management system match the quantities actually in stock.","The storage conditions fulfill the product requirements."],"ex":" Packaging  Labeling (traceability/inspection status/use status)  Quarantine stores; quarantine areas  Batch-related use  Climatic conditions  Protection against damage/contamination/corrosion  Order and cleanliness  Precautions to prevent mixing/mistakes"},{"id":"P5.7","k":false,"q":"Are personnel qualified for their respective tasks and are responsibilities defined?","es":"¿El personal está calificado para sus tareas y las responsabilidades están definidas?","rq":["The responsibilities, tasks and authority the employees have in their relevant work areas must be specified.","The employees are qualified in accordance with the job profile.","Qualification requirements must be determined in relation to the tasks, and qualifications must be planned and carried out accordingly.","Knowledge of previous complaints (including corrective actions) is available for purchased products and services."],"ex":" Knowledge of specifications, product characteristics, customer requirements and production processes  Standards  Statutory and regulatory requirements  Packaging requirements  Quality procedures  Job description / description of tasks and function  Qualification matrix  Qualification of supplier auditors"},{"id":"P6.1.1","k":false,"q":"Has the project been handed over from development to series production and is a reliable start guaranteed?","es":"¿Se traspasó el proyecto de desarrollo a serie y está garantizado un arranque confiable?","rq":["The project handover to series production has been documented according to the specified criteria.","The responsibilities for the entire handover process are specified and acknowledged.","Unresolved issues are followed up on, and the necessary measures are implemented on schedule.","A complete production process and product release (PPA) including the documentation required must take place before the first production shipment.","Measures to secure the production start-up have been implemented on the basis of a risk analysis.","Tools, transport and series packaging, inspection and measuring equipment are available in the necessary quantities.","Analysis options for failure analysis are available The product software corresponds to the latest release versions. "],"ex":" Handover reports  Defined measures and implementation schedule  Production release report  Releases for all plant components and tools in 6.1.2  PPA documents, including customer approval and reference parts regarding the PPA procedure  Waivers  Released software versions production start-up: Higher inspection frequency, additional inspections, Resident, Safe launch concept"},{"id":"P6.1.2","k":false,"q":"Are the necessary quantities/production batch sizes of production materials available at the agreed upon time and at the correct storage location/work-station?","es":"¿Los materiales de producción están disponibles en cantidad/lote, a tiempo y en el lugar correcto?","rq":["The production material must be of the agreed quality and must be provided in the correct quantity and the correct packaging, with the correct documentation, at the agreed time and at the agreed place.","Parts/components must be available at defined storage areas/work-stations.","At the workplace, parts and primary materials are provided as needed, taking into account the order quantity/lot size in accordance with the logistics concept.","The reuse of residual quantities, separated parts, reworked parts, reused parts from product audits, inspected items, etc. and their traceability must be clearly defined.","Regulations for reintroducing parts from outsourced processes (e.g. sorting service) must be available."],"ex":" Production material includes, for example:  Software, packaging, load carriers, parts and components, raw material, series packaging for delivery to the customer, operating, auxiliary and process materials  suitable means of transport     Defined storage locations and stock levels  KANBAN, Just in time/Just in sequence, FIFO/FEFO  Revision / change status of materials and software  Special requirements regarding components and containers (e.g. ESD protection, humidity, temperature, residue)"},{"id":"P6.1.3","k":false,"q":"Are materials stored appropriately and are the means of transport/packaging facilities suitable for the special characteristics of the materials?","es":"¿Los materiales se almacenan adecuadamente y el transporte/empaque es idóneo para sus características especiales?","rq":["Packaging requirements must be consistently taken into account/fulfilled.","During manufacture and in-house transport and also when being transported to and from service providers, suitable transport units must be used to protect the products from damage and contamination.","Storage areas/work-stations/containers must be appropriate for the tidiness and cleanliness required for the material.","Cleaning cycles are defined and monitored.","The supply of materials at the work-station/on the assembly line must allow for safe handling.","Specified storage times and use-by dates for special materials must be monitored by means of appropriate methods Operating and auxiliary materials for plants and machinery that have a direct effect on the product/product quality must be monitored accordingly.","Materials, operating and auxiliary materials must be protected against environmental and climatic influences."],"ex":" Stock quantities  Storage conditions  released special and standard transport containers  Protection against damage to the material  5S  Over-filling (storage areas and containers)  Maximum and minimum storage times, specified interim storage times, FIFO/FEFO"},{"id":"P6.1.4","k":false,"q":"Are the necessary labels/records/releases available and allocated appropriately to the materials?","es":"¿Las etiquetas/registros/liberaciones necesarias están disponibles y asignados correctamente a los materiales?","rq":["Released materials must be clearly identifiable.","The release identification on bundles/batches/load carriers/parts must be defined.","It must be ensured that only released materials/parts are forwarded to production/the next production stage and used.","Traceability from the sub-supplier to the customer must be guaranteed according to a defined traceability concept.","Customer requirements as well as statutory and regulatory requirements regarding labeling are taken into account."],"ex":" Customer requirements regarding labeling and traceability  Labeling of released parts/materials (stickers, labels, issue slips, VDA label, DMC, etc.)  Records of approvals  Traceability system  Documentation of waivers (number, duration, type of identification, etc.)  Stock management systems"},{"id":"P6.1.5","k":true,"q":"Are product or process changes during series production tracked and documented?","es":"¿Los cambios de producto o proceso en serie se rastrean y documentan?","rq":["ment Changes to the product and the production process are implemented in accordance with the change management described.","Changes to the product and process are agreed upon with the customer, approved and released (including software changes) in accordance with customer requirements.","A PPA must be carried out.","The history of change statuses must be fully traceable.","The correct, released version of the material / software must be used.","After changes have been made, it must be checked whether the risk analyses need to be updated."],"ex":" Trigger matrix in accordance with VDA Volume 2 or customer specifications  Documented release of a change  Cross-functional evaluation prior to changes  Change history/parts history (also for software)  Design and process FMEA  Operation management in case of changes  Pre-production  Unique software identifier, software integrity (build number, hash key)"},{"id":"P6.2.1","k":false,"q":"Are the requirements in the production control plan complete and have they been effectively implemented?","es":"¿Los requisitos del plan de control de producción están completos y se implementaron eficazmente?","rq":["ment The production and inspection documents are complete and are based on the production control plan.","The data relating to released machinery/tools/aids must be noted in the production control plan and/or the manufacturing and inspection documents.","The documents must be accessible close to the work-station.","Required measures (reaction plan) for process disturbances are described in the production control plan and are implemented and documented.","Process parameters influencing product characteristics/quality must be fully stated.","Tolerances must be stated for process parameters and inspection characteristics.","The control limits in process control charts are defined, identifiable and plausible.","Non-conformities and initiated measures regarding process requirements and inspection characteristics must be documented.","Conditions governing rework are specified, assess as part of the risk analysis and secured within the process (parts identification; repeat inspection etc.)."],"ex":" Inspection characteristics, inspection equipment, inspection methods, inspection frequencies, inspection cycles and requalification  Data regarding machines/tools/aids (identification numbers), process parameters and tolerances (pressure, temperatures, times, speeds etc.)  Work instructions (including reworking)  Inspection instruction"},{"id":"P6.2.2","k":false,"q":"Are production processes released?","es":"¿Los procesos de producción están liberados?","rq":["A process-specific release inspection for first piece/last piece and repeat release was carried out and documented.","A release is necessary for the product and the process and must be carried out and documented by authorized employees using acceptance criteria.","Non-conformities and initiated measures are documented.","At the time of release, the necessary reference and boundary samples must be available.","Criteria for triggering a repeat release must be defined e.g. after an interruption of production.","If production is continued after the collection of inspection parts, these products must be accessible until the inspection parts are released."],"ex":" Release of a batch, including repeat release  First piece /last piece and repeat release  Tooling diagrams/reference parts/installation parts (e.g. defect identification)  Possible triggering criteria for a repeat release: ○ Production interruption (e.g. night time in two-shift operations, tool changes, material/ batch/product change) ○ Repair, tool change, ○ changed setting data  Release of reworked parts"},{"id":"P6.2.3","k":true,"q":"Are special characteristics controlled in production?","es":"¿Se controlan las características especiales en producción?","rq":["Special product characteristics specified by the customer and the organization as well as defined process parameters are marked in the production control plan and systematically monitored.","Records of non-compliances and corrective actions are maintained.","Non-compliances affecting the characteristics of the product must be approved by the customer.","Records regarding special characteristics are available.","The duration and type of archiving of these records are specified and meet the customer’s requirements."],"ex":" Drawings  Labeling indicating the customer-specific special characteristics, e.g.: D/TLD, DS, DZ, R, S, F  Process FMEA  Production control plan  SPC evaluations  Quality control charts  Proofs of capability  Proof of inspection process capability  Inspection results  Process parameter records"},{"id":"P6.2.4","k":true,"q":"Are non-approved and/or defective parts controlled?","es":"¿Se controlan las piezas no aprobadas y/o defectuosas?","rq":["Suspect parts and defective parts must be separated, labeled, recorded or (when necessary) safely removed from the production process.","These parts must either be directly marked or marked on their container.","Authorized personnel decide on the further use of potentially defective products.","The scope (including inspection and release) of permissible rework is described in work instructions.","Quarantine stores and quarantine areas must be clearly labeled.","Accidental or unauthorized use of restricted parts must be excluded."],"ex":" Labeling indicating the product status  defined scrap/rework-stations in production  Quarantine stores and quarantine areas, clearance areas  Documentation regarding rejects, rework and repair  Authorizations"},{"id":"P6.2.5","k":false,"q":"Is the flow of materials secured against mixing/wrong items?","es":"¿El flujo de materiales está asegurado contra mezclas / piezas equivocadas?","rq":["A mix-up of materials or the use of wrong materials, software or components must be ruled out.","Appropriate measures must be taken to ensure that any mix-ups of parts or any use of wrong parts/incorrect installation of parts is detected early on.","The process and/or inspection status of parts must be clearly visible.","The reuse of residual quantities, separated parts, reworked parts, reusable parts must be clearly defined.","Traceability is ensured.","Regulations for reintroducing parts from outsourced processes must be available.","Setting masters, setup and reference parts must be labeled and protected against accidental use."],"ex":" Process FMEA  Poka Yoke actions  Checks and inspections in production facilities  Traceability of batches  FIFO/FEFO  Kanban  Removal of invalid labeling  Value stream analysis  Sorting service  Unique software identifier, software integrity (build number, hash key)"},{"id":"P6.3.1","k":false,"q":"Are the employees able to fulfill their given tasks?","es":"¿Los empleados son capaces de cumplir las tareas asignadas?","rq":["For each task/job, the corresponding requirements profile has been specified.","The employees’ qualification is in line with the requirements profile.","If this is not the case, a qualification scheme must be put in place.","Instructions, trainings and inductions provided to the employees as well as proofs of qualification are documented.","Proof of special qualifications required for the relevant job must be provided.","In case of changes to processes, trainings/instructions are provided and documented.","The requirements also apply to temporary employees."],"ex":" Evidence of qualifications  Training plan  Initial training plan, including evidence  On-the-job training  Qualification matrix  Knowledge about the product and failures that have occurred  Handling of measuring equipment  Interpretation of control charts  Training/instructions regarding occupational safety  Training in special characteristics  Suitable evidence of qualification (e.g. welding certificate, vision test results, hearing test results)"},{"id":"P6.3.2","k":false,"q":"Do the employees know what responsibilities and authority they have regarding the monitoring of product and process quality?","es":"¿Los empleados conocen sus responsabilidades y autoridad sobre el monitoreo de la calidad de producto y proceso?","rq":["The employees’ responsibilities, duties and authority are described and implemented.","The employees know the consequences of incorrect execution of work.","The tasks/functions of the product are known.","It is also known what happens when they are no longer guaranteed.","Employees receive regular information on the current standard of quality achieved and are informed about customer complaints.","The requirements also apply to temporary employees."],"ex":" Work/inspection instructions  Job descriptions  Setup release, first piece inspection, last piece inspection  Authority to stop and start the process  Escalation protocol  Product training  Product safety/product liability training"},{"id":"P6.3.3","k":false,"q":"Are the necessary personnel resources available?","es":"¿Se cuenta con los recursos de personal necesarios?","rq":["There is a staff schedule for all shifts.","The staff schedule takes into account the required number of qualified employees.","Rules exist for supporting areas that are not continually in use (e.g. laboratory, measurement room).","Fluctuations in customer orders and workforce absences (e.g. illness, holidays, training) are taken into account in the staff schedule.","The requirements also apply to temporary employees."],"ex":" Shift plan  Evidence of qualifications  Qualification matrix  documented absence management rules  Staff schedule  Mentors"},{"id":"P6.4.1","k":true,"q":"Is the manufacturing equipment suitable to meet the customer’s product-specific requirements?","es":"¿El equipo de manufactura es adecuado para los requisitos específicos de producto del cliente?","rq":["It must be demonstrated that the processes are implemented in accordance with the customer requirements using the existing production facilities, and that the resulting products meet the customer specifications.","The production facilities, machines and plants must be able to comply with the specified tolerances for the respective product and process characteristics.","Parameters and software that influence the process are protected against unauthorized access.","Process capability must be determined for selected product and process characteristics, and proof of capability must be provided.","The process capability must meet internal requirements as well as customer requirements.","The minimum requirement for process capability is Cpk ≥ 1.33.","In case of characteristics where a certain capability is required but proof of capability cannot be obtained, 100% inspection is required."],"ex":"tion  Proof of machine/process capability  Monitoring of key process parameters (e.g. pressure, time, temperature)  Capability of replacement tools  Feed and removal systems  Reproducibility of gages, fixtures etc.  Cleanliness requirements  Configuration management, ensuring provision of software in accordance with the unique identifier, software integrity (build number, hash key)"},{"id":"P6.4.2","k":false,"q":"Is the maintenance of the manufacturing equipment and tools controlled?","es":"¿Se controla el mantenimiento del equipo de manufactura y herramentales?","rq":["Preventive and/or predictive maintenance activities (maintenance, inspection and repair) are defined and implemented for all installations, equipment, machines and tools based on the risk.","Scheduled and unscheduled maintenance activities that have been carried out are documented and analyzed with regard to potential improvement measures.","Resources needed to carry out necessary maintenance activities are available.","A process for the analysis and optimization of down-time, machine utilization and tool life is implemented effectively.","The availability of replacement parts is ensured.","Tools undergo tool management which includes the following:  Tool history including all changes and tool life  Operational status  Labeling of tools These requirements also apply to external service providers."],"ex":" Production-related logistical equipment, such as forklift trucks  Maintenance and servicing schedules  TPM Total Productive Maintenance  Key processes and bottleneck machines  Technical documentation provided by the manufacturer  Preventative tool exchange programs for units subject to increased wear  Tool operation sheet  Operational status of tools, e.g. operational, not operational  Labeling of tools, e.g. property of the customer, tool no., index"},{"id":"P6.4.3","k":true,"q":"Can compliance with quality requirements be effectively monitored with the measuring and inspection equipment in use?","es":"¿Con el equipo de medición e inspección se puede monitorear eficazmente el cumplimiento de requisitos de calidad?","rq":["The inspection equipment and measuring systems used are suitable for the intended purpose and handling in production.","They are included in the production control plan.","Confirmed results of capability studies are available for the inspection equipment and measuring systems used.","Inspection and measuring equipment is labeled.","The validity status is monitored.","A process for periodic monitoring of inspection equipment and measuring systems is established and implemented.","In case of non-conformity, an assessment of potential risks in relation to the process, the product and the customer is carried out.","Measures have been defined and are implemented effectively.","Auxiliary equipment for inspection equipment and measuring systems that have an influence on the measurement result are monitored in the same way."],"ex":" Measuring system analysis  Test process capability  Replacement measuring equipment  Software integrity check  Calibration status (inspection sticker, barcode, engraving, etc.)  Reference parts"},{"id":"P6.4.4","k":false,"q":"Do the work and inspection stations fulfill the requirements?","es":"¿Los puestos de trabajo e inspección cumplen los requisitos?","rq":["Workplace and ambient conditions are appropriate for the products and the work carried out, in order to prevent or eliminate contamination, damage, mix-ups of parts and the use of wrong parts.","This also applies to rework, sorting and inspection stations that have been permanently or temporarily set up.","The layout of the work station is adapted to the work to be carried out."],"ex":" Cleanliness and tidiness, 5S  Lighting  Noise pollution  Climate control  Clean rooms  ESD  Layout of the work station  Surroundings/handling of parts at the work station  Occupational safety"},{"id":"P6.4.5","k":false,"q":"Are tools, devices and inspection equipment stored properly?","es":"¿Herramientas, dispositivos y equipo de inspección se almacenan correctamente?","rq":["Tools, devices and test equipment must be stored properly.","It is ensured that the equipment is stored in such a way as to be protected against damage and environmental effects.","Cleanliness and tidiness are ensured.","The issue and use of this equipment is controlled and documented."],"ex":" Stored in such a way as to be protected against damage, e.g. collision protection    5S Method  Defined storage location, e.g. markings on the floor  Transparent warehouse management"},{"id":"P6.5.1","k":false,"q":"Have targets been set for the production process?","es":"¿Se definieron metas para el proceso de producción?","rq":["Process-specific targets are defined, monitored and communicated.","Customer requirements are taken into account when setting targets.","A regular comparison between specified targets and actual results is made and documented."],"ex":" Key production figures, e.g. quantities produced; quality metrics, throughput times, defect costs, process effectiveness figures, plant and machine availability)  First time trough quality, First pass yield  Reduction of waste (e.g. rejects and rework, energy and process materials)"},{"id":"P6.5.2","k":false,"q":"Is quality and process data collected in a way that allows for analysis?","es":"¿Los datos de calidad y proceso se recopilan de modo que permitan su análisis?","rq":["The quality and process parameters required to demonstrate product conformity (target values) are defined and documented.","The actual data is recorded and evaluated.","Special incidents are documented.","The recorded data can be allocated to a product and process, the data is available, legible, accessible and archived as specified.","Traceability requirements are met.","The collected data is analyzed, and appropriate improvement measures are initiated.","The potential for improvement must be continuously determined based on findings relating to quality, costs, and services."],"ex":" Control charts  Check sheet  Types of errors/error frequencies  Rejects/rework  Process data sheet with parameter changes  Shift/machine log  Cycle times, throughput times  Fault message (e.g. plant standstill, power outage, program error message)  Output/availability  Blocking message/sorting actions  Traceability"},{"id":"P6.5.3","k":true,"q":"If product and process requirements are not met, are the causes analyzed and the corrective actions checked for effectiveness?","es":"¿Ante incumplimientos de requisitos se analizan las causas y se verifica la eficacia de las acciones correctivas?","rq":["If product and process requirements are not met, immediate actions are taken to fulfill the requirements, until it has been proven that the corrective actions have been effective.","The employees are familiar with these immediate corrective actions.","Suitable methods are implemented to analyze the causes.","Repeat errors are recorded.","A more detailed analysis of the causes must be carried out accordingly.","Corrective actions are derived, their implementation is monitored and the effectiveness verified, The production control plan and the risk analysis are updated as needed.","Non-conformities that affect the characteristics of the delivered product are communicated to the customer."],"ex":" 8D method  Cause and effects diagram  Taguchi, Shainin  5W method  Process capability analysis  Design and process FMEA  Waivers/concessions  Additional dimensional, material, functional and endurance testing"},{"id":"P6.5.4","k":false,"q":"Are processes and products audited regularly?","es":"¿Se auditan regularmente procesos y productos?","rq":["The audit program for process and product audits is based on customer requirements as well as specific risks.","And is implemented.","The process and product audits carried out are suitable to identify specific risks and weaknesses.","If non-conformities are detected during an audit, the causes are analyzed.","Corrective actions are derived, their implementation is monitored and the effectiveness is verified.","Non-conformities that affect products which have already been delivered are communicated to the customer."],"ex":" Specifications  Special characteristics  Audit program including scheduled and event-based audits  Frequency of audits  Audit results, audit reports, action plans  Auditor qualification  Scope of the audit, e.g.: P5, P6, P7  Labeling, packaging  Change status of individual parts and software"},{"id":"P6.6.1","k":false,"q":"Do the quantities/production batch sizes match needs and are they systematically directed to the next process step?","es":"¿Las cantidades/lotes cubren la necesidad y se dirigen sistemáticamente al siguiente paso?","rq":["Products must be forwarded to defined storage/holding points using suitable means of transport.","The order quantity/batch size must be taken into account, so that only the required quantity of products is moved to the stipulated storage/holding point.","The current state of the component (OK part, reworked part, reject, etc.) must be evident from the labeling (component, container etc.).","The change status must be clearly indicated.","It is ensured that only OK parts move on to the next production process step.","Rules are put in place for returning residual quantities, including the recording of the quantities as well as further processing."],"ex":" KANBAN  FIFO/FEFO  JIT/JIS  Storage management  Production quantities tailored to the customer’s needs  Technical cleanliness"},{"id":"P6.6.2","k":false,"q":"Are products stored in an appropriate manner and are the means of transport/packaging facilities suitable for the special characteristics of the products?","es":"¿Los productos se almacenan adecuadamente y el transporte/empaque es idóneo para sus características especiales?","rq":["The products must be protected from damage by suitable storage and packaging.","Internal and customer-specific packaging instructions are known and are implemented.","This also applies to released replacement packaging.","The storage areas/containers must meet the requirements with regard to cleanliness.","Specified storage times must be monitored.","Products must be protected against environmental and climatic influences during storage and shipment.","These requirements apply to the handling during the production process as well as during shipment.","It is ensured that there are no product risks in the transport chain, e.g. due to parts handling, transport routes, commissioning, outdoor storage areas (internal/external)."],"ex":" Protection from damage  For electronic components: ESD protection  Technical cleanliness  Cleanliness, tidiness, 5S, over-filling (storage areas, containers)  Monitoring of storage times/storage quantity (maximum/minimum storage times, specified interim storage times)  Specifications regarding the cleaning of packaging  Sufficient amount of packaging"},{"id":"P6.6.3","k":false,"q":"Are the necessary records/releases retained?","es":"¿Se conservan los registros/liberaciones necesarios?","rq":["The release of the products as well as the relevant evidence is documented.","Waivers/concessions are documented.","The documentation must cover the period and/or quantity of parts involved.","Internal specifications and customer requirements regarding the documentation of rework and repair are fulfilled.","The traceability of products is ensured.","The customer’s requirements with regard to archiving are fulfilled."],"ex":" Customer specifications  Customer’s requirements for archiving time limits  Archiving requirements/regulations (e.g. EDP, paper, fire protection, legibility)  Parts history"},{"id":"P6.6.4","k":true,"q":"Are the customer requirements met upon delivery of the final product?","es":"¿Se cumplen los requisitos del cliente en la entrega del producto final?","rq":["The customer-specific requirements regarding the final product (delivery reliability, quality targets, quality performance etc.) are known.","The fulfillment of these requirements is continuously monitored, assessed and documented.","In case of non-conformities, the causes are analyzed, and measures are defined and implemented.","Products are labeled, stored and shipped in accordance with the customer requirements.","In case of waivers/concessions, products and packaging are labeled accordingly.","Internal specifications as well as customer requirements regarding the labeling of reworked or repaired products are observed.","The handling of supplied products is regulated.","Customers should be informed of delivery stops which affect them, and the further procedure should be coordinated with them."],"ex":"   Quality agreements with the customer    Packaging specification    Target agreements    Shipping audit    Customer specifications regarding labeling (e.g.: VDA label)    Labeling in cases of waivers"},{"id":"P7.1","k":false,"q":"Are all requirements related to the QM system and product conformity fulfilled?","es":"¿Se cumplen todos los requisitos del SGC y de conformidad del producto?","rq":["The internal and customer-specific requirements regarding the QM-system and its further development are fulfilled.","The processes within the organization (including the outsourced processes) and along the supply chain are taken into account.","Requalification tests are carried out in accordance with the customer requirements Customer requirements for the return of parts and their recycling must be fulfilled.","Proof of conformity with necessary national and international regulations is available."],"ex":" Quality agreements with the customer  Requalification concept, e.g. product audits carried out, functional tests, endurance tests  Certification of the QM system  Proof of conformity, e.g. parts that are subject to type approval, CCC, ECE, DOT, certificates, inspection reports"},{"id":"P7.2","k":false,"q":"Is customer service guaranteed?","es":"¿Está garantizado el servicio al cliente?","rq":["It must be ensured that competent contact persons are available for the various areas in the customer’s organization.","Communication is ensured in accordance with the customer specifications.","Product monitoring in the field is ensured.","Access to customer portals in accordance with the customer-specific agreements is ensured, and the required data is up to date/maintained."],"ex":" Knowledge regarding product use  Knowledge of problems with the product and complaints regarding the product or transport  Fulfillment of new requirements  Notification of improvement measures  World-wide customer service  The customer is informed in the case of non-compliance with the requirements  Required data (e.g. Certificates, contact data)"},{"id":"P7.3","k":true,"q":"Is the supply of parts guaranteed?","es":"¿Está garantizado el suministro de piezas?","rq":["Concepts (including contingency concepts to ensure that products/parts can continue to be supplied) are available and up to date.","The processes within the organization (including the outsourced processes) and along the supply chain must be taken into account.","This also includes immaterial products such as software, etc.","Risks and their impact on the customer have been taken into account.","Procedures must be in place which guarantee that the organization informs the customer immediately when supply shortages are detected.","The information must include the expected duration and extent of the shortages, the reason and the measures which have been initiated.","The customer’s requirements regarding the supply of spare parts must be fulfilled during the series production phase as well as afterwards."],"ex":" Contingency plans (e.g. alternative production, suppliers, packaging, transport)  Capacity and reaction time for sorting actions  Use of external capacity  Communication regarding supply shortages  Regulations covering authority to make decisions/escalation paths when introducing special actions  Blocking of parts  Involvement of the suppliers in spare parts supply  Provision of software updates"},{"id":"P7.4","k":true,"q":"In case of complaints, are failure analyses carried out and corrective actions implemented effectively?","es":"¿Ante reclamos se hacen análisis de falla y se implementan acciones correctivas eficaces?","rq":["A complaints process that meets the customer requirements is followed in case of 0-km and field complaints.","Analysis procedures must be defined.","The necessary personnel and material resources are available to ensure punctual processing.","The deadlines agreed upon with the customer must be met.","In case of non-conformities, the customer has to be informed.","In case of field complaints, a field failure analysis must be carried out according to the customer requirements (e.g.","VDA Field Failure Analysis).","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Process for processing complaints and field failure analysis process  Internal/external analysis facilities (laboratories, test and inspection facilities, personnel)  Use of problem-solving methods (8D)  Flow of information to the customer in the case of nonconformities  Knowledge databases, lessons learned  Quality control loop  Risk analysis (e.g. FMEA, HARA)  Access to the necessary release documents (e.g. PPA)"},{"id":"P7.5","k":false,"q":"Are personnel qualified for their respective tasks and are responsibilities defined?","es":"¿El personal está calificado para sus tareas y las responsabilidades están definidas?","rq":["It must be determined which responsibilities, duties and authorizations each employee has in their respective field of work.","Training needs must be determined and implemented individually, based on the tasks.","The employees are familiar with the product and the consequences of incorrect execution of work for the supply of parts and the quality of the final product."],"ex":" Organizational chart and escalation procedures  Evidence of knowledge of: the product/the specifications/ special customer requirements  Standards/legislation (product liability)  Intended use  Failure analysis  Evaluation methods (e.g. audits, statistics)  Quality techniques (e.g. Pareto, 8D Method, cause and effect diagram, “5 Whys” method)  Knowledge of foreign languages"}];
