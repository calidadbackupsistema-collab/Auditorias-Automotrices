반영\n      1) 표준류 게시된 현위치 기준 소화 방재시설 위치 및 비상대피 동선 표기된 표준류 작성/게시\n      2) 설비 간섭 등 고려 소화 방재시설 식별표, 비상대비 표시등 2층높이 반영\n    - 운영중인 설비에 대한 정기 안전관리 프로세스 수립 및 이행상태\n    - 설비 점검시(계획/비계획) 업무 처리절차 수립 : 2인 1개조 운영, 비정상 가동 예방절차 등","es":"▣ Proceso y cumplimiento de la prevención de accidentes de seguridad\n- Proceso de seguridad del operador y su cumplimiento (verificar en piso)\n  : instalar un resguardo con candado para guardar celulares durante la producción; medida si se usa el celular sin haberlo entregado antes de entrar a línea\n  : criterio y revisión (diaria) del uso del equipo de protección (lentes, casco, guantes, etc.)\n- Reflejar en equipos/layout la prevención de accidentes según el giro\n    ⇒ ej.) Prensa: sensor de detección del operador (barra de seguridad), control a dos manos, cubierta de volante, etc.\n            Recubrimiento: mascarilla, gabinete separado para sustancias peligrosas (químicos) y criterios de manejo\n            Soldadura: guantes y lentes de seguridad, pantallas contra chispas de soldadura, etc.\n            Robots/equipos automáticos (LOTO): realizar bloqueo de energía (Lock-Out) y colocación de aviso (Tag-Out)\n- Publicar señales/reglas de seguridad en el área de trabajo y capacitar a los operadores\n- Instalar equipos/instalaciones de prevención y reflejar en estándares la identificación de riesgos (sustancias peligrosas) en el área\n  1) Elaborar y publicar estándares con la ubicación de equipos contra incendio y rutas de evacuación desde la posición actual\n  2) Considerando interferencias con equipos, colocar los letreros de equipo contra incendio y luces de emergencia a la altura del segundo nivel\n- Proceso de gestión periódica de seguridad de los equipos en operación y su implementación\n- Procedimiento durante revisión de equipos (planeada/no planeada): trabajo en pareja (2 personas), procedimiento para evitar operación anormal, etc."},{"id":"6_2","c":5,"p":20,"ko":"▣ 설계변경, 4M 변경처리 업무절차 수립 및 준수여부\n    - 설계변경/4M 변경 업무 프로세스 수립여부\n        [세부 유형별 업무 처리절차 및 관리분담, 고객사 ISIR 재승인 필요여부 등]\n    - 변경점 추적성 확보를 위한 마스터리스트 작성관리[누락 발생시 감점 처리]\n    - 변경점 누락 발생 예방을 위한 정기적인 점검활동 실시여부[담당자 지정 및 점검주기 설정관리]\n    - 4M 변경품 이상여부 확인을 위한 초기유동관리 여부\n    - 4M 변경이력 고객사 승인여부 확인[고객사 승인본 접수관리]","es":"▣ Procedimiento y cumplimiento de cambios de diseño y cambios 4M\n- ¿Existe un proceso de cambios de diseño/4M?\n   [procedimiento y reparto de responsabilidades por tipo de cambio, necesidad de reaprobación ISIR del cliente, etc.]\n- Elaborar y controlar una lista maestra para asegurar la trazabilidad de cambios [se descuenta si hay omisiones]\n- Revisiones periódicas para prevenir omisiones de cambios [designar responsable y definir frecuencia]\n- Control de flujo inicial (contención inicial) para verificar anomalías en productos con cambio 4M\n- Verificar la aprobación del cliente del historial de cambios 4M [recibir y controlar la versión aprobada por el cliente]"},{"id":"6_3","c":5,"p":20,"ko":"▣ 품목별 도면기준 검사협정 체결 및 관리기준 준수상태 (도면 일치성) \n   ▷ 도면에 명시된 외관, 치수, 기능, 주기를 검사협정 및 사내 검사기준 반영\n    - 검사협정서/기준서/초도품 보증서 고객 승인본 보유\n    - 도면 일치성 점검 담당자 지정하여 정기적 도면대비 검사협정/기준서 일치성 점검 및 점검이력 관리\n    ※ 금형 노후화에 따른 성형부 마모로 중요치수 불만족 문제점 사전 검토 (치수 정기검사 항목 外 금형 마모 예상부 검사항목 추가) \n   ▷ 검사협정 및 검사기준서내 부품 검사항목(정기신뢰성 시험 포함)의 점검주기 준수여부","es":"▣ Acuerdo de inspección por plano de cada producto y cumplimiento de criterios (coincidencia con el plano)\n   ▷ Reflejar apariencia, dimensiones, función y frecuencia indicadas en el plano en el acuerdo de inspección y en el estándar interno\n    - Contar con versión aprobada por el cliente del acuerdo/estándar de inspección y certificado de primera pieza\n    - Designar responsable de revisar la coincidencia con el plano; revisar periódicamente acuerdo/estándar vs plano y llevar historial\n    ※ Prever el problema de dimensiones críticas fuera de especificación por desgaste del molde (además de ítems de inspección dimensional periódica, agregar inspección de zonas con desgaste previsible)\n   ▷ Cumplimiento de la frecuencia de inspección de las piezas en el acuerdo/estándar de inspección (incluye pruebas periódicas de confiabilidad)"},{"id":"6_4","c":5,"p":30,"ko":"▣ 품질경영체제 구축/유지를 위한 조직구성 및 운영상태\n    - 품질 매뉴얼/절차서/지침서 구비 및 적용상태\n    - 구체적인 업무분장 수립상태\n    - SQ 인증업종 자체 내부심사[평가서 기준] 활동 실시 및 발췌 문제점에 대한 개선활동 추진 \n          ⇒ 점검결과 경영자/임원 보고 및 후속조치 활동 이력[증빙물 관리]","es":"▣ Organización y operación para construir/mantener el sistema de gestión de calidad\n- Contar con manual/procedimientos/instrucciones de calidad y su aplicación\n- Reparto de responsabilidades concreto\n- Realizar auditoría interna propia del giro con certificación SQ [conforme a la hoja de evaluación] y mejorar los problemas detectados\n     ⇒ Reporte de resultados a la dirección/ejecutivos e historial de acciones posteriores [control de evidencias]"},{"id":"6_5","c":5,"p":20,"ko":"▣ 자격인증 관리기준 수립 및 준수상태\n    - 공정별 작업자/검사자 배치기준 수립 및 자격인증 평가 실시여부 [품질 표준류내 검사지정 항목별 담당자]\n          ⇒ 자격인증 실시 기준 [부적합 판별 실기평가, 품질특성 교육, 동일업무 경력, 생산품 품질산포 발생 가능성 검증 등] \n      ※ 부적합 판별 실기평가\n          → 외관검사 : 부적합 유형별 검출능력 실기평가\n             치수검사 : 담당별 지정 계측기 사용능력 평가 [계측기 활용능력 평가로 CpK 산출 불필요]\n    - 자격인증 검증평가 결과에 대한 신뢰도 확보 필요(수기 작성 원본데이터, 검증용 시료 확보 등)\n    - 자격인증자 결원/휴가시 대응인원 확보상태 및 후속조치 관리방안/실행상태\n    - 작업자 결원으로 대체인원 투입 불가피시, 투입전 교육/품질보증 방안 등 관리 규정 수립 및 관리 상태점검\n    - 생산작업자 자격인증 : 동일작업 반복 생산후 부품간 산포발생 가능성 검증 \n    - 중요/특별 공정에 대한 품질검사원 확보 및 자격인증 실시 필요\n          ⇒ 열처리/단조 : 조직 판독능력, 전자/조립 : 리워크 검사원, 도금/도장 : 액분석 검사원, 전자(납땜) : AOI 검사 담당자 등\n      ※ 중요/특별특성 공정 자격인증평가 미실시, 허위작성 확인시 이행도 '0'점 처리","es":"▣ Criterios y cumplimiento de la certificación de calificación (autorización de personal)\n- Criterio de asignación de operadores/inspectores por proceso y realización de evaluación de calificación [responsable por ítem de inspección definido en estándares de calidad]\n     ⇒ Criterios de calificación [evaluación práctica de detección de no conformes, capacitación en características de calidad, experiencia en la misma labor, verificación de posible dispersión de calidad entre piezas, etc.]\n   ※ Evaluación práctica de detección de no conformes\n      → Inspección de apariencia: evaluación práctica de capacidad de detección por tipo de no conformidad\n         Inspección dimensional: evaluación de capacidad de uso del instrumento asignado [con evaluar el uso del instrumento no se requiere calcular CpK]\n- Asegurar la confiabilidad de resultados de evaluación de calificación (datos originales manuscritos, muestras de verificación, etc.)\n- Disponer de personal de reemplazo ante ausencia/vacaciones del personal calificado, y medidas/ejecución de seguimiento\n- Si es inevitable asignar reemplazo por falta de personal: definir y verificar reglas de capacitación/aseguramiento de calidad previas a la asignación\n- Calificación de operadores de producción: verificar posible dispersión entre piezas tras producir repetidamente el mismo trabajo\n- Contar con inspectores de calidad calificados para procesos importantes/especiales\n     ⇒ Tratamiento térmico/forja: lectura de microestructura; electrónica/ensamble: inspector de retrabajo; recubrimiento/pintura: inspector de análisis de baño; electrónica (soldadura): responsable de inspección AOI, etc.\n   ※ Si no se realiza evaluación de calificación en procesos de características críticas/especiales, o se detecta falsificación: el cumplimiento se califica con '0' puntos"},{"id":"6_6","c":5,"p":20,"ko":"▣ 수입검사/생산공정/최종검사 부적합(추정)품에 대한 격리/식별절차 수립 및 준수여부\n    - 부적합품 후공정 유출 방지를 위한 식별 및 격리방안 세부 작성 및 준수여부\n    - 부적합(추정)품 처리 프로세스 수립 및 준수여부\n    - 공정내 부적합품 보관용 보관박스 별도 비치(RED BOX)  \n    - 생산중 부적합품 발생수량과 실제 수거량 비교를 통한 부적합품 후공정 유출 발생여부 점검활동 실시[점검이력 보관]\n    - 개발등 시제품 생산시 양산부품과 혼입 방지를 위한 식별 및 격리 절차 수립/준수상태 점검\n    - 낙하품은 처리기준 수립 및 처리이력 관리 필요 (낙하품 수량 및 처리결과 기록)\n       예) 낙하품은 별도 격리/식별조치를 통한 혼입방지 및 폐기 또는 재사용(REWORK) 결정\n    ※ 완성품 외관/기능 검사시 부적합 추정품 선별된 부품은 별도의 식별 표기후 동일 검사장비 또는 품질 전문검사원을 통한 재검사 진행하되,\n        2차 검사 NG로 판별시 폐기처리하고 재검사 및 폐기 이력관리 (생산LOT, 재검사 사유, 재검사 결과, 폐기 수량 등) \n        예) 자동 검사장비를 통한 외관(Vision)/기능 검사 1차 NG → 동일장비 2차 재검사 → 재검사 NG시 폐기\n             생산라인 검사원 외관/기능 검사 1차 NG → 품질담당 전문 검사원 2차 재검사 → 재검사 NG시 폐기  \n              단, Rework 가능 항목으로 고객사와 협의된 부적합 항목은 Rework 진행이 가능하나, Rework 진행후 필히 라인내 검사장비 또는\n              품질담당 전문 검사원의 재검사 진행 필요","es":"▣ Procedimiento y cumplimiento de aislamiento/identificación de producto no conforme (presunto) en recepción/proceso/inspección final\n- Elaborar en detalle y cumplir los medios de identificación y aislamiento para evitar que el producto no conforme pase al siguiente proceso\n- Proceso de manejo del producto no conforme (presunto) y su cumplimiento\n- Contar con una caja separada en el proceso para producto no conforme (CAJA ROJA)\n- Actividad de revisión de fuga de no conformes al siguiente proceso, comparando la cantidad generada en producción con la realmente recolectada [conservar historial]\n- Procedimiento de identificación y aislamiento para evitar mezcla de prototipos (desarrollo, etc.) con piezas de producción, y su cumplimiento\n- Piezas caídas: definir criterio de manejo y llevar historial (registrar cantidad y resultado)\n   ej.) Las piezas caídas se aíslan/identifican por separado para evitar mezcla y se decide desecho o reuso (RETRABAJO)\n※ En la inspección de apariencia/función del producto terminado, las piezas presuntamente no conformes se identifican por separado y se re-inspeccionan con el mismo equipo o un inspector especializado de calidad;\n   si la 2ª inspección resulta NG se desecha, llevando historial de re-inspección y desecho (LOTE de producción, motivo de re-inspección, resultado, cantidad desechada, etc.)\n   ej.) Inspección de apariencia (visión)/función con equipo automático 1ª NG → 2ª re-inspección con el mismo equipo → si NG, desecho\n        Inspector de línea (apariencia/función) 1ª NG → 2ª re-inspección por inspector especializado de calidad → si NG, desecho\n        Sin embargo, los no conformes acordados con el cliente como retrabajables pueden retrabajarse, pero tras el retrabajo es obligatoria la re-inspección con equipo de la línea o inspector especializado de calidad"},{"id":"6_7","c":5,"p":20,"ko":"▣ 품질실적 점검 프로세스 수립 및 개선활동 실시상태\n    - 전년도 품질 실적대비 목표설정 및 실적 점검(1회/월)상태 \n          ⇒ 공정불량 (생산수량, 불량수, PPM), 고객불량 (납품수량, 불량수, PPM), 외주불량(입고수량, 불량수, PPM)\n       ⇒ 전체, 공정별, 품목별, 불량 유형별 및 장비별(필요시) 집계\n         ⇒ 공정불량률 집계 시, 재작업 수량 포함\n    - 목표 미달시 워스트 항목에 대한 근본적인 원인분석 및 개선대책 수립/유효성 평가 실시상태\n    - 고객 불량(필드 클레임) 문제점에 대한 고품분석 및 시정조치 활동 실시여부","es":"▣ Proceso de revisión de resultados de calidad y mejora\n- Metas contra los resultados de calidad del año anterior y revisión de resultados (1 vez/mes)\n     ⇒ Defecto de proceso (cantidad producida, cantidad de defectos, PPM), defecto de cliente (cantidad entregada, defectos, PPM), defecto de proveedor externo (cantidad recibida, defectos, PPM)\n     ⇒ Concentrar por total, por proceso, por producto, por tipo de defecto y por equipo (si es necesario)\n     ⇒ Al calcular la tasa de defecto de proceso, incluir la cantidad retrabajada\n- Si no se alcanza la meta: análisis de causa raíz de los peores ítems, definición de acciones de mejora y evaluación de su efectividad\n- Análisis de piezas devueltas y acciones correctivas ante defectos de cliente (reclamos de campo)"},{"id":"6_8","c":5,"p":10,"ko":"▣ 검사 유효성 확보를 위한 조도관리 프로세스 수립 및 준수실태\n    - 정기적인 작업장/ 검사장 조도 관리를 위한 운영 프로세스 수립[측정장소/시간, 조도 관리기준, 측정장소 지정]\n    - 표준류내 자주/순회검사 실시구간 조도관리 포인트 누락여부\n     ※ 야간작업 등 고려 일몰후 조도측정 실시, 측정산포 최소화 목적 검사위치 지정 및 손 미거치 조건 \n        조도측정 실시 등","es":"▣ Proceso y cumplimiento del control de iluminación para asegurar la validez de la inspección\n- Definir proceso de operación para el control periódico de iluminación en áreas de trabajo/inspección [lugar/hora de medición, criterio de iluminación, lugares de medición designados]\n- ¿Faltan puntos de control de iluminación en las zonas de autoinspección/inspección de rondas de los estándares?\n  ※ Considerando el trabajo nocturno, medir la iluminación después del atardecer; designar la posición de inspección para minimizar dispersión de medición y medir sin apoyar la mano, etc."},{"id":"6_9","c":5,"p":20,"ko":"▣ 3정 5행 관리 프로세스 수립 및 준수실태\n    - 정기적인 3정5행 현장개선 프로세스 수립 \n      (점검 체크시트 작성, 점검 주기, 업무 분담, 지적사항 개선 시정조치 완료여부] \n    - 현장점검시 3정 5행 관리실태","es":"▣ Proceso y cumplimiento de 3 Definiciones 5 Acciones (3정 5행 / 5S)\n- Proceso periódico de mejora en piso de 3정5행\n  (elaboración de checklist, frecuencia de revisión, reparto de tareas, cierre de acciones correctivas de lo observado)\n- Estado de la gestión de 3정5행 en la revisión de piso"},{"id":"6_10","c":5,"p":10,"ko":"▣ 불량부품 REWORK시 관리기준 수립 및 이행 상태\n    - 리워크 가능부품 선정기준 수립 및 관리상태\n    - 리워크 금지부품은 폐기 처분 및 이력관리\n    - 리워크품 사양확인 LOT 추적성 및 선입선출 관리상태 \n    - 불량부품 REWORK시 품질검사항목 설정 및 REWORK 전후 검사 이력 유지 관리상태\n    - REWORK 전/후 부품의 식별 관리기준 및 준수상태\n    - REWORK 제품의 출하 절차 준수 상태\n    - REWORK  작업을 위한 별도 공간 운영시 작업을 위한 TOOL 및 자재의 비치 상태","es":"▣ Criterios y cumplimiento del RETRABAJO (REWORK) de piezas defectuosas\n- Criterio de selección de piezas retrabajables y su control\n- Las piezas con retrabajo prohibido se desechan y se lleva historial\n- Verificación de especificación del producto retrabajado, trazabilidad por LOTE y control PEPS\n- Ítems de inspección de calidad en el retrabajo y mantenimiento del historial de inspección antes/después del retrabajo\n- Criterio y cumplimiento de identificación de piezas antes/después del retrabajo\n- Cumplimiento del procedimiento de embarque de productos retrabajados\n- Si hay un espacio separado para retrabajo: disponibilidad de herramientas y materiales para el trabajo"},{"id":"6_11","c":5,"p":10,"ko":"▣ 공정 누락 방지를 위한 작업환경 설정 상태\n    - 제품 생산시 공정 누락 방지를 위한 작업환경 구축 상태(공정이동 전표 활용 등) \n    - 제품 생산시 자재 소진에 의한 부품 및 부자재등 누락 방지 방안 운영 상태\n        → 정기적인 부자재 입고/소진량과 완제품 생산실적 비교검증 활동 실시 등 ","es":"▣ Entorno de trabajo para prevenir omisión de procesos\n- Estado del entorno de trabajo para prevenir omisión de procesos en la producción (uso de vales de traslado entre procesos, etc.)\n- Operación de medidas para evitar omisión de piezas y auxiliares por agotamiento de material durante la producción\n    → ej.) verificación periódica de entradas/consumo de auxiliares contra la producción de producto terminado"},{"id":"6_12","c":5,"p":20,"ko":"▣ 『정성품질』 운영 프로세스는 마련되어 있고, 점검 및 포상활동은 실시되는가?\n   ▷『정성품질』 활동 관련 업무분장(키맨)\n     - 『정성품질』 수평전개 교육 담당/ 품질문제 발생시 개선활동 담당/ 고객사 협업 담당 등\n  ▷ 정성품질 통신문 품질현황판 게시 및 사내 임직원 전파교육 실시 이력 관리\n  ▷제조현장 『정성품질』관련 예방/개선 프로세스 수립(제조현장 반영내역 확인)\n     - 예방활동 : 휴먼에러 발생 예방을 위한 작업자/공정/설비 등 예방점검 개선 이력\n     - 개선활동 : 중요 품질문제(작업자 휴먼에러) 발생시 해당 공정 시정조치 활동 이력 \n                      → 발생 원인에 대한 세부적인 원인 분류 및 근본적인 시정조치 활동 실시\n  ▷『정성품질』 유지 및 관리실태 점검 활동 실시이력(현황 및 개선대책 경영진 보고)\n     - 제조현장 표준류 준수, 작업공수 일치성, 공정검사 기준 준수 등 『정성품질』 관리실태 정기적 점검이력\n      ex) 제조현장 확인시 수작업 조립 어려움, 작업 공수 불명확, 역조립/오조립 가능성, 신규/임시 작업자 표준 준수 등 \n            『정성품질』 개선 필요항목 확인 \n  ▷『정성품질』 정착화 및 붐업 조성을 위한 포상제도 운영관리\n     - 『정성품질』관련 사전 예방활동 및 개선 우수사례에 대한 포상제도 운영기준 수립 및 실적","es":"▣ ¿Existe proceso de operación de 『Calidad Meticulosa (정성품질)』 y se realizan revisiones y reconocimientos?\n   ▷ Reparto de responsabilidades de 『Calidad Meticulosa』 (persona clave)\n     - Responsable de capacitación de despliegue horizontal / responsable de mejora ante problemas de calidad / responsable de colaboración con el cliente, etc.\n  ▷ Publicación del boletín de Calidad Meticulosa en el tablero de calidad y control de historial de capacitación de difusión al personal\n  ▷ Proceso de prevención/mejora de 『Calidad Meticulosa』 en piso (verificar lo reflejado en manufactura)\n     - Prevención: historial de revisiones preventivas de operador/proceso/equipo para evitar error humano\n     - Mejora: historial de acciones correctivas del proceso ante problemas críticos de calidad (error humano del operador)\n                    → clasificar en detalle la causa y realizar acciones correctivas de fondo\n  ▷ Historial de revisiones del mantenimiento y control de 『Calidad Meticulosa』 (reporte a la dirección de situación y acciones de mejora)\n     - Historial de revisión periódica de cumplimiento de estándares en piso, coincidencia de horas-hombre, cumplimiento de criterios de inspección de proceso, etc.\n      ej.) Al verificar en piso: dificultad de ensamble manual, horas-hombre poco claras, posibilidad de ensamble inverso/erróneo, cumplimiento de estándares por personal nuevo/temporal, etc.\n           identificar ítems por mejorar de 『Calidad Meticulosa』\n  ▷ Operación del sistema de reconocimiento para consolidar e impulsar la 『Calidad Meticulosa』\n     - Criterios de operación y resultados del sistema de reconocimiento a actividades preventivas y casos sobresalientes de mejora"}],"prof":{"sup":"㈜현대포리텍","supCode":"#1407","ind":"PL사출","siteCode":"#140701","ceo":"","addr":"","lead":"","leadCode":"RFP4","evType":"사후평가(외부)","round":"2차","team":"자동차 구매팀","certs":[["본사","고무 성형","2026.03.24","B","보쉬전장"],["본사","전기 조립","2026.02.12","B","만도 원주공장"],["2공장","고무 성형","2026.04.21","B","만도 익산공장"],["본사","PL 사출","2025.07.18","G","만도 익산공장"],["2공장","전착 도장","2026.05.27","A","한온시스템"],["","","","",""],["","","","",""]],"hist":[["1975","현대특수고무 창립 ('01 상호변경)",""],["2001","상호변경, 고무부문 SQ인증 획득",""],["2004~2007","중국('04), 미국('05), 인도('07) 법인 설립",""],["2009","수지부분 SQ인증 획득",""],["2016","멕시코 법인 설립",""],["2021","산업통상부 우수기업연구소 선정",""],["2022","IATF16949 , ISO9001 , ISO14001 인증 갱신",""],["","",""]]}}, VDAD=[{"id":"P2.1","k":false,"q":"Has a project management strategy (including a project organization) been established?","es":"¿Se estableció una estrategia de gestión de proyecto (incluida la organización del proyecto)?","rq":["There is a project management process.","An interdisciplinary project organization is specified.","The responsibilities and authorizations of the project leader and team members are defined.","The customer and the supplier have been informed who the contact persons are.","The project organization and the associated escalation management meet the customer requirements.","Escalation criteria (including escalation in supplier management) have been specified, and measures are derived in case of non-compliance with the specifications.","Roles are defined in accordance with the development method or collaboration model (agile or not agile).","Experiences (especially lessons learned) from ongoing or previous projects with a comparable scope of products are taken into account.","Project risks have been identified, assessed, and have been mitigated by means of appropriate measures."],"ex":" The roles, tasks, competences and responsibilities of the project manager/technical experts have been defined  Project interfaces in multi-site projects  Organizational chart for the project  Composition of the project team  Evidence of qualifications  Special customer requirements regarding project management  In case of an agile approach: Definition of the escalation mechanism (e.g. the Scrum Master escalates to the Product Owner)  Contact persons/decisionmakers in the escalation process have been defined  Records of milestone assessments, including measures"},{"id":"P2.2","k":true,"q":"Are all resources required for project implementation planned and available, and are changes reported?","es":"¿Están planificados y disponibles todos los recursos para el proyecto y se reportan los cambios?","rq":["The resource planning takes the customer requirements into account and is based on the project agreement.","Resource planning for project team members has been established and implemented.","The staff workload is taken into account.","A review and (where necessary) an adjustment of the resource planning is carried out when changes occur (deadlines, scope of development performance etc.).","The critical path is given special consideration within the resource planning.","The necessary project budget for personnel and equipment is planned and released.","Changes to the project organization (interface with customer) are reported.","The resources for software-specific activities have been planned."],"ex":" Evidence of resource planning (taking other projects into account)  Resource planning for equipment (e.g. development test stand, inspection and laboratory facilities)  Resource planning by the Scrum Master  Resource planning for integration and tests"},{"id":"P2.3","k":false,"q":"Has project management been implemented and is there a project plan that has been agreed upon with the customer?","es":"¿Se implementó la gestión del proyecto y existe un plan acordado con el cliente?","rq":["The project plan meets the specific customer requirements.","All internal and customer defined milestones are fully incorporated in the project plan.","A review is carried out at the milestones defined in the project plan to check that all planned activities are carried out and that the required maturity level is reached.","If a statutory authorization procedure for a product is specifically required, the duration of this procedure is included in the project plan.","In-house communication is ensured when changes are made to the project plan.","Changes to the project plan which affect the customer are coordinated with the customer.","Project changes that have an impact on the overall schedule have been taken in account in the escalation process (risk management).","The critical path is generated from the project plan and takes account of the associated delivery items.","Quality-related project activities as well as procurement activities must be part of the project plan.","A separate, detailed plan can be referred to in the project plan.","The plans must take prototypes and pre-launch parts into account.","The scope of software required at the respective times has been planned."],"ex":" Project plan with milestones  Specific customer requirements regarding technologies xand/or product groups  Customer project plan  Customer deadlines  Customer milestones  Targets set by the customer (measurements within the individual milestones)  Milestone assessments (reviews)  QM plan (e.g. from VDA MLA or APQP)  Country-specific certification requirements (ECE, SAE, DOT, CCC, INMETRO, KBA etc.)  Legal and regulatory approval processes relating to critical systems (environmental requirements, among other things)  Release planning regarding basic functions and milestones  Software project plan  Software milestones  Basic Rollout Plan (BROP)  Feature Rollout Plan (FROP)  Planning of the ASPICE assessment, including the definition of levels and the scope in accordance with the agreed customer requirements"},{"id":"P2.4","k":false,"q":"Have the quality-related project activities been planned, and are they monitored for compliance?","es":"¿Las actividades de calidad del proyecto están planificadas y se monitorea su cumplimiento?","rq":["The quality-related project activities meet the specific customer requirements.","Both product and process assurance measures are part of the quality-related activities.","Verification and validation of the product and process requirements are included in the planning.","The planning also addresses critical components and supply items (internal and external suppliers).","The planning is regularly monitored for compliance and for target achievement.","The quality-related activities relevant to software have been taken into account."],"ex":" Project plan  Customer milestones  Customer requirements with regard to quality plans  Quality plan (audits, reviews and VDA MLA)  Customer specifications  Specific software milestones  Reviews, e.g. of code and models  Test case creation and validation (verification?)  KPIs relevant to software (metrics, test coverage, level of test automation, rate of error reduction etc.)  Software-specific assessment planning and assessment levels  SW-Q release  Risk assessments (special characteristics, cyber security)"},{"id":"P2.5","k":false,"q":"Are the procurement activities of the project included in the project planning?","es":"¿Las actividades de compras están incluidas en la planificación del proyecto?","rq":["The supplier selection process and the target dates for contract awards are contained in the project plan for all types of suppliers.","The suppliers of plants, machines, tools, measuring and inspection systems as well as the service providers are integrated in the planning."],"ex":"   Project plan    Milestone plan    Make-or-buy decision    Service providers (e.g. development, laboratories, maintenance, software)"},{"id":"P2.6","k":true,"q":"Is change management within the project ensured by the project organization?","es":"¿La organización del proyecto asegura la gestión de cambios dentro del proyecto?","rq":["Change management within the project meets the customer’s specific requirements.","Changes (initiated by the supplier, internally or by the customer) must be evaluated.","If necessary, the project plan must be adapted.","This evaluation must include the risk assessment for product quality as well as the deadlines.","Suppliers are actively involved in change management.","It must be ensured that specified design freezes are observed.","Exceptions must be agreed upon between the customer and the supplier and must be documented.","All changes must be documented.","The persons responsible for change management are defined for the customer, internally and to suppliers."],"ex":"   Change management    Process description    Schedules    Change forms    Change history for the product and the process    Evaluation of changes    Approvals of changes    Software: Change request, change management    Change due to fault elimination, changes to the architecture and the requirements"},{"id":"P3.1","k":false,"q":"Have the product/process-specific requirements been specified?","es":"¿Se especificaron los requisitos específicos de producto y proceso?","rq":["The functional and non-functional requirements, including the customer’s requirements as well as statutory and regulatory requirements that apply to the product (and software) to be developed as well as to the production process have to be determined.","The organization must identify and take into account the product and process requirements known from previous experience.","Special characteristics must be identified on the basis of the organization’s own requirements, customer requirements, statutory and regulatory requirements, manufacturing technology and characteristics that arise from the purpose/use of the product.","Customer requirements regarding the selection of suppliers or primary materials must be documented.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are available.","The customer’s requirements regarding the documentation and release of Free and Open Source Software (FOSS) must be taken into account."],"ex":"Product/process development  Requirements regarding the interfaces between hardware and software (products with integrated/embedded software)  Inquiry and contract documents, including requirement specifications  Traceability concept  Ordering and inspection requirements  Catalog of characteristics/reference samples  Product/process characteristics, including characteristics regarding functional safety  Purchasing conditions  Logistics requirements (packaging, JIT, JIS, on consignment)  Quality agreements, including QM-specific requirements  Schedules  Portals/information platforms on the Internet  Lessons Learned  Environmental aspects, recycling requirements  Capability requirements  Requirements regarding release Product development  Specifications, drawings  Software specifications Process development  Requirements regarding facilities, tools and inspection equipment as well as workplace and test station layout  Requirements regarding handling, packaging, storage and identification  Requirements for identification, configuration and ensuring correct installation of the software"},{"id":"P3.2","k":true,"q":"Has the feasibility been comprehensively evaluated according to the product and process requirements?","es":"¿Se evaluó integralmente la factibilidad según los requisitos de producto y proceso?","rq":["ment An interdisciplinary procedure for evaluating feasibility (including potential production locations) must be used.","All determined product/process-specific requirements (technology, function, quality, logistics, software, etc.) must be checked for feasibility.","Material and personnel resources must be considered in the feasibility study.","The results of the feasibility study must be available before tendering.","The feasibility of critical purchased parts must be ensured.","If customer requirements cannot be fulfilled, the customer must be notified or non-conformities approved by the customer prior to the contract being awarded.","A flash concept is available for programming at the plant and updates in the field (if required)."],"ex":"Product/process development  Customer requirements and standards  Schedules, time frame  Regulations, standards, legislation, environmental impact  Requirements from product liability  Traceability concept  Buildings, premises  CAM, CAQ  Product/process innovation  Interdisciplinary feasibility analysis (for example, sales, development, purchasing, production planning, production, QM planning, logistics) Product development  Laboratory/test equipment  Parallel software development / prototyping Process development  Capacity monitoring  Availability of primary materials  Manufacturing options, manufacturing locations  Equipment, tools, production/inspection equipment, auxiliary materials, laboratory facilities, means of transport, containers, storage"},{"id":"P3.3","k":false,"q":"Are the activities for product and process development planned in detail?","es":"¿Las actividades de desarrollo de producto y proceso están planificadas en detalle?","rq":["When planning the product and process development, the level of detail depends on the component, software and complexity of the process.","In the development phase, suitable risk mitigation measures must be used for product and process development assurance, so that the product meets the required operational conditions when goes into series production (function, reliability, safety).","In case of product and process innovations, there is a fallback concept.","Risk analyses are part of the planning.","The inspection planning concept includes the requirements regarding series production, product audits and requalification.","The schedules contain all information regarding product and process development (including deadlines and duration, milestones according to the overall project plan, performance testing, PPA date, software standards…).","The methods and evidence for development release meet the customer requirements and clarification must be sought with the customer if non-conformities occur.","The software engineering process has been specified and meets the customer’s requirements.","The software development progress must also be taken into consideration in the planning, such that the required software functions are tested and available at the required point in time."],"ex":"Product/process development  Overall project plan including all deadlines  Customer requirements  Customer schedule  Lead times  Risk mitigation measures (including backup strategy and cybersecurity)  (QFD, FMEA, HARA etc.)  Prototype/pre-launch planning  Regular status checks on the progress of the development (reviews)  Project plans for investment items (facilities and equipment)  Logistics planning for all phases of product and process development, including packaging  Spare parts concept Product development  Reliability testing, functional testing, trial plan"},{"id":"P3.4","k":true,"q":"Have the procurement activities been planned, and are they monitored for compliance?","es":"¿Se planificaron las actividades de compras y se monitorea su cumplimiento?","rq":["Selection criteria are defined to ensure that the selected suppliers are able to meet the quality requirements.","A potential analysis has been planned or has been carried out for new suppliers not appointed by the customer, new locations or new technologies.","The scope of the planning activities after contract award is based on the risk classification of the purchased products/services.","There are clear rules for the communication of customer requirements along the supply chain.","Customer requirements also include requirements arising from the drawing, the parts, software or component specifications, the delivery quantity, the deadlines, QM agreements and applicable regulations.","Agreements regarding suppliers appointed by the customer (directed suppliers) are defined on a project-specific basis.","The activities in terms of purchasing plants, machines, tools, measuring and inspection equipment as well as services have been determined and planned (selection, contract award, verification and approval).","The progress of the supplier activities (such as contract awards, deadlines, customer and supplier milestones) is monitored."],"ex":"Product / process development  Supplier selection criteria  VDA 6.3 potential analysis and/or comparable method for software  VDA 6.3 audit planning  Management (supplier development, forwarding customer requirements) of the suppliers, PPA procedures, failure analysis, quality, warranty, communication  Interface agreement (services according to DIA or interface agreement)  List of suppliers for the project, including service providers (e.g. development, laboratories, maintenance, software)  Risk classification for the scope of supply of the project and the activities derived (VDA MLA)  Third-party software  Criteria for the release of FOSS"},{"id":"P3.5","k":false,"q":"Have the necessary resources been taken into account for product and process development planning?","es":"¿Se consideraron los recursos necesarios en la planificación del desarrollo de producto y proceso?","rq":["ment The required resources for the project have been determined and documented.","Capacity for the implementation of prototypes and prototype construction, pilot production, performance tests and series production must be planned.","Resource planning is regularly adapted to changes in the project and potential bottlenecks must be addressed.","When introducing new technologies and products, consistent employee training must be planned, and it must be ensured that the necessary infrastructure is created.","Means of transport for in-house transportation, such as packaging and special load carriers have been planned and the relevant quantities have been determined."],"ex":"Product/process development  Planning of staff training, customer service (0km and field), among other things  Qualification matrix  CAx equipment  Availability of qualified personnel for the respective tasks  Budget, infrastructure, e.g. buildings, inspection equipment (hardware and software), laboratory equipment, machines, plants etc.  Capacity planning for all resources  Performance test, Run@Rate, 2-day production, stress test  Provision and distribution of software  Tool chain planning (software development tools) Product development  Test/inspection/laboratory facilities (internal and external)  Resources for planning and conducting tests as well as fixing bugs  Resources for installing the software on the hardware (e.g. flashing, coding, programming) Process development  Production locations, tools, production and inspection equipment, infrastructure"},{"id":"P3.6","k":false,"q":"Have the activities for customer care/customer satisfaction/customer service and field failure analysis been planned?","es":"¿Se planificaron las actividades de atención/satisfacción/servicio al cliente y análisis de fallas en campo?","rq":["The customer requirements are taken into account in the concept for parts supply across the product life cycle, including spare parts supply.","Contingency plans to continually ensure series supply must be included in the concept.","The analysis process for 0-km and field complaints has been planned for the scope of delivery and the supply chain.","The customer requirements regarding field failure analysis are taken into account.","Interfaces to the complaints process have been planned.","An access control concept for software has been established and is maintained.","An analysis of all stakeholders has been carried out.","Communication and escalation paths have been specified."],"ex":"Product/process development  Investment planning Product development  Interfaces to analysis centers for customer complaints, including the relevant software  Access for diagnosis  Access control lists Process development  Inspection planning for standard and stress testing  Triggering criteria are defined  NTF process  Spare parts supply concepts  Contingency plans"},{"id":"P4.1","k":true,"q":"Are the actions from the product and process development plans implemented?","es":"¿Se implementan las acciones de los planes de desarrollo de producto y proceso?","rq":["ment Product and process development activities defined in the development planning are implemented in such a way as to ensure that the operational conditions are met (function, reliability, safety).","The risk analysis (e.g.","FMEA, HARA) is conducted on a multidisciplinary basis and is continuously revised in accordance with the progress of the project.","Defined measures are implemented in accordance with the planning and are checked for effectiveness.","Special characteristics are defined and identified in the relevant documents (FMEA etc.), and measures are implemented to ensure conformity."],"ex":"Product/process development  Methods to minimize risk (e.g. FMEA, HARA, FTA)  Design of experiments (e.g. DoE, Shainin, Taguchi…)  Poka-Yoke principles Product development  Test planning  Assembly test and system test  A, B, C, D samples  Endurance tests  Environmental simulation test (e.g. salt spray test)  Automotive SPICE assessments in accordance with the planning  Code, software release management  Traceability, fallback concept  Variant management  Analysis of requirements, architecture design, implementation and test in accordance with the planning Process development  Control plan/inspection plan"},{"id":"P4.2","k":false,"q":"Are personnel resources available and are the personnel qualified to ensure product and process implementation?","es":"¿Hay recursos de personal disponibles y calificados para asegurar la realización de producto y proceso?","rq":["A staff schedule must be available.","The employees’ tasks, responsibilities and authorizations are defined and allocated.","This also applies to the staff of external service providers.","Appropriate evidence must be available.","It must be ensured that needs assessments is carried out regularly during product and process development with regard to potentially emerging bottlenecks and additional requirements.","Qualified personnel are available during all phases of product and process implementation, and the requirements regarding the series production personnel have been derived.","Processes that have been outsourced must be taken into account."],"ex":"Product/process development  Customer requirements  Requirements profile for the relevant jobs  Determination of the need for training  Evidence of training  Knowledge of methods  Knowledge of foreign languages  Software development: Qualified software testers, integration managers, etc.  Agile development due to qualified roles (DevOps Manager, Release Train Manager, etc.)"},{"id":"P4.3","k":false,"q":"Are the material/immaterial resources available and are they suitable to ensure product and process implementation?","es":"¿Los recursos materiales/inmateriales están disponibles y son adecuados para la realización?","rq":["ment A process to determine resources has been implemented.","The provision of resources refers to the availability of buildings, measuring and inspection equipment, laboratory equipment, machinery, plants, IT systems and infrastructure as well as their utilization.","Processes that have been outsourced must be taken into account.","Regular needs assessment must be carried out during product and process development with regard to potentially emerging bottlenecks and additional requirements.","Material/immaterial resources are available for all phases of product and process implementation, and the requirements for series production have been derived.","Equipment for in-house transport, such as packaging and special load carriers, has been defined and is available in sufficient quantities."],"ex":"Product/process development  Customer requirements  Technical interface to the customer and suppliers  ERP systems  Supporting processes, e.g. from logistics and IT Product development  Resources for verification and validation  Test setups, e.g. Hardware in the Loop (HIL), test boards, evaluation boards  Development tools, provision of the tool chain for software development Process development  Facility planning  Facility layout  Release of plants and machines, line clearance  Quantities and throughput times  Transport routes  Transport, containers, storage  Capacity before the start of series production (initial stock)"},{"id":"P4.4","k":true,"q":"Are the required proofs of capability and releases for product and process development available?","es":"¿Existen las pruebas de capacidad y liberaciones requeridas para el desarrollo de producto y proceso?","rq":["The releases and proofs of capability are available for all items, assemblies, software versions and purchased products/services in accordance with development schedules.","The capability of the measuring and inspection equipment has been proven.","The material data has been confirmed and released.","The measures from the risk analyses (e.g.","FMEA, HARA) have been included in the product and process implementation, and their effectiveness has been confirmed.","In case of products with integrated (embedded) software, the software-related aspects according to VDA Volume 2 have to be taken into account.","The production process and product approval (PPA) must be available on the agreed date.","The tolerances of process parameters for the production of special characteristics have to be verified."],"ex":"Product/process development  PPA results, in particular confirmation of conformity with statutory and regulatory requirements  PPA results for purchased products and services  Development releases from customers Process development  Process parameters and their tolerances  Confirmed logistics concept (e.g. suitability of packaging through sample shipping)  Proofs of capability  Capacity studies  Plant and tool releases Software  Recommendations for use (release notes) for each release  Release of third-party software and FOSS in accordance with customer requirements  Provision of test results and test evaluations"},{"id":"P4.5","k":false,"q":"Have the planned procurement activities been implemented?","es":"¿Se implementaron las actividades de compras planificadas?","rq":["The planned procurement activities have been implemented.","This includes risk assessments, the project plan, the maturity level, releases and observing deadlines.","The planning activities according to the risk classification have been implemented; measures have been derived and their implementation is monitored.","The required proofs of capability and releases (process and product release) for the purchased products and services are available in accordance with the project schedule.","The material data has been confirmed and released.","The relevant project-specific customer requirements have been taken into account.","The processes for ensuring customer care/customer satisfaction/customer service as well as field failure analysis have been established."],"ex":" PPA release  FMEA, HARA  VDA 6.3 audit, potential analysis etc.  Releases, evidence and performance tests in accordance with the coordinated PPA procedure  NTF process, triggering criteria for stress tests have been defined  Spare parts supply concepts  Contingency plans  Interface agreement (services according to DIA or interface agreement)  Sub-supplier management by auditee for off-the-shelf components, engineering assignments (no personnel leasing)  Reference to the ASPICE Acquisition Process Group, ACQ2, ACQ.3, ACQ.4"},{"id":"P4.6","k":false,"q":"Are the manufacturing and inspection specifications derived from product and process development and are they implemented?","es":"¿Las especificaciones de manufactura e inspección se derivan del desarrollo y están implementadas?","rq":["The manufacturing and inspection specifications contain all inspection characteristics from product and process development (including special characteristics).","These must take into account all the components, assemblies, sub-assemblies, and materials, including the processes for manufacturing the products.","The results of the risk analysis are considered (e.g.","FMEA, HARA).","A production control plan is available.","It must be available throughout the prototype phase (if required by the customer), the pre-launch phase and the series production phase.","The scope and the elements of product audits and requalification tests have been defined.","Maintenance specifications are available.","All test cases are described in accordance with the test levels and the customer requirements (e.g.","VModel).","The software functions required at the respective times are released."],"ex":"Product/process development  Risk analyses Product development  Product audit plan  Requalification planning Process development  Inspection instruction  Work instruction  Reaction plans  Production release (first and last piece, repeat release)  In-line inspections Software  Requirements for ensuring correct installation of the software  Release criteria in the production test"},{"id":"P4.7","k":false,"q":"Is a performance test carried out under series conditions for the series release?","es":"¿Se realiza una prueba de desempeño en condiciones de serie para la liberación a serie?","rq":["A performance test must be carried out under series conditions to confirm that the required quantity can be produced for the customer with the resources used, within the specified period of time and in accordance with the specifications.","If the performance test fails to confirm this, measures must be defined.","The installation of the software in the components must be taken into account when determining the cycle times/throughput times.","Note: Depending on the time of the audit, some parts of the relevant production test could still be at the planning stage! The question is not relevant for product development!"],"ex":"Process development  Series production conditions: e.g. tools, plants, cycle time, personnel, production and inspection specifications, measuring and inspection equipment  Customer requirements  Performance test, Run@Rate  Determination of minimum quantities (production peak and agreed flexibility)  Series production maturity of equipment and facilities (measurement report)  Staff concept for series production  Packaging requirements Software  Flash times, including test, ROM programming"},{"id":"P4.8","k":false,"q":"Have the processes for ensuring customer care/customer satisfaction/customer service as well as the field failure analysis been established?","es":"¿Se establecieron los procesos de atención/satisfacción/servicio al cliente y análisis de fallas en campo?","rq":["ment The customer requirements regarding the supply of parts throughout the product life cycle are established in the processes.","The planned processes for the continuous series supply including safety margins for emergencies are available.","The analysis process for 0-km and field complaints is established for the scope of delivery.","The customer requirements regarding field failure analysis are taken into account.","The requirements for the analysis capability at the site have been agreed with the customer.","If external sites are used for analysis, the interfaces are defined and evidence of the availability of the required equipment and capacity is available.","New technologies and products are also taken into account in customer support.","The employees designated for these processes are qualified.","The infrastructure is available.","Processes for product monitoring in the field have been specified.","There must be processes for error analysis and diagnosis (embedded software in control unit).","If agreed, processes for over-the-air (OTA) software updates have been specified."],"ex":"Product/process development  Inspection equipment for standard and stress tests  Triggering criteria are defined  Inspection plans for failure analysis  NTF process Process development  Qualification matrix and evidence of training  Inspection equipment  Service agreements with external analysis sites  Spare parts supply concepts  Contingency plans"},{"id":"P4.9","k":true,"q":"Is there a controlled method for the project handover from development to series production?","es":"¿Existe un método controlado para el traspaso del proyecto de desarrollo a producción en serie?","rq":["ment There is a process for transferring work results from the project to series production.","The activities specified in the project plan have been implemented.","Deadlines have been set for aspects that are still to be clarified, and responsible persons have been appointed.","Successful internal release and customer release is a prerequisite for a series delivery release.","Measures resulting from internal and external releases are implemented on time.","Personnel are available in accordance with the planning and are qualified.","The material resources for series production are available in accordance with the planning.","Measures to secure the production start-up have been specified and introduced.","For products with integrated (embedded) software, the results from development (including intermediate results and their documentation) are recorded.","The industrialization is ensured."],"ex":"Product/process development  Customer requirements  PPA records  Handover protocols/checklists with handover criteria, acceptance reports  Parts history  Key production figures such as OEE, ppm, reject rate, etc.  Experiences from the ongoing project  Personnel resources (production staff, process engineers, maintenance, etc.)  Material resources (machines and plants, buildings, access routes, inspection facilities, load carriers, packaging, etc.)  Change log, Release Note  Industrialization of software: includes flashing software onto the control unit in series production and coding"},{"id":"P5.1","k":false,"q":"Are only approved suppliers used who are able to meet the quality requirements?","es":"¿Solo se usan proveedores aprobados capaces de cumplir los requisitos de calidad?","rq":["ment In series production, it must be ensured that only approved suppliers are used.","The relevant approval criteria have been defined.","When selecting suppliers and in order to assess their ability to meet quality requirements, a process audit must be planned and carried out depending on the risk classification of the component.","Evaluations of the quality performance of existing suppliers have been taken into consideration.","Risks in the supply chain (internal/external) have been identified, evaluated and mitigated using suitable measures.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":"   Defined criteria for the selection of suppliers    QM agreements    In case of criteria that have not been met: evidence of measures being implemented in order to mitigate risks    Assessment of the suppliers’ ability to meet quality requirements, e.g. by means of KPI (ppm, delivery performance), escalation level    Self-Assessment, audit results of the suppliers    ASPICE assessment results    VDA 6.3-Process Audit    VDA 6.3-Potential Analysis"},{"id":"P5.2","k":false,"q":"Are the customer requirements taken into account in the supply chain?","es":"¿Se consideran los requisitos del cliente en la cadena de suministro?","rq":["ment The communication of customer requirements must be regulated and traceable.","Change management must also be taken into account during series production.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Requirements from: drawings, components, software or component specifications, milestone plans, QM agreements or other valid standards  Special characteristics  Requalification requirements  Forwarding of complaints, including measures  Statutory and regulatory requirements"},{"id":"P5.3","k":false,"q":"Have targets for supplier performance been agreed upon, and is the achievement of these targets regularly assessed?","es":"¿Se acordaron metas de desempeño con proveedores y se evalúa su logro periódicamente?","rq":["ment Target agreements regarding delivery performance must be made with all direct suppliers and must be implemented.","Supplier performance must be checked and evaluated within defined periods and according to defined criteria.","If the agreed targets are not met, measures must be defined and their implementation including deadlines must be monitored.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Measurable targets: Delivery quantity, punctuality, failure rate, PPM, special deliveries, rejects, lead times for complaints  Escalation criteria according to QM agreements  Evidence of measures (development programs) being implemented in case of suppliers that do not meet the required delivery performance"},{"id":"P5.4","k":true,"q":"Are the necessary releases available for purchased products and services?","es":"¿Existen las liberaciones necesarias para productos y servicios comprados?","rq":["Prior to using new or changed products/processes in series production, a release must be available for all purchased products and services as agreed upon with the customer.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Report regarding the coordination of the PPA procedure  PPA reports  Reference parts for the PPA procedure  Boundary sample  Product and process changes in the supply chain  Release agreement for small series and individual needs"},{"id":"P5.5","k":true,"q":"Is it ensured that the purchased products and services are of the agreedupon quality?","es":"¿Se asegura que los productos y servicios comprados tengan la calidad acordada?","rq":["To monitor the quality of purchased products and services, inspections are carried out, documented and evaluated in accordance with the inspection planning.","If the quality requirements are not met, a standard complaints process is followed.","Inspection and measuring equipment for purchased products and services must be sufficiently available and must be stored appropriately.","Inspection stations must be laid out appropriately (e.g. climate control, lighting conditions, cleanliness, and protection against damage and contamination)."],"ex":" Released inspection procedure  Sample size (e.g. Skip Lot)  Boundary sample  PPM evaluations, 8D reports  Improvement programs  Material certificates in accordance with DIN EN 10204  Gauges/fixtures  Drawings/specifications  Ordering and packaging specifications"},{"id":"P5.6","k":false,"q":"Are incoming goods delivered and stored appropriately?","es":"¿Los bienes entrantes se entregan y almacenan de forma adecuada?","rq":["Primary materials and load carriers must be stored in accordance with their release status so that they cannot be damaged or mixed.","For materials that could be damaged by temperature, humidity, vibration, etc. and affect the quality of the final product, the transport and storage conditions must be defined and evidence shown. “Suspicious”/quarantined materials must be clearly labeled protected against unauthorized access.","FIFO/FEFO (shelf-life requirements) and batch traceability must be ensured when the materials are further processed.","This equally applies to residual quantities.","Material stock figures in the warehouse management system match the quantities actually in stock.","The storage conditions fulfill the product requirements."],"ex":" Packaging  Labeling (traceability/inspection status/use status)  Quarantine stores; quarantine areas  Batch-related use  Climatic conditions  Protection against damage/contamination/corrosion  Order and cleanliness  Precautions to prevent mixing/mistakes"},{"id":"P5.7","k":false,"q":"Are personnel qualified for their respective tasks and are responsibilities defined?","es":"¿El personal está calificado para sus tareas y las responsabilidades están definidas?","rq":["The responsibilities, tasks and authority the employees have in their relevant work areas must be specified.","The employees are qualified in accordance with the job profile.","Qualification requirements must be determined in relation to the tasks, and qualifications must be planned and carried out accordingly.","Knowledge of previous complaints (including corrective actions) is available for purchased products and services."],"ex":" Knowledge of specifications, product characteristics, customer requirements and production processes  Standards  Statutory and regulatory requirements  Packaging requirements  Quality procedures  Job description / description of tasks and function  Qualification matrix  Qualification of supplier auditors"},{"id":"P6.1.1","k":false,"q":"Has the project been handed over from development to series production and is a reliable start guaranteed?","es":"¿Se traspasó el proyecto de desarrollo a serie y está garantizado un arranque confiable?","rq":["The project handover to series production has been documented according to the specified criteria.","The responsibilities for the entire handover process are specified and acknowledged.","Unresolved issues are followed up on, and the necessary measures are implemented on schedule.","A complete production process and product release (PPA) including the documentation required must take place before the first production shipment.","Measures to secure the production start-up have been implemented on the basis of a risk analysis.","Tools, transport and series packaging, inspection and measuring equipment are available in the necessary quantities.","Analysis options for failure analysis are available The product software corresponds to the latest release versions. "],"ex":" Handover reports  Defined measures and implementation schedule  Production release report  Releases for all plant components and tools in 6.1.2  PPA documents, including customer approval and reference parts regarding the PPA procedure  Waivers  Released software versions production start-up: Higher inspection frequency, additional inspections, Resident, Safe launch concept"},{"id":"P6.1.2","k":false,"q":"Are the necessary quantities/production batch sizes of production materials available at the agreed upon time and at the correct storage location/work-station?","es":"¿Los materiales de producción están disponibles en cantidad/lote, a tiempo y en el lugar correcto?","rq":["The production material must be of the agreed quality and must be provided in the correct quantity and the correct packaging, with the correct documentation, at the agreed time and at the agreed place.","Parts/components must be available at defined storage areas/work-stations.","At the workplace, parts and primary materials are provided as needed, taking into account the order quantity/lot size in accordance with the logistics concept.","The reuse of residual quantities, separated parts, reworked parts, reused parts from product audits, inspected items, etc. and their traceability must be clearly defined.","Regulations for reintroducing parts from outsourced processes (e.g. sorting service) must be available."],"ex":" Production material includes, for example:  Software, packaging, load carriers, parts and components, raw material, series packaging for delivery to the customer, operating, auxiliary and process materials  suitable means of transport     Defined storage locations and stock levels  KANBAN, Just in time/Just in sequence, FIFO/FEFO  Revision / change status of materials and software  Special requirements regarding components and containers (e.g. ESD protection, humidity, temperature, residue)"},{"id":"P6.1.3","k":false,"q":"Are materials stored appropriately and are the means of transport/packaging facilities suitable for the special characteristics of the materials?","es":"¿Los materiales se almacenan adecuadamente y el transporte/empaque es idóneo para sus características especiales?","rq":["Packaging requirements must be consistently taken into account/fulfilled.","During manufacture and in-house transport and also when being transported to and from service providers, suitable transport units must be used to protect the products from damage and contamination.","Storage areas/work-stations/containers must be appropriate for the tidiness and cleanliness required for the material.","Cleaning cycles are defined and monitored.","The supply of materials at the work-station/on the assembly line must allow for safe handling.","Specified storage times and use-by dates for special materials must be monitored by means of appropriate methods Operating and auxiliary materials for plants and machinery that have a direct effect on the product/product quality must be monitored accordingly.","Materials, operating and auxiliary materials must be protected against environmental and climatic influences."],"ex":" Stock quantities  Storage conditions  released special and standard transport containers  Protection against damage to the material  5S  Over-filling (storage areas and containers)  Maximum and minimum storage times, specified interim storage times, FIFO/FEFO"},{"id":"P6.1.4","k":false,"q":"Are the necessary labels/records/releases available and allocated appropriately to the materials?","es":"¿Las etiquetas/registros/liberaciones necesarias están disponibles y asignados correctamente a los materiales?","rq":["Released materials must be clearly identifiable.","The release identification on bundles/batches/load carriers/parts must be defined.","It must be ensured that only released materials/parts are forwarded to production/the next production stage and used.","Traceability from the sub-supplier to the customer must be guaranteed according to a defined traceability concept.","Customer requirements as well as statutory and regulatory requirements regarding labeling are taken into account."],"ex":" Customer requirements regarding labeling and traceability  Labeling of released parts/materials (stickers, labels, issue slips, VDA label, DMC, etc.)  Records of approvals  Traceability system  Documentation of waivers (number, duration, type of identification, etc.)  Stock management systems"},{"id":"P6.1.5","k":true,"q":"Are product or process changes during series production tracked and documented?","es":"¿Los cambios de producto o proceso en serie se rastrean y documentan?","rq":["ment Changes to the product and the production process are implemented in accordance with the change management described.","Changes to the product and process are agreed upon with the customer, approved and released (including software changes) in accordance with customer requirements.","A PPA must be carried out.","The history of change statuses must be fully traceable.","The correct, released version of the material / software must be used.","After changes have been made, it must be checked whether the risk analyses need to be updated."],"ex":" Trigger matrix in accordance with VDA Volume 2 or customer specifications  Documented release of a change  Cross-functional evaluation prior to changes  Change history/parts history (also for software)  Design and process FMEA  Operation management in case of changes  Pre-production  Unique software identifier, software integrity (build number, hash key)"},{"id":"P6.2.1","k":false,"q":"Are the requirements in the production control plan complete and have they been effectively implemented?","es":"¿Los requisitos del plan de control de producción están completos y se implementaron eficazmente?","rq":["ment The production and inspection documents are complete and are based on the production control plan.","The data relating to released machinery/tools/aids must be noted in the production control plan and/or the manufacturing and inspection documents.","The documents must be accessible close to the work-station.","Required measures (reaction plan) for process disturbances are described in the production control plan and are implemented and documented.","Process parameters influencing product characteristics/quality must be fully stated.","Tolerances must be stated for process parameters and inspection characteristics.","The control limits in process control charts are defined, identifiable and plausible.","Non-conformities and initiated measures regarding process requirements and inspection characteristics must be documented.","Conditions governing rework are specified, assess as part of the risk analysis and secured within the process (parts identification; repeat inspection etc.)."],"ex":" Inspection characteristics, inspection equipment, inspection methods, inspection frequencies, inspection cycles and requalification  Data regarding machines/tools/aids (identification numbers), process parameters and tolerances (pressure, temperatures, times, speeds etc.)  Work instructions (including reworking)  Inspection instruction"},{"id":"P6.2.2","k":false,"q":"Are production processes released?","es":"¿Los procesos de producción están liberados?","rq":["A process-specific release inspection for first piece/last piece and repeat release was carried out and documented.","A release is necessary for the product and the process and must be carried out and documented by authorized employees using acceptance criteria.","Non-conformities and initiated measures are documented.","At the time of release, the necessary reference and boundary samples must be available.","Criteria for triggering a repeat release must be defined e.g. after an interruption of production.","If production is continued after the collection of inspection parts, these products must be accessible until the inspection parts are released."],"ex":" Release of a batch, including repeat release  First piece /last piece and repeat release  Tooling diagrams/reference parts/installation parts (e.g. defect identification)  Possible triggering criteria for a repeat release: ○ Production interruption (e.g. night time in two-shift operations, tool changes, material/ batch/product change) ○ Repair, tool change, ○ changed setting data  Release of reworked parts"},{"id":"P6.2.3","k":true,"q":"Are special characteristics controlled in production?","es":"¿Se controlan las características especiales en producción?","rq":["Special product characteristics specified by the customer and the organization as well as defined process parameters are marked in the production control plan and systematically monitored.","Records of non-compliances and corrective actions are maintained.","Non-compliances affecting the characteristics of the product must be approved by the customer.","Records regarding special characteristics are available.","The duration and type of archiving of these records are specified and meet the customer’s requirements."],"ex":" Drawings  Labeling indicating the customer-specific special characteristics, e.g.: D/TLD, DS, DZ, R, S, F  Process FMEA  Production control plan  SPC evaluations  Quality control charts  Proofs of capability  Proof of inspection process capability  Inspection results  Process parameter records"},{"id":"P6.2.4","k":true,"q":"Are non-approved and/or defective parts controlled?","es":"¿Se controlan las piezas no aprobadas y/o defectuosas?","rq":["Suspect parts and defective parts must be separated, labeled, recorded or (when necessary) safely removed from the production process.","These parts must either be directly marked or marked on their container.","Authorized personnel decide on the further use of potentially defective products.","The scope (including inspection and release) of permissible rework is described in work instructions.","Quarantine stores and quarantine areas must be clearly labeled.","Accidental or unauthorized use of restricted parts must be excluded."],"ex":" Labeling indicating the product status  defined scrap/rework-stations in production  Quarantine stores and quarantine areas, clearance areas  Documentation regarding rejects, rework and repair  Authorizations"},{"id":"P6.2.5","k":false,"q":"Is the flow of materials secured against mixing/wrong items?","es":"¿El flujo de materiales está asegurado contra mezclas / piezas equivocadas?","rq":["A mix-up of materials or the use of wrong materials, software or components must be ruled out.","Appropriate measures must be taken to ensure that any mix-ups of parts or any use of wrong parts/incorrect installation of parts is detected early on.","The process and/or inspection status of parts must be clearly visible.","The reuse of residual quantities, separated parts, reworked parts, reusable parts must be clearly defined.","Traceability is ensured.","Regulations for reintroducing parts from outsourced processes must be available.","Setting masters, setup and reference parts must be labeled and protected against accidental use."],"ex":" Process FMEA  Poka Yoke actions  Checks and inspections in production facilities  Traceability of batches  FIFO/FEFO  Kanban  Removal of invalid labeling  Value stream analysis  Sorting service  Unique software identifier, software integrity (build number, hash key)"},{"id":"P6.3.1","k":false,"q":"Are the employees able to fulfill their given tasks?","es":"¿Los empleados son capaces de cumplir las tareas asignadas?","rq":["For each task/job, the corresponding requirements profile has been specified.","The employees’ qualification is in line with the requirements profile.","If this is not the case, a qualification scheme must be put in place.","Instructions, trainings and inductions provided to the employees as well as proofs of qualification are documented.","Proof of special qualifications required for the relevant job must be provided.","In case of changes to processes, trainings/instructions are provided and documented.","The requirements also apply to temporary employees."],"ex":" Evidence of qualifications  Training plan  Initial training plan, including evidence  On-the-job training  Qualification matrix  Knowledge about the product and failures that have occurred  Handling of measuring equipment  Interpretation of control charts  Training/instructions regarding occupational safety  Training in special characteristics  Suitable evidence of qualification (e.g. welding certificate, vision test results, hearing test results)"},{"id":"P6.3.2","k":false,"q":"Do the employees know what responsibilities and authority they have regarding the monitoring of product and process quality?","es":"¿Los empleados conocen sus responsabilidades y autoridad sobre el monitoreo de la calidad de producto y proceso?","rq":["The employees’ responsibilities, duties and authority are described and implemented.","The employees know the consequences of incorrect execution of work.","The tasks/functions of the product are known.","It is also known what happens when they are no longer guaranteed.","Employees receive regular information on the current standard of quality achieved and are informed about customer complaints.","The requirements also apply to temporary employees."],"ex":" Work/inspection instructions  Job descriptions  Setup release, first piece inspection, last piece inspection  Authority to stop and start the process  Escalation protocol  Product training  Product safety/product liability training"},{"id":"P6.3.3","k":false,"q":"Are the necessary personnel resources available?","es":"¿Se cuenta con los recursos de personal necesarios?","rq":["There is a staff schedule for all shifts.","The staff schedule takes into account the required number of qualified employees.","Rules exist for supporting areas that are not continually in use (e.g. laboratory, measurement room).","Fluctuations in customer orders and workforce absences (e.g. illness, holidays, training) are taken into account in the staff schedule.","The requirements also apply to temporary employees."],"ex":" Shift plan  Evidence of qualifications  Qualification matrix  documented absence management rules  Staff schedule  Mentors"},{"id":"P6.4.1","k":true,"q":"Is the manufacturing equipment suitable to meet the customer’s product-specific requirements?","es":"¿El equipo de manufactura es adecuado para los requisitos específicos de producto del cliente?","rq":["It must be demonstrated that the processes are implemented in accordance with the customer requirements using the existing production facilities, and that the resulting products meet the customer specifications.","The production facilities, machines and plants must be able to comply with the specified tolerances for the respective product and process characteristics.","Parameters and software that influence the process are protected against unauthorized access.","Process capability must be determined for selected product and process characteristics, and proof of capability must be provided.","The process capability must meet internal requirements as well as customer requirements.","The minimum requirement for process capability is Cpk ≥ 1.33.","In case of characteristics where a certain capability is required but proof of capability cannot be obtained, 100% inspection is required."],"ex":"tion  Proof of machine/process capability  Monitoring of key process parameters (e.g. pressure, time, temperature)  Capability of replacement tools  Feed and removal systems  Reproducibility of gages, fixtures etc.  Cleanliness requirements  Configuration management, ensuring provision of software in accordance with the unique identifier, software integrity (build number, hash key)"},{"id":"P6.4.2","k":false,"q":"Is the maintenance of the manufacturing equipment and tools controlled?","es":"¿Se controla el mantenimiento del equipo de manufactura y herramentales?","rq":["Preventive and/or predictive maintenance activities (maintenance, inspection and repair) are defined and implemented for all installations, equipment, machines and tools based on the risk.","Scheduled and unscheduled maintenance activities that have been carried out are documented and analyzed with regard to potential improvement measures.","Resources needed to carry out necessary maintenance activities are available.","A process for the analysis and optimization of down-time, machine utilization and tool life is implemented effectively.","The availability of replacement parts is ensured.","Tools undergo tool management which includes the following:  Tool history including all changes and tool life  Operational status  Labeling of tools These requirements also apply to external service providers."],"ex":" Production-related logistical equipment, such as forklift trucks  Maintenance and servicing schedules  TPM Total Productive Maintenance  Key processes and bottleneck machines  Technical documentation provided by the manufacturer  Preventative tool exchange programs for units subject to increased wear  Tool operation sheet  Operational status of tools, e.g. operational, not operational  Labeling of tools, e.g. property of the customer, tool no., index"},{"id":"P6.4.3","k":true,"q":"Can compliance with quality requirements be effectively monitored with the measuring and inspection equipment in use?","es":"¿Con el equipo de medición e inspección se puede monitorear eficazmente el cumplimiento de requisitos de calidad?","rq":["The inspection equipment and measuring systems used are suitable for the intended purpose and handling in production.","They are included in the production control plan.","Confirmed results of capability studies are available for the inspection equipment and measuring systems used.","Inspection and measuring equipment is labeled.","The validity status is monitored.","A process for periodic monitoring of inspection equipment and measuring systems is established and implemented.","In case of non-conformity, an assessment of potential risks in relation to the process, the product and the customer is carried out.","Measures have been defined and are implemented effectively.","Auxiliary equipment for inspection equipment and measuring systems that have an influence on the measurement result are monitored in the same way."],"ex":" Measuring system analysis  Test process capability  Replacement measuring equipment  Software integrity check  Calibration status (inspection sticker, barcode, engraving, etc.)  Reference parts"},{"id":"P6.4.4","k":false,"q":"Do the work and inspection stations fulfill the requirements?","es":"¿Los puestos de trabajo e inspección cumplen los requisitos?","rq":["Workplace and ambient conditions are appropriate for the products and the work carried out, in order to prevent or eliminate contamination, damage, mix-ups of parts and the use of wrong parts.","This also applies to rework, sorting and inspection stations that have been permanently or temporarily set up.","The layout of the work station is adapted to the work to be carried out."],"ex":" Cleanliness and tidiness, 5S  Lighting  Noise pollution  Climate control  Clean rooms  ESD  Layout of the work station  Surroundings/handling of parts at the work station  Occupational safety"},{"id":"P6.4.5","k":false,"q":"Are tools, devices and inspection equipment stored properly?","es":"¿Herramientas, dispositivos y equipo de inspección se almacenan correctamente?","rq":["Tools, devices and test equipment must be stored properly.","It is ensured that the equipment is stored in such a way as to be protected against damage and environmental effects.","Cleanliness and tidiness are ensured.","The issue and use of this equipment is controlled and documented."],"ex":" Stored in such a way as to be protected against damage, e.g. collision protection    5S Method  Defined storage location, e.g. markings on the floor  Transparent warehouse management"},{"id":"P6.5.1","k":false,"q":"Have targets been set for the production process?","es":"¿Se definieron metas para el proceso de producción?","rq":["Process-specific targets are defined, monitored and communicated.","Customer requirements are taken into account when setting targets.","A regular comparison between specified targets and actual results is made and documented."],"ex":" Key production figures, e.g. quantities produced; quality metrics, throughput times, defect costs, process effectiveness figures, plant and machine availability)  First time trough quality, First pass yield  Reduction of waste (e.g. rejects and rework, energy and process materials)"},{"id":"P6.5.2","k":false,"q":"Is quality and process data collected in a way that allows for analysis?","es":"¿Los datos de calidad y proceso se recop
