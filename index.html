<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPM · Plataforma de Auditorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--dk:#0B2D50;--dk2:#123E69;--mid:#0E75BC;--cy:#42C6FF;--lt:#CFE2F1;--pale:#EAF1F7;--amb:#C87F0A;--grn:#16834E;--red:#D7263D;--gray:#5A6C7E;--txt:#10263B;--bd:#D7E1EB}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'IBM Plex Sans','Noto Sans KR','Malgun Gothic',Arial,sans-serif;color:var(--txt);font-size:14px;line-height:1.45;min-height:100vh;
background:radial-gradient(circle at 8% 3%,rgba(66,198,255,.16),transparent 27rem),radial-gradient(circle at 96% 12%,rgba(14,117,188,.13),transparent 30rem),linear-gradient(145deg,#f7fafc 0%,#eaf1f7 52%,#dce8f2 100%);background-attachment:fixed}
.mono{font-family:'IBM Plex Mono',monospace}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.hero{width:min(1180px,calc(100% - 32px));margin:18px auto 0;padding:18px 22px;border-radius:18px;border:1px solid rgba(255,255,255,.2);border-bottom:4px solid var(--red);background:linear-gradient(118deg,rgba(7,35,62,.98),rgba(11,63,105,.95) 62%,rgba(14,117,188,.9));box-shadow:0 18px 48px rgba(5,35,61,.22);color:#fff}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-box{width:190px;min-width:190px;height:74px;padding:11px 15px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(0,0,0,.22)}
.logo-box img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.brand-copy{flex:1;min-width:220px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:#8EDCFF;text-transform:uppercase;margin-bottom:4px}
.brand-copy h1{margin:0;font-size:clamp(19px,2.5vw,29px);font-weight:700;letter-spacing:-.02em}
.brand-sub{margin-top:4px;color:#D5E8F7;font-size:12px}
.hstat{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#D4E7F5;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:6px 10px;border-radius:8px;text-align:right;max-width:100%}
.pill.b{background:rgba(66,198,255,.14);border-color:rgba(142,220,255,.3);color:#F5FBFF;font-family:inherit;font-weight:600}
.langs{display:flex;gap:5px}.langs button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px}.langs button.sel{background:#fff;color:var(--dk)}
main{width:min(1180px,calc(100% - 32px));margin:14px auto 40px;display:grid;gap:14px}
/* ---- 07 carrusel curvo ---- */
.stage{position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 44px rgba(22,59,88,.22);isolation:isolate}
.s-curve{background:radial-gradient(70% 90% at 50% 0%,#0f3a63 0,#07203a 55%,#04111f 100%);height:clamp(440px,50vw,520px);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.s-curve.drag{cursor:grabbing}
.curve-head{position:absolute;left:24px;top:20px;z-index:3;max-width:48ch;pointer-events:none}
.curve-head b{display:block;font-weight:600;color:#f2f7fb;font-size:15px}
.curve-head span{color:#8fb0cc;font-size:12.5px}
.curve-scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%}
.ring{position:absolute;left:50%;top:54%;width:0;height:0;transform-style:preserve-3d}
.cc{position:absolute;width:224px;height:292px;left:-112px;top:-146px;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 20px 40px -18px rgba(0,0,0,.6);cursor:pointer}
.cc.light{color:var(--txt)}
.cc .tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cc h3{margin:6px 0 4px;font-size:20px;line-height:1.1;letter-spacing:-.02em}
.cc p{margin:0;font-size:11.5px;opacity:.8}
.cc .prog{display:grid;gap:5px}
.cc .prog .row{display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:11px}
.cc .prog .row b{font-size:24px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;white-space:nowrap}.cc .prog .row span{white-space:nowrap}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}.cc.light .bar{background:rgba(11,45,80,.15)}
.bar i{display:block;height:100%;background:#7ee0a8;border-radius:9px;transition:width .5s}
.cc .go{margin-top:8px;border-radius:9px;padding:8px 10px;text-align:center;font-weight:700;font-size:12.5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}.cc.light .go{background:rgba(11,45,80,.1);border-color:rgba(11,45,80,.25)}.cc.sel .go{background:#fff;color:var(--dk)}
.cc.sel{box-shadow:inset 0 0 0 2px var(--cy),0 24px 50px -18px rgba(66,198,255,.5)}
.carr-ctl{position:absolute;left:0;right:0;bottom:14px;z-index:3;display:flex;justify-content:center;align-items:center;gap:12px}
.carr-ctl button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:16px}
.carr-ctl button:hover{background:rgba(255,255,255,.22)}
.dots{display:flex;gap:7px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:.25s;cursor:pointer}.dots i.on{background:var(--cy);transform:scale(1.35)}
@media (max-width:600px){.cc{width:176px;height:240px;left:-88px;top:-120px;padding:13px}.cc h3{font-size:17px}.curve-head{left:16px}}
.cloud{width:min(1180px,calc(100% - 32px));margin:14px auto 0;background:rgba(255,255,255,.92);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 8px 24px rgba(22,59,88,.08)}
.cloud .cs{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:var(--dk)}
.cloud .dot{width:10px;height:10px;border-radius:50%;background:#B9C4DE;flex:none}
.cloud.ok .dot{background:#16834E;box-shadow:0 0 6px #4CE0A0}.cloud.warn .dot{background:#F0C24B;box-shadow:0 0 6px #F0C24B}.cloud.ng .dot{background:#D7263D;box-shadow:0 0 6px #FF8A80}
.cloud .sp{flex:1;min-width:120px;font-size:12px;color:var(--gray)}
.cloud input{width:200px!important;flex:none;padding:8px 10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase}
.cloud .btn{padding:8px 14px;font-size:12.5px}
.pill.cl{display:flex;align-items:center;gap:6px}.pill.cl .dot{width:8px;height:8px;border-radius:50%;background:#B9C4DE}.pill.cl.ok .dot{background:#4CE0A0;box-shadow:0 0 5px #4CE0A0}.pill.cl.warn .dot{background:#F0C24B}.pill.cl.ng .dot{background:#FF8A80}
/* ---- paneles ---- */
.panel{background:rgba(255,255,255,.92);border:1px solid var(--bd);border-radius:16px;padding:20px 22px;box-shadow:0 10px 28px rgba(22,59,88,.1)}
.det{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;animation:fin .4s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:820px){.det{grid-template-columns:1fr}}
.det h2{margin:2px 0 6px;font-size:24px;letter-spacing:-.02em}
.ref{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mid);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.det p{color:#3d5368;margin:6px 0 12px}
.det ul{margin:0 0 14px;padding-left:18px;color:#3d5368}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--pale);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);font-weight:600}
.kpi b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi b.sm{font-size:15px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:13.5px;background:var(--dk);color:#fff;transition:.2s}
.btn:hover{background:var(--mid)}
.btn.sec{background:#fff;color:var(--dk);border:1px solid var(--bd)}.btn.sec:hover{background:var(--pale)}
.btn.red{background:#fff;color:var(--red);border:1px solid #f0c3c9}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.gauge{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px}
.gauge svg{flex:none;transform:rotate(-90deg)}
.gauge .gt b{display:block;font-size:15px}.gauge .gt span{font-size:12px;color:var(--gray)}
/* ---- vistas de módulo ---- */
.view{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(145deg,#f7fafc 0%,#eaf1f7 52%,#dce8f2 100%)}
.view[hidden]{display:none}
.vbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(118deg,#07233e,#0b3f69);color:#fff;border-bottom:3px solid var(--red)}
.vbar .back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px}
.vbar .back:hover{background:rgba(255,255,255,.25)}
.vbar h2{margin:0;font-size:16px;flex:1}.vbar .eyebrow{margin:0}
.vbar img{height:30px;background:#fff;border-radius:6px;padding:3px 6px}
#view-iatf{overflow:hidden}
#view-iatf iframe{display:block;width:100%;height:calc(100vh - 56px);border:0;background:#fff}
.wrapm{width:min(1100px,calc(100% - 28px));margin:14px auto 60px;display:grid;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;color:var(--gray)}
.tabs button.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.08);font-size:11px;margin-right:7px}
.tabs button.on .n{background:rgba(255,255,255,.2)}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--dk)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
@media (max-width:760px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:block;font-size:11px;font-weight:600;color:var(--gray);margin-bottom:3px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;font:inherit;background:#fcfdfe;color:var(--txt)}
textarea{min-height:58px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--gray)}
.chip.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.side{position:sticky;top:70px;display:grid;gap:6px}
@media (max-width:820px){.side{position:static;grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}}
.sb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--txt)}
.sb.on{border-color:var(--mid);box-shadow:inset 3px 0 0 var(--mid);background:#f4f9fd}
.sb .pc{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gray);white-space:nowrap}
.q{background:#fff;border:1px solid var(--bd);border-left:5px solid #c4d1de;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.q.bad{border-left-color:var(--red)}.q.mid{border-left-color:var(--amb)}.q.good{border-left-color:var(--grn)}
.q .qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qid{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--mid);font-size:12px}
.star{color:var(--red);font-weight:700;font-size:11px;background:#fdecee;border-radius:6px;padding:1px 7px}
.q h4{margin:4px 0 2px;font-size:14.5px;font-weight:600;flex-basis:100%}
.q .en{font-size:12px;color:var(--gray);margin:0 0 8px}
details{margin:6px 0;border:1px solid var(--bd);border-radius:9px;background:#f6fafd}
details summary{cursor:pointer;padding:7px 11px;font-size:12px;font-weight:600;color:var(--dk)}
details .dd{padding:2px 14px 10px;font-size:12px;color:#3d5368}
details ul{margin:4px 0;padding-left:16px}
.scale{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sc{min-width:52px;border:1px solid var(--bd);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;font-size:14px;color:var(--gray);font-family:'IBM Plex Mono',monospace}
.sc.on.r{background:var(--red);border-color:var(--red);color:#fff}.sc.on.a{background:var(--amb);border-color:var(--amb);color:#fff}.sc.on.g{background:var(--grn);border-color:var(--grn);color:#fff}.sc.on.n{background:var(--gray);border-color:var(--gray);color:#fff}
.crit{display:grid;gap:6px;margin:8px 0}
.cr{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--txt);align-items:flex-start}
.cr .p{flex:none;min-width:46px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;border-radius:7px;background:var(--pale);padding:2px 6px}
.cr.on{border-color:var(--mid);background:#eef6fc}.cr.on .p{background:var(--dk);color:#fff}
.hint{font-size:12px;color:var(--gray)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:var(--dk);color:#fff;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table.t td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
table.t tr:nth-child(even) td{background:#f6fafd}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;color:#fff}
.alert{border-radius:10px;padding:10px 14px;font-size:12.5px;border:1px solid}
.alert.w{background:#fff8e6;border-color:#f0d9a8;color:#7a5006}.alert.r{background:#fdecee;border-color:#f0c3c9;color:#8f1a2b}.alert.i{background:#eaf4fc;border-color:#bcd9ee;color:#12476f}.alert.g{background:#e8f6ee;border-color:#b5e0c7;color:#0d5a34}
.big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.row-in{display:flex;gap:8px;margin-bottom:6px}
.row-in input{flex:1}
.x{border:1px solid var(--bd);background:#fff;border-radius:9px;width:36px;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1}
/* ---- módulos con diseño IATF ---- */
.mhero{width:min(1180px,calc(100% - 32px));margin:14px auto 0;padding:18px 22px;border-radius:18px;border:1px solid rgba(255,255,255,.2);border-bottom:4px solid var(--red);background:linear-gradient(118deg,rgba(7,35,62,.98),rgba(11,63,105,.95) 62%,rgba(14,117,188,.9));box-shadow:0 18px 48px rgba(5,35,61,.22);color:#fff}
.mhero .brand{align-items:center}
.mback{width:min(1180px,calc(100% - 32px));margin:12px auto 0;display:flex}
.mback button{background:#fff;border:1px solid var(--bd);color:var(--dk);border-radius:10px;padding:8px 14px;font-weight:700;font-size:12.5px;box-shadow:0 6px 18px rgba(22,59,88,.08)}
.mback button:hover{background:var(--pale)}
.showcase{position:relative;overflow:hidden;width:min(1180px,calc(100% - 32px));margin:14px auto 0;border-radius:18px;border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 44px rgba(22,59,88,.17);min-height:190px}
.showcase img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 52%}
.showcase .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,31,54,.94) 0%,rgba(7,45,77,.84) 38%,rgba(8,48,79,.28) 72%,rgba(4,24,43,.56) 100%)}
.showcase .ct{position:relative;z-index:1;padding:26px 30px;color:#fff;max-width:620px}
.showcase .ti{font-size:clamp(20px,2.6vw,30px);font-weight:700;line-height:1.1}
.showcase .de{margin-top:9px;color:#D6E8F5;font-size:13px;line-height:1.5}
.mnav{display:flex;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 24px rgba(22,59,88,.1);position:sticky;top:8px;z-index:5;overflow-x:auto;width:min(1180px,calc(100% - 32px));margin:14px auto 0}
.mnav button{flex:1;min-width:130px;border:0;background:none;padding:12px 8px;font-weight:700;color:var(--gray);border-bottom:3px solid transparent;white-space:nowrap}
.mnav button .n{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--lt);color:var(--dk);margin-right:6px;font-size:12px;text-align:center}
.mnav button.on{color:var(--dk);border-bottom-color:var(--red);background:var(--pale)}
.mnav button.on .n{background:var(--dk);color:#fff}
.wrapm{width:min(1180px,calc(100% - 32px))}
.card{box-shadow:0 6px 18px rgba(22,59,88,.06);padding:18px}
.card h3{font-size:18px}
.card .sub{color:var(--gray);margin:-6px 0 14px;font-size:13px}
label.f{text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:700}
/* ---- SQ-Mark v5.1 ---- */
.btn.sm{padding:7px 11px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:6px;margin:10px 0}
.lv{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 10px;display:grid;gap:1px;text-align:left;color:var(--txt);font-size:12.5px;align-content:start}
.lv b{font-size:12.5px}.lv span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gray)}.lv small{font-size:10.5px;color:#8a99a8}
.lv.on{color:#fff;border-color:transparent}.lv.on span,.lv.on small{color:rgba(255,255,255,.9)}
.lv.l0.on{background:#0e7a4a}.lv.l1.on{background:#2e9e5b}.lv.l2.on{background:#1a6fb5}.lv.l3.on{background:#d98a00}.lv.l4.on{background:#e0662b}.lv.l5.on{background:#d7263d}.lv.l6.on{background:#6b7b8c}
.evid{margin-top:10px;border:1px dashed #b9cde0;border-radius:11px;padding:10px 12px;background:#f8fbfe}
.evid.need{border-color:#e9b44c;background:#fff9ec}
.evid .eh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.th{position:relative;width:96px;height:96px;border-radius:9px;overflow:hidden;border:1px solid var(--bd);background:#eef3f8}
.th img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.th .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:14px;line-height:1;padding:0}
.th .wait{display:grid;place-items:center;height:100%;color:var(--gray)}
.pbt{display:flex;gap:8px;flex-wrap:wrap}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:grid;place-items:center;cursor:zoom-out}.lbx img{max-width:96vw;max-height:92vh;object-fit:contain}.lbx button{position:absolute;top:14px;right:18px;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:22px}
.crt td{font-size:12px;line-height:1.45}
/* ---- tarjeta VDA 6.3: rojo, borde y letra negros ---- */
.cc.vda{color:#000;border:4px solid #000;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.cc.vda .tag,.cc.vda h3,.cc.vda p,.cc.vda .prog .row,.cc.vda .prog .row b,.cc.vda .prog .row span{color:#000;opacity:1}
.cc.vda .tag{font-weight:600}
.cc.vda .bar{background:rgba(0,0,0,.18);border:1px solid #000;height:7px}.cc.vda .bar i{background:#000}
.cc.vda .go{background:#fff;color:#000;border:2px solid #000}
.cc.vda.sel{box-shadow:inset 0 0 0 3px #fff,0 24px 50px -18px rgba(237,28,36,.7)}
/* ---- informe SQ imprimible ---- */
#printSQ{display:none}
.rp{font-family:'IBM Plex Sans','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;color:#000;font-size:8.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp .pg{break-after:page;page-break-after:always}.rp .pg:last-child{break-after:auto;page-break-after:auto}
.rp .pg-l{page:land}.rp .pg-p{page:port}
.rp{padding-right:.6mm;box-sizing:border-box}.rp table{border-collapse:collapse;width:calc(100% - .4mm)}
.rp td,.rp th{border:.2mm solid #8d9aa6;padding:.6mm 1.5mm;vertical-align:middle}
.rtitle{background:#E2EFDA;font-size:15pt;font-weight:800;padding:1.4mm 3mm}
.rline{height:1.4mm;background:#1F3864;margin:1.2mm 0 1.5mm}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:0 6mm}
.rh{font-size:10pt;font-weight:700;margin:1.6mm 0 .8mm;display:flex;justify-content:space-between;align-items:center}
.rd{font-size:8.5pt;font-weight:400}.rd .dt{display:inline-block;min-width:26mm;padding:1mm 2mm;text-align:center}
.lb{background:#E3F3F6;text-align:center;font-size:8.5pt}.lb2{background:#fff;font-size:8.5pt}
.vl{background:#E2EFDA;text-align:center;font-weight:700}.vw{text-align:center;font-weight:700}
.rp .c{text-align:center}.dr td{height:4.6mm;font-size:7.8pt}
.res .vl.big{font-size:12pt}.tot{background:#2F5597;color:#fff;text-align:center;font-size:11pt;font-weight:600;width:24mm}
.cm td.tx{height:6.5mm;vertical-align:top;border-style:dotted}
.rfoot{margin-top:2.5mm;font-size:7.5pt;color:#444}
.etop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2mm}.etit{font-size:14pt;font-weight:800}.esub{font-size:8pt;font-weight:400}.eh2{width:60mm}
.rp table.et{table-layout:fixed}
.et th{background:#E2EFDA;font-size:7.5pt;text-align:center}.et td{font-size:6.4pt;line-height:1.26;vertical-align:top;word-break:break-word;white-space:pre-wrap}
.et thead{display:table-header-group}.et tr{break-inside:avoid;page-break-inside:avoid}
.et td.cat{font-weight:700;background:#f3f7fb;white-space:normal;vertical-align:top;border-top-color:transparent;border-bottom-color:transparent}.et td.cat.first{border-top-color:#8d9aa6}.et td.lvc{font-weight:600;white-space:normal}.et td.c{vertical-align:middle}
.et tr.sub td{background:#E2EFDA;font-weight:700;font-size:7.5pt;vertical-align:middle;white-space:normal}.et tr.tt td{background:#cfe0f4}
.ftit{font-size:13pt;font-weight:800;text-align:center;padding-bottom:1mm;border-bottom:.8mm solid #1F3864}
.ft td{font-size:8pt}
.annex .ax{break-inside:avoid;page-break-inside:avoid;margin-bottom:5mm}.axh{background:#E2EFDA;padding:1.2mm 2mm;font-size:8.5pt;display:flex;justify-content:space-between;gap:4mm;align-items:flex-start}.axh span{font-size:8pt;color:#333;white-space:nowrap;flex:none}
.axg{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm;margin-top:2mm}
.axg figure{margin:0}.axg img{width:100%;max-height:62mm;object-fit:contain;background:#f3f3f3;border:.2mm solid #bbb}.axg figcaption{font-size:7pt;color:#555;margin-top:.6mm}

"use strict";
const SQD={"cats":[{"ko":"생산조건관리","es":"Gestión de condiciones de producción","en":"Production condition management"},{"ko":"검사시험","es":"Inspección y pruebas","en":"Inspection & testing"},{"ko":"설비관리","es":"Gestión de equipos","en":"Equipment management"},{"ko":"금형관리","es":"Gestión de moldes","en":"Mold management"},{"ko":"자재관리","es":"Gestión de materiales","en":"Material management"},{"ko":"품질경영체제","es":"Sistema de gestión de calidad","en":"Quality management system"}],"lv":[{"ko":"우수","es":"Sobresaliente","en":"Excellent","f":1},{"ko":"양호","es":"Bueno","en":"Good","f":0.9},{"ko":"보완","es":"Por complementar","en":"Needs supplement","f":0.7},{"ko":"일부미흡","es":"Deficiencia parcial","en":"Partially insufficient","f":0.45},{"ko":"다수미흡","es":"Deficiencia múltiple","en":"Largely insufficient","f":0.25},{"ko":"미관리","es":"Sin control","en":"Not managed","f":0},{"ko":"해당없음","es":"No aplica","en":"N/A","f":0}],"crit":[{"lv":0,"ko":["SQ평가서에 명시된 점검항목 및 업종특성 요구사항(SQ평가서 참고)에 대한 관리기준이 명확히 수립되고, 정합성 및 효율성을 지속적으로 검토/보완하여 고도화 진행\n 사례1) 『문제점 파악 → 관리기준 개선/보완 → 문제점 파악 → 관리기준 개선/보완』으로 지속적인 관리기준 정합성 및 유효성 검토\n 사례2) 작업자 중 품질관리 우수 인력 포상 및 인센티브 제도 운영으로 정성작업 유도를 통한 작업자 실수 저감활동 지속 추진\n 사례3) 타 협력사 대비 우수한 관리기준/역량을 보유하고 있어 벤치마킹 사례로 활용가능","이행상태 데이터 누락없이 과거 이행실적에 대해 100% 확인 가능하며, 이행실적 데이터의 정기적 이상유무 확인 또는 지속 모니터링\n사례1) 사내 전사시스템 적용으로 공정별, 부품별 이행실적 누락없이 실적이 기록/조회되며, 정기적 데이터 분포수준 점검\n사례2) 품질관리 중요항목에 대한 지속적 점검활동으로 문제점 발생 사전 예방을 위한 SPC 연계 관리","1) 시행 상태에 대한 관찰사항 구체적 기술\n2) 우수 선정 사유 必 명기 (동종업종 대비 우수사항)"],"es":["Los criterios de control de los ítems de la hoja SQ y de los requisitos propios del giro están claramente definidos, y se revisan y complementan continuamente en coherencia y eficiencia, avanzando hacia un nivel superior.\n Caso 1) Revisión continua de coherencia y validez del criterio: identificar problema → mejorar/complementar el criterio → identificar problema → mejorar/complementar…\n Caso 2) Sistema de reconocimiento e incentivos al personal destacado en calidad, que fomenta el trabajo meticuloso y reduce errores del operador de forma continua\n Caso 3) Criterios/capacidades superiores a los de otros proveedores, aprovechables como caso de benchmarking","Los datos de cumplimiento no tienen omisiones, el 100 % del historial pasado puede verificarse, y se revisan periódicamente o se monitorean continuamente.\nCaso 1) Con un sistema corporativo, los resultados por proceso/pieza se registran y consultan sin omisión, con revisión periódica de la distribución de datos\nCaso 2) Revisión continua de ítems críticos de calidad, con control vinculado a SPC para prevenir problemas","1) Describir concretamente lo observado sobre el estado de implementación\n2) Indicar OBLIGATORIAMENTE el motivo de la calificación sobresaliente (aspecto destacado frente al mismo giro)"]},{"lv":1,"ko":["SQ평가서에 명시된 점검항목 및 업종특성 요구사항에 대한 관리기준이 아래 조건을 모두 만족\n ① 사내 관리기준과 현장에 게시된 작업 표준류가 일치\n ② 고객지정 요구항목(도면, 검사협정)이 모두 반영\n ③ 관리기준은 업무절차(방법/주기 등), 업무분장(자격인증, 업무투입 기준 등), 이상/부적합(추정)품 발생시 조치절차 등이 명확히 명시되고, 담당자가 변경되어도 이전과 동일한 수준으로 관리 가능\n ④ 관리항목에 대한 관리기준은 설정 근거가 명확(관리주기/방법/판정기준 등)\n ⑤ 협력사 자체 정기점검 항목(설비, 금형, 부품, 안전점검, 3정5행, 자격인증, 게이지R&R 등)에 대한 점검계획 및 점검방법/절차/사후관리 기준 수립됨","이행실적 데이터 누락이 없고, 과거 이행실적에 대해 100% 확인 가능\n사례1) 현재/과거 이행실적의 누락 및 허위기재는 없으나, 이행실적 정기적 이상유무 확인 또는 지속 모니터링 미진행","1) 시행 상태에 대한 관찰사항 구체적 기술"],"es":["Los criterios de control de los ítems de la hoja SQ y de los requisitos del giro cumplen TODAS estas condiciones:\n ① El criterio interno coincide con los estándares publicados en piso\n ② Se reflejan todos los requisitos del cliente (plano, acuerdo de inspección)\n ③ El criterio define claramente procedimiento (método/frecuencia), reparto de responsabilidades (calificación, criterios de asignación) y acciones ante anomalías/no conformes (presuntos), y se mantiene el mismo nivel de control aunque cambie el responsable\n ④ El criterio de cada ítem tiene fundamento claro (frecuencia/método/criterio de juicio)\n ⑤ Existe plan, método, procedimiento y seguimiento de las revisiones periódicas propias (equipo, molde, pieza, seguridad, 3정5행, calificación, Gauge R&R, etc.)","Los datos de cumplimiento no tienen omisiones y el 100 % del historial pasado es verificable.\nCaso 1) No hay omisiones ni falsificación de registros actuales/pasados, pero no se revisa periódicamente ni se monitorea de forma continua el cumplimiento","1) Describir concretamente lo observado sobre el estado de implementación"]},{"lv":2,"ko":["SQ평가서에 명시된 점검항목에 대한 관리기준은 수립되어 있으나 세부 관리기준 일부가 누락, 관리기준(절차/방법 등) 또는 설정근거가 명확치 않음 업종특성 요구사항 관리기준 미수립\n 사례1) 설비/금형 점검항목 및 점검주기는 수립되어 있으나 점검방법 및 이상유무 판정기준 미수립 또는 해당 관리기준 설정근거 미보유\n 사례2) 업무절차, 업무분장, 이상/부적합(추정)품 발생시 조치절차가 명확하지 않아 작업자/담당자별 처리기준이 상이 또는 관리누락 발생우려\n 사례3) 협력사 자체 정기점검 항목에 대한 점검 계획은 수립되어 있으나, 점검방법/절차/사후관리 방법 등 점검기준이 불명확","이행상태 데이터 누락은 없으나, 이행실적 정보 부족/ 판정 오류로 이상유무 판정 어려움\n 사례1) 이행실적 기록시 정확한 상태가 수치적 또는 명확히 서술되어 기록되지 않고, OK/NG 등으로 결론만 기록되었을 경우 기록 불명확으로 판단\n 사례2) 이행실적에 대한 최종 데이터는 누락없이 기록되어 있으나, 데이터에 대한 판정 및 근거 자료 미보유로 최종 데이터에 대한 신뢰성 확보 어려움","1) 시행 상태에 대한 관찰사항 구체적 기술\n2) 보완 필요항목 지도 (개선방향 등 제시)"],"es":["Los criterios de control de los ítems de la hoja SQ están definidos, pero faltan algunos criterios detallados, el criterio (procedimiento/método) o su fundamento no es claro, o no hay criterio para requisitos del giro.\n Caso 1) Hay ítems y frecuencia de revisión de equipo/molde, pero no método de revisión ni criterio de juicio de anomalías, o no hay fundamento del criterio\n Caso 2) Procedimiento, reparto de responsabilidades y acciones ante anomalías/no conformes (presuntos) poco claros: el criterio de manejo varía por operador/responsable o hay riesgo de omisiones\n Caso 3) Hay plan de revisiones periódicas propias, pero método/procedimiento/seguimiento poco claros","No hay omisiones en los datos de cumplimiento, pero la información es insuficiente o hay errores de juicio que dificultan determinar si hay anomalías.\n Caso 1) Los registros solo anotan la conclusión (OK/NG) sin describir el estado de forma numérica o clara: se juzga registro poco claro\n Caso 2) El dato final se registra sin omisiones, pero no hay evidencia del juicio ni de su fundamento, lo que dificulta asegurar su confiabilidad","1) Describir concretamente lo observado sobre el estado de implementación\n2) Orientar sobre los ítems a complementar (indicar dirección de mejora, etc.)"]},{"lv":3,"ko":["SQ평가서에 명시된 점검항목에 대한 관리기준 일부(2항목 이하) 기준이 미수립되거나, 수립된 기준이 실제 관리기준과 불일치\n 사례1) 『부적합 관리』 평가항목중 1)~3)번, 5)번 항목은 기준이 수립되어 있으나 4)번 1항목 기준 미수립\n 사례2) 생산조건은 관리계획서, 작업표준에 명시되어 있으나, 실제 생산설비 셋업/관리 조건이 명시된 기준과 상이\n 사례3) 협력사 자체 정기점검 항목에 대한 점검계획 일부 미수립\n 사례4) 고객지정 요구항목이 관리기준에 미반영 또는 상이한 기준으로 관리","이행실적 데이터 간헐적 누락 또는 합부판정에 대한 간헐적 오류/누락 (단, 동일항목 지속누락X)\n 사례1) 부품 자주검사 또는 설비 일상 점검시 특정 1~2항목 간헐적 누락 또는 점검 방법/주기/ 시료수 미일치\n 사례2) 협력사 자체 정기점검 항목에 대한 일부 이행지연 또는 확인된 문제점에 대한 개선지연\n 사례3) 부품, 설비, 금형에 대한 검사/점검 진행시(수입검사, 자주/일상검사, 신뢰성/정기검사 등) 간헐적 불합격 데이터를 합격으로 판정 또는 판정누락","1) 시행 상태에 대한 관찰사항 구체적 기술 [대책수립 요청]\n - 이행상태 일부 누락사항 기재\n - 관리기준 개선 필요항목 기재"],"es":["Algunos criterios de control (2 ítems o menos) de la hoja SQ no están definidos, o los definidos no coinciden con el control real.\n Caso 1) En 『Control de no conformes』 los ítems 1)–3) y 5) tienen criterio, pero el 4) no\n Caso 2) Las condiciones de producción están en el plan de control y las instrucciones, pero el ajuste/control real del equipo difiere de lo indicado\n Caso 3) Parte de los ítems de revisión periódica propia no tiene plan\n Caso 4) Requisitos del cliente no reflejados en el criterio, o controlados con criterio distinto","Omisiones ocasionales en datos de cumplimiento, o errores/omisiones ocasionales en el juicio aprobado/rechazado (sin omisión continua del mismo ítem).\n Caso 1) En autoinspección de piezas o revisión diaria de equipos se omiten ocasionalmente 1–2 ítems, o el método/frecuencia/tamaño de muestra no coincide\n Caso 2) Retraso en parte de la revisión periódica propia o en mejorar problemas ya identificados\n Caso 3) En inspecciones/revisiones de piezas, equipos o moldes (recepción, autoinspección/diaria, confiabilidad/periódica) datos rechazados se juzgan ocasionalmente como aprobados, o se omite el juicio","1) Describir concretamente lo observado [solicitar plan de acción]\n - Anotar omisiones parciales de implementación\n - Anotar ítems del criterio que requieren mejora"]},{"lv":4,"ko":["SQ평가서에 명시된 점검항목에 대한 관리기준 다수(3항목 이상) 기준이 미수립 있거나 임시작업자 투입\n 사례1) 『완성품 품질검사(일상)』 평가항목중 1)~6)번 항목은 기준이 수립되어 있으나, 8)~10)번 3항목 기준 미수립\n 사례2) 제조현장 작업자 교육/자격인증 등 투입기준은 있으나 투입기준 불만족 임시작업자 투입","이행실적에 대한 데이터 다수 또는 지속적 누락되거나 허위기재 확인 (다수의 합부판정 오류/누락 포함)\n 사례1) 부품 자주검사 또는 설비 일상점검 항목중 여러항목 간헐적 누락 또는 동일항목 연속 누락\n 사례2) 설비점검 담당자 부재로 정기점검 미진행되었으나, 심사전 정기점검 결과 허위기재 사실 확인","1) 시행 상태에 대한 관찰사항 구체적 기술 [대책수립 요청]\n - 이행상태 미실시 및 다수누락 사항 기재\n - 관리기준 불합리 문제점 기재"],"es":["Varios criterios (3 ítems o más) de la hoja SQ no están definidos, o se asigna personal temporal.\n Caso 1) En 『Inspección de calidad del producto terminado (diaria)』 los ítems 1)–6) tienen criterio pero los ítems 8)–10) (3 ítems) no\n Caso 2) Existe criterio de capacitación/calificación para asignar operadores, pero se asigna personal temporal que no lo cumple","Omisiones múltiples o continuas en los datos de cumplimiento, o falsificación de registros (incluye muchos errores/omisiones de juicio aprobado/rechazado).\n Caso 1) En autoinspección de piezas o revisión diaria de equipos hay omisiones ocasionales en varios ítems u omisión continua del mismo ítem\n Caso 2) No se realizó la revisión periódica por ausencia del responsable, pero antes de la auditoría se confirmó que se falsificó el resultado de la revisión","1) Describir concretamente lo observado [solicitar plan de acción]\n - Anotar lo no implementado y las omisiones múltiples\n - Anotar problemas de irracionalidad del criterio"]},{"lv":5,"ko":["SQ평가서에 명시된 점검항목에 대한 관리기준 수립 없음","SQ평가서에 명시된 점검항목에 대한 이행실적 없음",""],"es":["No se ha definido ningún criterio de control para el ítem de la hoja SQ","No hay evidencia de cumplimiento del ítem de la hoja SQ",""]}],"items":[{"id":"1_1","c":0,"p":30,"ko":"▣ 표준류 작성 및 준수상태\n    - 표준류(관리계획서, 작업표준서, 설비일상점검표 등)와 실제공정 일치성 확인[관리 분담 등]\n    - 고객과 협의된 검사협정서/검사기준서 기준과 실제 업무절차 일치성\n    - 공정 FMEA작성 및 주요 품질 문서 내용과 연계상태 확인\n    - 주요 표준류(작업표준서 등) 현장내 게시 상태\n    - 관리계획서 및 현장내 표준류 중요공정/안전 보안공정 식별표시관리\n    - 신규/임시작업자 공정투입전 업무 R&R 명확화, 단계별 작업표준서 게시 및 전문용어 사용지양\n    - 공정내 사용되는 설비 및 부자재등은 사전 검증을 통해 표준류 반영되어야 하며 미승인 설비 및 부자재 사용 금지\n       ex) 조립성 확보를 위한 미승인 열풍기 및 윤활제 사용등","es":"▣ Elaboración y cumplimiento de los documentos estándar\n- Coincidencia de los estándares (plan de control, instrucciones de trabajo, hoja de revisión diaria de equipos, etc.) con el proceso real [incluye reparto de responsabilidades]\n- Coincidencia de lo acordado con el cliente (acuerdo/estándar de inspección) con el procedimiento de trabajo real\n- Elaboración del AMEF de proceso y su vínculo con los principales documentos de calidad\n- Publicación en piso de los estándares principales (instrucciones de trabajo, etc.)\n- Identificación de procesos críticos/de seguridad en el plan de control y en los estándares de piso\n- Antes de asignar personal nuevo/temporal: definir roles y responsabilidades, publicar instrucciones por etapas y evitar términos técnicos\n- Los equipos y auxiliares usados en el proceso deben validarse previamente e incluirse en los estándares; prohibido usar equipos o auxiliares no aprobados\n   ej.) uso de pistola de aire caliente o lubricante no aprobados para facilitar el ensamble"},{"id":"1_2","c":0,"p":20,"ko":"▣ 설비 가동중단(계획/비계획)후 재가동시 업무처리 절차 수립 및 준수상태\n    - 설비 가동중단 발생시 설비점검 절차 수립 및 준수상태\n      ※ 계획 : 가동중단 시간별/사유별 점검절차 수립 및 이행\n         비계획 : 이상발생 가동중단 발생시 설비 점검 지침, 생산중인 제품에 대한 품질보증 업무절차 수립 및 이행\n    - 설비중단/이상 발생시(툴교환 포함) 직전 생산품 이상유무 검사 및 설비이상 조치후 초품 이상유무 검사 및 기록관리\n       (설비중단/이상 발생시 또는 설비이상 조치중 생산부품 불량으로 폐기 및 수량 이력관리)\n    - 비계획 가동중단 발생시 전/후 생산제품에 대한 LOT 구분 관리방안 수립 및 식별관리 실시\n    - 로봇/자동화설비 이상 발생시 작업자의 공정조건(파라메터, 티칭) 임의변경 금지 및 공정조건 변경에 따른 부품품질 검증 필요","es":"▣ Procedimiento de reinicio tras paro de equipo (planeado/no planeado)\n- Procedimiento de revisión del equipo ante un paro y su cumplimiento\n  ※ Planeado: procedimiento de revisión según duración/motivo del paro. No planeado: guía de revisión del equipo ante paro por falla y procedimiento de aseguramiento de calidad del producto en proceso\n- Ante paro/falla de equipo (incluye cambio de herramental): inspeccionar el producto inmediatamente anterior, y tras corregir la falla inspeccionar la primera pieza; llevar registro\n  (llevar historial de la cantidad de piezas desechadas por defecto durante el paro/falla o la corrección)\n- Ante paro no planeado: definir e implementar la separación e identificación por LOTE del producto fabricado antes/después\n- Ante falla de robot/automatización: prohibido que el operador cambie a su criterio las condiciones de proceso (parámetros, enseñanza); si cambian, se debe verificar la calidad de la pieza"},{"id":"1_3","c":0,"p":10,"ko":"▣ 외국인 배치 운영공정 현지어 번역/게시된 표준류 반영상태\n    - 작업표준서, 설비일상점검 기준표, 작업일보 등 외국인 배치공정 표준류 현지어 번역 게시상태\n      : 부적합 처리절차 및 중요 품질문제 개선 사례등 품질의식 강화목적 표준류 번역 게시 (추가 관리시 우수)\n      ※ 해당공정 외국인작업자 주요 표준류 교육 및 내용 숙지 시 현지어 번역게시 불필요(현장확인 필요)","es":"▣ Traducción al idioma local de los estándares en procesos con personal extranjero\n- Estándares traducidos al idioma local y publicados (instrucciones de trabajo, criterios de revisión diaria, reporte diario, etc.)\n  : traducir y publicar el procedimiento de producto no conforme y casos de mejora de problemas críticos para reforzar la conciencia de calidad (si se maneja adicionalmente, es sobresaliente)\n  ※ Si el personal extranjero del proceso fue capacitado en los estándares principales y los domina, no se requiere traducción publicada (verificar en piso)"},{"id":"1_4","c":0,"p":10,"ko":"▣ 품질관리 취약 시간대 관리기준 수립 및 관리상태 (주말특근 및 비지정 작업자 투입시포함)\n    - 교대 작업시 일상점검, 자주검사 및 순회검사 관리기준 수립 및 관리상태\n    - 교대 작업시 공정 Issue 사항 전달 여부\n      ※ 초/종품 검사는 필수, 중품은 선택사항으로 자율적 기준 수립필요, 중품검사 미진행도 가능, \n          단, 생산LOT가 장기적일경우 최소 1회/shift검사 진행 필요\n      ※ 인원 부족으로 야간 검사요원 미 투입 시 야간 생산품 검증 프로세스 수립\n          (야간 작업 초종 생산품 익일 주간 검사인원 출근시 검사 등)","es":"▣ Criterios de control para horarios vulnerables en calidad (incluye fines de semana y personal no designado)\n- Criterios y estado de la revisión diaria, autoinspección e inspección de rondas en trabajo por turnos\n- Transmisión de los problemas del proceso entre turnos\n  ※ La inspección de primera y última pieza es obligatoria; la intermedia es opcional (criterio propio), puede no hacerse; sin embargo, si el LOTE es largo, mínimo 1 inspección por turno\n  ※ Si por falta de personal no hay inspector nocturno, definir proceso de verificación de lo producido de noche (p. ej. inspeccionar primera/última pieza nocturna al día siguiente cuando llegue el inspector)"},{"id":"1_5","c":0,"p":30,"ko":"▣ 생산품목별 원단위 중량 관리기준 수립 및 점검상태 \n    - 차종별/품목별 1SHOT 생산시 소요 사출 중량 점검기준 기준 마스터 작성\n    - 원단위 중량 관리 마스터 기준 월간단위 총 생산실적 대비 신재 투입량 수율관리 실적점검(1회/월 점검)\n    - 월간 총 생산실적 및 스크랩 발생실적 대비 매각 내역 비교검증(1회/월 이상)\n      ※ 점검자료 : 원단위 중량관리 마스터, 생산일보, 스크랩 매각내역서, 스크랩 배합일지 등","es":"▣ Control de peso unitario por producto: criterios y revisión\n- Elaborar el maestro de peso de inyección requerido por disparo (1 SHOT) por modelo/producto\n- Con base en el maestro, revisar mensualmente (1 vez/mes) el rendimiento de material virgen consumido contra la producción total del mes\n- Comparar y verificar (1 vez/mes o más) la producción total y el scrap generado contra lo vendido\n  ※ Documentos a revisar: maestro de peso unitario, reporte diario de producción, detalle de venta de scrap, bitácora de mezcla de scrap, etc."},{"id":"1_6","c":0,"p":30,"ko":"▣ 원재료 수분관리 설정근거 수립 및 준수상태\n    - 원소재별 수분함유량 관리기준 수립 (기준설정 근거자료 확보)\n      ※ 비함습성 원재료 또는 수분함유량 관리 불필요 소재는 근거 확보 시(원재료내 수분 품질영향성 없음) 관리 불필요\n          ⇒ 미건조 사출 T/O품 품질검증(외관/중량/치수/물성 등) 자료 확보 필요\n    - 소재별 건조온도, 시간 관리기준 수립 (기준 설정 근거자료 확보)\n    - 사출시 품목별 건조온도/시간 준수여부 증빙자료 관리 (건조호퍼 가동시간 등 일보내 기록관리)","es":"▣ Fundamento y cumplimiento del control de humedad de materia prima\n- Definir criterio de contenido de humedad por material (contar con evidencia del criterio)\n  ※ Para materiales no higroscópicos o que no requieren control de humedad: no se requiere control si hay evidencia (la humedad no afecta la calidad)\n     ⇒ Se requieren datos de verificación de calidad (apariencia/peso/dimensión/propiedades, etc.) de piezas de prueba (T/O) inyectadas sin secar\n- Definir criterios de temperatura y tiempo de secado por material (con evidencia del criterio)\n- Evidencias de cumplimiento de temperatura/tiempo de secado por producto durante la inyección (registro diario, p. ej. horas de operación de la tolva secadora)"},{"id":"1_7","c":0,"p":30,"ko":"▣ 사출 성형공정 주요 관리조건 수립 및 관리상태\n    - 성형조건 기록 항목 및 주기 관리기준 설정 및  기록관리 상태(성형조건 추적관리 )\n    - 성형조건 관리기준 이탈시 작업자 인지 가능여부\n          (경광등 및 경고음 작동 등 F/P 설치 또는 모니터링 자체 기준 수립 필요)\n    - 성형 조건 (제품별 성형조건 기준, 설비공차 누적 포함)\n          * 작동유 및 냉각수 등 관리기준 실제품 품질영향성 고려된 자체기준 수립\n          * 사출외관 불량(웰드라인 등) 방지를 위하여 계절별(동절기/하절기) 성형조건 이원화 관리기준 수립 필요\n    - 권장사항 : 노즐온도(수지온도) : ±5℃ / 작동유 온도 : ±5℃ / 냉각수(설비/금형) 입/출수 온도차 3℃ 이내로 설정 \n          * 기타 성형조건(압력,속도,위치,계량,시간 등) : ±5%          ⇒ 환산치로 관리기준 표시필요\n    - 온도, 시간, 압력, 속도, 보압, 쿠션량 등 품목별 성형조건 표준설정 및 준수상태\n      ※ 관리기준 상/하한 셋팅이 불가능한 노후 장비의 경우 정기점검을 통한 셋팅값 유효성 검증결과 확보 필요\n    - 사출기 생산중단후 재가동시 원소재 퍼지(짜내기 작업) 100% 진행 및 퍼징 실시 이력관리(실시일자, 퍼지량)\n      → 동일 원소재일 경우에도 실린더내 탄화된 원소재 퍼징작업 실시 필요\n      ※사출 성형조건 변경시, 자주검사 지정항목 外 부품 전체 외관/치수/상대 매칭부품 이상여부 추가 확인필요","es":"▣ Condiciones principales del proceso de moldeo por inyección: definición y control\n- Definir criterios de ítems y frecuencia de registro de condiciones de moldeo y su registro (trazabilidad de condiciones de moldeo)\n- Si se exceden los criterios de condición de moldeo, ¿el operador lo detecta?\n  (instalar a prueba de error como luz/alarma sonora, o definir criterio propio de monitoreo)\n- Condiciones de moldeo (criterio por producto, incluye acumulación de tolerancias del equipo)\n  * Criterios propios para aceite hidráulico, agua de enfriamiento, etc. considerando su efecto en la calidad real\n  * Para evitar defectos de apariencia (líneas de soldadura, etc.), definir criterios de condiciones de moldeo diferenciados por temporada (invierno/verano)\n- Recomendado: temperatura de boquilla (resina) ±5℃ / aceite hidráulico ±5℃ / diferencia de temperatura entrada-salida del agua de enfriamiento (equipo/molde) dentro de 3℃\n  * Otras condiciones (presión, velocidad, posición, dosificación, tiempo, etc.): ±5%  ⇒ mostrar el criterio en valores convertidos\n- Estándar y cumplimiento de condiciones de moldeo por producto: temperatura, tiempo, presión, velocidad, presión de sostenimiento, colchón, etc.\n  ※ En equipos antiguos que no permiten fijar límites superior/inferior, obtener resultados de validación del valor de ajuste mediante revisión periódica\n- Al reiniciar tras un paro, purgar 100 % la materia prima y llevar historial de purga (fecha, cantidad)\n  → Aun con el mismo material se debe purgar el material carbonizado dentro del cilindro\n  ※ Si cambian las condiciones de moldeo, además de los ítems de autoinspección, verificar apariencia/dimensiones/ensamble con piezas acopladas de toda la pieza"},{"id":"1_8","c":0,"p":20,"ko":"▣ 품목별 초기 허용불량 기준 설정 근거 및 절차 준수여부\n    [ 초기허용불량 설정]\n    - T/O 성형조건 기록, 금형 CAVITY별 미성형/외관/치수/중량 검증을 통한 폐기수량 셋팅여부(기록물)\n    - T/O시 성형 조건과 표준류 성형조건 일치여부 확인\n    [ 초기허용불량 처리규정 준수]\n    - 초기 허용불량 폐기조건 표준 수립여부(설비 이상정지후 재가동시, 사출조건 변경시, 시업시 등 상황별 폐기조건 수립)\n    - 업무절차 현장내 게시상태, 기록물(작업일보 or 자주검사 체크시트) 작성상태, 현장내 초기허용불량 폐기품 생산중 보관","es":"▣ Fundamento y cumplimiento del procedimiento de defecto inicial permitido por producto\n  [Definición del defecto inicial permitido]\n- Registro de condiciones de moldeo en T/O, y definición de la cantidad a desechar mediante verificación por CAVIDAD del molde de no llenado/apariencia/dimensión/peso (registros)\n- Verificar que las condiciones de moldeo en T/O coincidan con las de los estándares\n  [Cumplimiento de la norma de defecto inicial permitido]\n- Existencia de estándar de condiciones de descarte del defecto inicial (por situación: reinicio tras paro por falla, cambio de condiciones de inyección, inicio de turno, etc.)\n- Publicación del procedimiento en piso, llenado de registros (reporte diario o checklist de autoinspección) y resguardo en piso del descarte de defecto inicial durante la producción"},{"id":"1_9","c":0,"p":30,"ko":"▣ 사출 성형시 원소재 수분함유량 검증 프로세스 수립 및 준수상태\n    - 수분함유량 검증 온도 및 시간 설정 적합성\n      ※ 권장사항\n          1) 테스트 온도 : 원소재 건조호퍼 온도와 동일하게 설정\n          2) 검증시간 : 수분함유량 증가가 안되는 시간까지 설정[수동모드], 수분함유량 증가율 0.01%미만일때 멈춤[자동모드]\n    - 양산공정 품목별 원소재 수분함유량 검증 프로세스 수립[설비 재가동시 검증 필요, 연속 가동일경우 매일측정 불필요]\n      ⇒ 수분함유량 검증 업무절차 수립 및 이행상태(건조설비 중단 후 재가동시, 원소재 사양 변경시 등)\n      ※ 수분함유량 검증은 생산 개시전 사전 검증토록 기준수립 및 증빙 관리 필요\n    - 생산 기준별(연속가동 생산) 시업시 수분측정 점검이력 신뢰도 확인 (측정기 출력 데이터 등 증빙 유효성 확인)","es":"▣ Proceso de verificación de humedad de la materia prima en el moldeo por inyección\n- Adecuación de la temperatura y tiempo de verificación de humedad\n  ※ Recomendado\n     1) Temperatura de prueba: igual a la de la tolva secadora de la materia prima\n     2) Tiempo de verificación: hasta que la humedad deje de aumentar [modo manual]; detener cuando el aumento de humedad sea menor a 0.01 % [modo automático]\n- Definir el proceso de verificación de humedad por producto en producción [verificar al reiniciar el equipo; en operación continua no es necesaria la medición diaria]\n  ⇒ Procedimiento y cumplimiento (al reiniciar tras paro del secador, al cambiar la especificación del material, etc.)\n  ※ La verificación de humedad debe definirse y evidenciarse antes de iniciar la producción\n- Confiabilidad del historial de medición de humedad al inicio de turno (producción continua) (validez de evidencias como datos de salida del medidor)"},{"id":"1_10","c":0,"p":10,"ko":"▣ 사출 성형공정 외 공정관리 운영실태 (분쇄 및 배합공정, 융착공정 없을시 '해당없음' 처리)\n    1) 분쇄 및 배합 공정\n        - 재료별/품목별 신재, 스크랩 혼합 관리기준 설정 및 고객사 승인(협의)여부\n        - 신재, 스크랩 혼합 사용시 원소재 물성 MS-SPEC 만족여부 검증자료\n        - 생산 LOT별 혼합일지(배합일지) 기록상태\n        - 비규격 원소재 사용여부 : 외주 협력사로부터 재생재 구입 사용시 SQ 불합격 처리\n    2) 융착 공정\n        - 융착설비 셋팅기준 설정('H'방향 융착 높이) 및 융착 구간별 외관/이탈력 보증 프로세스 수립\n        - 기밀 융착목적 전둘레 융착시 리크검사 또는 융착면당 융착돌기 품질보증 프로세스 수립","es":"▣ Procesos distintos al moldeo por inyección (si no hay molienda/mezcla ni soldadura por fusión: 'No aplica')\n  1) Proceso de molienda y mezcla\n   - Criterio de mezcla de material virgen y scrap por material/producto y aprobación (acuerdo) del cliente\n   - Evidencia de que las propiedades del material con mezcla virgen+scrap cumplen la especificación MS-SPEC\n   - Registro de la bitácora de mezcla por LOTE de producción\n   - Uso de material no estándar: si se compra material reciclado a un proveedor externo, el SQ se considera reprobado\n  2) Proceso de fusión (soldadura)\n   - Criterio de ajuste del equipo de fusión (altura de fusión dirección 'H') y proceso que asegure apariencia/fuerza de desprendimiento por tramo de fusión\n   - Si es fusión de toda la circunferencia por hermeticidad: proceso de aseguramiento con prueba de fuga o con calidad de la nervadura de fusión por superficie"},{"id":"2_1","c":1,"p":40,"ko":"▣ 수입검사 실시기준 수립 및 준수상태\n    - 검사협정서/기준서 체결상태(사급품은 1차 협력사가 체결한 검사협정서 사본 접수 및 동일 시료/주기로 검사 실시 필요)\n        → 검사협정 체결이 어려울 시 검사기준서 수립으로 대체 (예: 대기업 공급 원재료,도금업종 등)\n    - 외주품 입고 시 외주사 출하성적서 접수 및 수입검사 실측값 비교검증 여부\n    - 원재료 M/SHEET 접수 시 물성 및 화학조성비 합/부 판단기준 명확화 수립\n    - 입고 LOT와 출하검사 성적서내 LOT 일치성 확보여부(원소재의 경우 M/SHEET내 검사시료 LOT 일치성)\n    - 검사협정서/기준서에 준한 일상검사/정기검사 실시상태\n    - 용기/포장 적정성 (필요시 제전 비닐/박스, 이물질 유입 방지, 제품간 간섭 방지,\n       물류 이동시 제품 훼손 방지,사양 식별, 오조립 방지, 이물질 유입방지, 체결부 좌면상태, 취급 용이성) \n       및 습동부/매칭부 단품 치수검사 상태\n    - 다 CAVITY 제품의 경우 CAVITY별 검사 기준 수립 및 준수 상태\n      ※ 점검기준은 CAVITY 총 수량 고려 합리적인 점검주기 설정(일상/정기) 및 이행필요\n          예) 일상 : 10 캐비티↓ : 전캐비티 검사,  11 캐비티↑ : 홀수일 Lot 홀수 캐비티/짝수일 Lot 짝수 캐비티 검사\n               정기 : 전 캐비티 검사","es":"▣ Criterios y cumplimiento de la inspección de recepción\n- Estado del acuerdo/estándar de inspección (para material consignado: recibir copia del acuerdo del proveedor de 1er nivel e inspeccionar con la misma muestra/frecuencia)\n   → Si es difícil firmar acuerdo, se puede sustituir con un estándar de inspección (ej.: materia prima de grandes empresas, giro de recubrimiento)\n- Al recibir piezas externas: recibir el certificado de embarque del proveedor y comparar con los valores medidos en la inspección de recepción\n- Al recibir la hoja de datos (M/SHEET) de materia prima: definir claramente el criterio de aprobación de propiedades y composición química\n- Coincidencia del LOTE recibido con el LOTE del certificado de inspección (en materia prima, con el LOTE de la muestra del M/SHEET)\n- Inspección diaria/periódica conforme al acuerdo/estándar de inspección\n- Adecuación del contenedor/empaque (según necesidad: bolsa/caja antiestática, evitar ingreso de contaminantes, evitar interferencia entre piezas, evitar daño en traslado, identificar especificación, evitar mal ensamble, estado de las superficies de apoyo, facilidad de manejo) e inspección dimensional de piezas individuales de zonas deslizantes/de acople\n- Para productos multicavidad: criterio de inspección por CAVIDAD y su cumplimiento\n  ※ Definir frecuencia razonable (diaria/periódica) considerando el total de cavidades\n     ej.) Diaria: ≤10 cavidades: todas; ≥11 cavidades: día impar → LOTE cavidades impares / día par → cavidades pares\n          Periódica: todas las cavidades"},{"id":"2_2","c":1,"p":10,"ko":"▣ 수입검사 누락방지 절차 수립(수입검사 대장 LIST 작성) 및 준수 상태\n    - 외주품 입고시 수입검사 마스터 관리 대장 작성을 통한 검사 누락 예방\n    - 수입검사 실시 전 외주품/원재료 입고처리 안되도록 업무 프로세스 수립\n    - 수입검사 완료품 식별 프로세스 수립 (합격도장 등)","es":"▣ Procedimiento para evitar omisión de la inspección de recepción (registro maestro de inspección de recepción)\n- Prevenir omisiones mediante un registro maestro de inspección de recepción al ingresar piezas externas\n- Proceso para que piezas externas/materia prima no se den de alta en almacén antes de la inspección de recepción\n- Proceso de identificación de lo ya inspeccionado (sello de aprobado, etc.)"},{"id":"2_3","c":1,"p":10,"ko":"▣ 검사용 마스터(한도견본) 관리기준 수립 및 준수상태\n    - 외주품/완성품 외관 합/부 판별용 한도견본 운영\n    - 설비 유효성 확보용 한도견본 또는 셋팅 마스터지그 제작관리 (시업시 마스터 이용한 설비 유효성 검증 실시)\n    - 검사기 신뢰도 확인을 위한 OK/NG 마스터 설정기준 및 관리상태\n    - 한도견본의 변색, 변형, 녹 발생 등으로 실제 견본품 운영이 어려울 경우 외관검사기준서로 대체 가능\n    - 목시검사(확대경) 한도견본 비치, 관리 및 이력관리    ","es":"▣ Criterios y cumplimiento de maestros de inspección (muestras límite)\n- Operar muestras límite para juzgar apariencia OK/NG de piezas externas/producto terminado\n- Elaborar y controlar muestras límite o maestros/dispositivos de ajuste para asegurar la validez del equipo (verificar el equipo con el maestro al inicio de turno)\n- Criterio y control de maestros OK/NG para confirmar la confiabilidad de las máquinas de inspección\n- Si por decoloración, deformación u oxidación de la muestra límite no es viable operarla, se puede sustituir con un estándar de inspección de apariencia\n- Disponer, controlar y llevar historial de muestras límite para inspección visual (lupa)"},{"id":"2_4","c":1,"p":30,"ko":"▣ 정기검사(신뢰성 시험 포함) 실시계획 수립 및 준수상태 (실시결과 신뢰성 확보 요구됨)\n    - 정기 시험 성적서 신뢰도 확보\n      (성적서 시험 전/후 사진 첨부, 제조 LOT표기, 사진內 시험 날짜표시, 계측기 전산 연동시 원본데이터 저장관리 등)\n    - 환경규제(중금속) 정기시험 실시상태 : 검사협정 체결기준 시험결과 증빙관리 상태\n      (시험장비 보유시 자체 성적서 인정, 미보유시 1차사 또는 공인기관 의뢰 가능)","es":"▣ Plan y cumplimiento de inspecciones periódicas (incluye pruebas de confiabilidad) (se exige confiabilidad de resultados)\n- Asegurar la confiabilidad de los reportes de pruebas periódicas\n  (fotos antes/después de la prueba en el reporte, LOTE de fabricación, fecha de prueba en la foto, guardar datos originales si el instrumento está conectado a sistema, etc.)\n- Pruebas periódicas de regulación ambiental (metales pesados): evidencia de resultados según lo acordado en el acuerdo de inspección\n  (si hay equipo de prueba, se acepta reporte propio; si no, se puede solicitar al proveedor de 1er nivel o a un organismo acreditado)"},{"id":"2_5","c":1,"p":10,"ko":"▣ 계측기/검사구 보유 및 신뢰성 확보상태 (검교정 주기설정, 교정상태)\n    - 검사협정 체결기준 시험항목 자체시험 가능한 계측장비 보유상태 (정기 신뢰성 항목별 계측기 지정 및 준수필요)\n      ※ 고가 계측기 등 자체검증 불가능 시험 항목의 경우 1차 협력사 또는 공인기관시험 인정\n          (예 : 3차원 측정기, 성분분석기 등)되나 시험결과 접수 및 이상발생 여부 검토 필요\n    - 계측기 검교정 계획 대비 실적관리 상태 (계측기 검교정 성적서/테그 관리)\n      ※ 검교정 자격인증 인원 보유 협력사는 자체 검증 근거 확보시 인정\n      ※ 검교정 실시 후 불확도 고려 합/부 판정 실시 (판정 기준 수립)\n         → 신뢰수준 95%기준으로 측정된 불확도 대비 측정대상 관리 공차가 4배 이상시 사용 가능\n             예) 신뢰수준 95% 기준 불확도 0.002mm인 계측장비는 관리공차 ±0.008mm 이상이 부품만 측정가능 (1:4 비율 반영)\n    - 주요 검사구 유효성 확보여부 점검결과(검사구 사용시 마모,유격 발생에 따른 측정 유효성 확인 필요)\n         예) 사출품 측정용 검사구 3차원 데이터 측정결과, 치수 보증된 제품을 통한 자체 비교검증 데이터 등","es":"▣ Disponibilidad y confiabilidad de instrumentos/calibres (frecuencia de calibración, estado de calibración)\n- Disponer de instrumentos para realizar las pruebas del acuerdo de inspección por cuenta propia (designar y cumplir instrumento por cada prueba periódica de confiabilidad)\n  ※ Para pruebas que no pueden verificarse internamente (instrumentos costosos, p. ej. CMM, analizador de composición), se acepta prueba del proveedor de 1er nivel u organismo acreditado, pero se debe recibir el resultado y revisar anomalías\n- Control del plan vs real de calibración (certificados/etiquetas de calibración)\n  ※ Si el proveedor cuenta con personal acreditado para calibración, se acepta con evidencia de verificación propia\n  ※ Tras calibrar, juzgar aprobado/rechazado considerando la incertidumbre (definir criterio)\n     → Se puede usar si, con nivel de confianza del 95 %, la tolerancia de control de lo medido es ≥ 4 veces la incertidumbre\n         ej.) Un instrumento con incertidumbre 0.002 mm (95 %) solo puede medir piezas con tolerancia ±0.008 mm o mayor (relación 1:4)\n- Verificar la validez de los calibres de inspección principales (confirmar validez de medición ante desgaste/holgura con el uso)\n     ej.) resultados de medición 3D del calibre para piezas inyectadas, datos de comparación propia con producto de dimensión asegurada, etc."},{"id":"2_6","c":1,"p":10,"ko":"▣ 게이지 R&R 실시기준 수립 및 준수 상태\n    - 계측기 운영 기준별 R&R 평가 계획 수립\n       (자체제작 전용 계측기는 필히 실시할 것. 단. 자동 측정 검사 장비 제외 : 비커스경도기, 거칠기 측정기 등)\n    - 계측 장비별 실제 사용인력(작업자/검사원) 계량형  R&R 검증 진행 데이터","es":"▣ Criterios y cumplimiento de Gauge R&R\n- Plan de evaluación R&R según el criterio de operación de cada instrumento\n  (obligatorio para instrumentos dedicados de fabricación propia. Excepto equipos de medición automática: durómetro Vickers, rugosímetro, etc.)\n- Datos de R&R por variables con el personal que realmente usa cada equipo de medición (operador/inspector)"},{"id":"2_7","c":1,"p":40,"ko":"▣ 자주검사 기준설정 및 준수상태\n    - 자주검사 실시주기/수량 유효성 확보여부 및 준수상태 \n       ⇒ 초/종품 검증 프로세스 수립, 금형 캐비티별 검사 등\n    - 자주검사 점검항목 유효성(외관, 중량, 치수, 제품내 제조 LOT 캘린더 각인 등) 확보여부 기록물 관리상태\n       → 외관검사 항목 : 게이트 사상불량, 파팅면 버 발생, 미성형, 웰드라인 등\n    - 자주검사 점검결과 신뢰도 확보여부 현장확인(작업일보 대비 자주검사 일치성 점검, 측정 기록물과 실측값 비교 등)\n    - 3차원 측정기, 형상 측정기 등 전산 연동된 계측장비 활용시 점검이력 원본데이터 저장관리","es":"▣ Criterios y cumplimiento de la autoinspección\n- Validez de la frecuencia/cantidad de autoinspección y su cumplimiento\n   ⇒ Proceso de verificación de primera/última pieza, inspección por cavidad del molde, etc.\n- Validez de los ítems de autoinspección (apariencia, peso, dimensión, calendario/LOTE grabado en la pieza, etc.) y control de registros\n   → Ítems de apariencia: rebaba de compuerta, rebaba en línea de partición, no llenado, línea de soldadura, etc.\n- Verificar en piso la confiabilidad de resultados de autoinspección (consistencia con el reporte diario, comparar registros con valores medidos, etc.)\n- Si se usan instrumentos conectados a sistema (CMM 3D, medidor de forma, etc.), guardar los datos originales del historial"},{"id":"2_8","c":1,"p":50,"ko":"▣ 완제품 검사기준 수립 및 준수상태 점검\n    - 검사기준 표준화 (검사협정서/검사기준서내 검사항목/방법/시료수 명확화) 및 실제 검사방법 일치성 확인\n    - 검사항목 적합성 (외관, 치수, 신뢰성 등 도면 요구항목 일치성) \n    - 검사주기 및 시료수 일치성 점검 (캐비티별 부품검사 포함)\n    - 완제품 검사시점 확인 (LOT 생산 종료시 최종검사 후 안전재고 확보토록 기준설정 등)\n    - 최종품 검사 완료품 식별상태 확인(생산 LOT 및 최종검사 완료 식별)\n    - 유로 홀 반영부 등 기능부는 육안검사 외 고노게이지 등 치공구 활용한 품질보증 필요","es":"▣ Criterios y cumplimiento de la inspección de producto terminado\n- Estandarización de la inspección (ítems/método/tamaño de muestra claros en el acuerdo/estándar) y coincidencia con el método real\n- Adecuación de los ítems (apariencia, dimensión, confiabilidad, etc. conforme a lo requerido en el plano)\n- Coincidencia de frecuencia y tamaño de muestra (incluye inspección por cavidad)\n- Momento de la inspección del producto terminado (p. ej. criterio de inspección final al terminar el LOTE y asegurar stock de seguridad)\n- Identificación del producto con inspección final completada (LOTE de producción y fin de inspección final)\n- En zonas funcionales (p. ej. orificios de flujo) además de la inspección visual se requiere aseguramiento con calibres/dispositivos tipo pasa/no pasa"},{"id":"2_9","c":1,"p":20,"ko":"▣ 사출품 후공정(융착) 투입시 검사기준 설정 유효성 확보 및 준수여부(융착공정 없을시 '해당없음' 처리)\n    - 자체 융착공정 미실시(고객사 융착시)\n        1) 정밀융착(기밀성능 확보)  : 융착구간 전둘레 융착돌기 검사(융착면당 1개소 이상 측정) 기준반영\n        2) 일반융착(고정목적) : 융착부 돌기 측정기준 반영\n    - 사내 융착공정 반영시\n        1) 정밀 융착(기밀성) : LEAK검사 설비 리크량 디스플레이 설정 및 마스터 활용한 점검 및 캘리브레이션 진행 \n        2) 일반융착 : 융착부 이탈강도 측정 및 추이도 분석","es":"▣ Criterios de inspección en el post-proceso (fusión) de piezas inyectadas (si no hay proceso de fusión: 'No aplica')\n- Si no se realiza fusión propia (la hace el cliente)\n   1) Fusión de precisión (hermeticidad): incluir inspección de la nervadura de fusión en toda la circunferencia (medir al menos 1 punto por superficie)\n   2) Fusión general (fijación): incluir criterio de medición de la nervadura de fusión\n- Si se refleja el proceso de fusión interno\n   1) Precisión (hermeticidad): ajuste de la pantalla de fuga del equipo de prueba de fuga, revisión y calibración con maestro\n   2) General: medición de resistencia al desprendimiento de la unión y análisis de tendencia"},{"id":"3_1","c":2,"p":30,"ko":"▣ 설비 일상점검 업무절차 수립 및 준수여부\n    - 설비별 설비일상 점검부위 및 점검방법 도식화 관리상태 \n    - 설비내 부착 게이지류 상/하한 식별 및 측정 실측값 일상점검표 기록관리\n    - 설비내 F/P설비 경고등/알람 정상작동 및 설비내 셋팅값/관리공차 표준과 일치여부\n    - 설비 셋팅값 임의조작 방지를 위한 시건장치/KEY-LOCK 반영상태\n    - 주요 핵심설비 시업시 설비 정상작동 여부 검증 프로세스 수립(OK/NG 마스터 점검 또는 계측값 셋팅용 게이지 점검) \n    - 캘리브레이션이 필요한 생산 및 검사장비는 시업전 0점 조정(티칭)후 이상유무(OK/NG마스터를 활용)를 검증 필요","es":"▣ Procedimiento y cumplimiento de la revisión diaria de equipos\n- Control gráfico de las zonas y método de revisión diaria por equipo\n- Identificación de límites superior/inferior de los manómetros/indicadores del equipo y registro de los valores medidos en la hoja de revisión diaria\n- Funcionamiento normal de luces de alerta/alarmas del a prueba de error (F/P) del equipo y coincidencia de valores de ajuste/tolerancias con el estándar\n- Candado/llave (KEY-LOCK) para evitar manipular a criterio los valores de ajuste del equipo\n- Proceso de verificación del funcionamiento normal de equipos clave al inicio de turno (revisión con maestro OK/NG o calibre de ajuste de valores de medición)\n- Equipos de producción e inspección que requieren calibración: ajustar a cero (enseñanza) antes del inicio y verificar su estado (con maestro OK/NG)"},{"id":"3_2","c":2,"p":30,"ko":"▣ 설비 정기점검 업무절차 수립 및 준수여부\n    - 주요 핵심설비 정기점검 계획수립 및 점검상태(예, 설비 등급별 점검 주기 설정)\n       1) 외주업체 정도점검 성적서 포함, 자체점검주기 반영\n       ※ 외주업체 또는 자체 정도점검 가능 설비/인력이 확보된경우 인정\n    - 설비내 소모성 부자재류 점검/교체주기 설정 및 준수여부 \n        [필요시 소모성 부자재 교체주기 설정근거 제시 필요, T/O 이력 등]\n    - 설비 부착 센서 및 게이지류에 대한 정도 보증 방안 수립 및 이행 상태\n      1) 설비내 주요 압력계 정기점검 정도보증 또는 검교정된 마스터게이지 비교 검증활동 실시\n      2) 금형내 노즐온도 센서 등 중요 센서류 고장여부 정기점검시 정도보증 활동 필요\n          (단, 부품생산 금형 미보유 업종 제외 - 예)전기조립, 스프레이도장, 사출금형, 프레스금형, 프레스 등)\n      3) 전동툴 및 너트런너 점검주기 설정 및 정기적 토크 검사 진행\n      ※ 설비 일상점검 항목을 제외한 세부 점검 필요부만 정기점검 계획 수립 및 점검 필요","es":"▣ Procedimiento y cumplimiento de la revisión periódica de equipos\n- Plan y estado de revisión periódica de equipos clave (ej. frecuencia según clasificación del equipo)\n   1) Incluir reportes de revisión de precisión de proveedores externos y frecuencia de revisión propia\n   ※ Se acepta si se cuenta con proveedor externo o con equipo/personal propio para revisión de precisión\n- Frecuencia de revisión/reemplazo de auxiliares consumibles del equipo y su cumplimiento\n   [de ser necesario, presentar fundamento de la frecuencia de reemplazo, historial de T/O, etc.]\n- Aseguramiento de precisión de sensores y manómetros del equipo y su implementación\n  1) Revisión periódica de precisión de manómetros principales, o verificación comparando con manómetro maestro calibrado\n  2) Aseguramiento de precisión en la revisión periódica de fallas de sensores importantes (p. ej. sensor de temperatura de boquilla en el molde)\n      (excepto giros sin molde de producción de piezas — ej. ensamble eléctrico, pintura por aspersión, molde de inyección, molde de estampado, prensa, etc.)\n  3) Definir frecuencia de revisión de herramientas eléctricas y atornilladores (nut runner) y realizar inspección periódica de torque\n  ※ Solo se requiere plan de revisión periódica para las partes que necesitan revisión detallada, excluyendo los ítems de revisión diaria"},{"id":"3_3","c":2,"p":20,"ko":"▣ 원소재 건조장치 관리기준 설정 및 준수상태\n    - 건조기, 공급장치 필터 교체이력 관리 및 공급라인 청소, 원재료 잔량 감지센서 활용상태 \n    - 사출기별 최대중량 사출품기준 원소재 건조시간 준수를 위한 잔량식별 센서 부착위치 위치 적합성 검토 및 준수실태(현장점검)\n      ※ 센서 위치 적합성 검토\n             1) 원단위 중량(사출호기별 최대 중량품 기준) * 생산 UPH : 시간당 원소재 소요량 \n             2) 원소재 수분함유량 만족 최소 건조시간 \n             3) 잔량 식별센서 위치 원소재 최소 건조시간 유지 장입 기준[ 1) * 2) ]보다 높게 설정여부 확인","es":"▣ Criterios y cumplimiento del equipo de secado de materia prima\n- Historial de reemplazo de filtros de secadora y alimentador, limpieza de línea de suministro y uso del sensor de nivel remanente de materia prima\n- Adecuación de la posición del sensor de remanente para cumplir el tiempo de secado con el producto de peso máximo de cada inyectora, y su cumplimiento (verificar en piso)\n  ※ Revisión de la posición del sensor\n     1) Peso unitario (producto de mayor peso por inyectora) × UPH de producción: consumo de materia prima por hora\n     2) Tiempo mínimo de secado para cumplir el contenido de humedad\n     3) Verificar que la posición del sensor de remanente esté por encima de la carga necesaria para mantener el tiempo mínimo de secado [1) × 2)]"},{"id":"3_4","c":2,"p":20,"ko":"▣ 배합기/분쇄기 관리기준 설정 및 준수상태 (분쇄 및 배합공정 없을시 '해당없음' 처리)\n [배합기]\n   ▷ 배합기 설비 관리기준 설정 및 준수상태\n    - 신재/스크랩/첨가제 등 품목/재료별 배합 관리기준표 현장내 게시상태\n    - 배합시간 및 RPM 표준과 실제공정 일치성 현장점검\n    - 배합설비 설비 일상점검 실시상태(타이머, 중량계 등)\n    - 배합설비 배합비율 정합성 정기적 검증(배합비율 셋업대비 실측결과)\n [분쇄기]\n   ▷ 분쇄기 설비 관리기준 설정 및 준수상태\n    - 분쇄기 칼날 등 설비 일상점검 항목선정 및 준수실태(일상점검표)\n    - 이종 원소재 동일 분쇄기 사용 재투입시 물성저하 문제점 발생 가능성 예방\n    - 스크랩 분쇄 점검/청소 관리 및 미분쇄 소재 투입방지를 위한 필터망 설치 운영 \n [공통항목]\n   ▷ 배합기/분쇄기 정기점검 계획 수립 대비 실적확인\n    - 정기 점검항목 유효성 확보여부(설비일상점검 기준표와 동일항목 점검시 유효성 없음)","es":"▣ Criterios y cumplimiento de mezcladora/molino (si no hay proceso de molienda ni mezcla: 'No aplica')\n [Mezcladora]\n   ▷ Criterios de gestión del equipo de mezcla y su cumplimiento\n    - Publicación en piso de la tabla de control de mezcla por producto/material (virgen/scrap/aditivos, etc.)\n    - Revisión en piso de coincidencia del tiempo de mezcla y RPM con el estándar y el proceso real\n    - Estado de la revisión diaria del equipo de mezcla (temporizador, báscula, etc.)\n    - Verificación periódica de la proporción de mezcla (resultado medido vs ajuste)\n [Molino]\n   ▷ Criterios de gestión del molino y su cumplimiento\n    - Definición y cumplimiento de ítems de revisión diaria (cuchillas, etc.) (hoja de revisión diaria)\n    - Prevenir degradación de propiedades por moler materiales de distinta resina en el mismo molino y reincorporarlos\n    - Control de revisión/limpieza del molido de scrap e instalación de malla filtrante para evitar que entre material sin moler\n [Común]\n   ▷ Verificar el plan de revisión periódica de mezcladora/molino contra lo realizado\n    - Validez de los ítems de revisión periódica (no tiene validez si son los mismos de la hoja de revisión diaria)"},{"id":"3_5","c":2,"p":10,"ko":"▣ 지그 제작/보전관리 프로세스 수립 및 준수상태 (사출작업 외 조립/융착공정 없을시 '해당없음' 처리)\n    - JIG 제작 기준 \n      → 융착공정 융착부 전면적이 눌릴 수 있도록 JIG 설정 여부\n      → 조립 및 융착공정 사출품 거치시 안착면 유격발생 여부 및 지그내 클램프 등 고정부 유격/툴링핀 마모여부 점검 ","es":"▣ Proceso de fabricación/mantenimiento de dispositivos (JIG) (si no hay ensamble/fusión además de la inyección: 'No aplica')\n- Criterios de fabricación del JIG\n  → ¿El JIG está configurado para presionar toda el área de la zona de fusión?\n  → Al colocar la pieza inyectada en procesos de ensamble/fusión: revisar holguras en la superficie de asiento, holgura en abrazaderas/fijaciones del JIG y desgaste de pines de herramental"},{"id":"4_1","c":3,"p":20,"ko":"▣ 금형 일상/점기점검 프로세스 수립 및 준수상태\n    - 과거 수리이력 / 품질문제 발생이력 / 사용빈도 등 명확한 근거에 준한 금형 등급관리 기준 수립여부\n    - 금형별 등급기준에 따라 일상점검/정기점검 주기설정 및 준수상태 (일상점검/정기점검 체크시트 별도 운영)\n        ※중요 점검항목 \n           ＊ 일상점검 : 금형 CAVITY별 검사여부, 금형 T/O시 품질 취약 POINT (미성형 발생 위치 등) 확인 등\n           ＊ 정기점검 : 금형 슬라이드 코어 마모 등 서브품 손상에 따른 일상점검 부위 외 외관/치수 이상여부 확인 등  \n    - 금형별 타발수 기록/관리 상태(정기검증 필요)\n          ⇒ 전산관리 또는 엑셀 등 활용한 타발수 실적관리 데이터 유효성 확보여부 점검(생산 실적 기준, 타발수 관리 필요)","es":"▣ Proceso y cumplimiento de la revisión diaria/periódica de moldes\n- Definir criterio de clasificación de moldes con base clara en historial de reparaciones, de problemas de calidad, frecuencia de uso, etc.\n- Frecuencia y cumplimiento de revisión diaria/periódica según la clasificación de cada molde (checklists de revisión diaria y periódica por separado)\n   ※ Ítems de revisión importantes\n      ＊ Diaria: si se inspecciona por CAVIDAD; puntos débiles de calidad detectados en el T/O (p. ej. posición donde ocurre no llenado)\n      ＊ Periódica: verificar apariencia/dimensión fuera de las zonas de revisión diaria por daño de piezas (p. ej. desgaste de corazones deslizantes)\n- Registro y control del conteo de disparos por molde (requiere verificación periódica)\n     ⇒ Verificar la validez de los datos del conteo de disparos en sistema o Excel (controlar el conteo con base en la producción real)"},{"id":"4_2","c":3,"p":20,"ko":"▣ 금형 세척관리 프로세스 수립 및 준수상태\n    - 금형별 등급기준에 따라 금형세척 주기설정 및 준수상태 (세척관리 체크시트 및 실시이력 확인 필요)\n    - 협력사별 세척프로세스 기준수립 (절차서, 장비현황, 인원 등)\n       ※중요 점검항목 : 금형세척시 GAS VENT부 등 全POINT 누락없이 실시되는지 확인(최근 세척금형 현물검증)","es":"▣ Proceso y cumplimiento de la limpieza de moldes\n- Frecuencia de limpieza según la clasificación del molde y su cumplimiento (verificar checklist de limpieza e historial)\n- Definir criterios del proceso de limpieza por proveedor (procedimiento, equipos, personal, etc.)\n   ※ Ítem importante: verificar que en la limpieza se realicen TODOS los puntos, como los respiraderos (GAS VENT), sin omisión (verificar físicamente un molde recién limpiado)"},{"id":"4_3","c":3,"p":20,"ko":"▣ 금형 보전 프로세스 수립 및 준수상태\n    - 금형별 사내수리/외주수리/소모품교체 등 보전관리 프로세스 수립 및 준수여부 (데이터 증빙) \n    - 금형 보수용 S/part 관리상태 및 및 점검인원 확보 상태. 금형 보수후 생산부품 검증자료 \n    - 금형 수정작업 진행시 신규제작에 준한 T/O실시 및 재공품 품질 보증활동 실시\n    - 금형 수정사항 발생시 협력사 임의수정 금지 (금형제작사에 정식 수정요청 必) \n        → 금형 유지관리를 위한 금형 수리는 협력사에서 진행 가능하나, 제품의 치수/형상 변경과 관련된 금형 수정은 금형 제작사에\n            정식 수정요청 필요\n    - 금형 수정 초품에 대한 검사 이력 관리","es":"▣ Proceso y cumplimiento del mantenimiento de moldes\n- Proceso de mantenimiento por molde (reparación interna/externa, cambio de consumibles, etc.) y su cumplimiento (evidencia con datos)\n- Gestión de refacciones (S/part) para reparación de moldes y disponibilidad de personal de revisión; datos de verificación de piezas producidas tras la reparación\n- Al modificar un molde: realizar T/O equivalente a uno nuevo y actividades de aseguramiento de calidad del producto en proceso\n- Prohibido que el proveedor modifique el molde por su cuenta (se debe solicitar formalmente al fabricante del molde)\n    → El proveedor puede realizar reparaciones de mantenimiento, pero las modificaciones que cambien dimensión/forma del producto requieren solicitud formal al fabricante del molde\n- Control del historial de inspección de la primera pieza tras modificar el molde"},{"id":"4_4","c":3,"p":10,"ko":"▣ 금형 보관 프로세스 수립 및 준수상태\n    - 금형보관대 제작 및 금형위치 현황판 주소화 관리(공정투입/작업대기/외주수리 등 LOCATION별 관리여부)\n    - 금형 식별관리 절차 수립 및 준수(양산, A/S차종 등)\n    - 금형 보관시 이물유입 방지 대책 수립 및 세척/냉각수 탈수 상태 보관 등 관리실태 현장 점검","es":"▣ Proceso y cumplimiento del almacenamiento de moldes\n- Fabricar racks de moldes y tablero de ubicación con direccionamiento (control por UBICACIÓN: en proceso/en espera/reparación externa, etc.)\n- Procedimiento y cumplimiento de identificación de moldes (producción en serie, modelos de servicio/A/S, etc.)\n- Medidas para evitar ingreso de contaminantes al almacenar y verificación en piso del estado de limpieza y de drenado del agua de enfriamiento"},{"id":"4_5","c":3,"p":20,"ko":"▣ 금형 이관 프로세스 수립 및 준수상태\n    - 신규제작 및 양산 금형 이관시 시사출(T/OUT) 보고서 및 성형/강도해석 자료 검증 실시(실시결과 증빙관리)\n    - 시사출 T/O 발췌 문제점 개선 종료후 이관 실시여부 이력확인\n    - 시사출 T/O 중요 발췌 POINT 일상/정기점검 체크시트 반영여부","es":"▣ Proceso y cumplimiento del traslado de moldes\n- En traslado de moldes nuevos y de producción: verificar el reporte de prueba (T/OUT) y análisis de moldeo/resistencia (evidencia de resultados)\n- Verificar en el historial que el traslado se hizo después de cerrar la mejora de los problemas detectados en el T/O\n- ¿Los puntos importantes detectados en el T/O se reflejaron en los checklists de revisión diaria/periódica?"},{"id":"4_6","c":3,"p":10,"ko":"▣ 금형 예열 관리기준 수립 및 준수여부\n    - 금형 예열관련 기준수립 여부 : 금형예열기 사용 필요여부 검토이력\n          ⇒ 소물금형 등 온수기 활용으로 신속한 온도상승 가능할경우 예열기 사용 불필요\n          ⇒ 사용중인 금형별 양산 관리조건 생산준비 셋업시간 검토이력 확보 필요\n    - 재료별/품목별 금형 예열시간 표준 설정 및 이력관리 상태","es":"▣ Criterios y cumplimiento del precalentamiento de moldes\n- ¿Existe criterio de precalentamiento? Historial de análisis de la necesidad del precalentador\n     ⇒ Si con calentador de agua (moldes pequeños, etc.) se alcanza rápido la temperatura, no es necesario el precalentador\n     ⇒ Se requiere historial de análisis del tiempo de preparación/ajuste según condiciones de producción de cada molde en uso\n- Estándar de tiempo de precalentamiento por material/producto y su control de historial"},{"id":"4_7","c":3,"p":30,"ko":"▣ 금형 온도 관리기준 수립 및 운영실태 점검(실시이력 신뢰도 확보 필요, 현장점검시 샘플 실측 요망)\n    - 금형온도 F/P 측정센서 반영시 : 금형온도 설비 유효성 비교검증 절차 수립 및 준수\n        : 금형 고정측/ 이동측별 F/P 계측센서 설비 유효성 검증\n          ⇒ 설비 셋팅값 대비 온도센서 표시값/실측값 비교검증 실시(자체 정기점검 주기 설정 및 준수)\n      ※ 권장사항 [권장 사항으로 자체 품질영향성 검증을 통한 관리공차 가능]\n                     600t이하 : 센서 1개소 이상, 센서대비 실측값 온도편차 ±3℃이내 권장 \n                     600t이상 : 센서 2개소 이상, 센서대비 실측값 온도편차 및 센서간 온도편차 ±5℃이내 권장   \n    - 금형온도 F/P 측정센서 미반영 시\n        : 생산중 정기적인 금형온도 유효성 점검활동 실시 필요(1회 이상/SHIFT)  \n          ⇒ F/P 미반영시 생산과정중 금형온도 생산과정중 관리기준 만족여부 자주 보증방안 수립 필요\n               (초/종품 생산시 표면온도 검증 등) \n      ※ 접촉식 온도계 측정위치 선정 기준 근거(금형구조 검토, 측정위치 적정성 확보) 확인\n    - 금형온도 유지/조절장치(온수기, 온유기, 칠러) 적용상태 점검","es":"▣ Criterios y operación del control de temperatura de molde (se requiere confiabilidad del historial; medir una muestra real en la revisión de piso)\n- Si hay sensor de medición F/P de temperatura del molde: procedimiento y cumplimiento de verificación comparativa de validez\n    : verificar la validez del sensor F/P por lado fijo/móvil del molde\n      ⇒ Comparar valor mostrado/medido del sensor contra el valor ajustado (definir y cumplir frecuencia propia de revisión)\n   ※ Recomendado [se puede definir tolerancia propia con verificación de impacto en calidad]\n        ≤600 t: 1 sensor o más; desviación de temperatura medida vs sensor dentro de ±3℃\n        ≥600 t: 2 sensores o más; desviación medida vs sensor y entre sensores dentro de ±5℃\n- Si no hay sensor F/P de temperatura de molde:\n    : Realizar verificación periódica de validez de la temperatura del molde durante producción (1 vez o más por TURNO)\n      ⇒ Definir medio de autoaseguramiento de que la temperatura cumple el criterio (p. ej. verificar temperatura superficial en primera/última pieza)\n   ※ Verificar el fundamento de la posición de medición del termómetro de contacto (revisión de estructura del molde, adecuación de la posición)\n- Revisar la aplicación de equipos de mantenimiento/regulación de temperatura del molde (calentador de agua, de aceite, chiller)"},{"id":"5_1","c":4,"p":40,"ko":"▣ 원자재 및 재공품, 출하품 LOT 추적성 관리 프로세스 수립 및 준수상태\n [CASE1] LOT수작업관리 - 파렛트or 부품단위 \n   ▷ 보안/안전 부품 별도 식별 표시 : LOT타각, 식별마크 등\n   ▷ 선입/선출 관리기준 유무 (공정~출하) - 관리 대장, 레이아웃\n   ▷ 선입 선출 준수 여부 - 중요 부품 샘플링 점검, 인라인 투입 제품, 투입 대기 제품, 자재창고 적재 제품 생산일 점검 \n   ▷ 부품 LOT 표기 여부  (표준류 지정시) - 각인, 스티커, 타각 등\n   ▷ 부품 LOT기록 마스터리스트 관리되고 역추적 가능 여부\n [CASE2] LOT전산관리 - 파렛트단위 \n   ▷ 파렛트 납품단위 이종 LOT 생산품 혼입 방지 프로세스 수립 - 파렛트 납입 제품 혼입여부 실물 확인\n   ▷ 파렛트 바코드 라벨 부착 관리 여부 (바코드 라벨 유실 방지 대책 포함) \n    - 생산 LOT 정보 포함, 보안/안전 부품 별도 식별 표시\n   ▷ 파렛트 단위 공정 투입시 바코드 리딩     - 미리딩 오류 발생 알람 및 선입선출 인터락 유무\n   ▷ 파렛트 단위 LOT 전산 관리되고, 역추적 가능 여부\n[CASE3] LOT전산관리 - 부품단위 \n   ▷ 부품 바코드 라벨 부착 관리 여부 (바코드 라벨 유실 방지 대책 포함) \n    - 생산 LOT 정보 포함, 보안/안전 부품 별도 식별 표시\n    - 라벨 부착 위치는 정해져 있으며, 불완전 부착에 의한 상대물 간섭 없을것\n   ▷ 부품단위 공정 투입시 바코드 리딩 - 미리딩 오류 발생 알람 및 선입선출 인터락 유무\n   ▷ 부품 단위 LOT 전산 관리되고, 역추적 가능 여부","es":"▣ Proceso y cumplimiento de trazabilidad por LOTE de materia prima, producto en proceso y producto embarcado\n [CASO 1] Control manual de LOTE – por tarima o por pieza\n   ▷ Identificación separada de piezas de seguridad: grabado de LOTE, marcas de identificación, etc.\n   ▷ Criterio de PEPS (primeras entradas-primeras salidas) del proceso al embarque – registro, layout\n   ▷ Cumplimiento del PEPS – muestreo de piezas importantes; revisar fecha de producción de lo que va a línea, lo que espera y lo almacenado\n   ▷ Marcado del LOTE en la pieza (si lo define el estándar) – grabado, etiqueta, golpe, etc.\n   ▷ ¿La lista maestra de registro de LOTE de piezas se controla y permite trazabilidad hacia atrás?\n [CASO 2] Control por sistema de LOTE – por tarima\n   ▷ Proceso para evitar mezcla de LOTES distintos en la tarima de entrega – verificar físicamente\n   ▷ Etiqueta de código de barras en tarima (con medidas contra pérdida de etiqueta)\n    - Incluir información de LOTE de producción; identificación separada de piezas de seguridad\n   ▷ Lectura de código de barras al entrar la tarima al proceso – alarma por error de no lectura e interlock de PEPS\n   ▷ ¿El LOTE por tarima se controla en sistema y permite trazabilidad hacia atrás?\n [CASO 3] Control por sistema de LOTE – por pieza\n   ▷ Etiqueta de código de barras en la pieza (con medidas contra pérdida de etiqueta)\n    - Incluir información de LOTE de producción; identificación separada de piezas de seguridad\n    - Posición de etiqueta definida; sin interferencia con piezas de acople por pegado incompleto\n   ▷ Lectura de código de barras al entrar la pieza al proceso – alarma por error de no lectura e interlock de PEPS\n   ▷ ¿El LOTE por pieza se controla en sistema y permite trazabilidad hacia atrás?"},{"id":"5_2","c":4,"p":10,"ko":"▣ 수입자재 보관장 관리기준 수립 및 준수상태\n    - 자재 창고 Lay Out 현황도 작성 및 선입선출 관리(선입선출 다이 등 구조적 시스템, 입/불출 절차 효율성 확보 여부)\n    - 입고품 적재/관리기준 수립 및 준수(입고 완료품 찍힘/발청, 이물질오염, 기타 손상 확인시 감점)\n    - 원소재 보관 관리기준 수립 및 준수상태(포장상태 및 개봉후 식별방법 등)\n    - 미사용 장기보관 자재류 처리기준 수립 및 이행상태\n    - 설변에 의한 불용자재 발생시 자재 식별 및 혼입 방지 관리 상태 \n    - 항온/항습보관 필요 자재의 경우 보관장 관리기준 수립 및 준수 상태\n    - 원소재 및 외주품 안전재고 관리기준 수립 및 외주품 결품시 유사사양 대체 투입 금지","es":"▣ Criterios y cumplimiento del almacén de materiales recibidos\n- Elaborar el layout del almacén y controlar PEPS (sistema estructural como racks PEPS, eficiencia del procedimiento de entrada/salida)\n- Definir y cumplir criterios de estiba/control de lo recibido (se descuenta si hay golpes/óxido, contaminación u otros daños)\n- Criterios y cumplimiento de almacenamiento de materia prima (estado del empaque, método de identificación tras abrir, etc.)\n- Criterio e implementación para materiales sin uso y de larga estancia\n- Control de identificación y prevención de mezcla de materiales obsoletos por cambio de ingeniería\n- Criterios y cumplimiento del almacén para materiales que requieren temperatura/humedad constante\n- Criterio de stock de seguridad de materia prima y piezas externas; prohibido usar sustituto de especificación similar ante faltante de pieza externa"},{"id":"5_3","c":4,"p":20,"ko":"▣ 입고품 식별관리 기준 수립 및 준수여부\n    - 검사 전,후 식별 및 미검사품 사용 방지 보증 방안\n    - 소재사양 및 GRADE 식별절차 \n    - 장기/불용/개발품 자재 식별절차(장기/불용/개발용 원재료 별도 구분/식별관리)\n    - 공정 투입후 잔량관리(보관상태/식별표시/유효기간 설정 등)\n    - 여러 사양의 부품을 동시 생산하는 라인의 SUB품 조립 작업시 사양관리 방안마련\n     ※ Barcode 인터락 또는 부품 보관박스 LABEL 구분후 작업일보 SUB품 사양(품번기입) 활동으로 정사양 여부 시업전 점검","es":"▣ Criterios y cumplimiento de la identificación de lo recibido\n- Identificación antes/después de inspección y medios que aseguren no usar producto sin inspeccionar\n- Procedimiento de identificación de especificación y GRADO del material\n- Procedimiento de identificación de materiales de larga estancia/obsoletos/de desarrollo (separar e identificar materia prima de larga estancia/obsoleta/de desarrollo)\n- Control del remanente tras entrar al proceso (estado de almacenamiento, identificación, definición de vigencia, etc.)\n- En líneas que producen varias especificaciones a la vez: medida de control de especificación al ensamblar piezas SUB\n  ※ Verificar antes del inicio la especificación correcta mediante interlock de código de barras, o separando con ETIQUETA las cajas de piezas y anotando la especificación (número de parte) de la pieza SUB en el reporte diario"},{"id":"5_4","c":4,"p":20,"ko":"▣ 재공품/완제품 용기 표준화 관리기준 수립 및 이행상태\n    - 품목별/공정별 장입(적재) 기준 수립 및 준수상태/ 과다적재 예방을 위한 장입 한계 기준설정 등\n    - 외관확인이 어려운 공정처리 전/후 재공품 보관용기 식별절차 수립 및 준수상태\n        (예: 표면처리, 열처리 전/후, 템퍼링 전/후 용기 식별관리 절차수립, 열처리후 템퍼링 시간관리)\n    - 제품 특성을 고려한 용기 관리기준 설정(청정도 관리 대상품 이물질유입 예방목적 용기 세척, 오염방지 커버 적용 등)\n    - 포장 용기 다단적재 및 현장 적재상태 (종이BOX, 프라스틱BOX, 전용용기 등 적재 관리기준 수립 및 이행상태)\n    - 완제품 보관관리 기준 및 관리상태\n      : 성적서 기록상태, 완제품 보관관리(별도공간/식별공간, 청결관리, 간지사용 등 제품 외관 및 기능에 품질문제 발생 가능여부)\n    - 이동 또는 보관 대차/팔레트에 의한 부품손상(부품간 간섭 찍힘, 적입인출시 대차간섭 등)방지 사전 검토필요","es":"▣ Criterios y cumplimiento de la estandarización de contenedores de producto en proceso/terminado\n- Criterios de carga (estiba) por producto/proceso y su cumplimiento; límite de carga para evitar sobrecarga\n- Procedimiento y cumplimiento de identificación de contenedores de producto en proceso antes/después de procesos cuya apariencia no permite distinguirlos\n   (ej.: identificación de contenedores antes/después de tratamiento superficial, térmico o revenido; control del tiempo de revenido tras tratamiento térmico)\n- Criterios de contenedores considerando las características del producto (limpieza de contenedores y cubiertas anticontaminación para productos con control de limpieza, etc.)\n- Estiba multinivel de contenedores y estado de estiba en piso (criterios y cumplimiento para cajas de cartón, cajas de plástico, contenedores dedicados, etc.)\n- Criterios y estado del almacenamiento de producto terminado\n  : registro en reportes, almacenamiento (espacio separado/identificado, limpieza, uso de separadores, etc.; posibilidad de problemas de apariencia o función)\n- Revisar previamente cómo evitar daños a las piezas por carros/tarimas de traslado o almacenamiento (golpes entre piezas, interferencia del carro al cargar/descargar, etc.)"},{"id":"6_1","c":5,"p":30,"ko":"▣ 안전사고 발생 예방을 위한 업무 프로세스 수립 및 준수실태\n    - 작업자 안전관리 프로세스 수립 및 준수실태(현장확인)\n      : 생산중 핸드폰 미사용을 위한 별도 보관대 설치 및 시건장치, 라인투입전 휴대폰 미반납후 사용시 조치방안\n       : 안전 보호장구(보안경/헬멧/장갑 등) 착용 기준수립 및 이행상태 점검(일상)\n    - 업종별 안전사고 발생 예방을 위한 설비/레이아웃 반영\n          ⇒ 예) 프레스 : 작업자 감지센서(안전BAR), 양수 조작버튼, 플라이휠 커버 등\n                    도금 : 마스크 착용, 위험물(약품) 별도 보관장 마련 및 취급기준 수립\n                    용접 : 안전장갑 및 보호 안경 착용, 용접 스페터 비산 방지용 보호막 설치 등 \n                    로봇, 자동 기계 설비(LOTO) : 전원차단(Lock-Out)과 경고표지 부착(Tag-Out) 실시\n    - 작업 현장내 안전표지/수칙 게시 및 작업자 교육\n    - 작업 현장내 위험요소(위험물)에 대한 사고예방 장비/시설물 설치 및 식별 표준류
