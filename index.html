s"],B12:["Are roles, responsibilities and authorities assigned and communicated (org chart, profiles)?","Org chart, current job descriptions"],B13:["Does personnel responsible for product requirements have authority to stop shipment and production to correct quality problems?","Stop procedure, evidence of authority exercised, personnel designation"],B14:["Is risk analysis performed that includes lessons learned from complaints and product recalls?","Dated risk matrix with actions, lessons learned"],B15:["Are preventive actions in place to eliminate causes of potential nonconformities and is their effectiveness verified?","Preventive action log, effectiveness verification"],B16:["Are contingency plans (equipment failure, power, supply, disasters) tested and reviewed?","Contingency plan, tests/drills, annual review"],B17:["Do quality objectives cover customer requirements, and are they measurable, aligned with policy, monitored and communicated?","Objectives with target, owner, monthly follow-up"],B18:["Are facilities, layout and equipment planned to optimize material flow and safety? Is feasibility evaluated on change?","Layout, facilities plan, feasibility assessments"],B19:["Are there contingency plans that include maintenance and supply of critical utilities (power, air, water)?","Equipment and facilities contingency plan"],B20:["Is the work environment (cleanliness, order, lighting, ESD, safety) adequate to achieve product conformity?","Plant walk-through, 5S / environmental condition records"],B21:["Has measurement systems analysis (MSA: R&R, bias, linearity, stability) been done on control-plan equipment?","Current MSA studies per equipment, acceptance criteria"],B22:["Is measuring equipment calibrated with traceability, complete records, identification and impact assessment when out of tolerance?","Calibration program, ILAC/ISO 17025 certificates, labels, impact records"],B23:["Does the internal laboratory have defined scope, procedures, competent personnel an view?","APQP indicators, project reviews"],B48:["Is there a prototype program and control plan when required by the customer, using series suppliers and tooling?","Prototype control plan, test results"],B49:["Does the product approval process (PPAP/PSW) meet customer requirements and was it approved before shipment?","Approved PSWs, PPAP package, customer approval"],B50:["Are manufacturing process design outputs (flow, FMEA, control plan, instructions, capability) verifiable against inputs?","Process flow, process FMEA, control plan, capability studies"],B51:["Are design changes evaluated (form, fit, function), validated and approved before implementation? Is there customer approval?","Change records, customer approvals, deviations"],B52:["Are external services affecting the customer (sorting, rework, calibration, sub-assembly) within the scope of control?","List of suppliers and services with defined control"],B53:["Is there a documented supplier selection process with risk, performance, QMS evaluation and multidisciplinary decision?","Selection procedure, initial assessments"],B54:["Are customer-directed sources (directed-buy) managed per customer requirements?","List of customer-designated suppliers"],B55:["Are the type and extent of control defined per supplier based on risk, and do suppliers have certification (ISO 9001/IATF) or a development plan?","Approved supplier list (ASL), certificates, development plan"],B56:["Is it ensured that supplier products meet legal requirements of the country of manufacture and destination?","Compliance declarations (RoHS, REACH, IMDS)"],B57:["Is supplier QMS development toward IATF 16949 carried out, prioritized by risk and performance?","Supplier development plan, certifications"],B58:["Is supplier performance monitored (PPM, deliveries, complaints, premium freight) with actions?","Supplier scorecard, actions for performance"],B59:["Is there a second-party audit program with criteria, frequency, results and follow-up?","Supplier audit program, reports and finding closure"],B60:["Are customer requirements, special characteristics, traceability and changes communicated to suppliers?","Purchase orders / specifications, CSR communication"],B61:["Are there complete control plans (pre-launch and production) linked to FMEA and flow, with special characteristics, reaction plan and review after changes or complaints?","Control plans, linked FMEA and flow, dated reviews"],B62:["Are standardized work instructions and visual aids available at the workstation, current, and derived from FMEA/control plan?","Operation sheets on the floor, review signature, consistency with control plan"],B63:["Are start-ups and changeovers (set-up) verified with acceptance criteria and records, including first/last piece?","Set-up approval records, first and last piece"],B64:["Is the process verified after prolonged or unplanned production stoppages?","Restart procedure and records"],B65:["Is there a total productive maintenance (TPM) system with plan, critical spares, indicators and improvement?","Maintenance plan, OEE, MTBF/MTTR, critical spares"],B66:["Are tooling, molds and gauges managed (identification, ownership, maintenance, recovery)?","Tooling register, preventive maintenance, customer ownership identified"],B67:["Is production planning based on customer demand, with order system, inventories and controlled schedule?","Production schedule, MRP, customer order system"],B68:["Is there a risk-based traceability plan (lot/serial) that allows identifying and segregating suspect product within customer response time?","Traceability plan, successful traceability test (drill)"],B69:["Are inspection and nonconforming product status clearly identified throughout the flow?","Status labels, identified areas, floor walk-through"],B70:["Is customer property controlled (tooling, consigned material, returnable packaging)?","Inventory and records of customer property"],B71:["Is product preserved (warehouse, FIFO/FEFO, packaging, seasonality, shelf life) and inventory evaluated periodically?","Orderly warehouse, FIFO, expiry control, inventory condition records"],B72:["Is there control of shipping, delivery scheduling, shortage alerts and delivery communication with the customer?","Delivery schedule, OTD indicators, alert plan"],B73:["Is after-sales / field feedback obtained, analyzed and communicated internally?","Field and warranty information records"],B74:["Are changes to process, equipment, tooling and materials controlled, validated and communicated (with customer approval where applicable)?","Change requests, validations, updated PSW, approvals"],B75:["Do temporary process-control changes (e.g. inspection instead of poka-yoke) have risk analysis, approval, end date and return to the original process?","Temporary change records with expiry date"],B76:["Is product release defined in the control plan and repeated after changes?","Control plan, release records"],B77:["Is complete dimensional inspection and functional testing performed per control plan and customer frequencies?","Dimensional layouts, functional results"],B78:["For appearance parts, are there lighting, masters, equipment and qualified personnel?","Controlled masters, evaluator qualification"],B79:["Is conformity of received product verified (supplier data, sampling receiving inspection, audits or laboratory)?","Receiving inspection records, certificates, performance-based sampling criteria"],B80:["Is it confirmed that externally provided products comply with applicable legislation before use?","Updated compliance declarations"],B81:["Are acceptance criteria defined (zero defects for attribute data) and customer-approved when applicable?","Acceptance criteria, customer approval"],B82:["Are customer concessions or deviations authorized before shipment and recorded?","Customer authorizations, concession records"],B83:["Is nonconforming product controlled according to the customer-specified process?","NC control procedure, ts performed at appropriate stages against specifications?","Product audit reports"],B98:["Do audit findings receive correction, cause analysis and effectiveness verification within deadlines?","Reports with closed actions and verified effectiveness"],B99:["Is management review held at least annually (more often if risk) with results recorded?","Management review minutes / presentations"],B100:["Do inputs include cost of poor quality, process effectiveness, productivity, customer satisfaction, maintenance, supplier performance and complaints?","Management review inputs"],B101:["Do outputs include actions, deadlines and owners, with follow-up and closure?","Review action log and status"],B102:["Are nonconformities handled with correction and effective corrective action (including customer complaints)?","NC / 8D records, closure and effectiveness"],B103:["Is there a documented problem-solving process (containment, root cause, systemic actions, spread to other processes, verification)?","Methodology (8D / 5 Whys) and recent cases"],B104:["Is error-proofing (poka-yoke) applied with periodic verification and master parts?","Poka-yoke list, verification records"],B105:["Is there a warranty management system and analysis of returned parts?","Warranty procedure, parts analysis"],B106:["Are customer complaints and field failures analyzed, and results communicated and used for improvement?","Complaint analysis, failure reports, actions"],B107:["Is there a continual improvement process (focused on reducing variation and waste) and action plans based on results?","Improvement plan, projects, results"],Xestampado0:["Stamping: are dies verified (height, wear, burr) and first/last piece recorded for every lot/changeover?","Start-up approval records, die maintenance"],Xestampado1:["Stamping: are coils/sheets (heat number) traced to the finished part?","Coil labels, lot traceability"],Xinyeccion0:["Injection: are critical parameters (temperature, pressure, time) recorded and control ted","\uBBF8\uD3C9\uAC00"),c:"#8a99a8"}:p>=95?{t:x("Excelente","Excellent","\uC6B0\uC218"),c:"#16834E"}:p>=85?{t:x("Bueno","Good","\uC591\uD638"),c:"#0E9F6E"}:p>=70?{t:x("Aceptable","Acceptable","\uD5C8\uC6A9"),c:"#C87F0A"}:{t:x("Cr\xEDtico","Critical","\uC704\uD5D8"),c:"#D7263D"}}function iatfLang(){try{ifr().contentWindow.eval('S.lang="'+G.lang+'";save();render();')}catch{}}const AID={ph:{1:["\xC1rea de aplicaci\xF3n","Application area"],2:["Comprensi\xF3n de los datos","Understanding data"],3:["Recopilaci\xF3n de datos","Data collection"],4:["Preparaci\xF3n de datos","Data preparation"],5:["Modelado de IA","AI modeling"],6:["Evaluaci\xF3n y pruebas","Evaluation / testing"],7:["Preparaci\xF3n para el uso","Preparation for use"],8:["Integraci\xF3n de la aplicaci\xF3n","Application integration"],9:["Verificaci\xF3n del desempe\xF1o","Performance verification"],10:["Puesta en operaci\xF3n (Go-live)","Go-live"],11:["Mejora continua","Continuous improvement"]},items:[{id:"1.1",ph:1,a:[1,1,1],q:["\xBFSe defini\xF3 un \xE1rea de aplicaci\xF3n y un objetivo realista para la aplicaci\xF3n de IA?","Have you defined an application area and a realistic goal for the AI application?"],r:["\xC1rea y uso alineados con la estrategia (empresa, TI). Objetivos medibles y casos de uso definidos (matem\xE1ticamente, con datos de ejemplo o de forma sem\xE1ntica/verbal). Escalabilidad, robustez y requisitos de seguridad TI descritos; ROI/benchmark y costos (licencias, tokens) si aplica; planeaci\xF3n de fin de vida (archivo de datos y modelos).","Application area and use aligned with strategy (company, IT). Measurable goals and use cases defined (mathematically, on example data, or semantically/verbally). Scalability, robustness and IT-security requirements described; ROI/benchmark and cost models (licences, tokens) where required; end-of-life planning (archiving data and models)."],e:["Descripci\xF3n del proyecto|Contrataci\xF3n|Especificaci\xF3n|Hoja de logro de objetivos","Project description|Contracting|Specification|Objective achievement sheet"],g:["IA generativa: especificar claramente la generaci\xF3n de contenido, restringir el caso de uso y definir qu\xE9 contenido de alto riesgo se filtra (violencia, odio).","Generative AI: clear specification of content generation, use-case restrictions, and which high-risk content (violence, hate) is filtered."]},{id:"1.2",ph:1,a:[0,1,1],q:["\xBFSe definieron requisitos especiales de explicabilidad del comportamiento esperado de la IA?","Have special requirements for the explainability of the expected AI behavior been defined?"],r:["El comportamiento esperado (explicabilidad) est\xE1 descrito, documentado y es trazable; la relaci\xF3n entradas-salidas se describe con el detalle adecuado. Se consideran los l\xEDmites del sistema, el mal uso previsible y la influencia de las salidas en otros procesos o decisiones. Se planifica la verificaci\xF3n necesaria de las salidas (p. ej. humano en el lazo). Art. 50 EU AI Act: transparencia.","Desired function of expected AI behavior (explainability) is described, documented and traceable; input-output relation described to an appropriate level of detail. System limits, foreseeable misuse and influence of outputs on other processes/decisions are considered. Any necessary verification of outputs is planned (e.g. human-in-the-loop). EU AI Act Art. 50: transparency."],e:["Descripci\xF3n del proyecto|Contrataci\xF3n|Especificaci\xF3n|Hoja de logro de objetivos","Project description|Contracting|Specification|Objective achievement sheet"],g:["IA generativa: la explicabilidad es un reto, pero es esencial para entender las salidas y generar confianza.","Generative AI: explainability is a challenge but essential to understand outputs and build trust."]},{id:"1.3",ph:1,a:[1,1,1],q:["\xBFSe definieron los roles relevantes y se aseguraron las competencias necesarias para un arranque sin contratiempos?","Have all relevant roles been defined and the necessary competences ensured to enable a smooth start to the project/activity?"],r:["Hay un responsable de proyecto/due\xF1o y expertos de software, IA, sistemas y dominio, con la capacidad necesaria. Competencias aseguradas (incluida la alfabetizaci\xF3n en IA del EU AI Act). Roles adicionales posibles: responsable de c\xF3digo abierto, jur\xEDdico, ciberseguridad, protecci\xF3n de datos, cumplimiento de producto (ver cap. 4 del volumen).","A project manager/owner and relevant software, AI, systems and domain experts are involved with the necessary capacity. Required competences ensured (including AI literacy per the EU AI Act). Additional roles may include open source officer, legal, cyber security, data protection officer, product compliance (see chapter 4)."],e:["Descripci\xF3n del proyecto|Contrataci\xF3n|Organigrama|Matrices de capacitaci\xF3n","Project description|Contracting|Organization chart|Training matrices"]},{id:"1.4",ph:1,a:[1,1,1],q:["\xBFSe coordin\xF3 el uso del sistema de IA con el cliente?","Has the use of the AI system been coordinated with the customer?"],r:["El uso del sistema de IA se aclara y acuerda temprano con el cliente/partes interesadas, si se requiere; el monitoreo durante el uso y el concepto de actualizaci\xF3n se coordinan con el cliente. EU AI Act Art. 50: obligaci\xF3n de transparencia en sistemas que interact\xFAan directamente con personas.","Use of the AI system is clarified and agreed early with the customer/stakeholder where required; monitoring during use and the update concept are coordinated with the customer. EU AI Act Art. 50: transparency obligation for AI systems interacting directly with persons."],e:["Descripci\xF3n del proyecto|Contrataci\xF3n|Contrato|Especificaci\xF3n","Project description|Contracting|Contract|Specification"]},{id:"1.5",ph:1,a:[1,1,1],q:["\xBFSe conocen y se cumplen los requisitos regulatorios, normas internas y externas y acuerdos contractuales?","Are relevant regulatory requirements, internal and external standards and contractual agreements known and are they being adhered to?"],r:["Datos y algoritmos son propiedad de la empresa, licenciados o de libre uso comercial; responsabilidad contractual aclarada (p. ej. proveedores). Como m\xEDnimo revisar: EU AI Act / mercados destino, control de exportaciones, RGPD y protecci\xF3n de datos (derecho de supresi\xF3n, retenci\xF3n), leyes de datos (EU Data Act, ley china), licencias de software y datos, gesti\xF3n de c\xF3digo abierto, b\xFAsqueda de patentes, derechos de autor, y principios \xE9ticos/equidad cuando aplique.","Data and algorithms are company property, licensed or freely usable commercially; liability within contracts clarified (e.g. suppliers). At minimum check: EU AI Act / target-market rules, export control, GDPR / data protection (erasure, retention), data law (EU Data Act, Chinese Data Security Law), software and data licensing, open source management, patent search, copyright, and ethical/fairness principles where applicable."],e:["Descripci\xF3n del proyecto|Contrataci\xF3n|Contrato|Especificaci\xF3n","Project description|Contracting|Contract|Specification"]},{id:"2.1",ph:2,a:[1,1,1],q:["\xBFSe determin\xF3 qu\xE9 datos se requieren para desarrollar el sistema de IA para el prop\xF3sito de negocio?","Has it been determined which data is required to develop an AI system for the desired business purpose?"],r:["Datos requeridos para entrenamiento, prueba, validaci\xF3n y operaci\xF3n determinados: tipo, alcance y variaciones, formatos, tasas de transferencia, esquemas, atribuci\xF3n/indexado, metadatos y origen (fuentes accesibles y documentadas; licencias y derechos de uso de terceros). Datos crudos almacenados sin cambios, versionados y en almacenamiento inalterable; requisitos de archivo; compresi\xF3n vs. p\xE9rdida de datos.","Data required for training, testing, validation and operation determined: type, scope and variations, formats, transfer rates, schemas, attribution/indexing, metadata and origin (sources accessible and documented; licence conditions and usage rights of third-party sources). Raw data stored unchanged, versioned in unalterable storage; archiving requirements; compression vs. data loss."],e:["Especificaci\xF3n|Resumen de formatos y contenido de datos","Specification|Overview of data formats and contents"]},{id:"3.1",ph:3,a:[0,1,1],q:["\xBFLa recopilaci\xF3n de datos est\xE1 documentada lo suficiente para poder reproducirse?","Is the collection of data sufficiently documented so that it can be reproduced?"],r:["La metodolog\xEDa y el sistema de recopilaci\xF3n est\xE1n descritos y documentados de forma trazable; los procedimientos de recopilaci\xF3n y anotaci\xF3n (etiquetado) est\xE1n especificados; la reproducibilidad de la recopilaci\xF3n est\xE1 garantizada.","Methodology and system for collecting data are fully described and traceably documented; procedures for collecting and annotating data are specified; reproducibility of data collection is guaranteed."],e:["Especificaci\xF3n|Instrucci\xF3n de trabajo|Resumen de formatos, fuentes y contenido de datos","Specification|Work instruction|Overview of data formats, sources and contents"]},{id:"3.2",ph:3,a:[1,1,1],q:["\xBFLos datos cumplen los requisitos de la tarea?","Does the data meet the requirements of the task?"],r:["Los datos son adecuados para el prop\xF3sito definido (entrenamiento, prueba/verificaci\xF3n y validaci\xF3n del desempe\xF1o). Si faltan datos, pueden generarse datos sint\xE9ticos (p. ej. piezas defectuosas simuladas con modelos f\xEDsicos): expertos documentan las razones y diferencias con datos reales; nunca deben generarse con el sistema de IA que se va a entrenar o probar (riesgo de sesgo) y deben revisarse antes de usarse (ver VDA 5.3 cap. 6).","Collected data is suitable for the purpose defined in the application area, in particular training, testing/verification and performance validation. If more data is needed, synthetic data is possible (e.g. simulated defective parts using physical models): experts document reasons and differences to real data; it must not be generated by the AI system to be trained/tested (bias risk) and must be checked before use (see VDA 5.3 chapter 6)."],e:["Resumen de formatos, fuentes y contenido de datos|Evaluaci\xF3n de riesgos|Resultado del examen de datos","Overview of data formats, sources and contents|Risk assessment|Result of the data examination"]},{id:"3.3",ph:3,a:[0,0,1],q:["\xBFEst\xE1 asegurado el versionado de los datos?","Has data versioning been ensured?"],r:["Cualquier cambio a los conjuntos de datos o datos crudos se rastrea y documenta de forma transparente con un sistema de versionado establecido.","Any changes to the datasets or raw data are transparently tracked and documented by an established versioning system."],e:["Instrucci\xF3n de trabajo|Base de datos o campos con datos de versi\xF3n","Work instruction|Database or data fields for version data"]},{id:"3.4",ph:3,a:[0,1,1],q:["\xBFSe involucr\xF3 a las partes interesadas relevantes en la recopilaci\xF3n de datos?","Have relevant stakeholders been involved in data collection?"],r:["Las partes interesadas relevantes (p. ej. responsable de protecci\xF3n de datos, clientes, \xE1reas internas) fueron informadas e involucradas en la recopilaci\xF3n de datos.","Relevant stakeholders (e.g. data protection officers, customers, internal departments) were informed about and involved in the data collection."],e:["Contrataci\xF3n|Contrato|Organigrama|Comprobante de notificaci\xF3n (p. ej. correo)","Contracting|Contract|Organization chart|Proof of notification, e.g. e-mail"]},{id:"4.1",ph:4,a:[1,1,1],q:["\xBFLos datos son completos, exactos y consistentes para permitir modelado, prueba y validaci\xF3n confiables?","Is the data provided complete, accurate and consistent to enable trustworthy modeling, testing and validation?"],r:["Una vez recopilados, se verifica: completitud (datos suficientes, huecos identificados), unicidad (cada dato identificable, duplicados detectados), consistencia (rangos de valores, formatos) y l\xEDmites de calidad de los datos definidos y documentados.","Once collected, the following are checked: completeness (sufficient data, gaps identified), uniqueness (each data point identifiable, duplicates recognized), consistency (value ranges, formats) and data quality limits defined and documented."],e:["Informe de inspecci\xF3n con resultado|Definici\xF3n de l\xEDmites de calidad de los datos|Verificaciones autom\xE1ticas en la recopilaci\xF3n o procesamiento","Inspection report with result|Definition of the quality limits of the data|Automated checks during data collection or processing"]},{id:"4.2",ph:4,a:[0,0,1],q:["\xBFSe asegur\xF3 que los datos son justos y representativos y que el sesgo relevante se reduce a un nivel aceptable?","Has it been ensured that the data is fair and representative and that relevant bias is reduced to an acceptable level?"],r:["An\xE1lisis de sesgo realizado y documentado; los conjuntos de datos representan a la poblaci\xF3n objetivo (distribuciones documentadas); medidas de reducci\xF3n de sesgo definidas e implementadas; m\xE9tricas de equidad definidas y cumplidas.","A bias analysis has been carried out and documented; datasets represent the target population (distributions documented); bias-reduction measures defined and implemented; fairness metrics defined and fulfilled."],e:["Informe de an\xE1lisis con resultados|Medidas con responsables, fechas y estatus|Efectividad de las medidas|Definici\xF3n de m\xE9tricas de equidad","Analysis report with results|Measures with responsibilities, deadline and status|Effectiveness of measures taken|Definition of fairness metrics"]},{id:"4.3",ph:4,a:[0,1,1],q:["\xBFLos pasos de preparaci\xF3n de datos son reproducibles, trazables y t\xE9cnicamente correctos?","Are the data preparation steps reproducible, traceable and correct from a technical point of view?"],r:["Todos los cambios al conjunto de datos se registran de forma trazable; hay an\xE1lisis de valores at\xEDpicos evaluados; la selecci\xF3n y generaci\xF3n de caracter\xEDsticas (features) est\xE1 justificada y documentada.","All changes to the dataset are recorded traceably; outlier analyses are in place and evaluated; feature selection and generation are justified and documented."],e:["Documentaci\xF3n de cambios|Resultado del an\xE1lisis de at\xEDpicos|Documentaci\xF3n de selecci\xF3n y generaci\xF3n de caracter\xEDsticas","Documentation of changes|Result of outlier analysis|Documentation regarding feature selection and generation"]},{id:"4.4",ph:4,a:[0,0,1],q:["\xBFSe consideraron los aspectos de procesamiento de datos y los cr\xEDticos para la seguridad?","Have data processing and security-critical aspects been taken into account?"],r:["Los datos cr\xEDticos para la seguridad, con referencia a caracter\xEDsticas especiales (IATF 16949), se aseguran con medidas de prueba especiales.","Safety-critical data with reference to special characteristics (see IATF 16949) are secured with special test measures."],e:["Lista de caracter\xEDsticas especiales seg\xFAn IATF 16949|Medidas con responsable, fecha y estatus|Efectividad de las medidas","List of special characteristics according to IATF 16949|Documentation of measures with responsibility, deadline and status|Effectiveness of measures taken"]},{id:"5.1",ph:5,a:[1,1,1],q:["\xBFEl entrenamiento est\xE1 configurado de forma determinista y es reproducible?","Is the training deterministically configured and reproducible?"],r:["Procesos deterministas implementados (p. ej. gesti\xF3n de semillas/seed). Entrenamiento validado de forma reproducible en distintos entornos de desarrollo; reproducibilidad y trazabilidad aseguradas (almacenar hiperpar\xE1metros, documentaci\xF3n asistida por herramientas).","Deterministic processes implemented (e.g. seed management). Training reproducibly validated on different development environments; reproducibility and traceability ensured (storing hyperparameters, tool-supported documentation)."],e:["Resultado de pruebas|Documentaci\xF3n de hiperpar\xE1metros","Result of tests|Documentation of hyperparameters"],g:["IA generativa: estos requisitos no pueden implementarse; se requieren medidas adicionales (monitoreo y pruebas).","Generative AI: these requirements cannot be implemented; additional measures (monitoring, testing) are required."]},{id:"5.2",ph:5,a:[0,1,1],q:["\xBFExiste una calibraci\xF3n del modelo que refleje las incertidumbres?","Is there a model calibration in place that reflects the uncertainties?"],r:["Se aplicaron y documentaron m\xE9todos de calibraci\xF3n adecuados; se evalu\xF3 la incertidumbre de las predicciones; la calibraci\xF3n se revisa y actualiza peri\xF3dicamente.","Suitable calibration methods applied and documented; prediction uncertainties evaluated; calibration regularly checked and updated."],e:["M\xE9todos de calibraci\xF3n (escalado de Platt/temperatura/matriz, regresi\xF3n isot\xF3nica, label smoothing)|Evaluaci\xF3n de la incertidumbre de predicci\xF3n|Documentaci\xF3n de la calibraci\xF3n","Calibration methods such as flat/temperature/matrix scaling, isotonic regression, label smoothing|Evaluation of the prediction uncertainty|Documentation of the calibration"],g:["IA generativa: no implementable; medidas adicionales de monitoreo y prueba.","Generative AI: not implementable; additional monitoring and testing measures."]},{id:"5.3",ph:5,a:[0,0,1],q:["\xBFEl entrenamiento est\xE1 completamente documentado, incluidos procedimientos, l\xEDmites de desempe\xF1o y restricciones?","Is the training fully documented, including procedures, performance limits and restrictions?"],r:["Procedimientos de entrenamiento y prueba adecuados y resultados documentados; m\xE9tricas de desempe\xF1o y sus l\xEDmites documentados; limitaciones y riesgos conocidos descritos expl\xEDcitamente.","Suitable training and test procedures are in place and results documented; performance metrics and limits documented; known limitations and risks explicitly described."],e:["Instrucciones de procedimiento|M\xE9tricas de desempe\xF1o|Evaluaci\xF3n de riesgos|Descripci\xF3n del \xE1rea de aplicaci\xF3n|Especificaci\xF3n","Procedural instructions|Performance metrics|Risk assessment|Description of the application area|Specification"],g:["IA generativa: no implementable; medidas adicionales de monitoreo y prueba.","Generative AI: not implementable; additional monitoring and testing measures."]},{id:"6.1",ph:6,a:[0,0,1],q:["\xBFEl concepto del modelo asegura explicabilidad e interpretabilidad para las partes interesadas relevantes?","Does the model concept ensure explainability and interpretability for relevant stakeholders?"],r:["Los requisitos de explicabilidad se verifican y cumplen; los m\xE9todos de interpretabilidad (p. ej. SHAP, LIME) est\xE1n especificados y documentados; las caracter\xEDsticas cr\xEDticas y su influencia se presentan de forma trazable.","Explainability requirements are checked and fulfilled; interpretability methods (e.g. SHAP, LIME) specified and documented; critical features and their influence are traceably presented."],e:["Lista de requisitos de explicabilidad (seguridad, EU AI Act)|Lista de caracter\xEDsticas cr\xEDticas","List of explainability requirements (e.g. safety, EU AI Act)|List of critical features"]},{id:"6.2",ph:6,a:[0,1,1],q:["\xBFExisten m\xE9tricas de reproducibilidad, equidad del sistema, monitoreo, cumplimiento legal y RGPD para las pruebas de IA?","Are there metrics in place for reproducibility, system fairness, monitoring, legal compliance and GDPR compliance of the AI tests?"],r:["M\xE9tricas de desempe\xF1o cuantificables para procedimientos supervisados y no supervisados, validadas con conjuntos de referencia. An\xE1lisis detallado de sesgo del modelo en grupos definidos (cobertura de datos y tama\xF1os de muestra verificados); m\xE9tricas de equidad registradas y evaluadas; proceso de evaluaci\xF3n estandarizado con visualizaci\xF3n de disparidades y revisi\xF3n por pares.","Clear quantifiable performance metrics for supervised and unsupervised procedures validated on benchmark datasets. Detailed bias analysis of the model on clearly defined groups (data coverage and sample sizes checked); fairness metrics recorded and evaluated; standardized evaluation with visualization of group disparities and peer review."],e:["M\xE9tricas F1, precisi\xF3n, recall, exactitud|M\xE9tricas no supervisadas (silhouette, Davies-Bouldin)|Resultado del an\xE1lisis de sesgo del modelo|M\xE9tricas de equidad (disparate impact, paridad demogr\xE1fica, equalized odds\u2026)|Resultado de la evaluaci\xF3n|Participantes de la revisi\xF3n por pares","Metrics such as F1, precision, recall, accuracy|Metrics for unsupervised procedures such as silhouette, Davies-Bouldin|Result of the bias analysis of the model|Fairness metrics (disparate impact, demographic parity gap, equalized odds\u2026)|Result of the evaluation|Participants of the peer review"]},{id:"6.3",ph:6,a:[0,1,1],q:["\xBFLas pruebas de robustez, casos l\xEDmite y sensibilidad son sistem\xE1ticas, medibles y documentadas?","Are robustness, edge case and sensitivity tests systematic, measurable and documented?"],r:["An\xE1lisis de sensibilidad estandarizados con KPIs medibles; pruebas de casos l\xEDmite con entradas extremas realizadas y evaluadas.","Standardized sensitivity analyses systematically introduced with measurable KPIs; edge-case tests under extreme inputs carried out and evaluated."],e:["Definici\xF3n de KPIs y criterios de aceptaci\xF3n|Informes de pruebas y an\xE1lisis","Definition of KPIs and acceptance criteria|Reports of tests and analyses"]},{id:"6.4",ph:6,a:[0,0,1],q:["\xBFExisten pruebas, KPIs e informes que aseguren equivalencia funcional, consistencia y cumplimiento?","Are tests, KPIs and reports in place to ensure functional equivalence, consistency and compliance?"],r:["Las pruebas demuestran la equivalencia funcional del modelo con conjuntos entrada/salida definidos, si existen o es factible; los KPIs de consistencia (desviaci\xF3n, tasa de error, tiempos de respuesta) se monitorean continuamente y est\xE1n dentro de tolerancias.","Tests demonstrate functional equivalence of the AI model using clearly defined input/output sets where available/feasible; consistency KPIs (deviation, error rate, response times) are continuously monitored and within defined tolerances."],e:["Definici\xF3n de KPIs y criterios de aceptaci\xF3n|Seguimiento de KPIs|Informes de pruebas y an\xE1lisis","Definition of KPIs and acceptance criteria|KPI tracking|Reports of tests and analyses"]},{id:"6.5",ph:6,a:[0,0,1],q:["\xBFLas respuestas incorrectas en sistemas con IA generativa se reducen a un nivel aceptable?","Are incorrect responses in systems with generative AI reduced to an acceptable level?"],r:["Pruebas especiales de creatividad, consistencia y plausibilidad (benchmarking) integradas para IA generativa; verificaci\xF3n adicional del contenido generado por estereotipos o prejuicios no intencionales (sesgo). (Aplica solo si el sistema usa IA generativa.)","Special tests for creativity, consistency and plausibility (benchmarking) integrated for generative AI; additional check of generated content for stereotypes or unintentional prejudice (bias). (Applies only if the system uses generative AI.)"],e:["Definici\xF3n de KPIs y criterios de aceptaci\xF3n|Seguimiento de KPIs|Informes de pruebas y an\xE1lisis","Definition of KPIs and acceptance criteria|KPI tracking|Reports of tests and analyses"]},{id:"7.1",ph:7,a:[1,1,1],q:["\xBFSe consideraron los temas de seguridad TI y ciberseguridad?","Have IT security and cyber security issues been taken into account?"],r:["Donde sea necesario, hay medidas para asegurar integridad, robustez y ciberseguridad del sistema o aplicaci\xF3n de IA durante todo su ciclo de vida; se involucra a ciberseguridad si hay riesgo. Riesgos posibles: inyecci\xF3n de prompts, envenenamiento de datos, evasi\xF3n (circumvention), extracci\xF3n del modelo, inferencia de pertenencia, divulgaci\xF3n de informaci\xF3n sensible, denegaci\xF3n de servicio al modelo, vulnerabilidades de la cadena de suministro y exceso de confianza (over-reliance) en LLMs.","Where necessary, measures ensure integrity, robustness and general cybersecurity of the AI system/application against attacks throughout its life cycle; cybersecurity officers involved where there is an AI security risk. Possible risks: prompt injection, data poisoning, circumvention, model extraction, inference, sensitive information disclosure, model denial of service, supply chain vulnerabilities, over-reliance on LLMs."],e:["An\xE1lisis de riesgos de ciberseguridad","Cybersecurity risk analysis"]},{id:"7.2",ph:7,a:[1,1,1],q:["\xBFSe elabor\xF3 y acord\xF3 un concepto operativo con escalamiento y contingencia?","Has an operational concept including escalation and contingency concepts been drawn up and agreed?"],r:["Concepto operativo para el uso planeado: procesos de escalamiento y contingencia ante incidentes; plan de soporte y mantenimiento; responsables (RASIC) y contratos con proveedores; estrategia de actualizaci\xF3n; concepto de monitoreo; canal de retroalimentaci\xF3n; condiciones de rollback; traspaso a proveedores de servicio; documentaci\xF3n del estado al momento de la aprobaci\xF3n como referencia; disponibilidad de licencias.","Operational concept for the planned use: escalation and contingency for incidents; support and maintenance plan; responsible persons (RASIC) and supplier contracts; update strategy; monitoring concept; feedback channel; rollback conditions; handover to service providers; documentation of status at approval as reference; licence availability."],e:["Concepto operativo acordado|Programas de mantenimiento|Planes de contingencia|Responsabilidades|Autorizaciones","Agreed operating concept|Maintenance schedules|Contingency plans|Responsibilities|Authorizations"]},{id:"7.3",ph:7,a:[0,1,1],q:["\xBFEst\xE1 planeado un proceso de despliegue (rollout) seguro?","Is a secure rollout process planned?"],r:["Existe un proceso de rollout que considera la infraestructura TI del sistema en vivo (incluida la protecci\xF3n de la nube contra fuga o p\xE9rdida de datos) y el concepto de capacitaci\xF3n.","A rollout process is created considering the IT infrastructure of the live system (including protection of the cloud against data outflow/loss) and the training concept."],e:["Planeaci\xF3n del rollout|Responsabilidades|Autorizaciones|Planeaci\xF3n de infraestructura TI|Capacitaci\xF3n","Rollout planning|Responsibilities|Authorizations|IT infrastructure planning|Training"]},{id:"8.1",ph:8,a:[0,0,1],q:["\xBFSe defini\xF3 e implement\xF3 un plan de gesti\xF3n de accesos e identidades para el sistema de IA, la aplicaci\xF3n y los conjuntos de datos?","Has an access and identity management plan been defined and implemented for the AI system, the AI application and relevant datasets?"],r:["Derechos de acceso e identidad definidos e implementados considerando roles, aplicaci\xF3n de IA, conjuntos de datos y documentaci\xF3n (qui\xE9n accede a datos de entrenamiento, nivel de confidencialidad, qui\xE9n modifica hiperpar\xE1metros o entrena). Debe asegurarse el cumplimiento del RGPD.","Access rights and identity management defined and implemented, covering roles, AI application, datasets and documentation (who accesses training data, confidentiality level, who modifies hyperparameters or conducts training). GDPR requirements must be ensured."],e:["Resumen de roles y personas|Responsabilidades|Autorizaciones|Ejemplos de derechos de acceso","Overview of roles and persons|Responsibilities|Authorizations|Examples of access rights and identity management"]},{id:"8.2",ph:8,a:[0,0,1],q:["\xBFSe cre\xF3 la documentaci\xF3n de datos, algoritmo, hardware y software y est\xE1 asegurado el versionado?","Has the documentation for data, algorithm, hardware and software been created and is versioning ensured?"],r:["Documentaci\xF3n completa de datos, algoritmos, hardware y software, incluidas versiones del c\xF3digo y paquetes de la soluci\xF3n final en operaci\xF3n; alcance seg\xFAn la evaluaci\xF3n de riesgos y la capacidad de recrear la soluci\xF3n; la versi\xF3n operativa vigente documentada para cada periodo.","Documentation of data, algorithms, hardware and software complete, including versions of code and packages of the final solution in operation; scope depends on the risk assessment and ability to recreate the solution; the current operational version documented for each period."],e:["Origen y caracter\xEDsticas de los conjuntos de datos (hojas de datos)|Arquitectura o grafo del modelo|Datos de entrada y salida esperados|Precisi\xF3n de par\xE1metros|Requisitos de hardware|M\xE9todo de entrenamiento|Arquitectura del sistema y flujo de informaci\xF3n","Data origin and characteristics (structured data sheets)|Architecture or model graph|Expected input and output data|Parameter accuracy|Hardware requirements|Training method|System architecture and information flow"]},{id:"9.1",ph:9,a:[1,1,1],q:["\xBFEl sistema de IA cumple el \xE1rea de aplicaci\xF3n planeada?","Is the planned application area fulfilled by the AI system?"],r:["Se determina si y c\xF3mo el sistema cumple las funciones y objetivos planeados (ver 1.1), con conjuntos de datos independientes de los de prueba y verificaci\xF3n; los resultados se comparan con los planeados y se eval\xFAan.","It is determined whether and how the AI system fulfills the planned functions and objectives (see 1.1), using datasets independent of test and verification data; results are compared with planned results and evaluated."],e:["Resultados de pruebas|Informes|Evaluaci\xF3n de desviaciones","Test results|Reports|Assessment of deviations"]},{id:"9.2",ph:9,a:[0,1,1],q:["\xBFQu\xE9 tan robusto reacciona el sistema bajo cargas extremas? \xBFEst\xE1n definidos y monitoreados los l\xEDmites del sistema?","How robustly does the AI system react under extreme loads? Are system limits defined and monitored?"],r:["Pruebas de estr\xE9s documentadas: estr\xE9s de infraestructura, desempe\xF1o del modelo en condiciones extremas, casos l\xEDmite y ejemplos adversarios dise\xF1ados para confundir al modelo.","Stress tests are documented: infrastructure stress, model performance under extreme conditions, borderline/edge cases and adversarial examples designed to confuse the model."],e:["Resultados de pruebas|Evaluaci\xF3n de robustez","Test results|Assessment of robustness"]},{id:"9.3",ph:9,a:[0,1,1],q:["\xBFSe verifica el desempe\xF1o en condiciones normales con diferentes m\xE9todos de prueba?","Is the performance of the AI system verified under normal conditions and taking into account different test methods?"],r:["Planes de prueba creados e implementados: pruebas supervisadas, no supervisadas y comparaci\xF3n con sistemas de referencia; las desviaciones se atienden.","Test plans created and implemented: supervised testing, unsupervised testing, comparison with reference systems; deviations addressed."],e:["Planes de prueba con criterios de aceptaci\xF3n|Resultados de pruebas|Medidas con responsables, fechas y estatus","Test plans with acceptance criteria|Test results|Measures with responsibilities, deadlines and status"]},{id:"9.4",ph:9,a:[0,0,1],q:["\xBFLos resultados de verificaci\xF3n de cada versi\xF3n del sistema est\xE1n documentados de forma completa, trazable y auditable?","Are verification results for each AI system version documented in a complete, traceable and auditable manner?"],r:["Documentaci\xF3n completa y auditable de todos los resultados de verificaci\xF3n, m\xE9tricas, actividades de explicabilidad y de equidad.","Complete, auditable documentation available for all verification results, metrics, explanation activities and fairness activities."],e:["Documentaci\xF3n de los resultados de verificaci\xF3n, p. ej. en una tarjeta de modelo (model card)","Documentation of the verification results, e.g. in a model card"]},{id:"10.1",ph:10,a:[1,1,1],q:["\xBFSe transfiri\xF3 la responsabilidad del sistema de IA al cliente?","Has responsibility for the AI system been transferred to the customer?"],r:["Se informa al cliente sobre el uso de IA seg\xFAn el enfoque de la empresa y los requisitos legales; el traspaso cumple los requisitos de transparencia del EU AI Act y entrega informaci\xF3n clara sobre funcionalidad, limitaciones y riesgos; se acuerdan procedimientos de soporte. Si las salidas se reutilizan, el uso por el cliente debe cubrirse en la especificaci\xF3n.","Customer informed about the use of AI per company focus and legal requirements; handover meets EU AI Act transparency requirements and gives clear information on functionality, limitations and risks; support procedures agreed. If AI outputs are reused, the customer's use must be covered by the specification."],e:["Documentaci\xF3n del sistema de IA|Documentaci\xF3n del traspaso de responsabilidad (contrato, acta de entrega)","Documentation of the AI system|Documentation of transfer of responsibility, e.g. by contract, handover report"]},{id:"11.1",ph:11,a:[0,1,1],q:["\xBFEst\xE1 establecido el monitoreo de datos?","Has data monitoring been set up?"],r:["Hay un proceso activo de monitoreo de datos de las salidas del sistema; m\xE9tricas de calidad de datos, valores objetivo y mecanismos de acciones correctivas ante desviaciones definidos.","A data monitoring process for the system's outputs is in place and active; metrics for data quality, target values and corrective mechanisms for deviations are defined."],e:["Descripci\xF3n del proceso|Definici\xF3n de KPIs y metas","Process description|Definition of KPIs and targets"]},{id:"11.2",ph:11,a:[0,0,1],q:["\xBFEst\xE1 establecido el monitoreo del modelo?","Has model monitoring been set up?"],r:["Hay un proceso activo de monitoreo del modelo; m\xE9tricas de calidad del modelo, valores objetivo y mecanismos correctivos ante desviaciones definidos.","A model monitoring process is in place and active; metrics for model quality, target values and corrective mechanisms for deviations are defined."],e:["Descripci\xF3n del proceso|Definici\xF3n de KPIs y metas","Process description|Definition of KPIs and targets"]},{id:"11.3",ph:11,a:[0,1,1],q:["\xBFEst\xE1 establecido el monitoreo del desempe\xF1o del entorno de ejecuci\xF3n en operaci\xF3n real?","Has performance monitoring been set up for the runtime environment in live operation?"],r:["Hay un proceso activo de monitoreo del desempe\xF1o del entorno de ejecuci\xF3n; m\xE9tricas, valores objetivo y mecanismos correctivos definidos.","A performance monitoring process for the runtime environment is in place and active; performance metrics, target values and corrective mechanisms are defined."],e:["Descripci\xF3n del proceso|Definici\xF3n de KPIs y metas","Process description|Definition of KPIs and targets"]},{id:"11.4",ph:11,a:[0,1,1],q:["\xBFEst\xE1 establecido un sistema de gesti\xF3n de cambios?","Has a change management system been set up?"],r:["Los cambios al sistema operativo de IA siguen un proceso de cambios definido y un plan de rollout; siempre es posible volver a la versi\xF3n anterior (rollback).","Changes to the operational AI system follow a defined change process and rollout plan; a rollback to the previous version is possible at any time."],e:["Descripci\xF3n del proceso|Procedimiento definido de rollback|Roles y autorizaciones","Process description|Defined procedure for rollback|Roles and authorizations"]},{id:"11.5",ph:11,a:[0,1,1],q:["\xBFExiste un procedimiento de monitoreo y de reentrenamiento/actualizaci\xF3n?","Is a monitoring and retraining/update procedure in place?"],r:["Se define o estima con qu\xE9 frecuencia cambia el proceso y cada cu\xE1ndo se prueba o actualiza el modelo; se verifica que los datos de entrada sigan en la distribuci\xF3n definida. Actualizar = reentrenar o reemplazar el modelo, normalmente si cambian la base de datos o el sistema: entorno de c\xF3mputo/sistema de medici\xF3n, firmware de la m\xE1quina, nuevas tecnolog\xEDas, cambio de KPIs, mejoras de seguridad/privacidad por nuevos requisitos.","Define or estimate how often the process changes and how often the model is updated/tested; check that input data is still in the defined distribution. Updating = retraining or replacing the model, usually when the database or system changed: computing environment/measurement system, machine firmware, new technologies, KPI changes, security/privacy enhancements due to new requirements."],e:["Descripci\xF3n del proceso|Procedimiento definido de rollback|Roles y autorizaciones","Process description|Defined procedure for rollback|Roles and authorizations"],g:["IA generativa: requiere estrategias de reentrenamiento y monitoreo de degradaci\xF3n.","Generative AI: requires retraining strategies and degradation monitoring."]}],risk:[{n:1,g:["Regulaci\xF3n de IA","AI regulations"],l:{3:["Sistema de alto riesgo seg\xFAn EU AI Act (con mecanismos de control establecidos o requisitos de homologaci\xF3n), u otros mercados con altos requisitos regulatorios","High-risk AI system under the EU AI Act (with established control mechanisms or homologation requirements), or other markets with high regulatory requirements"],2:["Requisitos regulatorios moderados y/o GPAI: obligaciones de transparencia del Art. 50 del EU AI Act","Moderate regulatory requirements and/or GPAI: transparency obligations under EU AI Act Art. 50"],1:["Bajos requisitos regulatorios: no es de alto riesgo ni tiene requisitos especiales (ver Art. 95)","Low regulatory requirements: not high-risk and no special requirements (see Art. 95)"]}},{n:2,g:["Protecci\xF3n de datos","Data protection law"],l:{3:["Datos personales y sensibles, o que requieren alta protecci\xF3n, o datos de terceros cuyos derechos podr\xEDan violarse","Personal and sensitive data, data requiring a high level of protection, or third-party data whose rights could be violated"],2:["Datos seudonimizados: riesgo bajo por medidas t\xE9cnicas y organizativas","Pseudonymized data: low risk due to technical and organizational measures"],1:["No se procesan datos personales ni sensibles: solo datos anonimizados o sint\xE9ticos","No personal or sensitive data processed: only anonymized or synthetic data"]}},{n:3,g:["Sesgo y equidad","Bias & fairness"],l:{3:["Se viola la equidad o hay sesgo indeseable: es muy probable que ocurra sesgo","Fairness is violated or undesirable bias exists: bias will most likely occur"],2:["La equidad podr\xEDa violarse: puede ocurrir sesgo, pero hay procesos de detecci\xF3n y correcci\xF3n","Fairness may be violated: bias may occur, but there are processes for detection and correction"],1:["Sin evidencia relevante de sesgo: datos de entrenamiento y modelo con sesgo aceptable","No relevant evidence of bias: training data and model have an acceptable bias"]}},{n:4,g:["Transparencia","Transparency"],l:{3:["Mayormente caja negra, no explicable: decisiones importantes en gran parte no trazables","Largely black box, not explainable: important decisions largely untraceable"],2:["Parcialmente explicable, con aspectos de caja negra: algunas decisiones no son trazables","Partially explainable, some black-box aspects: some decisions not traceable"],1:["Modelo en gran parte explicable y documentado: todas las decisiones son trazables","Model largely explainable and documented: all decisions are traceable"]}},{n:5,g:["Riesgo financiero","Financial risk"],l:{3:["Altas p\xE9rdidas econ\xF3micas por salidas incorrectas o falla de procesos de negocio (costos considerables)","High economic losses due to incorrect outputs or failure of business processes (considerable costs)"],2:["Impacto econ\xF3mico moderado: los errores generan mayores costos, sin p\xE9rdidas cr\xEDticas","Moderate economic impact: errors lead to increased costs, but no critical losses"],1:["Bajo impacto econ\xF3mico: las decisiones incorrectas generan costos adicionales amortiguados por procesos","Low economic impact: incorrect decisions lead to additional costs cushioned by processes"]}},{n:6,g:["Riesgo reputacional","Reputational risk"],l:{3:["Incidente de alto perfil con p\xE9rdida de confianza: esc\xE1ndalo o discriminaci\xF3n con da\xF1o reputacional masivo","High-profile incident with loss of confidence: scandal or discrimination causing massive reputational damage"],2:["Riesgo reputacional moderado: partes afectadas se involucran; da\xF1o limitado y mitigable con comunicaci\xF3n abierta","Moderate reputational risk: affected stakeholders are brought on board; limited damage, mitigable through open communication"],1:["Riesgo reputacional nulo o bajo: uso solo interno, sin impacto externo esperado","No relevant or low reputational risk: internal use only, no external impact expected"]}},{n:7,g:["Caracter\xEDsticas del producto","Product characteristics"],l:{3:["Alto: seguridad funcional ASIL D/C, ISO 21448 tipo 3/4, caracter\xEDstica especial o componentes con comunicaci\xF3n activa (requisitos de ciberseguridad)","High: functional safety ASIL D/C, ISO 21448 type 3/4, special characteristic or components with active communication (CS requirements)"],2:["Medio: ASIL B/A, ISO 21448 tipo 2, no es caracter\xEDstica especial y baja relevancia de ciberseguridad","Medium: ASIL B/A, ISO 21448 type 2, not a special characteristic, low CS relevance"],1:["Bajo: ASIL QM, ISO 21448 tipo 1, no es caracter\xEDstica especial y sin relevancia de ciberseguridad","Low: ASIL QM, ISO 21448 type 1, not a special characteristic, no CS relevance"]}}]},KAI="hpm_lobby_ai_v1",aiDef=()=>({tab:1,ph:1,sys:"",use:"",owner:"",gen:!1,risk:{},ans:{}});let AI=ld(KAI,aiDef());const saveAI=()=>{sv(KAI,AI),cloudPush("ai",AI)},AIC={1:"#16834E",2:"#C87F0A",3:"#D7263D"},aiRC=()=>{const v=Object.keys(AI.risk).map(k=>+AI.risk[k]).filter(Boolean);return{n:v.length,cls:v.length?Math.max.apply(null,v):null,done:v.length===7}},aiApp=(it,c)=>c?!!it.a[c-1]:!0;function aiCalc(){const rc=aiRC(),R2={rc,items:AID.items.filter(i=>aiApp(i,rc.cls)),ok:0,no:0,na:0,pend:0,phs:[],find:[],nas:[],pendL:[]};return R2.items.forEach(i=>{const s=(AI.ans[i.id]||{}).s;s==="ok"?R2.ok++:s==="no"?(R2.no++,R2.find.push(i)):s==="na"?(R2.na++,R2.nas.push(i)):(R2.pend++,R2.pendL.push(i))}),Object.keys(AID.ph).forEach(p=>{const l=R2.items.filter(i=>i.ph==+p);let ok=0,no=0,na=0;l.forEach(i=>{const s=(AI.ans[i.id]||{}).s;s==="ok"?ok++:s==="no"?no++:s==="na"&&na++}),R2.phs.push({p:+p,n:l.length,ok,no,na,ev:ok+no,pct:ok+no?Math.round(ok/(ok+no)*100):null})}),R2.pct=R2.ok+R2.no?Math.round(R2.ok/(R2.ok+R2.no)*100):null,R2.done=R2.ok+R2.no+R2.na,R2}const aiClsTxt=c=>c?{1:x("AIQM-1 \xB7 Riesgo bajo","AIQM-1 \xB7 Low risk","AIQM-1 \xB7 \uB0AE\uC740 \uB9AC\uC2A4\uD06C"),2:x("AIQM-2 \xB7 Riesgo moderado","AIQM-2 \xB7 Moderate risk","AIQM-2 \xB7 \uC911\uAC04 \uB9AC\uC2A4\uD06C"),3:x("AIQM-3 \xB7 Riesgo alto","AIQM-3 \xB7 High risk","AIQM-3 \xB7 \uB192\uC740 \uB9AC\uC2A4\uD06C")}[c]:x("Sin clasificar","Not classified","\uBBF8\uBD84\uB958"),aiPh=p=>cx(AID.ph[p][0],AID.ph[p][1]);function aiView(){const v=$("view-ai"),R2=aiCalc(),rc=R2.rc,tabs=[x("Sistema de IA","AI system","AI \uC2DC\uC2A4\uD15C"),x("Paso 1 \xB7 Clase de riesgo","Step 1 \xB7 Risk class","1\uB2E8\uACC4 \xB7 \uB9AC\uC2A4\uD06C \uB4F1\uAE09"),x("Paso 2 \xB7 Evaluaci\xF3n","Step 2 \xB7 Assessment","2\uB2E8\uACC4 \xB7 \uD3C9\uAC00"),x("Resultado","Result","\uACB0\uACFC")];let h=modHead({t:x("Auditor\xEDa VDA \xB7 IA en la Gesti\xF3n de Calidad","VDA Audit \xB7 AI in Quality Management","VDA \uC2EC\uC0AC \xB7 \uD488\uC9C8\uACBD\uC601\uC758 AI"),s:x("Volumen Amarillo VDA 1.\xAA ed. 2026 \xB7 Clase de riesgo AIQM \xB7 37 requisitos en 11 fases","VDA Yellow Volume 1st ed. 2026 \xB7 AIQM risk class \xB7 37 requirements in 11 phases","VDA \uC610\uB85C \uBCFC\uB968 2026 \uCD08\uD310 \xB7 AIQM \uB9AC\uC2A4\uD06C \uB4F1\uAE09 \xB7 11\uB2E8\uACC4 37\uAC1C \uC694\uAD6C\uC0AC\uD56D"),eye:x("VDA \xB7 IA en QM","VDA \xB7 AI in QM","VDA \xB7 QM\uC758 AI"),ti:x("Aprobar un sistema de IA con criterio de calidad","Approving an AI system with a quality mindset","\uD488\uC9C8 \uAD00\uC810\uC758 AI \uC2DC\uC2A4\uD15C \uC2B9\uC778"),de:x("Paso 1: clase de riesgo del proyecto (7 grupos, gana el m\xE1s alto). Paso 2: requisitos por fase con su evidencia esperada, aplicables seg\xFAn la clase; cumple / no cumple / n.a. con justificaci\xF3n.","Step 1: project risk class (7 groups, highest wins). Step 2: requirements per phase with expected evidence, applicable by class; met / not met / n.a. with justification.","1\uB2E8\uACC4: \uD504\uB85C\uC81D\uD2B8 \uB9AC\uC2A4\uD06C \uB4F1\uAE09(7\uAC1C \uADF8\uB8F9, \uCD5C\uACE0 \uB4F1\uAE09 \uC801\uC6A9). 2\uB2E8\uACC4: \uB4F1\uAE09\uBCC4 \uC801\uC6A9 \uC694\uAD6C\uC0AC\uD56D\uACFC \uAE30\uB300 \uC99D\uBE59; \uCDA9\uC871 / \uBBF8\uCDA9\uC871 / \uD574\uB2F9\uC5C6\uC74C(\uC0AC\uC720)."),tabs,cur:AI.tab,act:"aitab"})+'<div class="wrapm">';if(AI.tab===1&&(h+=profHTML().replace("__EXTRA__",`<div><label class="f">${x("Sistema de IA evaluado","AI system assessed","\uD3C9\uAC00 \uB300\uC0C1 AI \uC2DC\uC2A4\uD15C")}</label><input type="text" data-s="ai" data-k="sys" value="${esc(AI.sys)}"></div><div><label class="f">${x("Responsable / due\xF1o del sistema","System owner","\uC2DC\uC2A4\uD15C \uCC45\uC784\uC790")}</label><input type="text" data-s="ai" data-k="owner" value="${esc(AI.owner)}"></div>`),h+=`<div class="card"><h3>2. ${x("Uso previsto","Intended use","\uC0AC\uC6A9 \uBAA9\uC801")}</h3><label class="f">${x("Descripci\xF3n del caso de uso y su objetivo medible","Use-case description and its measurable goal","\uC0AC\uC6A9 \uC0AC\uB840 \uBC0F \uCE21\uC815 \uAC00\uB2A5\uD55C \uBAA9\uD45C")}</label><textarea data-s="ai" data-k="use">${esc(AI.use)}</textarea>
