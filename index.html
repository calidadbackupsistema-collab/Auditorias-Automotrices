     - Criterios de operaci\xF3n y resultados del sistema de reconocimiento a actividades preventivas y casos sobresalientes de mejora`}],prof:{sup:"\u321C\uD604\uB300\uD3EC\uB9AC\uD14D",supCode:"#1407",ind:"PL\uC0AC\uCD9C",siteCode:"#140701",ceo:"",addr:"",lead:"",leadCode:"RFP4",evType:"\uC0AC\uD6C4\uD3C9\uAC00(\uC678\uBD80)",round:"2\uCC28",team:"\uC790\uB3D9\uCC28 \uAD6C\uB9E4\uD300",certs:[["\uBCF8\uC0AC","\uACE0\uBB34 \uC131\uD615","2026.03.24","B","\uBCF4\uC26C\uC804\uC7A5"],["\uBCF8\uC0AC","\uC804\uAE30 \uC870\uB9BD","2026.02.12","B","\uB9CC\uB3C4 \uC6D0\uC8FC\uACF5\uC7A5"],["2\uACF5\uC7A5","\uACE0\uBB34 \uC131\uD615","2026.04.21","B","\uB9CC\uB3C4 \uC775\uC0B0\uACF5\uC7A5"],["\uBCF8\uC0AC","PL \uC0AC\uCD9C","2025.07.18","G","\uB9CC\uB3C4 \uC775\uC0B0\uACF5\uC7A5"],["2\uACF5\uC7A5","\uC804\uCC29 \uB3C4\uC7A5","2026.05.27","A","\uD55C\uC628\uC2DC\uC2A4\uD15C"],["","","","",""],["","","","",""]],hist:[["1975","\uD604\uB300\uD2B9\uC218\uACE0\uBB34 \uCC3D\uB9BD ('01 \uC0C1\uD638\uBCC0\uACBD)",""],["2001","\uC0C1\uD638\uBCC0\uACBD, \uACE0\uBB34\uBD80\uBB38 SQ\uC778\uC99D \uD68D\uB4DD",""],["2004~2007","\uC911\uAD6D('04), \uBBF8\uAD6D('05), \uC778\uB3C4('07) \uBC95\uC778 \uC124\uB9BD",""],["2009","\uC218\uC9C0\uBD80\uBD84 SQ\uC778\uC99D \uD68D\uB4DD",""],["2016","\uBA55\uC2DC\uCF54 \uBC95\uC778 \uC124\uB9BD",""],["2021","\uC0B0\uC5C5\uD1B5\uC0C1\uBD80 \uC6B0\uC218\uAE30\uC5C5\uC5F0\uAD6C\uC18C \uC120\uC815",""],["2022","IATF16949 , ISO9001 , ISO14001 \uC778\uC99D \uAC31\uC2E0",""],["","",""]]}},VDAD=[{id:"P2.1",k:!1,q:"Has a project management strategy (including a project organization) been established?",es:"\xBFSe estableci\xF3 una estrategia de gesti\xF3n de proyecto (incluida la organizaci\xF3n del proyecto)?",rq:["There is a project management process.","An interdisciplinary project organization is specified.","The responsibilities and authorizations of the project leader and team members are defined.","The customer and the supplier have been informed who the contact persons are.","The project organization and the associated escalation management meet the customer requirements.","Escalation criteria (including escalation in supplier management) have been specified, and measures are derived in case of non-compliance with the specifications.","Roles are defined in accordance with the development method or collaboration model (agile or not agile).","Experiences (especially lessons learned) from ongoing or previous projects with a comparable scope of products are taken into account.","Project risks have been identified, assessed, and have been mitigated by means of appropriate measures."],ex:"\uF0B7 The roles, tasks, competences and responsibilities of the project manager/technical experts have been defined \uF0B7 Project interfaces in multi-site projects \uF0B7 Organizational chart for the project \uF0B7 Composition of the project team \uF0B7 Evidence of qualifications \uF0B7 Special customer requirements regarding project management \uF0B7 In case of an agile approach: Definition of the escalation mechanism (e.g. the Scrum Master escalates to the Product Owner) \uF0B7 Contact persons/decisionmakers in the escalation process have been defined \uF0B7 Records of milestone assessments, including measures"},{id:"P2.2",k:!0,q:"Are all resources required for project implementation planned and available, and are changes reported?",es:"\xBFEst\xE1n planificados y disponibles todos los recursos para el proyecto y se reportan los cambios?",rq:["The resource planning takes the customer requirements into account and is based on the project agreement.","Resource planning for project team members has been established and implemented.","The staff workload is taken into account.","A review and (where necessary) an adjustment of the resource planning is carried out when changes occur (deadlines, scope of development performance etc.).","The critical path is given special consideration within the resource planning.","The necessary project budget for personnel and equipment is planned and released.","Changes to the project organization (interface with customer) are reported.","The resources for software-specific activities have been planned."],ex:"\uF0B7 Evidence of resource planning (taking other projects into account) \uF0B7 Resource planning for equipment (e.g. development test stand, inspection and laboratory facilities) \uF0B7 Resource planning by the Scrum Master \uF0B7 Resource planning for integration and tests"},{id:"P2.3",k:!1,q:"Has project management been implemented and is there a project plan that has been agreed upon with the customer?",es:"\xBFSe implement\xF3 la gesti\xF3n del proyecto y existe un plan acordado con el cliente?",rq:["The project plan meets the specific customer requirements.","All internal and customer defined milestones are fully incorporated in the project plan.","A review is carried out at the milestones defined in the project plan to check that all planned activities are carried out and that the required maturity level is reached.","If a statutory authorization procedure for a product is specifically required, the duration of this procedure is included in the project plan.","In-house communication is ensured when changes are made to the project plan.","Changes to the project plan which affect the customer are coordinated with the customer.","Project changes that have an impact on the overall schedule have been taken in account in the escalation process (risk management).","The critical path is generated from the project plan and takes account of the associated delivery items.","Quality-related project activities as well as procurement activities must be part of the project plan.","A separate, detailed plan can be referred to in the project plan.","The plans must take prototypes and pre-launch parts into account.","The scope of software required at the respective times has been planned."],ex:"\uF0B7 Project plan with milestones \uF0B7 Specific customer requirements regarding technologies xand/or product groups \uF0B7 Customer project plan \uF0B7 Customer deadlines \uF0B7 Customer milestones \uF0B7 Targets set by the customer (measurements within the individual milestones) \uF0B7 Milestone assessments (reviews) \uF0B7 QM plan (e.g. from VDA MLA or APQP) \uF0B7 Country-specific certification requirements (ECE, SAE, DOT, CCC, INMETRO, KBA etc.) \uF0B7 Legal and regulatory approval processes relating to critical systems (environmental requirements, among other things) \uF0B7 Release planning regarding basic functions and milestones \uF0B7 Software project plan \uF0B7 Software milestones \uF0B7 Basic Rollout Plan (BROP) \uF0B7 Feature Rollout Plan (FROP) \uF0B7 Planning of the ASPICE assessment, including the definition of levels and the scope in accordance with the agreed customer requirements"},{id:"P2.4",k:!1,q:"Have the quality-related project activities been planned, and are they monitored for compliance?",es:"\xBFLas actividades de calidad del proyecto est\xE1n planificadas y se monitorea su cumplimiento?",rq:["The quality-related project activities meet the specific customer requirements.","Both product and process assurance measures are part of the quality-related activities.","Verification and validation of the product and process requirements are included in the planning.","The planning also addresses critical components and supply items (internal and external suppliers).","The planning is regularly monitored for compliance and for target achievement.","The quality-related activities relevant to software have been taken into account."],ex:"\uF0B7 Project plan \uF0B7 Customer milestones \uF0B7 Customer requirements with regard to quality plans \uF0B7 Quality plan (audits, reviews and VDA MLA) \uF0B7 Customer specifications \uF0B7 Specific software milestones \uF0B7 Reviews, e.g. of code and models \uF0B7 Test case creation and validation (verification?) \uF0B7 KPIs relevant to software (metrics, test coverage, level of test automation, rate of error reduction etc.) \uF0B7 Software-specific assessment planning and assessment levels \uF0B7 SW-Q release \uF0B7 Risk assessments (special characteristics, cyber security)"},{id:"P2.5",k:!1,q:"Are the procurement activities of the project included in the project planning?",es:"\xBFLas actividades de compras est\xE1n incluidas en la planificaci\xF3n del proyecto?",rq:["The supplier selection process and the target dates for contract awards are contained in the project plan for all types of suppliers.","The suppliers of plants, machines, tools, measuring and inspection systems as well as the service providers are integrated in the planning."],ex:"\uF0B7   Project plan \uF0B7   Milestone plan \uF0B7   Make-or-buy decision \uF0B7   Service providers (e.g. development, laboratories, maintenance, software)"},{id:"P2.6",k:!0,q:"Is change management within the project ensured by the project organization?",es:"\xBFLa organizaci\xF3n del proyecto asegura la gesti\xF3n de cambios dentro del proyecto?",rq:["Change management within the project meets the customer\u2019s specific requirements.","Changes (initiated by the supplier, internally or by the customer) must be evaluated.","If necessary, the project plan must be adapted.","This evaluation must include the risk assessment for product quality as well as the deadlines.","Suppliers are actively involved in change management.","It must be ensured that specified design freezes are observed.","Exceptions must be agreed upon between the customer and the supplier and must be documented.","All changes must be documented.","The persons responsible for change management are defined for the customer, internally and to suppliers."],ex:"\uF0B7   Change management \uF0B7   Process description \uF0B7   Schedules \uF0B7   Change forms \uF0B7   Change history for the product and the process \uF0B7   Evaluation of changes \uF0B7   Approvals of changes \uF0B7   Software: Change request, change management \uF0B7   Change due to fault elimination, changes to the architecture and the requirements"},{id:"P3.1",k:!1,q:"Have the product/process-specific requirements been specified?",es:"\xBFSe especificaron los requisitos espec\xEDficos de producto y proceso?",rq:["The functional and non-functional requirements, including the customer\u2019s requirements as well as statutory and regulatory requirements that apply to the product (and software) to be developed as well as to the production process have to be determined.","The organization must identify and take into account the product and process requirements known from previous experience.","Special characteristics must be identified on the basis of the organization\u2019s own requirements, customer requirements, statutory and regulatory requirements, manufacturing technology and characteristics that arise from the purpose/use of the product.","Customer requirements regarding the selection of suppliers or primary materials must be documented.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are available.","The customer\u2019s requirements regarding the documentation and release of Free and Open Source Software (FOSS) must be taken into account."],ex:"Product/process development \uF0B7 Requirements regarding the interfaces between hardware and software (products with integrated/embedded software) \uF0B7 Inquiry and contract documents, including requirement specifications \uF0B7 Traceability concept \uF0B7 Ordering and inspection requirements \uF0B7 Catalog of characteristics/reference samples \uF0B7 Product/process characteristics, including characteristics regarding functional safety \uF0B7 Purchasing conditions \uF0B7 Logistics requirements (packaging, JIT, JIS, on consignment) \uF0B7 Quality agreements, including QM-specific requirements \uF0B7 Schedules \uF0B7 Portals/information platforms on the Internet \uF0B7 Lessons Learned \uF0B7 Environmental aspects, recycling requirements \uF0B7 Capability requirements \uF0B7 Requirements regarding release Product development \uF0B7 Specifications, drawings \uF0B7 Software specifications Process development \uF0B7 Requirements regarding facilities, tools and inspection equipment as well as workplace and test station layout \uF0B7 Requirements regarding handling, packaging, storage and identification \uF0B7 Requirements for identification, configuration and ensuring correct installation of the software"},{id:"P3.2",k:!0,q:"Has the feasibility been comprehensively evaluated according to the product and process requirements?",es:"\xBFSe evalu\xF3 integralmente la factibilidad seg\xFAn los requisitos de producto y proceso?",rq:["ment An interdisciplinary procedure for evaluating feasibility (including potential production locations) must be used.","All determined product/process-specific requirements (technology, function, quality, logistics, software, etc.) must be checked for feasibility.","Material and personnel resources must be considered in the feasibility study.","The results of the feasibility study must be available before tendering.","The feasibility of critical purchased parts must be ensured.","If customer requirements cannot be fulfilled, the customer must be notified or non-conformities approved by the customer prior to the contract being awarded.","A flash concept is available for programming at the plant and updates in the field (if required)."],ex:"Product/process development \uF0B7 Customer requirements and standards \uF0B7 Schedules, time frame \uF0B7 Regulations, standards, legislation, environmental impact \uF0B7 Requirements from product liability \uF0B7 Traceability concept \uF0B7 Buildings, premises \uF0B7 CAM, CAQ \uF0B7 Product/process innovation \uF0B7 Interdisciplinary feasibility analysis (for example, sales, development, purchasing, production planning, production, QM planning, logistics) Product development \uF0B7 Laboratory/test equipment \uF0B7 Parallel software development / prototyping Process development \uF0B7 Capacity monitoring \uF0B7 Availability of primary materials \uF0B7 Manufacturing options, manufacturing locations \uF0B7 Equipment, tools, production/inspection equipment, auxiliary materials, laboratory facilities, means of transport, containers, storage"},{id:"P3.3",k:!1,q:"Are the activities for product and process development planned in detail?",es:"\xBFLas actividades de desarrollo de producto y proceso est\xE1n planificadas en detalle?",rq:["When planning the product and process development, the level of detail depends on the component, software and complexity of the process.","In the development phase, suitable risk mitigation measures must be used for product and process development assurance, so that the product meets the required operational conditions when goes into series production (function, reliability, safety).","In case of product and process innovations, there is a fallback concept.","Risk analyses are part of the planning.","The inspection planning concept includes the requirements regarding series production, product audits and requalification.","The schedules contain all information regarding product and process development (including deadlines and duration, milestones according to the overall project plan, performance testing, PPA date, software standards\u2026).","The methods and evidence for development release meet the customer requirements and clarification must be sought with the customer if non-conformities occur.","The software engineering process has been specified and meets the customer\u2019s requirements.","The software development progress must also be taken into consideration in the planning, such that the required software functions are tested and available at the required point in time."],ex:"Product/process development \uF0B7 Overall project plan including all deadlines \uF0B7 Customer requirements \uF0B7 Customer schedule \uF0B7 Lead times \uF0B7 Risk mitigation measures (including backup strategy and cybersecurity) \uF0B7 (QFD, FMEA, HARA etc.) \uF0B7 Prototype/pre-launch planning \uF0B7 Regular status checks on the progress of the development (reviews) \uF0B7 Project plans for investment items (facilities and equipment) \uF0B7 Logistics planning for all phases of product and process development, including packaging \uF0B7 Spare parts concept Product development \uF0B7 Reliability testing, functional testing, trial plan"},{id:"P3.4",k:!0,q:"Have the procurement activities been planned, and are they monitored for compliance?",es:"\xBFSe planificaron las actividades de compras y se monitorea su cumplimiento?",rq:["Selection criteria are defined to ensure that the selected suppliers are able to meet the quality requirements.","A potential analysis has been planned or has been carried out for new suppliers not appointed by the customer, new locations or new technologies.","The scope of the planning activities after contract award is based on the risk classification of the purchased products/services.","There are clear rules for the communication of customer requirements along the supply chain.","Customer requirements also include requirements arising from the drawing, the parts, software or component specifications, the delivery quantity, the deadlines, QM agreements and applicable regulations.","Agreements regarding suppliers appointed by the customer (directed suppliers) are defined on a project-specific basis.","The activities in terms of purchasing plants, machines, tools, measuring and inspection equipment as well as services have been determined and planned (selection, contract award, verification and approval).","The progress of the supplier activities (such as contract awards, deadlines, customer and supplier milestones) is monitored."],ex:"Product / process development \uF0B7 Supplier selection criteria \uF0B7 VDA 6.3 potential analysis and/or comparable method for software \uF0B7 VDA 6.3 audit planning \uF0B7 Management (supplier development, forwarding customer requirements) of the suppliers, PPA procedures, failure analysis, quality, warranty, communication \uF0B7 Interface agreement (services according to DIA or interface agreement) \uF0B7 List of suppliers for the project, including service providers (e.g. development, laboratories, maintenance, software) \uF0B7 Risk classification for the scope of supply of the project and the activities derived (VDA MLA) \uF0B7 Third-party software \uF0B7 Criteria for the release of FOSS"},{id:"P3.5",k:!1,q:"Have the necessary resources been taken into account for product and process development planning?",es:"\xBFSe consideraron los recursos necesarios en la planificaci\xF3n del desarrollo de producto y proceso?",rq:["ment The required resources for the project have been determined and documented.","Capacity for the implementation of prototypes and prototype construction, pilot production, performance tests and series production must be planned.","Resource planning is regularly adapted to changes in the project and potential bottlenecks must be addressed.","When introducing new technologies and products, consistent employee training must be planned, and it must be ensured that the necessary infrastructure is created.","Means of transport for in-house transportation, such as packaging and special load carriers have been planned and the relevant quantities have been determined."],ex:"Product/process development \uF0B7 Planning of staff training, customer service (0km and field), among other things \uF0B7 Qualification matrix \uF0B7 CAx equipment \uF0B7 Availability of qualified personnel for the respective tasks \uF0B7 Budget, infrastructure, e.g. buildings, inspection equipment (hardware and software), laboratory equipment, machines, plants etc. \uF0B7 Capacity planning for all resources \uF0B7 Performance test, Run@Rate, 2-day production, stress test \uF0B7 Provision and distribution of software \uF0B7 Tool chain planning (software development tools) Product development \uF0B7 Test/inspection/laboratory facilities (internal and external) \uF0B7 Resources for planning and conducting tests as well as fixing bugs \uF0B7 Resources for installing the software on the hardware (e.g. flashing, coding, programming) Process development \uF0B7 Production locations, tools, production and inspection equipment, infrastructure"},{id:"P3.6",k:!1,q:"Have the activities for customer care/customer satisfaction/customer service and field failure analysis been planned?",es:"\xBFSe planificaron las actividades de atenci\xF3n/satisfacci\xF3n/servicio al cliente y an\xE1lisis de fallas en campo?",rq:["The customer requirements are taken into account in the concept for parts supply across the product life cycle, including spare parts supply.","Contingency plans to continually ensure series supply must be included in the concept.","The analysis process for 0-km and field complaints has been planned for the scope of delivery and the supply chain.","The customer requirements regarding field failure analysis are taken into account.","Interfaces to the complaints process have been planned.","An access control concept for software has been established and is maintained.","An analysis of all stakeholders has been carried out.","Communication and escalation paths have been specified."],ex:"Product/process development \uF0B7 Investment planning Product development \uF0B7 Interfaces to analysis centers for customer complaints, including the relevant software \uF0B7 Access for diagnosis \uF0B7 Access control lists Process development \uF0B7 Inspection planning for standard and stress testing \uF0B7 Triggering criteria are defined \uF0B7 NTF process \uF0B7 Spare parts supply concepts \uF0B7 Contingency plans"},{id:"P4.1",k:!0,q:"Are the actions from the product and process development plans implemented?",es:"\xBFSe implementan las acciones de los planes de desarrollo de producto y proceso?",rq:["ment Product and process development activities defined in the development planning are implemented in such a way as to ensure that the operational conditions are met (function, reliability, safety).","The risk analysis (e.g.","FMEA, HARA) is conducted on a multidisciplinary basis and is continuously revised in accordance with the progress of the project.","Defined measures are implemented in accordance with the planning and are checked for effectiveness.","Special characteristics are defined and identified in the relevant documents (FMEA etc.), and measures are implemented to ensure conformity."],ex:"Product/process development \uF0B7 Methods to minimize risk (e.g. FMEA, HARA, FTA) \uF0B7 Design of experiments (e.g. DoE, Shainin, Taguchi\u2026) \uF0B7 Poka-Yoke principles Product development \uF0B7 Test planning \uF0B7 Assembly test and system test \uF0B7 A, B, C, D samples \uF0B7 Endurance tests \uF0B7 Environmental simulation test (e.g. salt spray test) \uF0B7 Automotive SPICE assessments in accordance with the planning \uF0B7 Code, software release management \uF0B7 Traceability, fallback concept \uF0B7 Variant management \uF0B7 Analysis of requirements, architecture design, implementation and test in accordance with the planning Process development \uF0B7 Control plan/inspection plan"},{id:"P4.2",k:!1,q:"Are personnel resources available and are the personnel qualified to ensure product and process implementation?",es:"\xBFHay recursos de personal disponibles y calificados para asegurar la realizaci\xF3n de producto y proceso?",rq:["A staff schedule must be available.","The employees\u2019 tasks, responsibilities and authorizations are defined and allocated.","This also applies to the staff of external service providers.","Appropriate evidence must be available.","It must be ensured that needs assessments is carried out regularly during product and process development with regard to potentially emerging bottlenecks and additional requirements.","Qualified personnel are available during all phases of product and process implementation, and the requirements regarding the series production personnel have been derived.","Processes that have been outsourced must be taken into account."],ex:"Product/process development \uF0B7 Customer requirements \uF0B7 Requirements profile for the relevant jobs \uF0B7 Determination of the need for training \uF0B7 Evidence of training \uF0B7 Knowledge of methods \uF0B7 Knowledge of foreign languages \uF0B7 Software development: Qualified software testers, integration managers, etc. \uF0B7 Agile development due to qualified roles (DevOps Manager, Release Train Manager, etc.)"},{id:"P4.3",k:!1,q:"Are the material/immaterial resources available and are they suitable to ensure product and process implementation?",es:"\xBFLos recursos materiales/inmateriales est\xE1n disponibles y son adecuados para la realizaci\xF3n?",rq:["ment A process to determine resources has been implemented.","The provision of resources refers to the availability of buildings, measuring and inspection equipment, laboratory equipment, machinery, plants, IT systems and infrastructure as well as their utilization.","Processes that have been outsourced must be taken into account.","Regular needs assessment must be carried out during product and process development with regard to potentially emerging bottlenecks and additional requirements.","Material/immaterial resources are available for all phases of product and process implementation, and the requirements for series production have been derived.","Equipment for in-house transport, such as packaging and special load carriers, has been defined and is available in sufficient quantities."],ex:"Product/process development \uF0B7 Customer requirements \uF0B7 Technical interface to the customer and suppliers \uF0B7 ERP systems \uF0B7 Supporting processes, e.g. from logistics and IT Product development \uF0B7 Resources for verification and validation \uF0B7 Test setups, e.g. Hardware in the Loop (HIL), test boards, evaluation boards \uF0B7 Development tools, provision of the tool chain for software development Process development \uF0B7 Facility planning \uF0B7 Facility layout \uF0B7 Release of plants and machines, line clearance \uF0B7 Quantities and throughput times \uF0B7 Transport routes \uF0B7 Transport, containers, storage \uF0B7 Capacity before the start of series production (initial stock)"},{id:"P4.4",k:!0,q:"Are the required proofs of capability and releases for product and process development available?",es:"\xBFExisten las pruebas de capacidad y liberaciones requeridas para el desarrollo de producto y proceso?",rq:["The releases and proofs of capability are available for all items, assemblies, software versions and purchased products/services in accordance with development schedules.","The capability of the measuring and inspection equipment has been proven.","The material data has been confirmed and released.","The measures from the risk analyses (e.g.","FMEA, HARA) have been included in the product and process implementation, and their effectiveness has been confirmed.","In case of products with integrated (embedded) software, the software-related aspects according to VDA Volume 2 have to be taken into account.","The production process and product approval (PPA) must be available on the agreed date.","The tolerances of process parameters for the production of special characteristics have to be verified."],ex:"Product/process development \uF0B7 PPA results, in particular confirmation of conformity with statutory and regulatory requirements \uF0B7 PPA results for purchased products and services \uF0B7 Development releases from customers Process development \uF0B7 Process parameters and their tolerances \uF0B7 Confirmed logistics concept (e.g. suitability of packaging through sample shipping) \uF0B7 Proofs of capability \uF0B7 Capacity studies \uF0B7 Plant and tool releases Software \uF0B7 Recommendations for use (release notes) for each release \uF0B7 Release of third-party software and FOSS in accordance with customer requirements \uF0B7 Provision of test results and test evaluations"},{id:"P4.5",k:!1,q:"Have the planned procurement activities been implemented?",es:"\xBFSe implementaron las actividades de compras planificadas?",rq:["The planned procurement activities have been implemented.","This includes risk assessments, the project plan, the maturity level, releases and observing deadlines.","The planning activities according to the risk classification have been implemented; measures have been derived and their implementation is monitored.","The required proofs of capability and releases (process and product release) for the purchased products and services are available in accordance with the project schedule.","The material data has been confirmed and released.","The relevant project-specific customer requirements have been taken into account.","The processes for ensuring customer care/customer satisfaction/customer service as well as field failure analysis have been established."],ex:"\uF0B7 PPA release \uF0B7 FMEA, HARA \uF0B7 VDA 6.3 audit, potential analysis etc. \uF0B7 Releases, evidence and performance tests in accordance with the coordinated PPA procedure \uF0B7 NTF process, triggering criteria for stress tests have been defined \uF0B7 Spare parts supply concepts \uF0B7 Contingency plans \uF0B7 Interface agreement (services according to DIA or interface agreement) \uF0B7 Sub-supplier management by auditee for off-the-shelf components, engineering assignments (no personnel leasing) \uF0B7 Reference to the ASPICE Acquisition Process Group, ACQ2, ACQ.3, ACQ.4"},{id:"P4.6",k:!1,q:"Are the manufacturing and inspection specifications derived from product and process development and are they implemented?",es:"\xBFLas especificaciones de manufactura e inspecci\xF3n se derivan del desarrollo y est\xE1n implementadas?",rq:["The manufacturing and inspection specifications contain all inspection characteristics from product and process development (including special characteristics).","These must take into account all the components, assemblies, sub-assemblies, and materials, including the processes for manufacturing the products.","The results of the risk analysis are considered (e.g.","FMEA, HARA).","A production control plan is available.","It must be available throughout the prototype phase (if required by the customer), the pre-launch phase and the series production phase.","The scope and the elements of product audits and requalification tests have been defined.","Maintenance specifications are available.","All test cases are described in accordance with the test levels and the customer requirements (e.g.","VModel).","The software functions required at the respective times are released."],ex:"Product/process development \uF0B7 Risk analyses Product development \uF0B7 Product audit plan \uF0B7 Requalification planning Process development \uF0B7 Inspection instruction \uF0B7 Work instruction \uF0B7 Reaction plans \uF0B7 Production release (first and last piece, repeat release) \uF0B7 In-line inspections Software \uF0B7 Requirements for ensuring correct installation of the software \uF0B7 Release criteria in the production test"},{id:"P4.7",k:!1,q:"Is a performance test carried out under series conditions for the series release?",es:"\xBFSe realiza una prueba de desempe\xF1o en condiciones de serie para la liberaci\xF3n a serie?",rq:["A performance test must be carried out under series conditions to confirm that the required quantity can be produced for the customer with the resources used, within the specified period of time and in accordance with the specifications.","If the performance test fails to confirm this, measures must be defined.","The installation of the software in the components must be taken into account when determining the cycle times/throughput times.","Note: Depending on the time of the audit, some parts of the relevant production test could still be at the planning stage! The question is not relevant for product development!"],ex:"Process development \uF0B7 Series production conditions: e.g. tools, plants, cycle time, personnel, production and inspection specifications, measuring and inspection equipment \uF0B7 Customer requirements \uF0B7 Performance test, Run@Rate \uF0B7 Determination of minimum quantities (production peak and agreed flexibility) \uF0B7 Series production maturity of equipment and facilities (measurement report) \uF0B7 Staff concept for series production \uF0B7 Packaging requirements Software \uF0B7 Flash times, including test, ROM programming"},{id:"P4.8",k:!1,q:"Have the processes for ensuring customer care/customer satisfaction/customer service as well as the field failure analysis been established?",es:"\xBFSe establecieron los procesos de atenci\xF3n/satisfacci\xF3n/servicio al cliente y an\xE1lisis de fallas en campo?",rq:["ment The customer requirements regarding the supply of parts throughout the product life cycle are established in the processes.","The planned processes for the continuous series supply including safety margins for emergencies are available.","The analysis process for 0-km and field complaints is established for the scope of delivery.","The customer requirements regarding field failure analysis are taken into account.","The requirements for the analysis capability at the site have been agreed with the customer.","If external sites are used for analysis, the interfaces are defined and evidence of the availability of the required equipment and capacity is available.","New technologies and products are also taken into account in customer support.","The employees designated for these processes are qualified.","The infrastructure is available.","Processes for product monitoring in the field have been specified.","There must be processes for error analysis and diagnosis (embedded software in control unit).","If agreed, processes for over-the-air (OTA) software updates have been specified."],ex:"Product/process development \uF0B7 Inspection equipment for standard and stress tests \uF0B7 Triggering criteria are defined \uF0B7 Inspection plans for failure analysis \uF0B7 NTF process Process development \uF0B7 Qualification matrix and evidence of training \uF0B7 Inspection equipment \uF0B7 Service agreements with external analysis sites \uF0B7 Spare parts supply concepts \uF0B7 Contingency plans"},{id:"P4.9",k:!0,q:"Is there a controlled method for the project handover from development to series production?",es:"\xBFExiste un m\xE9todo controlado para el traspaso del proyecto de desarrollo a producci\xF3n en serie?",rq:["ment There is a process for transferring work results from the project to series production.","The activities specified in the project plan have been implemented.","Deadlines have been set for aspects that are still to be clarified, and responsible persons have been appointed.","Successful internal release and customer release is a prerequisite for a series delivery release.","Measures resulting from internal and external releases are implemented on time.","Personnel are available in accordance with the planning and are qualified.","The material resources for series production are available in accordance with the planning.","Measures to secure the production start-up have been specified and introduced.","For products with integrated (embedded) software, the results from development (including intermediate results and their documentation) are recorded.","The industrialization is ensured."],ex:"Product/process development \uF0B7 Customer requirements \uF0B7 PPA records \uF0B7 Handover protocols/checklists with handover criteria, acceptance reports \uF0B7 Parts history \uF0B7 Key production figures such as OEE, ppm, reject rate, etc. \uF0B7 Experiences from the ongoing project \uF0B7 Personnel resources (production staff, process engineers, maintenance, etc.) \uF0B7 Material resources (machines and plants, buildings, access routes, inspection facilities, load carriers, packaging, etc.) \uF0B7 Change log, Release Note \uF0B7 Industrialization of software: includes flashing software onto the control unit in series production and coding"},{id:"P5.1",k:!1,q:"Are only approved suppliers used who are able to meet the quality requirements?",es:"\xBFSolo se usan proveedores aprobados capaces de cumplir los requisitos de calidad?",rq:["ment In series production, it must be ensured that only approved suppliers are used.","The relevant approval criteria have been defined.","When selecting suppliers and in order to assess their ability to meet quality requirements, a process audit must be planned and carried out depending on the risk classification of the component.","Evaluations of the quality performance of existing suppliers have been taken into consideration.","Risks in the supply chain (internal/external) have been identified, evaluated and mitigated using suitable measures.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],ex:"\uF0B7   Defined criteria for the selection of suppliers \uF0B7   QM agreements \uF0B7   In case of criteria that have not been met: evidence of measures being implemented in order to mitigate risks \uF0B7   Assessment of the suppliers\u2019 ability to meet quality requirements, e.g. by means of KPI (ppm, delivery performance), escalation level \uF0B7   Self-Assessment, audit results of the suppliers \uF0B7   ASPICE assessment results \uF0B7   VDA 6.3-Process Audit \uF0B7   VDA 6.3-Potential Analysis"},{id:"P5.2",k:!1,q:"Are the customer requirements taken into account in the supply chain?",es:"\xBFSe consideran los requisitos del cliente en la cadena de suministro?",rq:["ment The communication of customer requirements must be regulated and traceable.","Change management must also be taken into account during series production.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],ex:"\uF0B7 Requirements from: drawings, components, software or component specifications, milestone plans, QM agreements or other valid standards \uF0B7 Special characteristics \uF0B7 Requalification requirements \uF0B7 Forwarding of complaints, including measures \uF0B7 Statutory and regulatory requirements"},{id:"P5.3",k:!1,q:"Have targets for supplier performance been agreed upon, and is the achievement of these targets regularly assessed?",es:"\xBFSe acordaron metas de desempe\xF1o con proveedores y se eval\xFAa su logro peri\xF3dicamente?",rq:["ment Target agreements regarding delivery performance must be made with all direct suppliers and must be implemented.","Supplier performance must be checked and evaluated within defined periods and according to defined criteria.","If the agreed targets are not met, measures must be defined and their implementation including deadlines must be monitored.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],ex:"\uF0B7 Measurable targets: Delivery quantity, punctuality, failure rate, PPM, special deliveries, rejects, lead times for complaints \uF0B7 Escalation criteria according to QM agreements \uF0B7 Evidence of measures (development programs) being implemented in case of suppliers that do not meet the required delivery performance"},{id:"P5.4",k:!0,q:"Are the necessary releases available for purchased products and services?",es:"\xBFExisten las liberaciones necesarias para productos y servicios comprados?",rq:["Prior to using new or changed products/processes in series production, a release must be available for all purchased products and services as agreed upon with the customer.","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],ex:"\uF0B7 Report regarding the coordination of the PPA procedure \uF0B7 PPA reports \uF0B7 Reference parts for the PPA procedure \uF0B7 Boundary sample \uF0B7 Product and process changes in the supply chain \uF0B7 Release agreement for small series and individual needs"},{id:"P5.5",k:!0,q:"Is it ensured that the purchased products and services are of the agreedupon quality?",es:"\xBFSe asegura que los productos y servicios comprados tengan la calidad acordada?",rq:["To monitor the quality of purchased products and services, inspections are carried out, documented and evaluated in accordance with the inspection planning.","If the quality requirements are not met, a standard complaints process is followed.","Inspection and measuring equipment for purchased products and services must be sufficiently available and must be stored appropriately.","Inspection stations must be laid out appropriately (e.g. climate control, lighting conditions, cleanliness, and protection against damage and contamination)."],ex:"\uF0B7 Released inspection procedure \uF0B7 Sample size (e.g. Skip Lot) \uF0B7 Boundary sample \uF0B7 PPM evaluations, 8D reports \uF0B7 Improvement programs \uF0B7 Material certificates in accordance with DIN EN 10204 \uF0B7 Gauges/fixtures \uF0B7 Drawings/specifications \uF0B7 Ordering and packaging specifications"},{id:"P5.6",k:!1,q:"Are incoming goods delivered and stored appropriately?",es:"\xBFLos bienes entrantes se entregan y almacenan de forma adecuada?",rq:["Primary materials and load carriers must be stored in accordance with their release status so that they cannot be damaged or mixed.","For materials that could be damaged by temperature, humidity, vibration, etc. and affect the quality of the final product, the transport and storage conditions must be defined and evidence shown. \u201CSuspicious\u201D/quarantined materials must be clearly labeled protected against unauthorized access.","FIFO/FEFO (shelf-life requirements) and batch traceability must be ensured when the materials are further processed.","This equally applies to residual quantities.","Material stock figures in the warehouse management system match the quantities actually in stock.","The storage conditions fulfill the product requirements."],ex:"\uF0B7 Packaging \uF0B7 Labeling (traceability/inspection status/use status) \uF0B7 Quarantine stores; quarantine areas \uF0B7 Batch-related use \uF0B7 Climatic conditions \uF0B7 Protection against damage/contamination/corrosion \uF0B7 Order and cleanliness \uF0B7 Precautions to prevent mixing/mistakes"},{id:"P5.7",k:!1,q:"Are personnel qualified for their respective tasks and are responsibilities defined?",es:"\xBFEl personal est\xE1 calificado para sus tareas y las responsabilidades est\xE1n definidas?",rq:["The responsibilities, tasks and authority the employees have in their relevant work areas must be specified.","The employees are qualified in accordance with the job profile.","Qualification requirements must be determined in relation to the tasks, and qualifications must be planned and carried out accordingly.","Knowledge of previous complaints (including corrective actions) is available for purchased products and services."],ex:"\uF0B7 Knowledge of specifications, product characteristics, customer requirements and production processes \uF0B7 Standards \uF0B7 Statutory and regulatory requirements \uF0B7 Packaging requirements \uF0B7 Quality procedures \uF0B7 Job description / description of tasks and function \uF0B7 Qualification matrix \uF0B7 Qualification of supplier auditors"},{id:"P6.1.1",k:!1,q:"Has the project been handed over from development to series production and is a reliable start guaranteed?",es:"\xBFSe traspas\xF3 el proyecto de desarrollo a serie y est\xE1 garantizado un arranque confiable?",rq:["The project handover to series production has been documented according to the specified criteria.","The responsibilities for the entire handover process are specified and acknowledged.","Unresolved issues are followed up on, and the necessary measures are implemented on schedule.","A complete production process and product release (PPA) including the documentation required must take place before the first production shipment.","Measures to secure the production start-up have been implemented on the basis of a risk analysis.","Tools, transport and series packaging, inspection and measuring equipment are available in the necessary quantities.","Analysis options for failure analysis are available The product software corresponds to the latest release versions. \uF0B7"],ex:"\uF0B7 Handover reports \uF0B7 Defined measures and implementation schedule \uF0B7 Production release report \uF0B7 Releases for all plant components and tools in 6.1.2 \uF0B7 PPA documents, including customer approval and reference parts regarding the PPA procedure \uF0B7 Waivers \uF0B7 Released software versions production start-up: Higher inspection frequency, additional inspections, Resident, Safe launch concept"},{id:"P6.1.2",k:!1,q:"Are the necessary quantities/production batch sizes of production materials available at the agreed upon time and at the correct storage location/work-station?",es:"\xBFLos materiales de producci\xF3n est\xE1n disponibles en cantidad/lote, a tiempo y en el lugar correcto?",rq:["The production material must be of the agreed quality and must be provided in the correct quantity and the correct packaging, with the correct documentation, at the agreed time and at the agreed place.","Parts/components must be available at defined storage areas/work-stations.","At the workplace, parts and primary materials are provided as needed, taking into account the order quantity/lot size in accordance with the logistics concept.","The reuse of residual quantities, separated parts, reworked parts, reused parts from product audits, inspected items, etc. and their traceability must be clearly defined.","Regulations for reintroducing parts from outsourced processes (e.g. sorting service) must be available."],ex:"\uF0B7 Production material includes, for example: \uF0B7 Software, packaging, load carriers, parts and components, raw material, series packaging for delivery to the customer, operating, auxiliary and process materials \uF0B7 suitable means of transport \uF0B7    Defined storage locations and stock levels \uF0B7 KANBAN, Just in time/Just in sequence, FIFO/FEFO \uF0B7 Revision / change status of materials and software \uF0B7 Special requirements regarding components and containers (e.g. ESD protection, humidity, temperature, residue)"},{id:"P6.1.3",k:!1,q:"Are materials stored appropriately and are the means of transport/packaging facilities suitable for the special characteristics of the materials?",es:"\xBFLos materiales se almacenan adecuadamente y el transporte/empaque es id\xF3neo para sus caracter\xEDsticas especiales?",rq:["Packaging requirements must be consistently taken into account/fulfilled.","During manufacture and in-house transport and also when being transported to and from service providers, suitable transport units must be used to protect the products from damage and contamination.","Storage areas/work-stations/containers must be appropriate for the tidiness and cleanliness required for the material.","Cleaning cycles are defined and monitored.","The supply of materials at the work-station/on the assembly line must allow for safe handling.","Specified storage times and use-by dates for special materials must be monitored by means of appropriate methods Operating and auxiliary materials for plants and machinery that have a direct effect on the product/product quality must be monitored accordingly.","Materials, operating and auxiliary materials must be protected against environmental and climatic influences."],ex:"\uF0B7 Stock quantities \uF0B7 Storage conditions \uF0B7 released special and standard transport containers \uF0B7 Protection against damage to the material \uF0B7 5S \uF0B7 Over-filling (storage areas and containers) \uF0B7 Maximum and minimum storage times, specified interim storage times, FIFO/FEFO"},{id:"P6.1.4",k:!1,q:"Are the necessary labels/records/releases available and allocated appropriately to the materials?",es:"\xBFLas etiquetas/registros/liberaciones necesarias est\xE1n disponibles y asignados correctamente a los materiales?",rq:["Released materials must be clearly identifiable.","The release identification on bundles/batches/load carriers/parts must be defined.","It must be ensured that only released materials/parts are forwarded to production/the next production stage and used.","Traceability from the sub-supplier to the customer must be guaranteed according to a defined traceability concept.","Customer requirements as well as statutory and regulatory requirements regarding labeling are taken into account."],ex:"\uF0B7 Customer requirements regarding labeling and traceability \uF0B7 Labeling of released parts/materials (stickers, labels, issue slips, VDA label, DMC, etc.) \uF0B7 Records of approvals \uF0B7 Traceability system \uF0B7 Documentation of waivers (number, duration, type of identification, etc.) \uF0B7 Stock management systems"},{id:"P6.1.5",k:!0,q:"Are product or process changes during series production tracked and documented?",es:"\xBFLos cambios de producto o proceso en serie se rastrean y documentan?",rq:["ment Changes to the product and the production process are implemented in accordance with the change management described.","Changes to the product and process are agreed upon with the customer, approved and released (including software changes) in accordance with customer requirements.","A PPA must be carried out.","The history of change statuses must be fully traceable.","The correct, released version of the material / software must be used.","After changes have been made, it must be checked whether the risk analyses need to be updated."],ex:"\uF0B7 Trigger matrix in accordance with VDA Volume 2 or customer specifications \uF0B7 Documented release of a change \uF0B7 Cross-functional evaluation prior to changes \uF0B7 Change history/parts history (also for software) \uF0B7 Design and process FMEA \uF0B7 Operation management in case of changes \uF0B7 Pre-production \uF0B7 Unique software identifier, software integrity (build number, hash key)"},{id:"P6.2.1",k:!1,q:"Are the requirements in the production control plan complete and have they been effectively implemented?",es:"\xBFLos requisitos del plan de control de producci\xF3n est\xE1n completos y se implementaron eficazmente?",rq:["ment The production and inspection documents are complete and are based on the production control plan.","The data relating to released machinery/tools/aids must be noted in the production control plan and/or the manufacturing and inspection documents.","The documents must be accessible close to the work-station.","Required measures (reaction plan) for process disturbances are described in the production control plan and are implemented and documented.","Process parameters influencing product characteristics/quality must be fully stated.","Tolerances must be stated for process parameters and inspection characteristics.","The control limits in process control charts are defined, identifiable and plausible.","Non-conformities and initiated measures regarding process requirements and inspection characteristics must be documented.","Conditions governing rework are specified, assess as part of the risk analysis and secured within the process (parts identification; repeat inspection etc.)."],ex:"\uF0B7 Inspection characteristics, inspection equipment, inspection methods, inspection frequencies, inspection cycles and requalification \uF0B7 Data regarding machines/tools/aids (identification numbers), process parameters and tolerances (pressure, temperatures, times, speeds etc.) \uF0B7 Work instructions (including reworking) \uF0B7 Inspection instruction"},{id:"P6.2.2",k:!1,q:"Are production processes released?",es:"\xBFLos procesos de producci\xF3n est\xE1n liberados?",rq:["A process-specific release inspection for first piece/last piece and repeat release was carried out and documented.","A release is necessary for the product and the process and must be carried out and documented by authorized employees using acceptance criteria.","Non-conformities and initiated measures are documented.","At the time of release, the necessary reference and boundary samples must be available.","Criteria for triggering a repeat release must be defined e.g. after an interruption of production.","If production is continued after the collection of inspection parts, these products must be accessible until the inspection parts are released."],ex:"\uF0B7 Release of a batch, including repeat release \uF0B7 First piece /last piece and repeat release \uF0B7 Tooling diagrams/reference parts/installation parts (e.g. defect identification) \uF0B7 Possible triggering criteria for a repeat release: \u25CB Production interruption (e.g. night time in two-shift operations, tool changes, material/ batch/product change) \u25CB Repair, tool change, \u25CB changed setting data \uF0B7 Release of reworked parts"},{id:"P6.2.3",k:!0,q:"Are special characteristics controlled in production?",es:"\xBFSe controlan las caracter\xEDsticas especiales en producci\xF3n?",rq:["Special product characteristics specified by the customer and the organization as well as defined process parameters are marked in the production control plan and systematically monitored.","Records of non-compliances and corrective actions are maintained.","Non-compliances affecting the characteristics of the product must be approved by the customer.","Records regarding special characteristics are available.","The duration and type of archiving of these records are specified and meet the customer\u2019s requirements."],ex:"\uF0B7 Drawings \uF0B7 Labeling indicating the customer-specific special characteristics, e.g.: D/TLD, DS, DZ, R, S, F \uF0B7 Process FMEA \uF0B7 Production control plan \uF0B7 SPC evaluations \uF0B7 Quality control charts \uF0B7 Proofs of capability \uF0B7 Proof of inspection process capability \uF0B7 Inspection results \uF0B7 Process parameter records"},{id:"P6.2.4",k:!0,q:"Are non-approved and/or defective parts controlled?",es:"\xBFSe controlan las piezas no aprobadas y/o defectuosas?",rq:["Suspect parts and defective parts must be separated, labeled, recorded or (when necessary) safely removed from the production process.","These parts must either be directly marked or marked on their container.","Authorized personnel decide on the further use of potentially defective products.","The scope (including inspection and release) of permissible rework is described in work instructions.","Quarantine stores and quarantine areas must be clearly labeled.","Accidental or unauthorized use of restricted parts must be excluded."],ex:"\uF0B7 Labeling indicating the product status \uF0B7 defined scrap/rework-stations in production \uF0B7 Quarantine stores and quarantine areas, clearance areas \uF0B7 Documentation regarding rejects, rework and repair \uF0B7 Authorizations"},{id:"P6.2.5",k:!1,q:"Is the flow of materials secured against mixing/wrong items?",es:"\xBFEl flujo de materiales est\xE1 asegurado contra mezclas / piezas equivocadas?",rq:["A mix-up of materials or the use of wrong materials, software or components must be ruled out.","Appropriate measures must be taken to ensure that any mix-ups of parts or any use of wrong parts/incorrect installation of parts is detected early on.","The process and/or inspection status of parts must be clearly visible.","The reuse of residual quantities, separated parts, reworked parts, reusable parts must be clearly defined.","Traceability is ensured.","Regulations for reintroducing parts from outsourced processes must be available.","Setting masters, setup and reference parts must be labeled and protected against accidental use."],ex:"\uF0B7 Process FMEA \uF0B7 Poka Yoke actions \uF0B7 Checks and inspections in production facilities \uF0B7 Traceability of batches \uF0B7 FIFO/FEFO \uF0B7 Kanban \uF0B7 Removal of invalid labeling \uF0B7 Value stream analysis \uF0B7 Sorting service \uF0B7 Unique software identifier, software integrity (build number, hash key)"},{id:"P6.3.1",k:!1,q:"Are the employees able to fulfill their given tasks?",es:"\xBFLos empleados son capaces de cumplir las tareas asignadas?",rq:["For each task/job, the corresponding requirements profile has been specified.","The employees\u2019 qualification is in line with the requirements profile.","If this is not the case, a qualification scheme must be put in place.","Instructions, trainings and inductions provided to the employees as well as proofs of qualification are documented.","Proof of special qualifications required for the relevant job must be provided.","In case of changes to processes, trainings/instructions are provided and documented.","The requirements also apply to temporary employees."],ex:"\uF0B7 Evidence of qualifications \uF0B7 Training plan \uF0B7 Initial training plan, including evidence \uF0B7 On-the-job training \uF0B7 Qualification matrix \uF0B7 Knowledge about the product and failures that have occurred \uF0B7 Handling of measuring equipment \uF0B7 Interpretation of control charts \uF0B7 Training/instructions regarding occupational safety \uF0B7 Training in special characteristics \uF0B7 Suitable evidence of qualification (e.g. welding certificate, vision test results, hearing test results)"},{id:"P6.3.2",k:!1,q:"Do the employees know what responsibilities and authority they have regarding the monitoring of product and process quality?",es:"\xBFLos empleados conocen sus responsabilidades y autoridad sobre el monitoreo de la calidad de producto y proceso?",rq:["The employees\u2019 responsibilities, duties and authority are described and implemented.","The employees know the consequences of incorrect execution of work.","The tasks/functions of the product are known.","It is also known what happens when they are no longer guaranteed.","Employees receive regular information on the current standard of quality achieved and are informed about customer complaints.","The requirements also apply to temporary employees."],ex:"\uF0B7 Work/inspection instructions \uF0B7 Job descriptions \uF0B7 Setup release, first piece inspection, last piece inspection \uF0B7 Authority to stop and start the process \uF0B7 Escalation protocol \uF0B7 Product training \uF0B7 Product safety/product liability training"},{id:"P6.3.3",k:!1,q:"Are the necessary personnel resources available?",es:"\xBFSe cuenta con los recursos de personal necesarios?",rq:["There is a staff schedule for all shifts.","The staff schedule takes into account the required number of qualified employees.","Rules exist for supporting areas that are not continually in use (e.g. laboratory, measurement room).","Fluctuations in customer orders and workforce absences (e.g. illness, holidays, training) are taken into account in the staff schedule.","The requirements also apply to temporary employees."],ex:"\uF0B7 Shift plan \uF0B7 Evidence of qualifications \uF0B7 Qualification matrix \uF0B7 documented absence management rules \uF0B7 Staff schedule \uF0B7 Mentors"},{id:"P6.4.1",k:!0,q:"Is the manufacturing equipment suitable to meet the customer\u2019s product-specific requirements?",es:"\xBFEl equipo de manufactura es adecuado para los requisitos espec\xEDficos de producto del cliente?",rq:["It must be demonstrated that the processes are implemented in accordance with the customer requirements using the existing production facilities, and that the resulting products meet the customer specifications.","The production facilities, machines and plants must be able to comply with the specified tolerances for the respective product and process characteristics.","Parameters and software that influence the process are protected against unauthorized access.","Process capability must be determined for selected product and process characteristics, and proof of capability must be provided.","The process capability must meet internal requirements as well as customer requirements.","The minimum requirement for process capability is Cpk \u2265 1.33.","In case of characteristics where a certain capability is required but proof of capability cannot be obtained, 100% inspection is required."],ex:"tion \uF0B7 Proof of machine/process capability \uF0B7 Monitoring of key process parameters (e.g. pressure, time, temperature) \uF0B7 Capability of replacement tools \uF0B7 Feed and removal systems \uF0B7 Reproducibility of gages, fixtures etc. \uF0B7 Cleanliness requirements \uF0B7 Configuration management, ensuring provision of software in accordance with the unique identifier, software integrity (build number, hash key)"},{id:"P6.4.2",k:!1,q:"Is the maintenance of the manufacturing equipment and tools controlled?",es:"\xBFSe controla el mantenimiento del equipo de manufactura y herramentales?",rq:["Preventive and/or predictive maintenance activities (maintenance, inspection and repair) are defined and implemented for all installations, equipment, machines and tools based on the risk.","Scheduled and unscheduled maintenance activities that have been carried out are documented and analyzed with regard to potential improvement measures.","Resources needed to carry out necessary maintenance activities are available.","A process for the analysis and optimization of down-time, machine utilization and tool life is implemented effectively.","The availability of replacement parts is ensured.","Tools undergo tool management which includes the following: \uF0B7 Tool history including all changes and tool life \uF0B7 Operational status \uF0B7 Labeling of tools These requirements also apply to external service providers."],ex:"\uF0B7 Production-related logistical equipment, such as forklift trucks \uF0B7 Maintenance and servicing schedules \uF0B7 TPM Total Productive Maintenance \uF0B7 Key processes and bottleneck machines \uF0B7 Technical documentation provided by the manufacturer \uF0B7 Preventative tool exchange programs for units subject to increased wear \uF0B7 Tool operation sheet \uF0B7 Operational status of tools, e.g. operational, not operational \uF0B7 Labeling of tools, e.g. property of the customer, tool no., index"},{id:"P6.4.3",k:!0,q:"Can compliance with quality requirements be effectively monitored with the measuring and inspection equipment in use?",es:"\xBFCon el equipo de medici\xF3n e inspecci\xF3n se puede monitorear eficazmente el cumplimiento de requisitos de calidad?",rq:["The inspection equipment and measuring systems used are suitable for the intended purpose and handling in production.","They are included in the production control plan.","Confirmed results of capability studies are available for the inspection equipment and measuring systems used.","Inspection and measuring equipment is labeled.","The validity status is monitored.","A process for periodic monitoring of inspection equipment and measuring systems is established and implemented.","In case of non-conformity, an assessment of potential risks in relation to the process, the product and the customer is carried out.","Measures have been defined and are implemented effectively.","Auxiliary equipment for inspection equipment and measuring systems that have an influence on the measurement result are monitored in the same way."],ex:"\uF0B7 Measuring system analysis \uF0B7 Test process capability \uF0B7 Replacement measuring equipment \uF0B7 Software integrity check \uF0B7 Calibration status (inspection sticker, barcode, engraving, etc.) \uF0B7 Reference parts"},{id:"P6.4.4",k:!1,q:"Do the work and inspection stations fulfill the requirements?",es:"\xBFLos puestos de trabajo e inspecci\xF3n cumplen los requisitos?",rq:["Workplace and ambient conditions are appropriate for the products and the work carried out, in order to prevent or eliminate contamination, damage, mix-ups of parts and the use of wrong parts.","This also applies to rework, sorting and inspection stations that have been permanently or temporarily set up.","The layout of the work station is adapted to the work to be carried out."],ex:"\uF0B7 Cleanliness and tidiness, 5S \uF0B7 Lighting \uF0B7 Noise pollution \uF0B7 Climate control \uF0B7 Clean rooms \uF0B7 ESD \uF0B7 Layout of the work station \uF0B7 Surroundings/handling of parts at the work station \uF0B7 Occupational safety"},{id:"P6.4.5",k:!1,q:"Are tools, devices and inspection equipment stored properly?",es:"\xBFHerramientas, dispositivos y equipo de inspecci\xF3n se almacenan correctamente?",rq:["Tools, devices and test equipment must be stored properly.","It is ensured that the equipment is stored in such a way as to be protected against damage and environmental effects.","Cleanliness and tidiness are ensured.","The issue and use of this equipment is controlled and documented."],ex:"\uF0B7 Stored in such a way as to be protected against damage, e.g. collision protection \uF0B7   5S Method \uF0B7 Defined storage location, e.g. markings on the floor \uF0B7 Transparent warehouse management"},{id:"P6.5.1",k:!1,q:"Have targets been set for the production process?",es:"\xBFSe definieron metas para el proceso de producci\xF3n?",rq:["Process-specific targets are defined, monitored and communicated.","Customer requirements are taken into account when setting targets.","A regular comparison between specified targets and actual results is made and documented."],ex:"\uF0B7 Key production figures, e.g. quantities produced; quality metrics, throughput times, defect costs, process effectiveness figures, plant and machine availability) \uF0B7 First time trough quality, First pass yield \uF0B7 Reduction of waste (e.g. rejects and rework, energy and process materials)"},{id:"P6.5.2",k:!1,q:"Is quality and process data collected in a way that allows for analysis?",es:"\xBFLos datos de calidad y proceso se recopilan de modo que permitan su an\xE1lisis?",rq:["The quality and process parameters required to demonstrate product conformity (target values) are defined and documented.","The actual data is recorded and evaluated.","Special incidents are documented.","The recorded data can be allocated to a product and process, the data is available, legible, accessible and archived as specified.","Traceability requirements are met.","The collected data is analyzed, and appropriate improvement measures are initiated.","The potential for improvement must be continuously determined based on findings relating to quality, costs, and services."],ex:"\uF0B7 Control charts \uF0B7 Check sheet \uF0B7 Types of errors/error frequencies \uF0B7 Rejects/rework \uF0B7 Process data sheet with parameter changes \uF0B7 Shift/machine log \uF0B7 Cycle times, throughput times \uF0B7 Fault message (e.g. plant standstill, power outage, program error message) \uF0B7 Output/availability \uF0B7 Blocking message/sorting actions \uF0B7 Traceability"},{id:"P6.5.3",k:!0,q:"If product and process requirements are not met, are the causes analyzed and the corrective actions checked for effectiveness?",es:"\xBFAnte incumplimientos de requisitos se analizan las causas y se verifica la eficacia de las acciones correctivas?",rq:["If product and process requirements are not met, immediate actions are taken to fulfill the requirements, until it has been proven that the corrective actions have been effective.","The employees are familiar with these immediate corrective actions.","Suitable methods are implemented to analyze the causes.","Repeat errors are recorded.","A more detailed analysis of the causes must be carried out accordingly.","Corrective actions are derived, their implementation is monitored and the effectiveness verified, The production control plan and the risk analysis are updated as needed.","Non-conformities that affect the characteristics of the delivered product are communicated to the customer."],ex:"\uF0B7 8D method \uF0B7 Cause and effects diagram \uF0B7 Taguchi, Shainin \uF0B7 5W method \uF0B7 Process capability analysis \uF0B7 Design and process FMEA \uF0B7 Waivers/concessions \uF0B7 Additional dimensional, material, functional and endurance testing"},{id:"P6.5.4",k:!1,q:"Are processes and products audited regularly?",es:"\xBFSe auditan regularmente procesos y productos?",rq:["The audit program for process and product audits is based on customer requirements as well as specific risks.","And is implemented.","The process and product audits carried out are suitable to identify specific risks and weaknesses.","If non-conformities are detected during an audit, the causes are analyzed.","Corrective actions are derived, their implementation is monitored and the effectiveness is verified.","Non-conformities that affect products which have already been delivered are communicated to the customer."],ex:"\uF0B7 Specifications \uF0B7 Special characteristics \uF0B7 Audit program including scheduled and event-based audits \uF0B7 Frequency of audits \uF0B7 Audit results, audit reports, action plans \uF0B7 Auditor qualification \uF0B7 Scope of the audit, e.g.: P5, P6, P7 \uF0B7 Labeling, packaging \uF0B7 Change status of individual parts and software"},{id:"P6.6.1",k:!1,q:"Do the quantities/production batch sizes match needs and are they systematically directed to the next process step?",es:"\xBFLas cantidades/lotes cubren la necesidad y se dirigen sistem\xE1ticamente al siguiente paso?",rq:["Products must be forwarded to defined storage/holding points using suitable means of transport.","The order quantity/batch size must be taken into account, so that only the required quantity of products is moved to the stipulated storage/holding point.","The current state of the component (OK part, reworked part, reject, etc.) must be evident from the labeling (component, container etc.).","The change status must be clearly indicated.","It is ensured that only OK parts move on to the next production process step.","Rules are put in place for returning residual quantities, including the recording of the quantities as well as further processing."],ex:"\uF0B7 KANBAN \uF0B7 FIFO/FEFO \uF0B7 JIT/JIS \uF0B7 Storage management \uF0B7 Production quantities tailored to the customer\u2019s needs \uF0B7 Technical cleanliness"},{id:"P6.6.2",k:!1,q:"Are products stored in an appropriate manner and are the means of transport/packaging facilities suitable for the special characteristics of the products?",es:"\xBFLos productos se almacenan adecuadamente y el transporte/empaque es id\xF3neo para sus caracter\xEDsticas especiales?",rq:["The products must be protected from damage by suitable storage and packaging.","Internal and customer-specific packaging instructions are known and are implemented.","This also applies to released replacement packaging.","The storage areas/containers must meet the requirements with regard to cleanliness.","Specified storage times must be monitored.","Products must be protected against environmental and climatic influences during storage and shipment.","These requirements apply to the handling during the production process as well as during shipment.","It is ensured that there are no product risks in the transport chain, e.g. due to parts handling, transport routes, commissioning, outdoor storage areas (internal/external)."],ex:"\uF0B7 Protection from damage \uF0B7 For electronic components: ESD protection \uF0B7 Technical cleanliness \uF0B7 Cleanliness, tidiness, 5S, over-filling (storage areas, containers) \uF0B7 Monitoring of storage times/storage quantity (maximum/minimum storage times, specified interim storage times) \uF0B7 Specifications regarding the cleaning of packaging \uF0B7 Sufficient amount of packaging"},{id:"P6.6.3",k:!1,q:"Are the necessary records/releases retained?",es:"\xBFSe conservan los registros/liberaciones necesarios?",rq:["The release of the products as well as the relevant evidence is documented.","Waivers/concessions are documented.","The documentation must cover the period and/or quantity of parts involved.","Internal specifications and customer requirements regarding the documentation of rework and repair are fulfilled.","The traceability of products is ensured.","The customer\u2019s requirements with regard to archiving are fulfilled."],ex:"\uF0B7 Customer specifications \uF0B7 Customer\u2019s requirements for archiving time limits \uF0B7 Archiving requirements/regulations (e.g. EDP, paper, fire protection, legibility) \uF0B7 Parts history"},{id:"P6.6.4",k:!0,q:"Are the customer requirements met upon delivery of the final product?",es:"\xBFSe cumplen los requisitos del cliente en la entrega del producto final?",rq:["The customer-specific requirements regarding the final product (delivery reliability, quality targets, quality performance etc.) are known.","The fulfillment of these requirements is continuously monitored, assessed and documented.","In case of non-conformities, the causes are analyzed, and measures are defined and implemented.","Products are labeled, stored and shipped in accordance with the customer requirements.","In case of waivers/concessions, products and packaging are labeled accordingly.","Internal specifications as well as customer requirements regarding the labeling of reworked or repaired products are observed.","The handling of supplied products is regulated.","Customers should be informed of delivery stops which affect them, and the further procedure should be coordinated with them."],ex:"\uF0B7   Quality agreements with the customer \uF0B7   Packaging specification \uF0B7   Target agreements \uF0B7   Shipping audit \uF0B7   Customer specifications regarding labeling (e.g.: VDA label) \uF0B7   Labeling in cases of waivers"},{id:"P7.1",k:!1,q:"Are all requirements related to the QM system and product conformity fulfilled?",es:"\xBFSe cumplen todos los requisitos del SGC y de conformidad del producto?",rq:["The internal and customer-specific requirements regarding the QM-system and its further development are fulfilled.","The processes within the organization (including the outsourced processes) and along the supply chain are taken into account.","Requalification tests are carried out in accordance with the customer requirements Customer requirements for the return of parts and their recycling must be fulfilled.","Proof of conformity with necessary national and international regulations is available."],ex:"\uF0B7 Quality agreements with the customer \uF0B7 Requalification concept, e.g. product audits carried out, functional tests, endurance tests \uF0B7 Certification of the QM system \uF0B7 Proof of conformity, e.g. parts that are subject to type approval, CCC, ECE, DOT, certificates, inspection reports"},{id:"P7.2",k:!1,q:"Is customer service guaranteed?",es:"\xBFEst\xE1 garantizado el servicio al cliente?",rq:["It must be ensured that competent contact persons are available for the various areas in the customer\u2019s organization.","Communication is ensured in accordance with the customer specifications.","Product monitoring in the field is ensured.","Access to customer portals in accordance with the customer-specific agreements is ensured, and the required data is up to date/maintained."],ex:"\uF0B7 Knowledge regarding product use \uF0B7 Knowledge of problems with the product and complaints regarding the product or transport \uF0B7 Fulfillment of new requirements \uF0B7 Notification of improvement measures \uF0B7 World-wide customer service \uF0B7 The customer is informed in the case of non-compliance with the requirements \uF0B7 Required data (e.g. Certificates, contact data)"},{id:"P7.3",k:!0,q:"Is the supply of parts guaranteed?",es:"\xBFEst\xE1 garantizado el suministro de piezas?",rq:["Concepts (including contingency concepts to ensure that products/parts can continue to be supplied) are available and up to date.","The processes within the organization (including the outsourced processes) and along the supply chain must be taken into account.","This also includes immaterial products such as software, etc.","Risks and their impact on the customer have been taken into account.","Procedures must be in place which guarantee that the organization informs the customer immediately when supply shortages are detected.","The information must include the expected duration and extent of the shortages, the reason and the measures which have been initiated.","The customer\u2019s requirements regarding the supply of spare parts must be fulfilled during the series production phase as well as afterwards."],ex:"\uF0B7 Contingency plans (e.g. alternative production, suppliers, packaging, transport) \uF0B7 Capacity and reaction time for sorting actions \uF0B7 Use of external capacity \uF0B7 Communication regarding supply shortages \uF0B7 Regulations covering authority to make decisions/escalation paths when introducing special actions \uF0B7 Blocking of parts \uF0B7 Involvement of the suppliers in spare parts supply \uF0B7 Provision of software updates"},{id:"P7.4",k:!0,q:"In case of complaints, are failure analyses carried out and corrective actions implemented effectively?",es:"\xBFAnte reclamos se hacen an\xE1lisis de falla y se implementan acciones correctivas eficaces?",rq:["A complaints process that meets the customer requirements is followed in case of 0-km and field complaints.","Analysis procedures must be defined.","The necessary personnel and material resources are available to ensure punctual processing.","The deadlines agreed upon with the customer must be met.","In case of non-conformities, the customer has to be informed.","In case of field complaints, a field failure analysis must be carried out according to the customer requirements (e.g.","VDA Field Failure Analysis).","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],ex:"\uF0B7 Process for processing complaints and field failure analysis process \uF0B7 Internal/external analysis facilities (laboratories, test and inspection facilities, personnel) \uF0B7 Use of problem-solving methods (8D) \uF0B7 Flow of information to the customer in the case of nonconformities \uF0B7 Knowledge databases, lessons learned \uF0B7 Quality control loop \uF0B7 Risk analysis (e.g. FMEA, HARA) \uF0B7 Access to the necessary release documents (e.g. PPA)"},{id:"P7.5",k:!1,q:"Are personnel qualified for their respective tasks and are responsibilities defined?",es:"\xBFEl personal est\xE1 calificado para sus tareas y las responsabilidades est\xE1n definidas?",rq:["It must be determined which responsibilities, duties and authorizations each employee has in their respective field of work.","Training needs must be determined and implemented individually, based on the tasks.","The employees are familiar with the product and the consequences of incorrect execution of work for the supply of parts and the quality of the final product."],ex:"\uF0B7 Organizational chart and escalation procedures \uF0B7 Evidence of knowledge of: the product/the specifications/ special customer requirements \uF0B7 Standards/legislation (product liability) \uF0B7 Intended use \uF0B7 Failure analysis \uF0B7 Evaluation methods (e.g. audits, statistics) \uF0B7 Quality techniques (e.g. Pareto, 8D Method, cause and effect diagram, \u201C5 Whys\u201D method) \uF0B7 Knowledge of foreign languages"}],IATF_HTML=`<!DOCTYPE html>
