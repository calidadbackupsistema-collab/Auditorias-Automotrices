ilan de modo que permitan su análisis?","rq":["The quality and process parameters required to demonstrate product conformity (target values) are defined and documented.","The actual data is recorded and evaluated.","Special incidents are documented.","The recorded data can be allocated to a product and process, the data is available, legible, accessible and archived as specified.","Traceability requirements are met.","The collected data is analyzed, and appropriate improvement measures are initiated.","The potential for improvement must be continuously determined based on findings relating to quality, costs, and services."],"ex":" Control charts  Check sheet  Types of errors/error frequencies  Rejects/rework  Process data sheet with parameter changes  Shift/machine log  Cycle times, throughput times  Fault message (e.g. plant standstill, power outage, program error message)  Output/availability  Blocking message/sorting actions  Traceability"},{"id":"P6.5.3","k":true,"q":"If product and process requirements are not met, are the causes analyzed and the corrective actions checked for effectiveness?","es":"¿Ante incumplimientos de requisitos se analizan las causas y se verifica la eficacia de las acciones correctivas?","rq":["If product and process requirements are not met, immediate actions are taken to fulfill the requirements, until it has been proven that the corrective actions have been effective.","The employees are familiar with these immediate corrective actions.","Suitable methods are implemented to analyze the causes.","Repeat errors are recorded.","A more detailed analysis of the causes must be carried out accordingly.","Corrective actions are derived, their implementation is monitored and the effectiveness verified, The production control plan and the risk analysis are updated as needed.","Non-conformities that affect the characteristics of the delivered product are communicated to the customer."],"ex":" 8D method  Cause and effects diagram  Taguchi, Shainin  5W method  Process capability analysis  Design and process FMEA  Waivers/concessions  Additional dimensional, material, functional and endurance testing"},{"id":"P6.5.4","k":false,"q":"Are processes and products audited regularly?","es":"¿Se auditan regularmente procesos y productos?","rq":["The audit program for process and product audits is based on customer requirements as well as specific risks.","And is implemented.","The process and product audits carried out are suitable to identify specific risks and weaknesses.","If non-conformities are detected during an audit, the causes are analyzed.","Corrective actions are derived, their implementation is monitored and the effectiveness is verified.","Non-conformities that affect products which have already been delivered are communicated to the customer."],"ex":" Specifications  Special characteristics  Audit program including scheduled and event-based audits  Frequency of audits  Audit results, audit reports, action plans  Auditor qualification  Scope of the audit, e.g.: P5, P6, P7  Labeling, packaging  Change status of individual parts and software"},{"id":"P6.6.1","k":false,"q":"Do the quantities/production batch sizes match needs and are they systematically directed to the next process step?","es":"¿Las cantidades/lotes cubren la necesidad y se dirigen sistemáticamente al siguiente paso?","rq":["Products must be forwarded to defined storage/holding points using suitable means of transport.","The order quantity/batch size must be taken into account, so that only the required quantity of products is moved to the stipulated storage/holding point.","The current state of the component (OK part, reworked part, reject, etc.) must be evident from the labeling (component, container etc.).","The change status must be clearly indicated.","It is ensured that only OK parts move on to the next production process step.","Rules are put in place for returning residual quantities, including the recording of the quantities as well as further processing."],"ex":" KANBAN  FIFO/FEFO  JIT/JIS  Storage management  Production quantities tailored to the customer’s needs  Technical cleanliness"},{"id":"P6.6.2","k":false,"q":"Are products stored in an appropriate manner and are the means of transport/packaging facilities suitable for the special characteristics of the products?","es":"¿Los productos se almacenan adecuadamente y el transporte/empaque es idóneo para sus características especiales?","rq":["The products must be protected from damage by suitable storage and packaging.","Internal and customer-specific packaging instructions are known and are implemented.","This also applies to released replacement packaging.","The storage areas/containers must meet the requirements with regard to cleanliness.","Specified storage times must be monitored.","Products must be protected against environmental and climatic influences during storage and shipment.","These requirements apply to the handling during the production process as well as during shipment.","It is ensured that there are no product risks in the transport chain, e.g. due to parts handling, transport routes, commissioning, outdoor storage areas (internal/external)."],"ex":" Protection from damage  For electronic components: ESD protection  Technical cleanliness  Cleanliness, tidiness, 5S, over-filling (storage areas, containers)  Monitoring of storage times/storage quantity (maximum/minimum storage times, specified interim storage times)  Specifications regarding the cleaning of packaging  Sufficient amount of packaging"},{"id":"P6.6.3","k":false,"q":"Are the necessary records/releases retained?","es":"¿Se conservan los registros/liberaciones necesarios?","rq":["The release of the products as well as the relevant evidence is documented.","Waivers/concessions are documented.","The documentation must cover the period and/or quantity of parts involved.","Internal specifications and customer requirements regarding the documentation of rework and repair are fulfilled.","The traceability of products is ensured.","The customer’s requirements with regard to archiving are fulfilled."],"ex":" Customer specifications  Customer’s requirements for archiving time limits  Archiving requirements/regulations (e.g. EDP, paper, fire protection, legibility)  Parts history"},{"id":"P6.6.4","k":true,"q":"Are the customer requirements met upon delivery of the final product?","es":"¿Se cumplen los requisitos del cliente en la entrega del producto final?","rq":["The customer-specific requirements regarding the final product (delivery reliability, quality targets, quality performance etc.) are known.","The fulfillment of these requirements is continuously monitored, assessed and documented.","In case of non-conformities, the causes are analyzed, and measures are defined and implemented.","Products are labeled, stored and shipped in accordance with the customer requirements.","In case of waivers/concessions, products and packaging are labeled accordingly.","Internal specifications as well as customer requirements regarding the labeling of reworked or repaired products are observed.","The handling of supplied products is regulated.","Customers should be informed of delivery stops which affect them, and the further procedure should be coordinated with them."],"ex":"   Quality agreements with the customer    Packaging specification    Target agreements    Shipping audit    Customer specifications regarding labeling (e.g.: VDA label)    Labeling in cases of waivers"},{"id":"P7.1","k":false,"q":"Are all requirements related to the QM system and product conformity fulfilled?","es":"¿Se cumplen todos los requisitos del SGC y de conformidad del producto?","rq":["The internal and customer-specific requirements regarding the QM-system and its further development are fulfilled.","The processes within the organization (including the outsourced processes) and along the supply chain are taken into account.","Requalification tests are carried out in accordance with the customer requirements Customer requirements for the return of parts and their recycling must be fulfilled.","Proof of conformity with necessary national and international regulations is available."],"ex":" Quality agreements with the customer  Requalification concept, e.g. product audits carried out, functional tests, endurance tests  Certification of the QM system  Proof of conformity, e.g. parts that are subject to type approval, CCC, ECE, DOT, certificates, inspection reports"},{"id":"P7.2","k":false,"q":"Is customer service guaranteed?","es":"¿Está garantizado el servicio al cliente?","rq":["It must be ensured that competent contact persons are available for the various areas in the customer’s organization.","Communication is ensured in accordance with the customer specifications.","Product monitoring in the field is ensured.","Access to customer portals in accordance with the customer-specific agreements is ensured, and the required data is up to date/maintained."],"ex":" Knowledge regarding product use  Knowledge of problems with the product and complaints regarding the product or transport  Fulfillment of new requirements  Notification of improvement measures  World-wide customer service  The customer is informed in the case of non-compliance with the requirements  Required data (e.g. Certificates, contact data)"},{"id":"P7.3","k":true,"q":"Is the supply of parts guaranteed?","es":"¿Está garantizado el suministro de piezas?","rq":["Concepts (including contingency concepts to ensure that products/parts can continue to be supplied) are available and up to date.","The processes within the organization (including the outsourced processes) and along the supply chain must be taken into account.","This also includes immaterial products such as software, etc.","Risks and their impact on the customer have been taken into account.","Procedures must be in place which guarantee that the organization informs the customer immediately when supply shortages are detected.","The information must include the expected duration and extent of the shortages, the reason and the measures which have been initiated.","The customer’s requirements regarding the supply of spare parts must be fulfilled during the series production phase as well as afterwards."],"ex":" Contingency plans (e.g. alternative production, suppliers, packaging, transport)  Capacity and reaction time for sorting actions  Use of external capacity  Communication regarding supply shortages  Regulations covering authority to make decisions/escalation paths when introducing special actions  Blocking of parts  Involvement of the suppliers in spare parts supply  Provision of software updates"},{"id":"P7.4","k":true,"q":"In case of complaints, are failure analyses carried out and corrective actions implemented effectively?","es":"¿Ante reclamos se hacen análisis de falla y se implementan acciones correctivas eficaces?","rq":["A complaints process that meets the customer requirements is followed in case of 0-km and field complaints.","Analysis procedures must be defined.","The necessary personnel and material resources are available to ensure punctual processing.","The deadlines agreed upon with the customer must be met.","In case of non-conformities, the customer has to be informed.","In case of field complaints, a field failure analysis must be carried out according to the customer requirements (e.g.","VDA Field Failure Analysis).","In case of suppliers appointed by the customer (directed suppliers), interface agreements are taken into consideration."],"ex":" Process for processing complaints and field failure analysis process  Internal/external analysis facilities (laboratories, test and inspection facilities, personnel)  Use of problem-solving methods (8D)  Flow of information to the customer in the case of nonconformities  Knowledge databases, lessons learned  Quality control loop  Risk analysis (e.g. FMEA, HARA)  Access to the necessary release documents (e.g. PPA)"},{"id":"P7.5","k":false,"q":"Are personnel qualified for their respective tasks and are responsibilities defined?","es":"¿El personal está calificado para sus tareas y las responsabilidades están definidas?","rq":["It must be determined which responsibilities, duties and authorizations each employee has in their respective field of work.","Training needs must be determined and implemented individually, based on the tasks.","The employees are familiar with the product and the consequences of incorrect execution of work for the supply of parts and the quality of the final product."],"ex":" Organizational chart and escalation procedures  Evidence of knowledge of: the product/the specifications/ special customer requirements  Standards/legislation (product liability)  Intended use  Failure analysis  Evaluation methods (e.g. audits, statistics)  Quality techniques (e.g. Pareto, 8D Method, cause and effect diagram, “5 Whys” method)  Knowledge of foreign languages"}];

ors and risks (process approach)?\",\"Turtle diagrams / process sheets, indicators with trend\"],\"B7\":[\"Does top management demonstrate leadership: policy, objectives, resources and accountability for QMS effectiveness?\",\"Management review, minutes, resource allocation\"],\"B8\":[\"Is process effectiveness (objective achievement and efficiency) evaluated and are actions taken?\",\"Process effectiveness and efficiency indicators, actions from results\"],\"B9\":[\"Are process owners defined and aware of their role and customer requirements?\",\"Defined process owners, interviews\"],\"B10\":[\"Does management ensure customer focus: requirements, risks, on-time delivery and quality are monitored?\",\"Customer scorecards, quality/delivery indicators, actions\"],\"B11\":[\"Is the quality policy appropriate, documented, communicated and available?\",\"Signed policy, visible deployment, staff interviews\"],\"B12\":[\"Are roles, responsibilities and authorities assigned and communicated (org chart, profiles)?\",\"Org chart, current job descriptions\"],\"B13\":[\"Does personnel responsible for product requirements have authority to stop shipment and production to correct quality problems?\",\"Stop procedure, evidence of authority exercised, personnel designation\"],\"B14\":[\"Is risk analysis performed that includes lessons learned from complaints and product recalls?\",\"Dated risk matrix with actions, lessons learned\"],\"B15\":[\"Are preventive actions in place to eliminate causes of potential nonconformities and is their effectiveness verified?\",\"Preventive action log, effectiveness verification\"],\"B16\":[\"Are contingency plans (equipment failure, power, supply, disasters) tested and reviewed?\",\"Contingency plan, tests/drills, annual review\"],\"B17\":[\"Do quality objectives cover customer requirements, and are they measurable, aligned with policy, monitored and communicated?\",\"Objectives with target, owner, monthly follow-up\"],\"B18\":[\"Are facilities, layout and equipment planned to optimize material flow and safety? Is feasibility evaluated on change?\",\"Layout, facilities plan, feasibility assessments\"],\"B19\":[\"Are there contingency plans that include maintenance and supply of critical utilities (power, air, water)?\",\"Equipment and facilities contingency plan\"],\"B20\":[\"Is the work environment (cleanliness, order, lighting, ESD, safety) adequate to achieve product conformity?\",\"Plant walk-through, 5S / environmental condition records\"],\"B21\":[\"Has measurement systems analysis (MSA: R&R, bias, linearity, stability) been done on control-plan equipment?\",\"Current MSA studies per equipment, acceptance criteria\"],\"B22\":[\"Is measuring equipment calibrated with traceability, complete records, identification and impact assessment when out of tolerance?\",\"Calibration program, ILAC/ISO 17025 certificates, labels, impact records\"],\"B23\":[\"Does the internal laboratory have defined scope, procedures, competent personnel and measurement traceability?\",\"Laboratory scope, methods, personnel qualification\"],\"B24\":[\"Are external laboratories ISO 17025 accredited (or customer-accepted) and does their scope cover the service?\",\"Accreditation certificate and scope, customer acceptance\"],\"B25\":[\"Has the necessary competence per position been determined and is training effectiveness evaluated?\",\"Skills matrix, effectiveness evaluations, profiles\"],\"B26\":[\"Do personnel with new or changed responsibilities, including temporary and contracted staff, receive job-specific training before operating?\",\"Complete skills matrix, signed OJT records, awareness of consequences of nonconformity\"],\"B27\":[\"Are internal auditors qualified (system, process, product, CSR) and are their list and competence maintained?\",\"List of qualified auditors, training evidence, minimum audits per year\"],\"B28\":[\"Do second-party auditors meet the standard's competencies and CSRs?\",\"Qualification records of supplier auditors\"],\"B29\":[\"Is there evidence that employees know the impact of their work on quality and the risks of nonconforming product?\",\"Awareness records, shop-floor interviews\"],\"B30\":[\"Is there a process to motivate staff, drive continual improvement and innovation?\",\"Suggestion program, recognitions, quality circles\"],\"B31\":[\"Does the quality manual contain scope, documented processes, sequence and interaction, and the CSR matrix?\",\"Current quality manual, CSR matrix\"],\"B32\":[\"Is there a record retention policy meeting legal and customer requirements (PPAP, tooling: product life + 1 year)?\",\"Retention policy / master list of records\"],\"B33\":[\"Is there a process to review, distribute and implement customer engineering specifications within 10 working days and record the implementation date?\",\"Specification change log, implementation evidence\"],\"B34\":[\"Does production planning consider customer requirements, logistics, feasibility and acceptance criteria?\",\"Project/production plans, defined acceptance criteria\"],\"B35\":[\"Is confidentiality of customer products, projects and information ensured?\",\"Confidentiality agreements, information access control\"],\"B36\":[\"Is communication with the customer in the agreed language and format (including electronic data)?\",\"Communication records, agreed formats\"],\"B37\":[\"Do product requirements include recycling, environmental impact, governmental and safety regulations?\",\"Review of legal requirements applicable to the product\"],\"B38\":[\"Is there evidence of formal requirements review and of customer-authorized deviations?\",\"Contract / quotation review records, customer authorizations\"],\"B39\":[\"Are designation, documented approval and control of customer-defined special characteristics met?\",\"List of special characteristics, customer approvals\"],\"B40\":[\"Was a multidisciplinary feasibility analysis done for new or changed products/processes, validating capacity and cycle rate?\",\"Feasibility study signed by multidisciplinary team, capacity validation\"],\"B41\":[\"Is the design and development process (product and process) documented and focused on error prevention?\",\"Design and development procedure / APQP\"],\"B42\":[\"Does design planning use a multidisciplinary approach (APQP, DFM/DFA, design and process FMEA)?\",\"APQP plan, multidisciplinary team, FMEA\"],\"B43\":[\"Do design personnel have the defined competence and tools?\",\"Design competence matrix\"],\"B44\":[\"Are product design inputs identified, documented and reviewed (specifications, special characteristics, traceability, packaging, legal requirements)?\",\"Design input record, contract review\"],\"B45\":[\"Are manufacturing process design inputs defined (productivity, technology, ergonomics, DFM)?\",\"Process design inputs, lessons learned\"],\"B46\":[\"Are special characteristics identified with a unique symbol and deployed in drawings, FMEA, control plan and instructions, with the customer symbol conversion table?\",\"Symbol conversion table, symbol consistency across documents\"],\"B47\":[\"Are development milestones measured and reported, feeding management review?\",\"APQP indicators, project reviews\"],\"B48\":[\"Is there a prototype program and control plan when required by the customer, using series suppliers and tooling?\",\"Prototype control plan, test results\"],\"B49\":[\"Does the product approval process (PPAP/PSW) meet customer requirements and was it approved before shipment?\",\"Approved PSWs, PPAP package, customer approval\"],\"B50\":[\"Are manufacturing process design outputs (flow, FMEA, control plan, instructions, capability) verifiable against inputs?\",\"Process flow, process FMEA, control plan, capability studies\"],\"B51\":[\"Are design changes evaluated (form, fit, function), validated and approved before implementation? Is there customer approval?\",\"Change records, customer approvals, deviations\"],\"B52\":[\"Are external services affecting the customer (sorting, rework, calibration, sub-assembly) within the scope of control?\",\"List of suppliers and services with defined control\"],\"B53\":[\"Is there a documented supplier selection process with risk, performance, QMS evaluation and multidisciplinary decision?\",\"Selection procedure, initial assessments\"],\"B54\":[\"Are customer-directed sources (directed-buy) managed per customer requirements?\",\"List of customer-designated suppliers\"],\"B55\":[\"Are the type and extent of control defined per supplier based on risk, and do suppliers have certification (ISO 9001/IATF) or a development plan?\",\"Approved supplier list (ASL), certificates, development plan\"],\"B56\":[\"Is it ensured that supplier products meet legal requirements of the country of manufacture and destination?\",\"Compliance declarations (RoHS, REACH, IMDS)\"],\"B57\":[\"Is supplier QMS development toward IATF 16949 carried out, prioritized by risk and performance?\",\"Supplier development plan, certifications\"],\"B58\":[\"Is supplier performance monitored (PPM, deliveries, complaints, premium freight) with actions?\",\"Supplier scorecard, actions for performance\"],\"B59\":[\"Is there a second-party audit program with criteria, frequency, results and follow-up?\",\"Supplier audit program, reports and finding closure\"],\"B60\":[\"Are customer requirements, special characteristics, traceability and changes communicated to suppliers?\",\"Purchase orders / specifications, CSR communication\"],\"B61\":[\"Are there complete control plans (pre-launch and production) linked to FMEA and flow, with special characteristics, reaction plan and review after changes or complaints?\",\"Control plans, linked FMEA and flow, dated reviews\"],\"B62\":[\"Are standardized work instructions and visual aids available at the workstation, current, and derived from FMEA/control plan?\",\"Operation sheets on the floor, review signature, consistency with control plan\"],\"B63\":[\"Are start-ups and changeovers (set-up) verified with acceptance criteria and records, including first/last piece?\",\"Set-up approval records, first and last piece\"],\"B64\":[\"Is the process verified after prolonged or unplanned production stoppages?\",\"Restart procedure and records\"],\"B65\":[\"Is there a total productive maintenance (TPM) system with plan, critical spares, indicators and improvement?\",\"Maintenance plan, OEE, MTBF/MTTR, critical spares\"],\"B66\":[\"Are tooling, molds and gauges managed (identification, ownership, maintenance, recovery)?\",\"Tooling register, preventive maintenance, customer ownership identified\"],\"B67\":[\"Is production planning based on customer demand, with order system, inventories and controlled schedule?\",\"Production schedule, MRP, customer order system\"],\"B68\":[\"Is there a risk-based traceability plan (lot/serial) that allows identifying and segregating suspect product within customer response time?\",\"Traceability plan, successful traceability test (drill)\"],\"B69\":[\"Are inspection and nonconforming product status clearly identified throughout the flow?\",\"Status labels, identified areas, floor walk-through\"],\"B70\":[\"Is customer property controlled (tooling, consigned material, returnable packaging)?\",\"Inventory and records of customer property\"],\"B71\":[\"Is product preserved (warehouse, FIFO/FEFO, packaging, seasonality, shelf life) and inventory evaluated periodically?\",\"Orderly warehouse, FIFO, expiry control, inventory condition records\"],\"B72\":[\"Is there control of shipping, delivery scheduling, shortage alerts and delivery communication with the customer?\",\"Delivery schedule, OTD indicators, alert plan\"],\"B73\":[\"Is after-sales / field feedback obtained, analyzed and communicated internally?\",\"Field and warranty information records\"],\"B74\":[\"Are changes to process, equipment, tooling and materials controlled, validated and communicated (with customer approval where applicable)?\",\"Change requests, validations, updated PSW, approvals\"],\"B75\":[\"Do temporary process-control changes (e.g. inspection instead of poka-yoke) have risk analysis, approval, end date and return to the original process?\",\"Temporary change records with expiry date\"],\"B76\":[\"Is product release defined in the control plan and repeated after changes?\",\"Control plan, release records\"],\"B77\":[\"Is complete dimensional inspection and functional testing performed per control plan and customer frequencies?\",\"Dimensional layouts, functional results\"],\"B78\":[\"For appearance parts, are there lighting, masters, equipment and qualified personnel?\",\"Controlled masters, evaluator qualification\"],\"B79\":[\"Is conformity of received product verified (supplier data, sampling receiving inspection, audits or laboratory)?\",\"Receiving inspection records, certificates, performance-based sampling criteria\"],\"B80\":[\"Is it confirmed that externally provided products comply with applicable legislation before use?\",\"Updated compliance declarations\"],\"B81\":[\"Are acceptance criteria defined (zero defects for attribute data) and customer-approved when applicable?\",\"Acceptance criteria, customer approval\"],\"B82\":[\"Are customer concessions or deviations authorized before shipment and recorded?\",\"Customer authorizations, concession records\"],\"B83\":[\"Is nonconforming product controlled according to the customer-specified process?\",\"NC control procedure, applicable CSR\"],\"B84\":[\"Is suspect product identified, contained and treated as nonconforming?\",\"Suspect product record, segregation\"],\"B85\":[\"Does rework have risk analysis, instructions, re-inspection and customer approval when applicable?\",\"Rework instructions, re-inspection records\"],\"B86\":[\"Do repairs have risk analysis, customer approval and records?\",\"Repair instructions, authorizations\"],\"B87\":[\"Is the customer informed immediately when nonconforming product has been shipped?\",\"Customer notification record\"],\"B88\":[\"Is the disposition of nonconforming product (scrap) controlled and does it record quantity and date?\",\"Scrap records with quantity, controlled areas, rendering unusable\"],\"B89\":[\"Are manufacturing processes monitored (capability, stability, Cpk) and reaction plans applied? Are results reviewed?\",\"Capability studies, control charts, actions for instability\"],\"B90\":[\"Are appropriate statistical tools identified in FMEA and control plan?\",\"List of statistical tools per process\"],\"B91\":[\"Are basic statistical concepts (variation, control, capability) understood and used?\",\"Interviews, use on the floor\"],\"B92\":[\"Is customer satisfaction monitored through performance indicators (quality, delivery, returns, scorecards) and acted upon?\",\"Customer scorecards, monthly complaint report, actions\"],\"B93\":[\"Are process data and indicators analyzed and evaluated, prioritizing adverse trends?\",\"Data analysis, dashboards, prioritization\"],\"B94\":[\"Is there a risk- and performance-based internal audit program covering all processes, shifts and CSRs (including software development if applicable)?\",\"Annual internal audit program, risk and shifts considered\"],\"B95\":[\"Is the full QMS audited every 3 years (cycle) verifying conformity with the standard and CSRs?\",\"Three-year plan, system audit reports\"],\"B96\":[\"Is each manufacturing process audited on all shifts at a defined frequency to verify effectiveness (FMEA, control plan)?\",\"Process audit reports, shift coverage\"],\"B97\":[\"Are product audits performed at appropriate stages against specifications?\",\"Product audit reports\"],\"B98\":[\"Do audit findings receive correction, cause analysis and effectiveness verification within deadlines?\",\"Reports with closed actions and verified effectiveness\"],\"B99\":[\"Is management review held at least annually (more often if risk) with results recorded?\",\"Management review minutes / presentations\"],\"B100\":[\"Do inputs include cost of poor quality, process effectiveness, productivity, customer satisfaction, maintenance, supplier performance and complaints?\",\"Management review inputs\"],\"B101\":[\"Do outputs include actions, deadlines and owners, with follow-up and closure?\",\"Review action log and status\"],\"B102\":[\"Are nonconformities handled with correction and effective corrective action (including customer complaints)?\",\"NC / 8D records, closure and effectiveness\"],\"B103\":[\"Is there a documented problem-solving process (containment, root cause, systemic actions, spread to other processes, verification)?\",\"Methodology (8D / 5 Whys) and recent cases\"],\"B104\":[\"Is error-proofing (poka-yoke) applied with periodic verification and master parts?\",\"Poka-yoke list, verification records\"],\"B105\":[\"Is there a warranty management system and analysis of returned parts?\",\"Warranty procedure, parts analysis\"],\"B106\":[\"Are customer complaints and field failures analyzed, and results communicated and used for improvement?\",\"Complaint analysis, failure reports, actions\"],\"B107\":[\"Is there a continual improvement process (focused on reducing variation and waste) and action plans based on results?\",\"Improvement plan, projects, results\"],\"Xestampado0\":[\"Stamping: are dies verified (height, wear, burr) and first/last piece recorded for every lot/changeover?\",\"Start-up approval records, die maintenance\"],\"Xestampado1\":[\"Stamping: are coils/sheets (heat number) traced to the finished part?\",\"Coil labels, lot traceability\"],\"Xinyeccion0\":[\"Injection: are critical parameters (temperature, pressure, time) recorded and controlled against the validated window? Is CQI-23 assessed if the customer requires it?\",\"Parameter sheet, process records, CQI-23 self-assessment\"],\"Xinyeccion1\":[\"Injection/rubber: are molds, material drying, regrind and mixing/weighing controlled, with verified scales?\",\"Drying records, regrind limit, scale verification\"],\"Xinyeccion2\":[\"Injection/rubber: are compound characteristics (rheometry/hardness) controlled and a sample retained per lot?\",\"Laboratory results per lot\"],\"Xsoldadura0\":[\"Welding: is CQI-15 met (parameters, welder qualification, periodic destructive/macro tests)?\",\"CQI-15 self-assessment, destructive tests, qualifications\"],\"Xsoldadura1\":[\"Welding: are electrodes/tips (dressing), gauge inspection and maintenance controlled?\",\"Electrode change records, inspections\"],\"Xmaquinado0\":[\"Machining: is capability (Cpk) demonstrated on key characteristics and cutting tool life controlled?\",\"Cpk studies, tool life sheet\"],\"Xmaquinado1\":[\"Machining: are start-ups approved with dimensional measurement and cleanliness/burrs controlled?\",\"Set-up records, cleanliness control\"],\"Xfundicion0\":[\"Casting/forging: is CQI-27 met (process parameters, mold/die control, X-ray porosity)?\",\"CQI-27 self-assessment, X-ray results\"],\"Xfundicion1\":[\"Casting/forging: are heat, material lot and parameters traced per part or lot?\",\"Heat records, traceability\"],\"Xtermico0\":[\"Heat treatment: is CQI-9 met (SAT/TUS pyrometry, atmosphere control, loads, hardness/metallography)?\",\"CQI-9 self-assessment, pyrometry reports, hardness results\"],\"Xpintura0\":[\"Paint/coatings: are CQI-11/CQI-12 met (bath chemistry, thickness, adhesion, corrosion)?\",\"CQI self-assessment, bath analyses, thickness and corrosion results\"],\"Xpintura1\":[\"Paint/coatings: are there color/gloss masters and lighting conditions to evaluate appearance?\",\"Masters, equipment and evaluator qualification\"],\"Xensamble0\":[\"Assembly: are poka-yokes and torque controls verified with master parts and recorded at start-up and after adjustments?\",\"Verification records, master parts, torque wrench calibration\"],\"Xensamble1\":[\"Assembly: is there an end-of-line (EOL) or functional test, and are kits and critical components managed by lot?\",\"Final test records, controlled kits\"],\"Xelectronico0\":[\"Electronics/harnesses: is CQI-17 (soldering) met, with ESD control, 100% electrical test and firmware/version control?\",\"CQI-17 self-assessment, ESD audit, test and version records\"],\"Xelectronico1\":[\"Electronics: is there counterfeit component prevention and shelf-life (MSL) control?\",\"Counterfeit parts procedure, MSL control\"],\"Xinteriores0\":[\"Interiors/textile/foams: are flammability, odor/VOC and appearance evaluated with controlled masters?\",\"Laboratory results, masters\"],\"Xinteriores1\":[\"Interiors/textile: are fabric, foam and adhesive lots traced?\",\"Lot traceability records\"],\"Xservicio0\":[\"Service (sorting/rework): are there instructions, acceptance criteria, training and containment records?\",\"Instructions, criteria, sorting records\"]},\"ko\":{\"B0\":[\"조직의 관련 내·외부 이슈(시장, 고객, 기술, 법규)가 파악되고 모니터링되고 있습니까?\",\"최신 상황 분석 / SWOT, 검토 회의록\"],\"B1\":[\"이해관계자와 관련 요구사항(고객, 관계당국, 공급업체, 직원)이 파악되어 있습니까?\",\"후속 관리가 포함된 이해관계자 매트릭스\"],\"B2\":[\"QMS 적용범위가 문서화되어 있으며 사업장, 지원 프로세스 및 정당한 제외사항(제품 설계 8.3에 한함)이 포함되어 있습니까?\",\"적용범위와 제외 사유가 포함된 품질매뉴얼\"],\"B3\":[\"고객 특정 요구사항(CSR)이 식별, 평가되어 QMS에 반영되어 있습니까?\",\"CSR 목록, CSR 대 프로세스 매트릭스, 최근 검토 증빙\"],\"B4\":[\"외주 프로세스를 포함한 모든 제품과 프로세스가 표준 및 고객 요구사항에 적합함을 보장합니까?\",\"프로세스 맵, 외주 프로세스 관리\"],\"B5\":[\"문서화된 제품 안전 프로세스(식별, 통보, 설계 승인, 교육, 추적성)가 있습니까?\",\"제품 안전 절차서, 안전 특성, 기록\"],\"B6\":[\"프로세스에 입력/출력, 책임자, 지표, 리스크가 정의되어 있습니까(프로세스 접근법)?\",\"터틀 다이어그램 / 프로세스 시트, 추세 지표\"],\"B7\":[\"최고경영자가 방침, 목표, 자원, QMS 효과성에 대한 책임 등 리더십을 보여주고 있습니까?\",\"경영검토, 회의록, 자원 배정\"],\"B8\":[\"프로세스 효과성(목표 달성도와 효율)을 평가하고 조치를 취하고 있습니까?\",\"프로세스별 효과성·효율 지표, 결과에 따른 조치\"],\"B9\":[\"프로세스 책임자가 지정되어 자신의 역할과 고객 요구사항을 알고 있습니까?\",\"프로세스 책임자 지정 현황, 인터뷰\"],\"B10\":[\"경영층이 고객 중심(요구사항, 리스크, 납기 준수, 품질 모니터링)을 보장합니까?\",\"고객 스코어카드, 품질/납기 지표, 조치\"],\"B11\":[\"품질방침이 적절하고 문서화되어 있으며 전달되고 이용 가능합니까?\",\"서명된 방침, 게시 현황, 직원 인터뷰\"],\"B12\":[\"역할, 책임, 권한이 부여되고 전달되어 있습니까(조직도, 직무기술서)?\",\"조직도, 최신 직무기술서\"],\"B13\":[\"제품 요구사항 책임자가 품질 문제 해결을 위해 출하와 생산을 중지할 권한이 있습니까?\",\"중지 절차, 권한 행사 증빙, 담당자 지정\"],\"B14\":[\"클레임과 리콜의 교훈을 포함한 리스크 분석을 수행합니까?\",\"일자와 조치가 있는 리스크 매트릭스, 교훈 사례\"],\"B15\":[\"잠재 부적합의 원인을 제거하는 예방조치가 있으며 그 효과성을 검증합니까?\",\"예방조치 기록, 효과성 검증\"],\"B16\":[\"비상 계획(설비 고장, 정전, 공급 중단, 재해)이 시험되고 검토되고 있습니까?\",\"비상 계획, 시험/훈련, 연간 검토\"],\"B17\":[\"품질 목표가 고객 요구사항을 포함하고 측정 가능하며 방침과 일관되고 모니터링·전달되고 있습니까?\",\"목표치, 책임자, 월별 추적이 있는 목표\"],\"B18\":[\"자재 흐름과 안전을 최적화하도록 시설, 레이아웃, 설비를 계획합니까? 변경 시 실현 가능성을 평가합니까?\",\"레이아웃, 시설 계획, 실현 가능성 평가\"],\"B19\":[\"핵심 유틸리티(전력, 공기, 물)의 정비와 공급을 포함한 비상 계획이 있습니까?\",\"설비 및 시설 비상 계획\"],\"B20\":[\"작업 환경(청결, 정돈, 조명, ESD, 안전)이 제품 적합성 달성에 적절합니까?\",\"현장 순회, 5S / 환경 조건 기록\"],\"B21\":[\"관리계획서에 포함된 측정기에 대해 MSA(R&R, 편의, 선형성, 안정성)를 수행했습니까?\",\"설비별 유효한 MSA 연구, 합격 기준\"],\"B22\":[\"측정기가 추적성 있게 교정되고 기록, 식별이 완비되어 있으며 공차 이탈 시 영향 평가를 합니까?\",\"교정 프로그램, ILAC/ISO 17025 성적서, 라벨, 영향 평가 기록\"],\"B23\":[\"사내 시험실의 범위, 절차, 유능한 인원, 측정 추적성이 정의되어 있습니까?\",\"시험실 범위, 시험 방법, 인원 자격\"],\"B24\":[\"외부 시험기관이 ISO 17025 인정(또는 고객 승인)을 받았으며 인정 범위가 해당 서비스를 포함합니까?\",\"인정서와 범위, 고객 승인\"],\"B25\":[\"직무별 필요 역량이 정해져 있고 교육의 효과성을 평가합니까?\",\"스킬 매트릭스, 효과성 평가, 직무 프로파일\"],\"B26\":[\"신규 또는 변경된 책임을 맡는 인원(임시직과 외주 인원 포함)이 작업 전에 직무별 교육을 받습니까?\",\"완비된 스킬 매트릭스, 서명된 OJT 기록, 요구사항 미준수 결과에 대한 인지\"],\"B27\":[\"내부심사원이 자격(시스템, 공정, 제품, CSR)을 갖추고 있으며 명단과 역량이 유지됩니까?\",\"자격 심사원 명단, 교육 증빙, 연간 최소 심사 횟수\"],\"B28\":[\"2자 심사원이 표준과 CSR의 역량 요건을 충족합니까?\",\"공급업체 심사원 자격 기록\"],\"B29\":[\"직원들이 자신의 업무가 품질에 미치는 영향과 부적합 제품의 리스크를 알고 있다는 증거가 있습니까?\",\"인식 교육 기록, 현장 인터뷰\"],\"B30\":[\"직원 동기부여, 지속적 개선, 혁신을 촉진하는 프로세스가 있습니까?\",\"제안 제도, 포상, 품질 분임조\"],\"B31\":[\"품질매뉴얼에 적용범위, 문서화된 프로세스, 순서와 상호작용, CSR 매트릭스가 포함되어 있습니까?\",\"최신 품질매뉴얼, CSR 매트릭스\"],\"B32\":[\"법규와 고객 요구사항(PPAP, 금형: 제품 수명+1년)을 충족하는 기록 보존 방침이 있습니까?\",\"기록 보존 방침 / 기록 마스터 목록\"],\"B33\":[\"고객 기술 사양을 10 영업일 이내에 검토, 배포, 적용하고 적용 일자를 기록하는 프로세스가 있습니까?\",\"사양 변경 기록, 적용 증빙\"],\"B34\":[\"생산 계획에서 고객 요구사항, 물류, 실현 가능성, 합격 기준을 고려합니까?\",\"프로젝트/생산 계획, 정의된 합격 기준\"],\"B35\":[\"고객 제품, 프로젝트, 정보의 기밀이 보장됩니까?\",\"기밀유지 협약, 정보 접근 통제\"],\"B36\":[\"고객과의 의사소통이 합의된 언어와 형식(전자 데이터 포함)으로 이루어집니까?\",\"의사소통 기록, 합의된 형식\"],\"B37\":[\"제품 요구사항에 재활용, 환경 영향, 정부 규제 및 안전 규정이 포함되어 있습니까?\",\"제품에 적용되는 법규 요구사항 검토\"],\"B38\":[\"요구사항의 공식 검토와 고객이 승인한 이탈 사항에 대한 증빙이 있습니까?\",\"계약 / 견적 검토 기록, 고객 승인\"],\"B39\":[\"고객이 정의한 특별특성의 지정, 문서화된 승인, 관리가 이행되고 있습니까?\",\"특별특성 목록, 고객 승인\"],\"B40\":[\"신규 또는 변경된 제품/프로세스에 대해 다분야 실현 가능성 분석을 하고 능력과 생산 속도를 검증했습니까?\",\"다분야 팀이 서명한 실현 가능성 검토서, 능력 검증\"],\"B41\":[\"설계 및 개발 프로세스(제품과 공정)가 문서화되어 있고 오류 예방에 중점을 둡니까?\",\"설계 및 개발 절차서 / APQP\"],\"B42\":[\"설계 계획에서 다분야 접근(APQP, DFM/DFA, 설계 및 공정 FMEA)을 사용합니까?\",\"APQP 계획, 다분야 팀, FMEA\"],\"B43\":[\"설계 인원이 정의된 역량과 도구를 갖추고 있습니까?\",\"설계 역량 매트릭스\"],\"B44\":[\"제품 설계 입력(사양, 특별특성, 추적성, 포장, 법규 요구사항)이 식별, 문서화, 검토되어 있습니까?\",\"설계 입력 기록, 계약 검토\"],\"B45\":[\"제조 공정 설계 입력(생산성, 기술, 인간공학, DFM)이 정의되어 있습니까?\",\"공정 설계 입력, 교훈 사례\"],\"B46\":[\"특별특성이 고유 기호로 식별되어 도면, FMEA, 관리계획서, 작업표준서에 전개되며 고객 기호 변환표가 있습니까?\",\"기호 변환표, 문서 간 기호 일관성\"],\"B47\":[\"개발 진행 사항을 측정하고 보고하여 경영검토에 반영합니까?\",\"APQP 지표, 프로젝트 검토\"],\"B48\":[\"고객이 요구하는 경우 양산 공급업체와 금형을 사용하여 시제품 프로그램과 관리계획서를 갖추고 있습니까?\",\"시제품 관리계획서, 시험 결과\"],\"B49\":[\"제품 승인 프로세스(PPAP/PSW)가 고객 요구사항을 충족하며 출하 전에 승인되었습니까?\",\"승인된 PSW, PPAP 패키지, 고객 승인\"],\"B50\":[\"제조 공정 설계 출력(흐름, FMEA, 관리계획서, 작업표준, 공정능력)을 입력 대비 검증할 수 있습니까?\",\"공정 흐름도, 공정 FMEA, 관리계획서, 공정능력 연구\"],\"B51\":[\"설계 변경(형상, 적합성, 기능)을 평가, 검증하고 적용 전에 승인합니까? 고객 승인이 있습니까?\",\"변경 기록, 고객 승인, 이탈 승인\"],\"B52\":[\"고객에 영향을 주는 외부 서비스(선별, 재작업, 교정, 서브 조립)가 관리 범위에 포함되어 있습니까?\",\"관리 방식이 정의된 공급업체 및 서비스 목록\"],\"B53\":[\"리스크, 실적, QMS 평가, 다분야 의사결정을 포함한 문서화된 공급업체 선정 프로세스가 있습니까?\",\"선정 절차서, 초기 평가\"],\"B54\":[\"고객 지정 공급처(Directed-buy)를 고객 요구사항에 따라 관리합니까?\",\"고객 지정 공급업체 목록\"],\"B55\":[\"공급업체별 관리 유형과 범위가 리스크에 따라 정의되어 있으며 인증(ISO 9001/IATF) 또는 개발 계획이 있습니까?\",\"승인 공급업체 목록(ASL), 인증서, 개발 계획\"],\"B56\":[\"공급업체 제품이 제조국과 도착국의 법규 요구사항을 충족함을 보장합니까?\",\"적합성 선언서(RoHS, REACH, IMDS)\"],\"B57\":[\"리스크와 실적에 따른 우선순위로 공급업체 QMS를 IATF 16949 수준으로 개발합니까?\",\"공급업체 개발 계획, 인증 현황\"],\"B58\":[\"공급업체 실적(PPM, 납기, 클레임, 긴급 운송비)을 모니터링하고 조치합니까?\",\"공급업체 스코어카드, 실적 조치\"],\"B59\":[\"기준, 주기, 결과, 후속 조치가 있는 2자 심사 프로그램이 있습니까?\",\"공급업체 심사 프로그램, 보고서 및 지적사항 종결\"],\"B60\":[\"고객 요구사항, 특별특성, 추적성, 변경 사항을 공급업체에 전달합니까?\",\"구매 발주서 / 사양서, CSR 전달 기록\"],\"B61\":[\"특별특성, 대응계획이 포함되고 FMEA 및 공정 흐름과 연계되어 변경이나 클레임 후 검토되는 완전한 관리계획서(초기양산 및 양산)가 있습니까?\",\"관리계획서, 연계된 FMEA와 흐름도, 일자가 있는 검토 기록\"],\"B62\":[\"표준작업서와 시각 보조물이 작업 위치에서 이용 가능하고 최신이며 FMEA/관리계획서에서 도출되었습니까?\",\"현장 작업표준서, 검토 서명, 관리계획서와의 일관성\"],\"B63\":[\"가동 시작과 모델 변경(셋업)을 합격 기준과 기록(초품/종품 포함)으로 검증합니까?\",\"셋업 승인 기록, 초품 및 종품\"],\"B64\":[\"장기 또는 비계획 생산 중단 후에 공정을 검증합니까?\",\"재가동 절차서 및 기록\"],\"B65\":[\"계획, 핵심 예비품, 지표, 개선이 포함된 전사적 설비 보전(TPM) 체계가 있습니까?\",\"보전 계획, OEE, MTBF/MTTR, 핵심 예비품\"],\"B66\":[\"공구, 금형, 게이지(식별, 소유권, 정비, 회수)를 관리합니까?\",\"공구 대장, 예방 정비, 고객 소유 식별\"],\"B67\":[\"고객 수요에 기반한 생산 계획이며 주문 체계, 재고, 관리되는 일정이 있습니까?\",\"생산 일정, MRP, 고객 주문 시스템\"],\"B68\":[\"고객 대응 시간 내에 의심 제품을 식별하고 격리할 수 있는 리스크 기반 추적성 계획(로트/시리얼)이 있습니까?\",\"추적성 계획, 추적성 모의훈련 성공 기록\"],\"B69\":[\"검사 상태와 부적합품 상태가 전체 흐름에서 명확히 식별됩니까?\",\"상태 라벨, 식별된 구역, 현장 순회\"],\"B70\":[\"고객 자산(금형, 사급 자재, 반납 용기)을 관리합니까?\",\"고객 자산 재고 및 기록\"],\"B71\":[\"제품을 보존(창고, FIFO/FEFO, 포장, 계절성, 유효기간)하고 재고 상태를 주기적으로 평가합니까?\",\"정돈된 창고, FIFO, 유효기간 관리, 재고 상태 기록\"],\"B72\":[\"출하 관리, 납품 일정, 결품 경보, 고객과의 납품 소통이 있습니까?\",\"납품 일정, OTD 지표, 경보 계획\"],\"B73\":[\"판매 후 서비스 / 시장 피드백을 입수·분석하고 내부에 전달합니까?\",\"시장 정보 및 보증 기록\"],\"B74\":[\"공정, 설비, 금형, 자재 변경을 관리, 검증, 전달합니까(해당 시 고객 승인 포함)?\",\"변경 요청서, 검증, 갱신된 PSW, 승인\"],\"B75\":[\"임시 관리 변경(예: 포카요케 대신 검사)에 리스크 분석, 승인, 종료일, 원래 공정 복귀가 있습니까?\",\"만료일이 있는 임시 변경 기록\"],\"B76\":[\"제품 출하 승인이 관리계획서에 정의되어 있고 변경 후 다시 이루어집니까?\",\"관리계획서, 출하 승인 기록\"],\"B77\":[\"관리계획서와 고객 주기에 따라 전수 치수 검사와 기능 시험을 수행합니까?\",\"치수 레이아웃 검사, 기능 시험 결과\"],\"B78\":[\"외관 부품에 대해 조명, 한도 견본, 설비, 자격 인원이 있습니까?\",\"관리되는 한도 견본, 평가자 자격\"],\"B79\":[\"입고 제품의 적합성을 검증합니까(공급업체 데이터, 샘플링 수입검사, 심사 또는 시험)?\",\"수입검사 기록, 성적서, 실적 기반 샘플링 기준\"],\"B80\":[\"외부 제공 제품이 사용 전에 적용 법규를 준수함을 확인합니까?\",\"최신 적합성 선언서\"],\"B81\":[\"합격 기준이 정의되어 있으며(계수형 데이터는 무결점) 해당 시 고객 승인을 받았습니까?\",\"합격 기준, 고객 승인\"],\"B82\":[\"고객 특채나 이탈이 출하 전에 승인되고 기록되어 있습니까?\",\"고객 승인서, 특채 기록\"],\"B83\":[\"부적합품을 고객이 지정한 프로세스에 따라 관리합니까?\",\"부적합품 관리 절차서, 해당 CSR\"],\"B84\":[\"의심 제품을 식별, 격리하고 부적합품으로 처리합니까?\",\"의심 제품 기록, 격리\"],\"B85\":[\"재작업에 리스크 분석, 작업 지침, 재검사, 해당 시 고객 승인이 있습니까?\",\"재작업 지침서, 재검사 기록\"],\"B86\":[\"수리에 리스크 분석, 고객 승인, 기록이 있습니까?\",\"수리 지침서, 승인\"],\"B87\":[\"부적합품이 출하된 경우 고객에게 즉시 통보합니까?\",\"고객 통보 기록\"],\"B88\":[\"부적합품 처리(폐기, 스크랩)가 관리되고 수량과 일자가 기록됩니까?\",\"수량이 있는 스크랩 기록, 관리 구역, 사용 불능 처리\"],\"B89\":[\"제조 공정을 모니터링(공정능력, 안정성, Cpk)하고 대응계획을 적용합니까? 결과를 검토합니까?\",\"공정능력 연구, 관리도, 불안정 시 조치\"],\"B90\":[\"FMEA와 관리계획서에 적절한 통계 도구가 식별되어 있습니까?\",\"공정별 통계 도구 목록\"],\"B91\":[\"기본 통계 개념(변동, 관리, 능력)을 이해하고 활용합니까?\",\"인터뷰, 현장 활용\"],\"B92\":[\"고객 만족을 성과 지표(품질, 납기, 반품, 스코어카드)로 모니터링하고 조치합니까?\",\"고객 스코어카드, 월간 클레임 보고서, 조치\"],\"B93\":[\"프로세스 데이터와 지표를 분석·평가하고 불리한 추세를 우선 처리합니까?\",\"데이터 분석, 대시보드, 우선순위\"],\"B94\":[\"모든 프로세스, 교대조, CSR(해당 시 소프트웨어 개발 포함)을 포함하는 리스크 및 실적 기반 내부심사 프로그램이 있습니까?\",\"연간 내부심사 프로그램, 리스크와 교대조 반영\"],\"B95\":[\"전체 QMS를 3년 주기로 심사하여 표준과 CSR 적합성을 검증합니까?\",\"3개년 계획, 시스템 심사 보고서\"],\"B96\":[\"효과성(FMEA, 관리계획서)을 검증하기 위해 모든 제조 공정을 모든 교대조에서 정해진 주기로 심사합니까?\",\"공정 심사 보고서, 교대조 커버리지\"],\"B97\":[\"제품 심사를 적절한 단계에서 사양 대비 수행합니까?\",\"제품 심사 보고서\"],\"B98\":[\"심사 지적사항에 대해 기한 내에 시정, 원인 분석, 효과성 검증을 합니까?\",\"조치 종결 및 효과성 검증이 포함된 보고서\"],\"B99\":[\"경영검토를 최소 연 1회(리스크가 있으면 더 자주) 실시하고 결과를 기록합니까?\",\"경영검토 회의록 / 발표자료\"],\"B100\":[\"입력 사항에 품질 비용, 프로세스 효과성, 생산성, 고객 만족, 설비 보전, 공급업체 실적, 클레임이 포함됩니까?\",\"경영검토 입력 자료\"],\"B101\":[\"출력 사항에 조치, 기한, 책임자가 있으며 후속 관리와 종결이 이루어집니까?\",\"검토 조치 기록 및 진행 상태\"],\"B102\":[\"부적합(고객 클레임 포함)을 시정과 효과적인 시정조치로 처리합니까?\",\"부적합 / 8D 기록, 종결 및 효과성\"],\"B103\":[\"문서화된 문제 해결 프로세스(봉쇄, 근본 원인, 시스템적 조치, 타 공정 수평전개, 검증)가 있습니까?\",\"방법론(8D / 5 Why)과 최근 사례\"],\"B104\":[\"오류방지(포카요케)를 마스터 샘플과 주기적 검증으로 적용합니까?\",\"포카요케 목록, 검증 기록\"],\"B105\":[\"보증 관리 시스템과 반품 부품 분석 체계가 있습니까?\",\"보증 절차서, 부품 분석\"],\"B106\":[\"고객 클레임과 시장 불량을 분석하고 결과를 전달하여 개선에 활용합니까?\",\"클레임 분석, 불량 보고서, 조치\"],\"B107\":[\"변동과 낭비 감소에 중점을 둔 지속적 개선 프로세스와 결과 기반 실행 계획이 있습니까?\",\"개선 계획, 프로젝트, 결과\"],\"Xestampado0\":[\"프레스: 금형(높이, 마모, 버)을 검증하고 로트/교체마다 초품과 종품을 기록합니까?\",\"가동 승인 기록, 금형 정비\"],\"Xestampado1\":[\"프레스: 코일/판재(히트 번호)를 완제품까지 추적합니까?\",\"코일 라벨, 로트 추적성\"],\"Xinyeccion0\":[\"사출: 핵심 변수(온도, 압력, 시간)를 기록하고 검증된 범위 내에서 관리합니까? 고객 요구 시 CQI-23으로 평가합니까?\",\"변수 시트, 공정 기록, CQI-23 자체 평가\"],\"Xinyeccion1\":[\"사출/고무: 금형, 소재 건조, 재생재(regrind), 배합/칭량을 검증된 저울로 관리합니까?\",\"건조 기록, 재생재 한도, 저울 검증\"],\"Xinyeccion2\":[\"사출/고무: 배합 특성(레오미터/경도)을 관리하고 로트별로 샘플을 보관합니까?\",\"로트별 시험 결과\"],\"Xsoldadura0\":[\"용접: CQI-15(변수, 용접사 자격, 주기적 파괴/매크로 시험)를 충족합니까?\",\"CQI-15 자체 평가, 파괴 시험, 자격 기록\"],\"Xsoldadura1\":[\"용접: 전극/팁(드레싱), 게이지 검사, 정비를 관리합니까?\",\"전극 교체 기록, 검사\"],\"Xmaquinado0\":[\"기계가공: 핵심 특성의 공정능력(Cpk)을 입증하고 절삭 공구 수명을 관리합니까?\",\"Cpk 연구, 공구 수명 시트\"],\"Xmaquinado1\":[\"기계가공: 치수 측정으로 가동을 승인하고 청결/버를 관리합니까?\",\"셋업 기록, 청결 관리\"],\"Xfundicion0\":[\"주조/단조: CQI-27(공정 변수, 금형/다이 관리, X선 기공 검사)을 충족합니까?\",\"CQI-27 자체 평가, X선 결과\"],\"Xfundicion1\":[\"주조/단조: 용탕, 소재 로트, 변수를 부품 또는 로트별로 추적합니까?\",\"용탕 기록, 추적성\"],\"Xtermico0\":[\"열처리: CQI-9(SAT/TUS 온도 정확도, 분위기 관리, 장입, 경도/금속조직)를 충족합니까?\",\"CQI-9 자체 평가, 온도 정확도 보고서, 경도 결과\"],\"Xpintura0\":[\"도장/코팅: CQI-11/CQI-12(조 성분, 두께, 부착력, 내식성)를 충족합니까?\",\"CQI 자체 평가, 조 분석, 두께 및 내식성 결과\"],\"Xpintura1\":[\"도장/코팅: 외관 평가를 위한 색상/광택 견본과 조명 조건이 있습니까?\",\"견본, 설비, 평가자 자격\"],\"Xensamble0\":[\"조립: 포카요케와 토크 관리를 마스터 샘플로 검증하고 시작 시와 조정 후에 기록합니까?\",\"검증 기록, 마스터 샘플, 토크렌치 교정\"],\"Xensamble1\":[\"조립: 최종(EOL) 또는 기능 시험이 있으며 키트와 핵심 부품을 로트별로 관리합니까?\",\"최종 시험 기록, 관리되는 키트\"],\"Xelectronico0\":[\"전자/와이어링: CQI-17(솔더링)을 충족하며 ESD 관리, 100% 전기 시험, 펌웨어/버전 관리가 있습니까?\",\"CQI-17 자체 평가, ESD 심사, 시험 및 버전 기록\"],\"Xelectronico1\":[\"전자: 위조 부품 방지와 유효기간(MSL) 관리가 있습니까?\",\"위조 부품 방지 절차서, MSL 관리\"],\"Xinteriores0\":[\"내장/섬유/폼: 인화성, 냄새/VOC, 외관을 관리되는 견본으로 평가합니까?\",\"시험 결과, 견본\"],\"Xinteriores1\":[\"내장/섬유: 원단, 폼, 접착제 로트를 추적합니까?\",\"로트 추적성 기록\"],\"Xservicio0\":[\"서비스(선별/재작업): 지침, 합격 기준, 교육, 봉쇄 기록이 있습니까?\",\"지침서, 기준, 선별 기록\"]}};\nvar B=[\n[\"4.1\",\"¿Se determinaron y se monitorean las cuestiones internas y externas relevantes (mercado, clientes, tecnología, legal)?\",\"Análisis de contexto / FODA actualizado, minuta de revisión\",0,\"QP-01\"],\n[\"4.2\",\"¿Se identificaron las partes interesadas y sus requisitos pertinentes (clientes, autoridades, proveedores, empleados)?\",\"Matriz de partes interesadas con seguimiento\",0,\"QP-01\"],\n[\"4.3.1\",\"¿El alcance del SGC está documentado, incluye sitios, procesos de soporte y las exclusiones justificadas (solo diseño de producto 8.3)?\",\"Manual de calidad con alcance y justificación de exclusión\",1,\"QP-01\"],\n[\"4.3.2\",\"¿Los requisitos específicos del cliente (CSR) están identificados, evaluados e incorporados al SGC?\",\"Listado de CSR, matriz CSR vs procesos, evidencia de última revisión\",1,\"QP-01\"],\n[\"4.4.1.1\",\"¿Se garantiza la conformidad de todos los productos y procesos (incluidos subcontratados) con los requisitos de la norma y del cliente?\",\"Mapa de procesos, control de procesos subcontratados\",0,\"QP-01\"],\n[\"4.4.1.2\",\"¿Existe un proceso documentado de seguridad del producto (identificación, notificación, aprobaciones de diseño, capacitación, trazabilidad)?\",\"Procedimiento de seguridad del producto, características de seguridad, registros\",1,\"QP-01\"],\n[\"4.4.2\",\"¿Los procesos tienen entradas/salidas, responsables, indicadores y riesgos definidos (enfoque de procesos)?\",\"Tortugas / fichas de proceso, indicadores con tendencia\",0,\"QP-01\"],\n[\"5.1.1.1\",\"¿La alta dirección demuestra liderazgo: política, objetivos, recursos y responsabilidad por la eficacia del SGC?\",\"Revisión por la dirección, minutas, asignación de recursos\",0,\"QP-01\"],\n[\"5.1.1.2\",\"¿Se evalúa la eficacia de los procesos (cumplimiento de objetivos y eficiencia) y se toman acciones?\",\"Indicadores de eficacia y eficiencia por proceso, acciones por resultados\",0,\"QP-01\"],\n[\"5.1.1.3\",\"¿Hay responsables del proceso con conocimiento de su rol y de los requisitos del cliente?\",\"Dueños de proceso definidos, entrevistas\",0,\"QP-01\"],\n[\"5.1.2\",\"¿La dirección asegura enfoque al cliente: requisitos, riesgos, entrega a tiempo y calidad monitoreados?\",\"Scorecards de cliente, indicadores de calidad/entrega, acciones\",1,\"QP-11\"],\n[\"5.2.1\",\"¿La política de calidad es apropiada, está documentada, comunicada y disponible?\",\"Política firmada, difusión visible, entrevistas al personal\",0,\"QP-01\"],\n[\"5.3.1\",\"¿Los roles, responsabilidades y autoridades están asignados y comunicados (organigrama, perfiles)?\",\"Organigrama, descripciones de puesto vigentes\",0,\"QP-01\"],\n[\"5.3.2\",\"¿El personal con responsabilidad de requisitos de producto tiene autoridad para detener el envío y la producción para corregir problemas de calidad?\",\"Procedimiento de paro, evidencia de ejercicio de autoridad, designación del personal\",1,\"QP-01\"],\n[\"6.1.2.1\",\"¿Se realiza análisis de riesgos que incluya lecciones aprendidas de reclamos y retiros de producto?\",\"Matriz de riesgos con fecha y acciones, lecciones aprendidas\",1,\"QP-01\"],\n[\"6.1.2.2\",\"¿Existen acciones preventivas para eliminar causas de no conformidades potenciales y se verifica su eficacia?\",\"Registro de acciones preventivas, verificación de eficacia\",0,\"QP-01\"],\n[\"6.1.2.3\",\"¿Existen planes de contingencia (falla de equipo, energía, suministro, desastres) probados y revisados?\",\"Plan de contingencia, pruebas/simulacros, revisión anual\",1,\"QP-01\"],\n[\"6.2.2.1\",\"¿Los objetivos de calidad cubren requisitos de cliente, son medibles, coherentes con la política, monitoreados y comunicados?\",\"Objetivos con meta, responsable, seguimiento mensual\",0,\"QP-01\"],\n[\"7.1.3.1\",\"¿Se planifican instalaciones, layout y equipos optimizando el flujo de material y la seguridad? ¿Se evalúa la factibilidad al cambiar?\",\"Layout, plan de instalaciones, evaluaciones de factibilidad\",0,\"QP-12\"],\n[\"7.1.3.2\",\"¿Existen planes de contingencia que incluyan mantenimiento y suministro de servicios críticos (energía, aire, agua)?\",\"Plan de contingencia de equipos e instalaciones\",0,\"QP-12\"],\n[\"7.1.4.1\",\"¿El ambiente de trabajo (limpieza, orden, iluminación, ESD, seguridad) es adecuado para lograr conformidad del producto?\",\"Recorrido de planta, registros de 5S / condiciones ambientales\",0,\"QP-12\"],\n[\"7.1.5.1.1\",\"¿Se realizó análisis de sistemas de medición (MSA: R&R, sesgo, linealidad, estabilidad) en los equipos del plan de control?\",\"Estudios MSA vigentes por equipo, criterio de aceptación\",1,\"QP-09\"],\n[\"7.1.5.2.1\",\"¿Los equipos de medición están calibrados con trazabilidad, registro completo, identificación y evaluación del impacto en caso de fuera de tolerancia?\",\"Programa de calibración, certificados ILAC/ISO 17025, etiquetas, registros de impacto\",1,\"QP-09\"],\n[\"7.1.5.3.1\",\"¿El laboratorio interno tiene alcance definido, procedimientos, personal competente y trazabilidad de mediciones?\",\"Alcance de laboratorio, métodos, calificación del personal\",0,\"QP-09\"],\n[\"7.1.5.3.2\",\"¿Los laboratorios externos son acreditados ISO 17025 (o aceptados por el cliente) y su alcance cubre el servicio?\",\"Certificado de acreditación y alcance, aceptación del cliente\",0,\"QP-09\"],\n[\"7.2.1\",\"¿Se determinó la competencia necesaria por puesto y se evalúa la eficacia de la capacitación?\",\"Matriz de habilidades, evaluaciones de eficacia, perfiles\",0,\"QP-13\"],\n[\"7.2.2\",\"¿El personal con responsabilidades nuevas o modificadas, incluidos temporales y subcontratados, recibe capacitación específica en el puesto antes de operar?\",\"Matriz de habilidades completa, registros OJT firmados, conocimiento de consecuencias de no cumplir requisitos\",1,\"QP-13\"],\n[\"7.2.3\",\"¿Los auditores internos están calificados (sistema, proceso, producto, CSR) y se mantiene su lista y competencia?\",\"Lista de auditores calificados, evidencia de formación y mínimo de auditorías al año\",1,\"QP-02\"],\n[\"7.2.4\",\"¿Los auditores de segunda parte cumplen las competencias de la norma y los CSR?\",\"Registros de calificación de auditores de proveedores\",0,\"QP-02\"],\n[\"7.3.1\",\"¿Se evidencia que los empleados conocen el impacto de su trabajo en la calidad y los riesgos de un producto no conforme?\",\"Registros de concientización, entrevistas en piso\",0,\"QP-13\"],\n[\"7.3.2\",\"¿Existe un proceso para motivar al personal, impulsar mejora continua e innovación?\",\"Programa de sugerencias, reconocimientos, círculos de calidad\",0,\"QP-13\"],\n[\"7.5.1.1\",\"¿El manual de calidad contiene alcance, procesos documentados, secuencia e interacción y la matriz de CSR?\",\"Manual de calidad vigente, matriz CSR\",0,\"QP-01\"],\n[\"7.5.3.2.1\",\"¿Existe política de retención de registros que cumple requisitos legales y del cliente (PPAP, utillajes: vida del producto + 1 año)?\",\"Política/lista maestra de retención de registros\",0,\"QP-01\"],\n[\"7.5.3.2.2\",\"¿Hay proceso para revisar, distribuir e implementar especificaciones de ingeniería del cliente en 10 días hábiles y registrar la fecha de implementación?\",\"Registro de cambios de especificaciones, evidencia de implementación\",1,\"QP-04\"],\n[\"8.1.1\",\"¿La planificación de la producción considera requisitos del cliente, logística, factibilidad y criterios de aceptación?\",\"Planes de proyecto/producción, criterios de aceptación definidos\",0,\"QP-05\"],\n[\"8.1.2\",\"¿Se garantiza la confidencialidad de productos, proyectos e información del cliente?\",\"Acuerdos de confidencialidad, control de acceso a información\",0,\"QP-03\"],\n[\"8.2.1.1\",\"¿La comunicación con el cliente se realiza en el idioma y formato pactados (incluyendo datos electrónicos)?\",\"Registros de comunicación, formatos acordados\",0,\"QP-03\"],\n[\"8.2.2.1\",\"¿Los requisitos del producto incluyen reciclaje, impacto ambiental, normas gubernamentales y de seguridad?\",\"Revisión de requisitos legales aplicables al producto\",0,\"QP-03\"],\n[\"8.2.3.1.1\",\"¿Existe evidencia de revisión formal de requisitos y de las desviaci function sqStat(){const g=sqGroup(()=>true);let find=0,nophoto=0,photos=0,napts=0;SQI.forEach(q=>{const a=SQ.ans[q.id];if(!a)return;if(a.add&&a.add.trim())find++;const np=(a.ph||[]).length;photos+=np;if(a.lv!=null&&a.lv<=4&&!np)nophoto++;if(a.lv===6)napts+=q.p;});
 const ap=g.mx-napts;return{n:g.n,d:g.d,sc:g.sc,mx:g.mx,na:g.na,find,nophoto,photos,grade:g.d?sqGrade(g.sc):null,pct:g.d?g.sc/g.mx*100:null,pctAp:ap&&g.d?g.sc/ap*100:null};}

const PH={};let IDBP=null;
function idb(){return IDBP||(IDBP=new Promise((res,rej)=>{try{const r=indexedDB.open("hpm_lobby_media",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}}));}
const idbDo=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("photos",mode),rq=fn(tx.objectStore("photos"));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);})).catch(()=>null);
const phSave=p=>idbDo("readwrite",s=>s.put(p)),phRemove=id=>idbDo("readwrite",s=>s.delete(id));
const phLoad=()=>idbDo("readonly",s=>s.getAll()).then(a=>{(a||[]).forEach(p=>{PH[p.id]=p;});});
async function phCompress(file){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"});}catch(_){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file);});}
 const w0=bmp.width,h0=bmp.height;let mx=1280,q=.72,out="";for(let k=0;k<3;k++){const s=Math.min(1,mx/Math.max(w0,h0)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<650000)break;mx*=.78;q-=.1;}return out;}
function phPush(rec){if(!CLOUD.ref)return;CLOUD.ref.collection("fotos").doc(rec.id).set({item:rec.item,data:rec.data,t:rec.t,by:rec.by||""}).catch(e=>toast("Fotos: "+(e.code||e.message)));}
function phCloudDel(id){if(!CLOUD.ref)return;CLOUD.ref.collection("fotos").doc(id).delete().catch(()=>{});}
async function phAdd(item,files){let n=0;for(const f of files){if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name||""))continue;
  try{const data=await phCompress(f),id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),rec={id,item,data,t:Date.now(),by:G.prof.aud||""};PH[id]=rec;phSave(rec);const a=SQ.ans[item]||(SQ.ans[item]={});(a.ph||(a.ph=[])).push(id);saveSQ();phPush(rec);n++;}
  catch(e){toast(x("No se pudo procesar la imagen","Could not process the image","이미지를 처리할 수 없습니다"));}}
 if(n){toast(x(n+" foto(s) agregada(s)",n+" photo(s) added",n+"장 추가됨"));sqView();}}
function phDel(item,id){if(!confirm(x("¿Quitar esta foto?","Remove this photo?","이 사진을 삭제할까요?")))return;const a=SQ.ans[item];if(a&&a.ph)a.ph=a.ph.filter(p=>p!==id);delete PH[id];phRemove(id);phCloudDel(id);saveSQ();sqView();}
function phClearAll(){Object.keys(PH).forEach(id=>{delete PH[id];phRemove(id);phCloudDel(id);});}
function phListen(){if(CLOUD.unsubPh)CLOUD.unsubPh();CLOUD.phFirst=true;
 CLOUD.unsubPh=CLOUD.ref.collection("fotos").onSnapshot(snap=>{let ch=false;
  snap.docChanges().forEach(c=>{const id=c.doc.id;if(c.type==="removed"){if(PH[id]){delete PH[id];phRemove(id);ch=true;}}else if(!PH[id]){const d=c.doc.data();PH[id]={id,item:d.item,data:d.data,t:d.t,by:d.by};phSave(PH[id]);ch=true;}});
  if(CLOUD.phFirst){CLOUD.phFirst=false;const have=new Set(snap.docs.map(d=>d.id));Object.keys(PH).forEach(id=>{if(!have.has(id))phPush(PH[id]);});}
  if(ch&&cur==="sq"){const ae=document.activeElement;if(!(ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")))sqView();}},e=>toast("Fotos: "+(e.code||e.message)));}
function phView(id){const p=PH[id];if(!p)return;const d=document.createElement("div");d.className="lbx";d.innerHTML=`<img alt="" src="${p.data}"><button aria-label="x">×</button>`;d.onclick=()=>d.remove();document.body.appendChild(d);}

function ring2(p,c,sz=64){const r=sz/2-6,L=2*Math.PI*r;return `<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#e3ebf3" stroke-width="7"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-(p||0)/100)}"/></svg>`;}
function detail(){
 const c=cards[sel],S=stats(),el=$("detail");let h="";
 const kp=(st)=>`<div class="kpis"><div class="kpi"><small>${x("Avance","Progress")}</small><b>${st.d}/${st.n}</b></div><div class="kpi"><small>${x("Resultado","Result")}</small><b style="color:${st.g.c}">${st.pct==null?"—":Math.round(st.pct*10)/10+" %"}</b></div><div class="kpi"><small>${x("Clasificación","Rating")}</small><b class="sm" style="color:${st.g.c}">${esc(st.g.t)}</b></div></div>`;
 if(c.id==="iatf")h=`<div class="det"><div><div class="ref">IATF 16949:2016 · ${x("Cláusulas 4–10 + CSR","Clauses 4–10 + CSR")}</div><h2>${x("Auditoría IATF 16949","IATF 16949 audit")}</h2><p>${x("Auditoría basada en procesos: define tamaño y giro, activa los macroprocesos, traza la ruta (día, orden, riesgo) y evalúa cada requisito con su evidencia esperada. Para auditorías de primera, segunda y tercera parte.","Process-based audit: set size and sector, activate macro-processes, build the route (day, order, risk) and assess each requirement against its expected evidence. For first, second and third party audits.")}</p><ul><li>${x("129 preguntas (108 base + 21 por giro), trilingüe","129 questions (108 base + 21 by sector), trilingual")}</li><li>${x("Escala 0–4, críticos ×2, NC mayor / menor / recomendación","Scale 0–4, critical ×2, major / minor NC / recommendation")}</li></ul><div class="btns"><button class="btn" data-act="open" data-v="iatf">${S.iatf&&S.iatf.d?x("Continuar auditoría","Continue audit"):x("Iniciar auditoría","Start audit")} ›</button></div></div><div>${S.iatf?kp(S.iatf):`<div class="alert w">${x("Cargando módulo…","Loading module…")}</div>`}${S.iatf?`<p class="hint">${x("Requisitos críticos con 0–1:","Critical items scored 0–1:")} <b>${S.iatf.extra}</b></p>`:""}</div></div>`;
 if(c.id==="sq")h=`<div class="det"><div><div class="ref">Hyundai · KIA SQ-Mark · Ver 5.1 · PL사출</div><h2>${x("SQ-Mark · Inyección plástica","SQ-Mark · Plastic injection","SQ-Mark · PL사출")}</h2><p>${x("Evaluación oficial del certificado SQ-Mark: 6 grupos y 47 ítems con 1,000 puntos. Cada ítem se califica en 6 niveles (o No aplica), se respalda con fotos de evidencia y al final se imprime el informe con el formato del Excel oficial.","Official SQ-Mark certificate assessment: 6 groups and 47 items worth 1,000 points. Each item is rated on 6 levels (or N/A), backed by photo evidence, and the report is printed in the official Excel format.","SQ-Mark 인증 공식 평가: 6개 영역 47개 항목 1,000점. 6단계 평가 + 증빙 사진, 공식 엑셀 양식으로 보고서 인쇄.")}</p><ul><li>${x("Grado por puntaje total: S ≥ 900 · A ≥ 800 · B ≥ 700 · C ≥ 600 · D","Grade by total score: S ≥ 900 · A ≥ 800 · B ≥ 700 · C ≥ 600 · D","총점 등급: S≥900 · A≥800 · B≥700 · C≥600 · D")}</li><li>${x("Informe, hoja de evaluación, hoja de hallazgos y anexo fotográfico","Report, evaluation sheet, findings sheet and photo annex","보고서 · 평가결과 · 지적사항 · 사진 부록")}</li></ul><div class="btns"><button class="btn" data-act="open" data-v="sq">${S.sq.d?x("Continuar","Continue","계속"):x("Iniciar","Start","시작")} ›</button><button class="btn red" data-act="reset" data-v="sq">${x("Reiniciar","Reset","초기화")}</button></div></div><div><div class="kpis"><div class="kpi"><small>${x("Avance","Progress","진행")}</small><b>${S.sq.d}/${S.sq.n}</b></div><div class="kpi"><small>${x("Puntaje","Score","점수")}</small><b style="color:${S.sq.g.c}">${S.sq.d?S.sq.sc.toFixed(1):"—"}<span style="font-size:12px;color:#8a99a8"> / ${S.sq.mx}</span></b></div><div class="kpi"><small>${x("Grado","Grade","등급")}</small><b class="sm" style="color:${S.sq.g.c}">${esc(S.sq.g.t)}</b></div></div><p class="hint">${x("Hallazgos:","Findings:","지적사항:")} <b>${S.sq.extra}</b> · ${x("Ítems sin foto:","Items without photo:","사진 없음:")} <b>${S.sq.nophoto}</b></p></div></div>`;
 if(c.id==="vda")h=`<div class="det"><div><div class="ref">VDA 6.3 · ${x("Auditoría de proceso","Process audit")}</div><h2>${x("Auditoría de proceso VDA 6.3","VDA 6.3 process audit")}</h2><p>${x("Evalúa P2 a P7 con 0 / 4 / 6 / 8 / 10 puntos, calcula EP, EU y En (por paso de proceso), el nivel global EG y la clasificación A/B/C aplicando las reglas de degradación del manual.","Assesses P2–P7 with 0 / 4 / 6 / 8 / 10 points, calculates EP, EU and En (per process step), the overall EG and the A/B/C rating applying the manual's downgrading rules.")}</p><ul><li>${x("59 preguntas, 15 con * (riesgo especial)","59 questions, 15 with * (special risk)")}</li><li>${x("Alcance flexible: P2–P7, P5–P7 (serie) o solo P4","Flexible scope: P2–P7, P5–P7 (series) or P4 only")}</li></ul><div class="btns"><button class="btn" data-act="open" data-v="vda">${S.vda.d?x("Continuar","Continue"):x("Iniciar","Start")} ›</button><button class="btn red" data-act="reset" data-v="vda">${x("Reiniciar","Reset")}</button></div></div><div>${kp(S.vda)}<p class="hint">${x("Hallazgos registrados:","Findings recorded:")} <b>${S.vda.extra}</b></p></div></div>`;
 if(c.id==="all"){const row=(id,nm,st,sub)=>`<div class="gauge">${ring2(st.pct,st.g.c)}<div class="gt"><b>${nm}</b><span>${st.pct==null?x("Sin evaluar","Not evaluated"):Math.round(st.pct*10)/10+" % · "+esc(st.g.t)}</span><br><span>${x("Avance","Progress")} ${st.d}/${st.n}${sub?" · "+sub:""}</span></div></div>`;
  h=`<div class="ref">${x("Vista consolidada","Consolidated view")}</div><h2 style="margin:2px 0 12px">${x("Resultados consolidados","Consolidated results")}</h2><div class="grid3">${S.iatf?row("iatf","IATF 16949",S.iatf,x("críticos 0–1: ","critical 0–1: ")+S.iatf.extra):""}${row("sq","SQ-Mark",S.sq,x("hallazgos: ","findings: ")+S.sq.extra)}${row("vda","VDA 6.3",S.vda,x("hallazgos: ","findings: ")+S.vda.extra)}</div><p class="hint">${x("Cada auditoría se guarda en este navegador. Usa Exportar para respaldar o llevar la información a otro equipo.","Each audit is stored in this browser. Use Export to back up or move the data to another computer.")}</p>`;}
 if(c.id==="bk")h=`<div class="ref">${x("Respaldo","Backup")}</div><h2 style="margin:2px 0 6px">${x("Exportar / importar","Export / import")}</h2><p style="color:#3d5368">${x("Un archivo JSON contiene las tres auditorías y el perfil. Exporta al cierre de cada día; importar reemplaza lo que hay en este equipo.","One JSON file holds the three audits and the profile. Export at the end of each day; import replaces what is on this computer.")}</p><div class="btns"><button class="btn" data-act="export">${x("Exportar respaldo","Export backup")}</button><label class="btn sec" style="cursor:pointer">${x("Importar respaldo","Import backup")}<input type="file" accept=".json,application/json" id="imp" hidden></label><button class="btn red" data-act="reset" data-v="all">${x("Borrar todo","Clear all")}</button></div>`;
 if(c.id==="gd")h=`<div class="ref">${x("Guía rápida","Quick guide")}</div><h2 style="margin:2px 0 8px">${x("Cómo usar la plataforma","How to use the platform")}</h2><div class="grid3"><div class="kpi"><small>1 · ${x("Elige","Choose")}</small>${x("Gira el carrusel (arrastra, flechas o clic en una tarjeta) y abre la auditoría que corresponda.","Spin the carousel (drag, arrows or click a card) and open the audit you need.")}</div><div class="kpi"><small>2 · ${x("Audita","Audit")}</small>${x("Cada pregunta muestra el requisito y la evidencia esperada; califica y anota el hallazgo. Todo se guarda solo.","Each question shows the requirement and expected evidence; score it and note the finding. Everything saves automatically.")}</div><div class="kpi"><small>3 · ${x("Cierra","Close")}</small>${x("Revisa el resultado, imprime a PDF y exporta el respaldo JSON.","Review the result, print to PDF and export the JSON backup.")}</div></div><p class="hint">${x("Nota: IATF 16949 conserva su propio flujo de 5 pasos (perfil, macroprocesos, ruta, ejecución, resultado).","Note: IATF 16949 keeps its own 5-step flow (profile, macro-processes, route, execution, result).")}</p>`;
 el.innerHTML=h;const im=$("imp");if(im)im.onchange=importAll;
}
function openCard(i){const c=cards[i];if(["iatf","sq","vda"].includes(c.id))openMod(c.id);else{goTo(i);}}
function openSel(){const c=cards[sel];if(["iatf","sq","vda"].includes(c.id))openMod(c.id);}
function hideAll(){["view-sq","view-vda","view-iatf"].forEach(i=>$(i).hidden=true);}
let cur=null;
function openMod(id){cur=id;hideAll();running=false;$("lobby").style.display="none";document.querySelector(".hero").style.display="none";
 if(id==="sq"){SQ.tab=SQ.tab||1;$("view-sq").hidden=false;sqView();}
 if(id==="vda"){$("view-vda").hidden=false;vdaView();}
 if(id==="iatf"){$("view-iatf").hidden=false;$("iatfT").textContent=x("Auditoría IATF 16949:2016","IATF 16949:2016 Audit");iatfLang();}
 window.scrollTo(0,0);}
function backLobby(){cur=null;hideAll();$("lobby").style.display="";document.querySelector(".hero").style.display="";running=true;paint();detail();chrome();}
function chrome(){document.documentElement.lang=G.lang;$("hTitle").textContent=x("Plataforma de Auditorías","Audit Platform","감사 플랫폼");$("hSub").textContent=x("IATF 16949 · SQ-Mark · VDA 6.3 — Lobby de auditorías","IATF 16949 · SQ-Mark · VDA 6.3 — Audit lobby","IATF 16949 · SQ-Mark · VDA 6.3");
 $("hOrg").textContent=G.prof.org+(G.prof.plant?" · "+G.prof.plant:"");$("hAud").textContent=G.prof.aud?x("Auditor: ","Auditor: ","심사원: ")+G.prof.aud:x("Auditor: —","Auditor: —","심사원: —");
 $("cvT").textContent=x("Selecciona la auditoría a realizar","Select the audit to perform","수행할 심사를 선택하세요");$("cvS").textContent=x("Arrastra a los lados para girar · clic en una tarjeta para elegirla","Drag sideways to rotate · click a card to select it");
 document.title=x("HPM · Plataforma de Auditorías","HPM · Audit Platform");
 [].forEach.call(document.querySelectorAll("[data-lang]"),b=>b.classList.toggle("sel",b.dataset.lang===G.lang));}
function rerender(){if(cur==="sq")sqView();else if(cur==="vda")vdaView();else{paint();detail();}chrome();}
/* respaldo */
function exportAll(){let ia=null;try{ia=JSON.parse(localStorage.getItem(KIATF));}catch(e){}const o={app:"hpm-audit-platform",v:2,t:new Date().toISOString(),g:G,sq:SQ,vda:VDA,iatf:ia,ph:Object.keys(PH).map(k=>PH[k])};const b=new Blob([JSON.stringify(o)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="HPM_Auditorias_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast(x("Respaldo exportado","Backup exported"));}
function importAll(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="hpm-audit-platform")throw 0;if(!confirm(x("Esto reemplaza las auditorías de este equipo. ¿Continuar?","This replaces the audits on this computer. Continue?")))return;
 if(o.g){G.prof=Object.assign(G.prof,o.g.prof||{});saveG();}if(o.sq&&o.sq.v===2){SQ=Object.assign(sqDef(),o.sq);saveSQ();}if(Array.isArray(o.ph))o.ph.forEach(p=>{if(p&&p.id&&p.data){PH[p.id]=p;phSave(p);phPush(p);}});if(o.vda){VDA=Object.assign({tab:1,el:"P2",step:0,scope:["P2","P3","P4","P5","P6","P7"],steps:["Proceso 1"],prod:"",cust:"",ans:{}},o.vda);saveVDA();}
 if(o.iatf){try{localStorage.setItem(KIATF,JSON.stringify(o.iatf));cloudPush("iatf",o.iatf);}catch(_){}ifr().srcdoc=IATF_HTML;}toast(x("Respaldo importado","Backup imported"));setTimeout(()=>{paint();detail();chrome();},600);}catch(_){toast(x("Archivo no válido","Invalid file"));}};r.readAsText(f);}
function resetMod(w){const m=w==="all"?x("¿Borrar TODAS las auditorías de este equipo? Exporta un respaldo antes.","Clear ALL audits on this computer? Export a backup first."):x("¿Reiniciar esta auditoría? Se pierden las respuestas (y las fotos de evidencia en SQ-Mark).","Reset this audit? Answers (and SQ-Mark photo evidence) will be lost.","이 심사를 초기화할까요? 답변(및 SQ-Mark 증빙 사진)이 삭제됩니다.");if(!confirm(m))return;
 if(w==="sq"||w==="all"){phClearAll();SQ=sqDef();saveSQ();}if(w==="vda"||w==="all"){VDA={tab:1,el:"P2",step:0,scope:["P2","P3","P4","P5","P6","P7"],steps:["Proceso 1"],prod:"",cust:"",ans:{}};saveVDA();}
 if(w==="all"){try{localStorage.removeItem(KIATF);}catch(_){}ifr().srcdoc=IATF_HTML;setTimeout(()=>{try{cloudPush("iatf",JSON.parse(localStorage.getItem(KIATF)));}catch(_){}},900);}setTimeout(()=>{paint();detail();},w==="all"?600:0);toast(x("Listo","Done"));}
/* eventos */
function setPath(o,p,v){const a=p.split("|");for(let i=0;i<a.length-1;i++){if(o[a[i]]==null)o[a[i]]={};o=o[a[i]];}o[a[a.length-1]]=v;}

document.addEventListener("click",e=>{
 const l=e.target.closest("[data-lang]");if(l){G.lang=l.dataset.lang;saveG();iatfLang();rerender();return;}
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==="back")return backLobby();
 if(a==="join"){joinRoom($("room").value);return;}
 if(a==="leave"){leaveRoom();return;}
 if(a==="open")return openMod(v);

 if(a==="export")return exportAll();
 if(a==="print")return window.print();
 if(a==="sqtab"){SQ.tab=+v;saveSQ();window.scrollTo(0,0);return sqView();}
 if(a==="sqcat"){SQ.cat=v;saveSQ();return sqView();}
 if(a==="sqexp"){SQ.exp=!SQ.exp;saveSQ();return sqView();}
 if(a==="sqprint")return sqPrint();
 if(a==="phview")return phView(b.dataset.id);
 if(a==="phdel")return phDel(b.dataset.item,b.dataset.id);
 if(a==="sqlv"){const o=SQ.ans[b.dataset.id]||(SQ.ans[b.dataset.id]={});o.lv=o.lv===+v?null:+v;saveSQ();return sqView();}
 if(a==="vtab"){VDA.tab=+v;saveVDA();return vdaView();}
 if(a==="vel"){VDA.el=v;saveVDA();return vdaView();}
 if(a==="vstep"){VDA.step=+v;saveVDA();return vdaView();}
 if(a==="vscope"){const s=VDA.scope;const i=s.indexOf(v);if(i>=0){if(s.length>1)s.splice(i,1);}else{s.push(v);s.sort();}saveVDA();return vdaView();}
 if(a==="vpre"){VDA.scope=v==="all"?["P2","P3","P4","P5","P6","P7"]:v==="P4"?["P4"]:["P5","P6","P7"];saveVDA();return vdaView();}
 if(a==="vadd"){VDA.steps.push(x("Proceso ","Process ")+(VDA.steps.length+1));saveVDA();return vdaView();}
 if(a==="vdel"){const i=+v;if(!confirm(x("¿Quitar este paso y sus respuestas de P6?","Remove this step and its P6 answers?")))return;VDA.steps.splice(i,1);const nn={};Object.keys(VDA.ans).forEach(k=>{if(k.includes("@")){const[q,n]=k.split("@");const j=+n;if(j===i)return;nn[q+"@"+(j>i?j-1:j)]=VDA.ans[k];}else nn[k]=VDA.ans[k];});VDA.ans=nn;VDA.step=0;saveVDA();return vdaView();}
 if(a==="vs"){const k=b.dataset.k;const o=VDA.ans[k]||(VDA.ans[k]={});const nv=v==="NE"?"NE":+v;o.s=o.s===nv?null:nv;saveVDA();return vdaView();}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.ph){const f=[].slice.call(t.files);t.value="";phAdd(t.dataset.ph,f);return;}if(t.dataset&&t.dataset.act==="sqannex"){SQ.annex=t.checked;saveSQ();}});
/* init */
chrome();buildCards();cloudInit();phLoad().then(()=>{if(cur==="sq")sqView();});
ifr().onload=()=>{try{ifr().contentWindow.eval('save=function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}try{parent.postMessage({t:"iatf"},"*");}catch(e){}};');}catch(_){}iatfLang();paint();detail();};
ifr().srcdoc=IATF_HTML;
detail();requestAnimationFrame(loop);
