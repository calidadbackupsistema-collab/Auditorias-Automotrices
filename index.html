 - \uC774\uD589\uC0C1\uD0DC \uC77C\uBD80 \uB204\uB77D\uC0AC\uD56D \uAE30\uC7AC

 \uC0AC\uB8401) \uBD80\uD488 \uC790\uC8FC\uAC80\uC0AC \uB610\uB294 \uC124\uBE44 \uC77C\uC0C1\uC810\uAC80 \uD56D\uBAA9\uC911 \uC5EC\uB7EC\uD56D\uBAA9 \uAC04\uD5D0\uC801 \uB204\uB77D \uB610\uB294 \uB3D9\uC77C\uD56D\uBAA9 \uC5F0\uC18D \uB204\uB77D
 \uC0AC\uB8402) \uC124\uBE44\uC810\uAC80 \uB2F4\uB2F9\uC790 \uBD80\uC7AC\uB85C \uC815\uAE30\uC810\uAC80 \uBBF8\uC9C4\uD589\uB418\uC5C8\uC73C\uB098, \uC2EC\uC0AC\uC804 \uC815\uAE30\uC810\uAC80 \uACB0\uACFC \uD5C8\uC704\uAE30\uC7AC \uC0AC\uC2E4 \uD655\uC778`,`1) \uC2DC\uD589 \uC0C1\uD0DC\uC5D0 \uB300\uD55C \uAD00\uCC30\uC0AC\uD56D \uAD6C\uCCB4\uC801 \uAE30\uC220 [\uB300\uCC45\uC218\uB9BD \uC694\uCCAD]
 - \uC774\uD589\uC0C1\uD0DC \uBBF8\uC2E4\uC2DC \uBC0F \uB2E4\uC218\uB204\uB77D \uC0AC\uD56D \uAE30\uC7AC

 Caso 1) En \u300EInspecci\xF3n de calidad del producto terminado (diaria)\u300F los \xEDtems 1)\u20136) tienen criterio pero los \xEDtems 8)\u201310) (3 \xEDtems) no

    - \uD45C\uC900\uB958(\uAD00\uB9AC\uACC4\uD68D\uC11C, \uC791\uC5C5\uD45C\uC900\uC11C, \uC124\uBE44\uC77C\uC0C1\uC810\uAC80\uD45C \uB4F1)\uC640 \uC2E4\uC81C\uACF5\uC815 \uC77C\uCE58\uC131 \uD655\uC778[\uAD00\uB9AC \uBD84\uB2F4 \uB4F1]
    - \uACE0\uAC1D\uACFC \uD611\uC758\uB41C \uAC80\uC0AC\uD611\uC815\uC11C/\uAC80\uC0AC\uAE30\uC900\uC11C \uAE30\uC900\uACFC \uC2E4\uC81C \uC5C5\uBB34\uC808\uCC28 \uC77C\uCE58\uC131
    - \uACF5\uC815 FMEA\uC791\uC131 \uBC0F \uC8FC\uC694 \uD488\uC9C8 \uBB38\uC11C \uB0B4\uC6A9\uACFC \uC5F0\uACC4\uC0C1\uD0DC \uD655\uC778
    - \uC8FC\uC694 \uD45C\uC900\uB958(\uC791\uC5C5\uD45C\uC900\uC11C \uB4F1) \uD604\uC7A5\uB0B4 \uAC8C\uC2DC \uC0C1\uD0DC
    - \uAD00\uB9AC\uACC4\uD68D\uC11C \uBC0F \uD604\uC7A5\uB0B4 \uD45C\uC900\uB958 \uC911\uC694\uACF5\uC815/\uC548\uC804 \uBCF4\uC548\uACF5\uC815 \uC2DD\uBCC4\uD45C\uC2DC\uAD00\uB9AC
    - \uC2E0\uADDC/\uC784\uC2DC\uC791\uC5C5\uC790 \uACF5\uC815\uD22C\uC785\uC804 \uC5C5\uBB34 R&R \uBA85\uD655\uD654, \uB2E8\uACC4\uBCC4 \uC791\uC5C5\uD45C\uC900\uC11C \uAC8C\uC2DC \uBC0F \uC804\uBB38\uC6A9\uC5B4 \uC0AC\uC6A9\uC9C0\uC591
    - \uACF5\uC815\uB0B4 \uC0AC\uC6A9\uB418\uB294 \uC124\uBE44 \uBC0F \uBD80\uC790\uC7AC\uB4F1\uC740 \uC0AC\uC804 \uAC80\uC99D\uC744 \uD1B5\uD574 \uD45C\uC900\uB958 \uBC18\uC601\uB418\uC5B4\uC57C \uD558\uBA70 \uBBF8\uC2B9\uC778 \uC124\uBE44 \uBC0F \uBD80\uC790\uC7AC \uC0AC\uC6A9 \uAE08\uC9C0
       ex) \uC870\uB9BD\uC131 \uD655\uBCF4\uB97C \uC704\uD55C \uBBF8\uC2B9\uC778 \uC5F4\uD48D\uAE30 \uBC0F \uC724\uD65C\uC81C \uC0AC\uC6A9\uB4F1`,es:`\u25A3 Elaboraci\xF3n y cumplimiento de los documentos est\xE1ndar
- Coincidencia de los est\xE1ndares (plan de control, instrucciones de trabajo, hoja de revisi\xF3n diaria de equipos, etc.) con el proceso real [incluye reparto de responsabilidades]
- Coincidencia de lo acordado con el cliente (acuerdo/est\xE1ndar de inspecci\xF3n) con el procedimiento de trabajo real
- Elaboraci\xF3n del AMEF de proceso y su v\xEDnculo con los principales documentos de calidad
- Publicaci\xF3n en piso de los est\xE1ndares principales (instrucciones de trabajo, etc.)
- Identificaci\xF3n de procesos cr\xEDticos/de seguridad en el plan de control y en los est\xE1ndares de piso
- Antes de asignar personal nuevo/temporal: definir roles y responsabilidades, publicar instrucciones por etapas y evitar t\xE9rminos t\xE9cnicos
- Los equipos y auxiliares usados en el proceso deben validarse previamente e incluirse en los est\xE1ndares; prohibido usar equipos o auxiliares no aprobados
   ej.) uso de pistola de aire caliente o lubricante no aprobados para facilitar el ensamble`},{id:"1_2",c:0,p:20,ko:`\u25A3 \uC124\uBE44 \uAC00\uB3D9\uC911\uB2E8(\uACC4\uD68D/\uBE44\uACC4\uD68D)\uD6C4 \uC7AC\uAC00\uB3D9\uC2DC \uC5C5\uBB34\uCC98\uB9AC \uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC124\uBE44 \uAC00\uB3D9\uC911\uB2E8 \uBC1C\uC0DD\uC2DC \uC124\uBE44\uC810\uAC80 \uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
      \u203B \uACC4\uD68D : \uAC00\uB3D9\uC911\uB2E8 \uC2DC\uAC04\uBCC4/\uC0AC\uC720\uBCC4 \uC810\uAC80\uC808\uCC28 \uC218\uB9BD \uBC0F \uC774\uD589
         \uBE44\uACC4\uD68D : \uC774\uC0C1\uBC1C\uC0DD \uAC00\uB3D9\uC911\uB2E8 \uBC1C\uC0DD\uC2DC \uC124\uBE44 \uC810\uAC80 \uC9C0\uCE68, \uC0DD\uC0B0\uC911\uC778 \uC81C\uD488\uC5D0 \uB300\uD55C \uD488\uC9C8\uBCF4\uC99D \uC5C5\uBB34\uC808\uCC28 \uC218\uB9BD \uBC0F \uC774\uD589
    - \uC124\uBE44\uC911\uB2E8/\uC774\uC0C1 \uBC1C\uC0DD\uC2DC(\uD234\uAD50\uD658 \uD3EC\uD568) \uC9C1\uC804 \uC0DD\uC0B0\uD488 \uC774\uC0C1\uC720\uBB34 \uAC80\uC0AC \uBC0F \uC124\uBE44\uC774\uC0C1 \uC870\uCE58\uD6C4 \uCD08\uD488 \uC774\uC0C1\uC720\uBB34 \uAC80\uC0AC \uBC0F \uAE30\uB85D\uAD00\uB9AC
       (\uC124\uBE44\uC911\uB2E8/\uC774\uC0C1 \uBC1C\uC0DD\uC2DC \uB610\uB294 \uC124\uBE44\uC774\uC0C1 \uC870\uCE58\uC911 \uC0DD\uC0B0\uBD80\uD488 \uBD88\uB7C9\uC73C\uB85C \uD3D0\uAE30 \uBC0F \uC218\uB7C9 \uC774\uB825\uAD00\uB9AC)
    - \uBE44\uACC4\uD68D \uAC00\uB3D9\uC911\uB2E8 \uBC1C\uC0DD\uC2DC \uC804/\uD6C4 \uC0DD\uC0B0\uC81C\uD488\uC5D0 \uB300\uD55C LOT \uAD6C\uBD84 \uAD00\uB9AC\uBC29\uC548 \uC218\uB9BD \uBC0F \uC2DD\uBCC4\uAD00\uB9AC \uC2E4\uC2DC
    - \uB85C\uBD07/\uC790\uB3D9\uD654\uC124\uBE44 \uC774\uC0C1 \uBC1C\uC0DD\uC2DC \uC791\uC5C5\uC790\uC758 \uACF5\uC815\uC870\uAC74(\uD30C\uB77C\uBA54\uD130, \uD2F0\uCE6D) \uC784\uC758\uBCC0\uACBD \uAE08\uC9C0 \uBC0F \uACF5\uC815\uC870\uAC74 \uBCC0\uACBD\uC5D0 \uB530\uB978 \uBD80\uD488\uD488\uC9C8 \uAC80\uC99D \uD544\uC694`,es:`\u25A3 Procedimiento de reinicio tras paro de equipo (planeado/no planeado)
- Procedimiento de revisi\xF3n del equipo ante un paro y su cumplimiento
  \u203B Planeado: procedimiento de revisi\xF3n seg\xFAn duraci\xF3n/motivo del paro. No planeado: gu\xEDa de revisi\xF3n del equipo ante paro por falla y procedimiento de aseguramiento de calidad del producto en proceso
- Ante paro/falla de equipo (incluye cambio de herramental): inspeccionar el producto inmediatamente anterior, y tras corregir la falla inspeccionar la primera pieza; llevar registro
  (llevar historial de la cantidad de piezas desechadas por defecto durante el paro/falla o la correcci\xF3n)
- Ante paro no planeado: definir e implementar la separaci\xF3n e identificaci\xF3n por LOTE del producto fabricado antes/despu\xE9s
- Ante falla de robot/automatizaci\xF3n: prohibido que el operador cambie a su criterio las condiciones de proceso (par\xE1metros, ense\xF1anza); si cambian, se debe verificar la calidad de la pieza`},{id:"1_3",c:0,p:10,ko:`\u25A3 \uC678\uAD6D\uC778 \uBC30\uCE58 \uC6B4\uC601\uACF5\uC815 \uD604\uC9C0\uC5B4 \uBC88\uC5ED/\uAC8C\uC2DC\uB41C \uD45C\uC900\uB958 \uBC18\uC601\uC0C1\uD0DC
    - \uC791\uC5C5\uD45C\uC900\uC11C, \uC124\uBE44\uC77C\uC0C1\uC810\uAC80 \uAE30\uC900\uD45C, \uC791\uC5C5\uC77C\uBCF4 \uB4F1 \uC678\uAD6D\uC778 \uBC30\uCE58\uACF5\uC815 \uD45C\uC900\uB958 \uD604\uC9C0\uC5B4 \uBC88\uC5ED \uAC8C\uC2DC\uC0C1\uD0DC
      : \uBD80\uC801\uD569 \uCC98\uB9AC\uC808\uCC28 \uBC0F \uC911\uC694 \uD488\uC9C8\uBB38\uC81C \uAC1C\uC120 \uC0AC\uB840\uB4F1 \uD488\uC9C8\uC758\uC2DD \uAC15\uD654\uBAA9\uC801 \uD45C\uC900\uB958 \uBC88\uC5ED \uAC8C\uC2DC (\uCD94\uAC00 \uAD00\uB9AC\uC2DC \uC6B0\uC218)
      \u203B \uD574\uB2F9\uACF5\uC815 \uC678\uAD6D\uC778\uC791\uC5C5\uC790 \uC8FC\uC694 \uD45C\uC900\uB958 \uAD50\uC721 \uBC0F \uB0B4\uC6A9 \uC219\uC9C0 \uC2DC \uD604\uC9C0\uC5B4 \uBC88\uC5ED\uAC8C\uC2DC \uBD88\uD544\uC694(\uD604\uC7A5\uD655\uC778 \uD544\uC694)`,es:`\u25A3 Traducci\xF3n al idioma local de los est\xE1ndares en procesos con personal extranjero
- Est\xE1ndares traducidos al idioma local y publicados (instrucciones de trabajo, criterios de revisi\xF3n diaria, reporte diario, etc.)
  : traducir y publicar el procedimiento de producto no conforme y casos de mejora de problemas cr\xEDticos para reforzar la conciencia de calidad (si se maneja adicionalmente, es sobresaliente)
  \u203B Si el personal extranjero del proceso fue capacitado en los est\xE1ndares principales y los domina, no se requiere traducci\xF3n publicada (verificar en piso)`},{id:"1_4",c:0,p:10,ko:`\u25A3 \uD488\uC9C8\uAD00\uB9AC \uCDE8\uC57D \uC2DC\uAC04\uB300 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uAD00\uB9AC\uC0C1\uD0DC (\uC8FC\uB9D0\uD2B9\uADFC \uBC0F \uBE44\uC9C0\uC815 \uC791\uC5C5\uC790 \uD22C\uC785\uC2DC\uD3EC\uD568)
    - \uAD50\uB300 \uC791\uC5C5\uC2DC \uC77C\uC0C1\uC810\uAC80, \uC790\uC8FC\uAC80\uC0AC \uBC0F \uC21C\uD68C\uAC80\uC0AC \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uAD00\uB9AC\uC0C1\uD0DC
    - \uAD50\uB300 \uC791\uC5C5\uC2DC \uACF5\uC815 Issue \uC0AC\uD56D \uC804\uB2EC \uC5EC\uBD80
      \u203B \uCD08/\uC885\uD488 \uAC80\uC0AC\uB294 \uD544\uC218, \uC911\uD488\uC740 \uC120\uD0DD\uC0AC\uD56D\uC73C\uB85C \uC790\uC728\uC801 \uAE30\uC900 \uC218\uB9BD\uD544\uC694, \uC911\uD488\uAC80\uC0AC \uBBF8\uC9C4\uD589\uB3C4 \uAC00\uB2A5, 
          \uB2E8, \uC0DD\uC0B0LOT\uAC00 \uC7A5\uAE30\uC801\uC77C\uACBD\uC6B0 \uCD5C\uC18C 1\uD68C/shift\uAC80\uC0AC \uC9C4\uD589 \uD544\uC694
      \u203B \uC778\uC6D0 \uBD80\uC871\uC73C\uB85C \uC57C\uAC04 \uAC80\uC0AC\uC694\uC6D0 \uBBF8 \uD22C\uC785 \uC2DC \uC57C\uAC04 \uC0DD\uC0B0\uD488 \uAC80\uC99D \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD
          (\uC57C\uAC04 \uC791\uC5C5 \uCD08\uC885 \uC0DD\uC0B0\uD488 \uC775\uC77C \uC8FC\uAC04 \uAC80\uC0AC\uC778\uC6D0 \uCD9C\uADFC\uC2DC \uAC80\uC0AC \uB4F1)`,es:`\u25A3 Criterios de control para horarios vulnerables en calidad (incluye fines de semana y personal no designado)
- Criterios y estado de la revisi\xF3n diaria, autoinspecci\xF3n e inspecci\xF3n de rondas en trabajo por turnos
- Transmisi\xF3n de los problemas del proceso entre turnos
  \u203B La inspecci\xF3n de primera y \xFAltima pieza es obligatoria; la intermedia es opcional (criterio propio), puede no hacerse; sin embargo, si el LOTE es largo, m\xEDnimo 1 inspecci\xF3n por turno
  \u203B Si por falta de personal no hay inspector nocturno, definir proceso de verificaci\xF3n de lo producido de noche (p. ej. inspeccionar primera/\xFAltima pieza nocturna al d\xEDa siguiente cuando llegue el inspector)`},{id:"1_5",c:0,p:30,ko:`\u25A3 \uC0DD\uC0B0\uD488\uBAA9\uBCC4 \uC6D0\uB2E8\uC704 \uC911\uB7C9 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC810\uAC80\uC0C1\uD0DC 
    - \uCC28\uC885\uBCC4/\uD488\uBAA9\uBCC4 1SHOT \uC0DD\uC0B0\uC2DC \uC18C\uC694 \uC0AC\uCD9C \uC911\uB7C9 \uC810\uAC80\uAE30\uC900 \uAE30\uC900 \uB9C8\uC2A4\uD130 \uC791\uC131
    - \uC6D0\uB2E8\uC704 \uC911\uB7C9 \uAD00\uB9AC \uB9C8\uC2A4\uD130 \uAE30\uC900 \uC6D4\uAC04\uB2E8\uC704 \uCD1D \uC0DD\uC0B0\uC2E4\uC801 \uB300\uBE44 \uC2E0\uC7AC \uD22C\uC785\uB7C9 \uC218\uC728\uAD00\uB9AC \uC2E4\uC801\uC810\uAC80(1\uD68C/\uC6D4 \uC810\uAC80)
    - \uC6D4\uAC04 \uCD1D \uC0DD\uC0B0\uC2E4\uC801 \uBC0F \uC2A4\uD06C\uB7A9 \uBC1C\uC0DD\uC2E4\uC801 \uB300\uBE44 \uB9E4\uAC01 \uB0B4\uC5ED \uBE44\uAD50\uAC80\uC99D(1\uD68C/\uC6D4 \uC774\uC0C1)
      \u203B \uC810\uAC80\uC790\uB8CC : \uC6D0\uB2E8\uC704 \uC911\uB7C9\uAD00\uB9AC \uB9C8\uC2A4\uD130, \uC0DD\uC0B0\uC77C\uBCF4, \uC2A4\uD06C\uB7A9 \uB9E4\uAC01\uB0B4\uC5ED\uC11C, \uC2A4\uD06C\uB7A9 \uBC30\uD569\uC77C\uC9C0 \uB4F1`,es:`\u25A3 Control de peso unitario por producto: criterios y revisi\xF3n
- Elaborar el maestro de peso de inyecci\xF3n requerido por disparo (1 SHOT) por modelo/producto
- Con base en el maestro, revisar mensualmente (1 vez/mes) el rendimiento de material virgen consumido contra la producci\xF3n total del mes
- Comparar y verificar (1 vez/mes o m\xE1s) la producci\xF3n total y el scrap generado contra lo vendido
  \u203B Documentos a revisar: maestro de peso unitario, reporte diario de producci\xF3n, detalle de venta de scrap, bit\xE1cora de mezcla de scrap, etc.`},{id:"1_6",c:0,p:30,ko:`\u25A3 \uC6D0\uC7AC\uB8CC \uC218\uBD84\uAD00\uB9AC \uC124\uC815\uADFC\uAC70 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC6D0\uC18C\uC7AC\uBCC4 \uC218\uBD84\uD568\uC720\uB7C9 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD (\uAE30\uC900\uC124\uC815 \uADFC\uAC70\uC790\uB8CC \uD655\uBCF4)
      \u203B \uBE44\uD568\uC2B5\uC131 \uC6D0\uC7AC\uB8CC \uB610\uB294 \uC218\uBD84\uD568\uC720\uB7C9 \uAD00\uB9AC \uBD88\uD544\uC694 \uC18C\uC7AC\uB294 \uADFC\uAC70 \uD655\uBCF4 \uC2DC(\uC6D0\uC7AC\uB8CC\uB0B4 \uC218\uBD84 \uD488\uC9C8\uC601\uD5A5\uC131 \uC5C6\uC74C) \uAD00\uB9AC \uBD88\uD544\uC694
          \u21D2 \uBBF8\uAC74\uC870 \uC0AC\uCD9C T/O\uD488 \uD488\uC9C8\uAC80\uC99D(\uC678\uAD00/\uC911\uB7C9/\uCE58\uC218/\uBB3C\uC131 \uB4F1) \uC790\uB8CC \uD655\uBCF4 \uD544\uC694
    - \uC18C\uC7AC\uBCC4 \uAC74\uC870\uC628\uB3C4, \uC2DC\uAC04 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD (\uAE30\uC900 \uC124\uC815 \uADFC\uAC70\uC790\uB8CC \uD655\uBCF4)
    - \uC0AC\uCD9C\uC2DC \uD488\uBAA9\uBCC4 \uAC74\uC870\uC628\uB3C4/\uC2DC\uAC04 \uC900\uC218\uC5EC\uBD80 \uC99D\uBE59\uC790\uB8CC \uAD00\uB9AC (\uAC74\uC870\uD638\uD37C \uAC00\uB3D9\uC2DC\uAC04 \uB4F1 \uC77C\uBCF4\uB0B4 \uAE30\uB85D\uAD00\uB9AC)`,es:`\u25A3 Fundamento y cumplimiento del control de humedad de materia prima
- Definir criterio de contenido de humedad por material (contar con evidencia del criterio)
  \u203B Para materiales no higrosc\xF3picos o que no requieren control de humedad: no se requiere control si hay evidencia (la humedad no afecta la calidad)
     \u21D2 Se requieren datos de verificaci\xF3n de calidad (apariencia/peso/dimensi\xF3n/propiedades, etc.) de piezas de prueba (T/O) inyectadas sin secar
- Definir criterios de temperatura y tiempo de secado por material (con evidencia del criterio)
- Evidencias de cumplimiento de temperatura/tiempo de secado por producto durante la inyecci\xF3n (registro diario, p. ej. horas de operaci\xF3n de la tolva secadora)`},{id:"1_7",c:0,p:30,ko:`\u25A3 \uC0AC\uCD9C \uC131\uD615\uACF5\uC815 \uC8FC\uC694 \uAD00\uB9AC\uC870\uAC74 \uC218\uB9BD \uBC0F \uAD00\uB9AC\uC0C1\uD0DC
    - \uC131\uD615\uC870\uAC74 \uAE30\uB85D \uD56D\uBAA9 \uBC0F \uC8FC\uAE30 \uAD00\uB9AC\uAE30\uC900 \uC124\uC815 \uBC0F  \uAE30\uB85D\uAD00\uB9AC \uC0C1\uD0DC(\uC131\uD615\uC870\uAC74 \uCD94\uC801\uAD00\uB9AC )
    - \uC131\uD615\uC870\uAC74 \uAD00\uB9AC\uAE30\uC900 \uC774\uD0C8\uC2DC \uC791\uC5C5\uC790 \uC778\uC9C0 \uAC00\uB2A5\uC5EC\uBD80
          (\uACBD\uAD11\uB4F1 \uBC0F \uACBD\uACE0\uC74C \uC791\uB3D9 \uB4F1 F/P \uC124\uCE58 \uB610\uB294 \uBAA8\uB2C8\uD130\uB9C1 \uC790\uCCB4 \uAE30\uC900 \uC218\uB9BD \uD544\uC694)
    - \uC131\uD615 \uC870\uAC74 (\uC81C\uD488\uBCC4 \uC131\uD615\uC870\uAC74 \uAE30\uC900, \uC124\uBE44\uACF5\uCC28 \uB204\uC801 \uD3EC\uD568)
          * \uC791\uB3D9\uC720 \uBC0F \uB0C9\uAC01\uC218 \uB4F1 \uAD00\uB9AC\uAE30\uC900 \uC2E4\uC81C\uD488 \uD488\uC9C8\uC601\uD5A5\uC131 \uACE0\uB824\uB41C \uC790\uCCB4\uAE30\uC900 \uC218\uB9BD
          * \uC0AC\uCD9C\uC678\uAD00 \uBD88\uB7C9(\uC6F0\uB4DC\uB77C\uC778 \uB4F1) \uBC29\uC9C0\uB97C \uC704\uD558\uC5EC \uACC4\uC808\uBCC4(\uB3D9\uC808\uAE30/\uD558\uC808\uAE30) \uC131\uD615\uC870\uAC74 \uC774\uC6D0\uD654 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uD544\uC694
    - \uAD8C\uC7A5\uC0AC\uD56D : \uB178\uC990\uC628\uB3C4(\uC218\uC9C0\uC628\uB3C4) : \xB15\u2103 / \uC791\uB3D9\uC720 \uC628\uB3C4 : \xB15\u2103 / \uB0C9\uAC01\uC218(\uC124\uBE44/\uAE08\uD615) \uC785/\uCD9C\uC218 \uC628\uB3C4\uCC28 3\u2103 \uC774\uB0B4\uB85C \uC124\uC815 
          * \uAE30\uD0C0 \uC131\uD615\uC870\uAC74(\uC555\uB825,\uC18D\uB3C4,\uC704\uCE58,\uACC4\uB7C9,\uC2DC\uAC04 \uB4F1) : \xB15%          \u21D2 \uD658\uC0B0\uCE58\uB85C \uAD00\uB9AC\uAE30\uC900 \uD45C\uC2DC\uD544\uC694
    - \uC628\uB3C4, \uC2DC\uAC04, \uC555\uB825, \uC18D\uB3C4, \uBCF4\uC555, \uCFE0\uC158\uB7C9 \uB4F1 \uD488\uBAA9\uBCC4 \uC131\uD615\uC870\uAC74 \uD45C\uC900\uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC
      \u203B \uAD00\uB9AC\uAE30\uC900 \uC0C1/\uD558\uD55C \uC14B\uD305\uC774 \uBD88\uAC00\uB2A5\uD55C \uB178\uD6C4 \uC7A5\uBE44\uC758 \uACBD\uC6B0 \uC815\uAE30\uC810\uAC80\uC744 \uD1B5\uD55C \uC14B\uD305\uAC12 \uC720\uD6A8\uC131 \uAC80\uC99D\uACB0\uACFC \uD655\uBCF4 \uD544\uC694
    - \uC0AC\uCD9C\uAE30 \uC0DD\uC0B0\uC911\uB2E8\uD6C4 \uC7AC\uAC00\uB3D9\uC2DC \uC6D0\uC18C\uC7AC \uD37C\uC9C0(\uC9DC\uB0B4\uAE30 \uC791\uC5C5) 100% \uC9C4\uD589 \uBC0F \uD37C\uC9D5 \uC2E4\uC2DC \uC774\uB825\uAD00\uB9AC(\uC2E4\uC2DC\uC77C\uC790, \uD37C\uC9C0\uB7C9)
      \u2192 \uB3D9\uC77C \uC6D0\uC18C\uC7AC\uC77C \uACBD\uC6B0\uC5D0\uB3C4 \uC2E4\uB9B0\uB354\uB0B4 \uD0C4\uD654\uB41C \uC6D0\uC18C\uC7AC \uD37C\uC9D5\uC791\uC5C5 \uC2E4\uC2DC \uD544\uC694
      \u203B\uC0AC\uCD9C \uC131\uD615\uC870\uAC74 \uBCC0\uACBD\uC2DC, \uC790\uC8FC\uAC80\uC0AC \uC9C0\uC815\uD56D\uBAA9 \u5916 \uBD80\uD488 \uC804\uCCB4 \uC678\uAD00/\uCE58\uC218/\uC0C1\uB300 \uB9E4\uCE6D\uBD80\uD488 \uC774\uC0C1\uC5EC\uBD80 \uCD94\uAC00 \uD655\uC778\uD544\uC694`,es:`\u25A3 Condiciones principales del proceso de moldeo por inyecci\xF3n: definici\xF3n y control
- Definir criterios de \xEDtems y frecuencia de registro de condiciones de moldeo y su registro (trazabilidad de condiciones de moldeo)
- Si se exceden los criterios de condici\xF3n de moldeo, \xBFel operador lo detecta?
  (instalar a prueba de error como luz/alarma sonora, o definir criterio propio de monitoreo)
- Condiciones de moldeo (criterio por producto, incluye acumulaci\xF3n de tolerancias del equipo)
  * Criterios propios para aceite hidr\xE1ulico, agua de enfriamiento, etc. considerando su efecto en la calidad real
  * Para evitar defectos de apariencia (l\xEDneas de soldadura, etc.), definir criterios de condiciones de moldeo diferenciados por temporada (invierno/verano)
- Recomendado: temperatura de boquilla (resina) \xB15\u2103 / aceite hidr\xE1ulico \xB15\u2103 / diferencia de temperatura entrada-salida del agua de enfriamiento (equipo/molde) dentro de 3\u2103
  * Otras condiciones (presi\xF3n, velocidad, posici\xF3n, dosificaci\xF3n, tiempo, etc.): \xB15%  \u21D2 mostrar el criterio en valores convertidos
- Est\xE1ndar y cumplimiento de condiciones de moldeo por producto: temperatura, tiempo, presi\xF3n, velocidad, presi\xF3n de sostenimiento, colch\xF3n, etc.
  \u203B En equipos antiguos que no permiten fijar l\xEDmites superior/inferior, obtener resultados de validaci\xF3n del valor de ajuste mediante revisi\xF3n peri\xF3dica
- Al reiniciar tras un paro, purgar 100 % la materia prima y llevar historial de purga (fecha, cantidad)
  \u2192 Aun con el mismo material se debe purgar el material carbonizado dentro del cilindro
  \u203B Si cambian las condiciones de moldeo, adem\xE1s de los \xEDtems de autoinspecci\xF3n, verificar apariencia/dimensiones/ensamble con piezas acopladas de toda la pieza`},{id:"1_8",c:0,p:20,ko:`\u25A3 \uD488\uBAA9\uBCC4 \uCD08\uAE30 \uD5C8\uC6A9\uBD88\uB7C9 \uAE30\uC900 \uC124\uC815 \uADFC\uAC70 \uBC0F \uC808\uCC28 \uC900\uC218\uC5EC\uBD80
    [ \uCD08\uAE30\uD5C8\uC6A9\uBD88\uB7C9 \uC124\uC815]
    - T/O \uC131\uD615\uC870\uAC74 \uAE30\uB85D, \uAE08\uD615 CAVITY\uBCC4 \uBBF8\uC131\uD615/\uC678\uAD00/\uCE58\uC218/\uC911\uB7C9 \uAC80\uC99D\uC744 \uD1B5\uD55C \uD3D0\uAE30\uC218\uB7C9 \uC14B\uD305\uC5EC\uBD80(\uAE30\uB85D\uBB3C)
    - T/O\uC2DC \uC131\uD615 \uC870\uAC74\uACFC \uD45C\uC900\uB958 \uC131\uD615\uC870\uAC74 \uC77C\uCE58\uC5EC\uBD80 \uD655\uC778
    [ \uCD08\uAE30\uD5C8\uC6A9\uBD88\uB7C9 \uCC98\uB9AC\uADDC\uC815 \uC900\uC218]
    - \uCD08\uAE30 \uD5C8\uC6A9\uBD88\uB7C9 \uD3D0\uAE30\uC870\uAC74 \uD45C\uC900 \uC218\uB9BD\uC5EC\uBD80(\uC124\uBE44 \uC774\uC0C1\uC815\uC9C0\uD6C4 \uC7AC\uAC00\uB3D9\uC2DC, \uC0AC\uCD9C\uC870\uAC74 \uBCC0\uACBD\uC2DC, \uC2DC\uC5C5\uC2DC \uB4F1 \uC0C1\uD669\uBCC4 \uD3D0\uAE30\uC870\uAC74 \uC218\uB9BD)
    - \uC5C5\uBB34\uC808\uCC28 \uD604\uC7A5\uB0B4 \uAC8C\uC2DC\uC0C1\uD0DC, \uAE30\uB85D\uBB3C(\uC791\uC5C5\uC77C\uBCF4 or \uC790\uC8FC\uAC80\uC0AC \uCCB4\uD06C\uC2DC\uD2B8) \uC791\uC131\uC0C1\uD0DC, \uD604\uC7A5\uB0B4 \uCD08\uAE30\uD5C8\uC6A9\uBD88\uB7C9 \uD3D0\uAE30\uD488 \uC0DD\uC0B0\uC911 \uBCF4\uAD00`,es:`\u25A3 Fundamento y cumplimiento del procedimiento de defecto inicial permitido por producto
  [Definici\xF3n del defecto inicial permitido]
- Registro de condiciones de moldeo en T/O, y definici\xF3n de la cantidad a desechar mediante verificaci\xF3n por CAVIDAD del molde de no llenado/apariencia/dimensi\xF3n/peso (registros)
- Verificar que las condiciones de moldeo en T/O coincidan con las de los est\xE1ndares
  [Cumplimiento de la norma de defecto inicial permitido]
- Existencia de est\xE1ndar de condiciones de descarte del defecto inicial (por situaci\xF3n: reinicio tras paro por falla, cambio de condiciones de inyecci\xF3n, inicio de turno, etc.)
- Publicaci\xF3n del procedimiento en piso, llenado de registros (reporte diario o checklist de autoinspecci\xF3n) y resguardo en piso del descarte de defecto inicial durante la producci\xF3n`},{id:"1_9",c:0,p:30,ko:`\u25A3 \uC0AC\uCD9C \uC131\uD615\uC2DC \uC6D0\uC18C\uC7AC \uC218\uBD84\uD568\uC720\uB7C9 \uAC80\uC99D \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC218\uBD84\uD568\uC720\uB7C9 \uAC80\uC99D \uC628\uB3C4 \uBC0F \uC2DC\uAC04 \uC124\uC815 \uC801\uD569\uC131
      \u203B \uAD8C\uC7A5\uC0AC\uD56D
          1) \uD14C\uC2A4\uD2B8 \uC628\uB3C4 : \uC6D0\uC18C\uC7AC \uAC74\uC870\uD638\uD37C \uC628\uB3C4\uC640 \uB3D9\uC77C\uD558\uAC8C \uC124\uC815
          2) \uAC80\uC99D\uC2DC\uAC04 : \uC218\uBD84\uD568\uC720\uB7C9 \uC99D\uAC00\uAC00 \uC548\uB418\uB294 \uC2DC\uAC04\uAE4C\uC9C0 \uC124\uC815[\uC218\uB3D9\uBAA8\uB4DC], \uC218\uBD84\uD568\uC720\uB7C9 \uC99D\uAC00\uC728 0.01%\uBBF8\uB9CC\uC77C\uB54C \uBA48\uCDA4[\uC790\uB3D9\uBAA8\uB4DC]
    - \uC591\uC0B0\uACF5\uC815 \uD488\uBAA9\uBCC4 \uC6D0\uC18C\uC7AC \uC218\uBD84\uD568\uC720\uB7C9 \uAC80\uC99D \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD[\uC124\uBE44 \uC7AC\uAC00\uB3D9\uC2DC \uAC80\uC99D \uD544\uC694, \uC5F0\uC18D \uAC00\uB3D9\uC77C\uACBD\uC6B0 \uB9E4\uC77C\uCE21\uC815 \uBD88\uD544\uC694]
      \u21D2 \uC218\uBD84\uD568\uC720\uB7C9 \uAC80\uC99D \uC5C5\uBB34\uC808\uCC28 \uC218\uB9BD \uBC0F \uC774\uD589\uC0C1\uD0DC(\uAC74\uC870\uC124\uBE44 \uC911\uB2E8 \uD6C4 \uC7AC\uAC00\uB3D9\uC2DC, \uC6D0\uC18C\uC7AC \uC0AC\uC591 \uBCC0\uACBD\uC2DC \uB4F1)
      \u203B \uC218\uBD84\uD568\uC720\uB7C9 \uAC80\uC99D\uC740 \uC0DD\uC0B0 \uAC1C\uC2DC\uC804 \uC0AC\uC804 \uAC80\uC99D\uD1A0\uB85D \uAE30\uC900\uC218\uB9BD \uBC0F \uC99D\uBE59 \uAD00\uB9AC \uD544\uC694
    - \uC0DD\uC0B0 \uAE30\uC900\uBCC4(\uC5F0\uC18D\uAC00\uB3D9 \uC0DD\uC0B0) \uC2DC\uC5C5\uC2DC \uC218\uBD84\uCE21\uC815 \uC810\uAC80\uC774\uB825 \uC2E0\uB8B0\uB3C4 \uD655\uC778 (\uCE21\uC815\uAE30 \uCD9C\uB825 \uB370\uC774\uD130 \uB4F1 \uC99D\uBE59 \uC720\uD6A8\uC131 \uD655\uC778)`,es:`\u25A3 Proceso de verificaci\xF3n de humedad de la materia prima en el moldeo por inyecci\xF3n
- Adecuaci\xF3n de la temperatura y tiempo de verificaci\xF3n de humedad
  \u203B Recomendado
     1) Temperatura de prueba: igual a la de la tolva secadora de la materia prima
     2) Tiempo de verificaci\xF3n: hasta que la humedad deje de aumentar [modo manual]; detener cuando el aumento de humedad sea menor a 0.01 % [modo autom\xE1tico]
- Definir el proceso de verificaci\xF3n de humedad por producto en producci\xF3n [verificar al reiniciar el equipo; en operaci\xF3n continua no es necesaria la medici\xF3n diaria]
  \u21D2 Procedimiento y cumplimiento (al reiniciar tras paro del secador, al cambiar la especificaci\xF3n del material, etc.)
  \u203B La verificaci\xF3n de humedad debe definirse y evidenciarse antes de iniciar la producci\xF3n
- Confiabilidad del historial de medici\xF3n de humedad al inicio de turno (producci\xF3n continua) (validez de evidencias como datos de salida del medidor)`},{id:"1_10",c:0,p:10,ko:`\u25A3 \uC0AC\uCD9C \uC131\uD615\uACF5\uC815 \uC678 \uACF5\uC815\uAD00\uB9AC \uC6B4\uC601\uC2E4\uD0DC (\uBD84\uC1C4 \uBC0F \uBC30\uD569\uACF5\uC815, \uC735\uCC29\uACF5\uC815 \uC5C6\uC744\uC2DC '\uD574\uB2F9\uC5C6\uC74C' \uCC98\uB9AC)
    1) \uBD84\uC1C4 \uBC0F \uBC30\uD569 \uACF5\uC815
        - \uC7AC\uB8CC\uBCC4/\uD488\uBAA9\uBCC4 \uC2E0\uC7AC, \uC2A4\uD06C\uB7A9 \uD63C\uD569 \uAD00\uB9AC\uAE30\uC900 \uC124\uC815 \uBC0F \uACE0\uAC1D\uC0AC \uC2B9\uC778(\uD611\uC758)\uC5EC\uBD80
        - \uC2E0\uC7AC, \uC2A4\uD06C\uB7A9 \uD63C\uD569 \uC0AC\uC6A9\uC2DC \uC6D0\uC18C\uC7AC \uBB3C\uC131 MS-SPEC \uB9CC\uC871\uC5EC\uBD80 \uAC80\uC99D\uC790\uB8CC
        - \uC0DD\uC0B0 LOT\uBCC4 \uD63C\uD569\uC77C\uC9C0(\uBC30\uD569\uC77C\uC9C0) \uAE30\uB85D\uC0C1\uD0DC
        - \uBE44\uADDC\uACA9 \uC6D0\uC18C\uC7AC \uC0AC\uC6A9\uC5EC\uBD80 : \uC678\uC8FC \uD611\uB825\uC0AC\uB85C\uBD80\uD130 \uC7AC\uC0DD\uC7AC \uAD6C\uC785 \uC0AC\uC6A9\uC2DC SQ \uBD88\uD569\uACA9 \uCC98\uB9AC
    2) \uC735\uCC29 \uACF5\uC815
        - \uC735\uCC29\uC124\uBE44 \uC14B\uD305\uAE30\uC900 \uC124\uC815('H'\uBC29\uD5A5 \uC735\uCC29 \uB192\uC774) \uBC0F \uC735\uCC29 \uAD6C\uAC04\uBCC4 \uC678\uAD00/\uC774\uD0C8\uB825 \uBCF4\uC99D \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD
        - \uAE30\uBC00 \uC735\uCC29\uBAA9\uC801 \uC804\uB458\uB808 \uC735\uCC29\uC2DC \uB9AC\uD06C\uAC80\uC0AC \uB610\uB294 \uC735\uCC29\uBA74\uB2F9 \uC735\uCC29\uB3CC\uAE30 \uD488\uC9C8\uBCF4\uC99D \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD`,es:`\u25A3 Procesos distintos al moldeo por inyecci\xF3n (si no hay molienda/mezcla ni soldadura por fusi\xF3n: 'No aplica')
  1) Proceso de molienda y mezcla
   - Criterio de mezcla de material virgen y scrap por material/producto y aprobaci\xF3n (acuerdo) del cliente
   - Evidencia de que las propiedades del material con mezcla virgen+scrap cumplen la especificaci\xF3n MS-SPEC
   - Registro de la bit\xE1cora de mezcla por LOTE de producci\xF3n
   - Uso de material no est\xE1ndar: si se compra material reciclado a un proveedor externo, el SQ se considera reprobado
  2) Proceso de fusi\xF3n (soldadura)
   - Criterio de ajuste del equipo de fusi\xF3n (altura de fusi\xF3n direcci\xF3n 'H') y proceso que asegure apariencia/fuerza de desprendimiento por tramo de fusi\xF3n
   - Si es fusi\xF3n de toda la circunferencia por hermeticidad: proceso de aseguramiento con prueba de fuga o con calidad de la nervadura de fusi\xF3n por superficie`},{id:"2_1",c:1,p:40,ko:`\u25A3 \uC218\uC785\uAC80\uC0AC \uC2E4\uC2DC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uAC80\uC0AC\uD611\uC815\uC11C/\uAE30\uC900\uC11C \uCCB4\uACB0\uC0C1\uD0DC(\uC0AC\uAE09\uD488\uC740 1\uCC28 \uD611\uB825\uC0AC\uAC00 \uCCB4\uACB0\uD55C \uAC80\uC0AC\uD611\uC815\uC11C \uC0AC\uBCF8 \uC811\uC218 \uBC0F \uB3D9\uC77C \uC2DC\uB8CC/\uC8FC\uAE30\uB85C \uAC80\uC0AC \uC2E4\uC2DC \uD544\uC694)
        \u2192 \uAC80\uC0AC\uD611\uC815 \uCCB4\uACB0\uC774 \uC5B4\uB824\uC6B8 \uC2DC \uAC80\uC0AC\uAE30\uC900\uC11C \uC218\uB9BD\uC73C\uB85C \uB300\uCCB4 (\uC608: \uB300\uAE30\uC5C5 \uACF5\uAE09 \uC6D0\uC7AC\uB8CC,\uB3C4\uAE08\uC5C5\uC885 \uB4F1)
    - \uC678\uC8FC\uD488 \uC785\uACE0 \uC2DC \uC678\uC8FC\uC0AC \uCD9C\uD558\uC131\uC801\uC11C \uC811\uC218 \uBC0F \uC218\uC785\uAC80\uC0AC \uC2E4\uCE21\uAC12 \uBE44\uAD50\uAC80\uC99D \uC5EC\uBD80
    - \uC6D0\uC7AC\uB8CC M/SHEET \uC811\uC218 \uC2DC \uBB3C\uC131 \uBC0F \uD654\uD559\uC870\uC131\uBE44 \uD569/\uBD80 \uD310\uB2E8\uAE30\uC900 \uBA85\uD655\uD654 \uC218\uB9BD
    - \uC785\uACE0 LOT\uC640 \uCD9C\uD558\uAC80\uC0AC \uC131\uC801\uC11C\uB0B4 LOT \uC77C\uCE58\uC131 \uD655\uBCF4\uC5EC\uBD80(\uC6D0\uC18C\uC7AC\uC758 \uACBD\uC6B0 M/SHEET\uB0B4 \uAC80\uC0AC\uC2DC\uB8CC LOT \uC77C\uCE58\uC131)
    - \uAC80\uC0AC\uD611\uC815\uC11C/\uAE30\uC900\uC11C\uC5D0 \uC900\uD55C \uC77C\uC0C1\uAC80\uC0AC/\uC815\uAE30\uAC80\uC0AC \uC2E4\uC2DC\uC0C1\uD0DC
    - \uC6A9\uAE30/\uD3EC\uC7A5 \uC801\uC815\uC131 (\uD544\uC694\uC2DC \uC81C\uC804 \uBE44\uB2D0/\uBC15\uC2A4, \uC774\uBB3C\uC9C8 \uC720\uC785 \uBC29\uC9C0, \uC81C\uD488\uAC04 \uAC04\uC12D \uBC29\uC9C0,
       \uBB3C\uB958 \uC774\uB3D9\uC2DC \uC81C\uD488 \uD6FC\uC190 \uBC29\uC9C0,\uC0AC\uC591 \uC2DD\uBCC4, \uC624\uC870\uB9BD \uBC29\uC9C0, \uC774\uBB3C\uC9C8 \uC720\uC785\uBC29\uC9C0, \uCCB4\uACB0\uBD80 \uC88C\uBA74\uC0C1\uD0DC, \uCDE8\uAE09 \uC6A9\uC774\uC131) 
       \uBC0F \uC2B5\uB3D9\uBD80/\uB9E4\uCE6D\uBD80 \uB2E8\uD488 \uCE58\uC218\uAC80\uC0AC \uC0C1\uD0DC
    - \uB2E4 CAVITY \uC81C\uD488\uC758 \uACBD\uC6B0 CAVITY\uBCC4 \uAC80\uC0AC \uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218 \uC0C1\uD0DC
      \u203B \uC810\uAC80\uAE30\uC900\uC740 CAVITY \uCD1D \uC218\uB7C9 \uACE0\uB824 \uD569\uB9AC\uC801\uC778 \uC810\uAC80\uC8FC\uAE30 \uC124\uC815(\uC77C\uC0C1/\uC815\uAE30) \uBC0F \uC774\uD589\uD544\uC694
          \uC608) \uC77C\uC0C1 : 10 \uCE90\uBE44\uD2F0\u2193 : \uC804\uCE90\uBE44\uD2F0 \uAC80\uC0AC,  11 \uCE90\uBE44\uD2F0\u2191 : \uD640\uC218\uC77C Lot \uD640\uC218 \uCE90\uBE44\uD2F0/\uC9DD\uC218\uC77C Lot \uC9DD\uC218 \uCE90\uBE44\uD2F0 \uAC80\uC0AC
               \uC815\uAE30 : \uC804 \uCE90\uBE44\uD2F0 \uAC80\uC0AC`,es:`\u25A3 Criterios y cumplimiento de la inspecci\xF3n de recepci\xF3n
- Estado del acuerdo/est\xE1ndar de inspecci\xF3n (para material consignado: recibir copia del acuerdo del proveedor de 1er nivel e inspeccionar con la misma muestra/frecuencia)
   \u2192 Si es dif\xEDcil firmar acuerdo, se puede sustituir con un est\xE1ndar de inspecci\xF3n (ej.: materia prima de grandes empresas, giro de recubrimiento)
- Al recibir piezas externas: recibir el certificado de embarque del proveedor y comparar con los valores medidos en la inspecci\xF3n de recepci\xF3n
- Al recibir la hoja de datos (M/SHEET) de materia prima: definir claramente el criterio de aprobaci\xF3n de propiedades y composici\xF3n qu\xEDmica
- Coincidencia del LOTE recibido con el LOTE del certificado de inspecci\xF3n (en materia prima, con el LOTE de la muestra del M/SHEET)
- Inspecci\xF3n diaria/peri\xF3dica conforme al acuerdo/est\xE1ndar de inspecci\xF3n
- Adecuaci\xF3n del contenedor/empaque (seg\xFAn necesidad: bolsa/caja antiest\xE1tica, evitar ingreso de contaminantes, evitar interferencia entre piezas, evitar da\xF1o en traslado, identificar especificaci\xF3n, evitar mal ensamble, estado de las superficies de apoyo, facilidad de manejo) e inspecci\xF3n dimensional de piezas individuales de zonas deslizantes/de acople
- Para productos multicavidad: criterio de inspecci\xF3n por CAVIDAD y su cumplimiento
  \u203B Definir frecuencia razonable (diaria/peri\xF3dica) considerando el total de cavidades
     ej.) Diaria: \u226410 cavidades: todas; \u226511 cavidades: d\xEDa impar \u2192 LOTE cavidades impares / d\xEDa par \u2192 cavidades pares
          Peri\xF3dica: todas las cavidades`},{id:"2_2",c:1,p:10,ko:`\u25A3 \uC218\uC785\uAC80\uC0AC \uB204\uB77D\uBC29\uC9C0 \uC808\uCC28 \uC218\uB9BD(\uC218\uC785\uAC80\uC0AC \uB300\uC7A5 LIST \uC791\uC131) \uBC0F \uC900\uC218 \uC0C1\uD0DC
    - \uC678\uC8FC\uD488 \uC785\uACE0\uC2DC \uC218\uC785\uAC80\uC0AC \uB9C8\uC2A4\uD130 \uAD00\uB9AC \uB300\uC7A5 \uC791\uC131\uC744 \uD1B5\uD55C \uAC80\uC0AC \uB204\uB77D \uC608\uBC29
    - \uC218\uC785\uAC80\uC0AC \uC2E4\uC2DC \uC804 \uC678\uC8FC\uD488/\uC6D0\uC7AC\uB8CC \uC785\uACE0\uCC98\uB9AC \uC548\uB418\uB3C4\uB85D \uC5C5\uBB34 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD
    - \uC218\uC785\uAC80\uC0AC \uC644\uB8CC\uD488 \uC2DD\uBCC4 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD (\uD569\uACA9\uB3C4\uC7A5 \uB4F1)`,es:`\u25A3 Procedimiento para evitar omisi\xF3n de la inspecci\xF3n de recepci\xF3n (registro maestro de inspecci\xF3n de recepci\xF3n)
- Prevenir omisiones mediante un registro maestro de inspecci\xF3n de recepci\xF3n al ingresar piezas externas
- Proceso para que piezas externas/materia prima no se den de alta en almac\xE9n antes de la inspecci\xF3n de recepci\xF3n
- Proceso de identificaci\xF3n de lo ya inspeccionado (sello de aprobado, etc.)`},{id:"2_3",c:1,p:10,ko:`\u25A3 \uAC80\uC0AC\uC6A9 \uB9C8\uC2A4\uD130(\uD55C\uB3C4\uACAC\uBCF8) \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC678\uC8FC\uD488/\uC644\uC131\uD488 \uC678\uAD00 \uD569/\uBD80 \uD310\uBCC4\uC6A9 \uD55C\uB3C4\uACAC\uBCF8 \uC6B4\uC601
    - \uC124\uBE44 \uC720\uD6A8\uC131 \uD655\uBCF4\uC6A9 \uD55C\uB3C4\uACAC\uBCF8 \uB610\uB294 \uC14B\uD305 \uB9C8\uC2A4\uD130\uC9C0\uADF8 \uC81C\uC791\uAD00\uB9AC (\uC2DC\uC5C5\uC2DC \uB9C8\uC2A4\uD130 \uC774\uC6A9\uD55C \uC124\uBE44 \uC720\uD6A8\uC131 \uAC80\uC99D \uC2E4\uC2DC)
    - \uAC80\uC0AC\uAE30 \uC2E0\uB8B0\uB3C4 \uD655\uC778\uC744 \uC704\uD55C OK/NG \uB9C8\uC2A4\uD130 \uC124\uC815\uAE30\uC900 \uBC0F \uAD00\uB9AC\uC0C1\uD0DC
    - \uD55C\uB3C4\uACAC\uBCF8\uC758 \uBCC0\uC0C9, \uBCC0\uD615, \uB179 \uBC1C\uC0DD \uB4F1\uC73C\uB85C \uC2E4\uC81C \uACAC\uBCF8\uD488 \uC6B4\uC601\uC774 \uC5B4\uB824\uC6B8 \uACBD\uC6B0 \uC678\uAD00\uAC80\uC0AC\uAE30\uC900\uC11C\uB85C \uB300\uCCB4 \uAC00\uB2A5
    - \uBAA9\uC2DC\uAC80\uC0AC(\uD655\uB300\uACBD) \uD55C\uB3C4\uACAC\uBCF8 \uBE44\uCE58, \uAD00\uB9AC \uBC0F \uC774\uB825\uAD00\uB9AC    `,es:`\u25A3 Criterios y cumplimiento de maestros de inspecci\xF3n (muestras l\xEDmite)
- Operar muestras l\xEDmite para juzgar apariencia OK/NG de piezas externas/producto terminado
- Elaborar y controlar muestras l\xEDmite o maestros/dispositivos de ajuste para asegurar la validez del equipo (verificar el equipo con el maestro al inicio de turno)
- Criterio y control de maestros OK/NG para confirmar la confiabilidad de las m\xE1quinas de inspecci\xF3n
- Si por decoloraci\xF3n, deformaci\xF3n u oxidaci\xF3n de la muestra l\xEDmite no es viable operarla, se puede sustituir con un est\xE1ndar de inspecci\xF3n de apariencia
- Disponer, controlar y llevar historial de muestras l\xEDmite para inspecci\xF3n visual (lupa)`},{id:"2_4",c:1,p:30,ko:`\u25A3 \uC815\uAE30\uAC80\uC0AC(\uC2E0\uB8B0\uC131 \uC2DC\uD5D8 \uD3EC\uD568) \uC2E4\uC2DC\uACC4\uD68D \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC (\uC2E4\uC2DC\uACB0\uACFC \uC2E0\uB8B0\uC131 \uD655\uBCF4 \uC694\uAD6C\uB428)
    - \uC815\uAE30 \uC2DC\uD5D8 \uC131\uC801\uC11C \uC2E0\uB8B0\uB3C4 \uD655\uBCF4
      (\uC131\uC801\uC11C \uC2DC\uD5D8 \uC804/\uD6C4 \uC0AC\uC9C4 \uCCA8\uBD80, \uC81C\uC870 LOT\uD45C\uAE30, \uC0AC\uC9C4\u5167 \uC2DC\uD5D8 \uB0A0\uC9DC\uD45C\uC2DC, \uACC4\uCE21\uAE30 \uC804\uC0B0 \uC5F0\uB3D9\uC2DC \uC6D0\uBCF8\uB370\uC774\uD130 \uC800\uC7A5\uAD00\uB9AC \uB4F1)
    - \uD658\uACBD\uADDC\uC81C(\uC911\uAE08\uC18D) \uC815\uAE30\uC2DC\uD5D8 \uC2E4\uC2DC\uC0C1\uD0DC : \uAC80\uC0AC\uD611\uC815 \uCCB4\uACB0\uAE30\uC900 \uC2DC\uD5D8\uACB0\uACFC \uC99D\uBE59\uAD00\uB9AC \uC0C1\uD0DC
      (\uC2DC\uD5D8\uC7A5\uBE44 \uBCF4\uC720\uC2DC \uC790\uCCB4 \uC131\uC801\uC11C \uC778\uC815, \uBBF8\uBCF4\uC720\uC2DC 1\uCC28\uC0AC \uB610\uB294 \uACF5\uC778\uAE30\uAD00 \uC758\uB8B0 \uAC00\uB2A5)`,es:`\u25A3 Plan y cumplimiento de inspecciones peri\xF3dicas (incluye pruebas de confiabilidad) (se exige confiabilidad de resultados)
- Asegurar la confiabilidad de los reportes de pruebas peri\xF3dicas
  (fotos antes/despu\xE9s de la prueba en el reporte, LOTE de fabricaci\xF3n, fecha de prueba en la foto, guardar datos originales si el instrumento est\xE1 conectado a sistema, etc.)
- Pruebas peri\xF3dicas de regulaci\xF3n ambiental (metales pesados): evidencia de resultados seg\xFAn lo acordado en el acuerdo de inspecci\xF3n
  (si hay equipo de prueba, se acepta reporte propio; si no, se puede solicitar al proveedor de 1er nivel o a un organismo acreditado)`},{id:"2_5",c:1,p:10,ko:`\u25A3 \uACC4\uCE21\uAE30/\uAC80\uC0AC\uAD6C \uBCF4\uC720 \uBC0F \uC2E0\uB8B0\uC131 \uD655\uBCF4\uC0C1\uD0DC (\uAC80\uAD50\uC815 \uC8FC\uAE30\uC124\uC815, \uAD50\uC815\uC0C1\uD0DC)
    - \uAC80\uC0AC\uD611\uC815 \uCCB4\uACB0\uAE30\uC900 \uC2DC\uD5D8\uD56D\uBAA9 \uC790\uCCB4\uC2DC\uD5D8 \uAC00\uB2A5\uD55C \uACC4\uCE21\uC7A5\uBE44 \uBCF4\uC720\uC0C1\uD0DC (\uC815\uAE30 \uC2E0\uB8B0\uC131 \uD56D\uBAA9\uBCC4 \uACC4\uCE21\uAE30 \uC9C0\uC815 \uBC0F \uC900\uC218\uD544\uC694)
      \u203B \uACE0\uAC00 \uACC4\uCE21\uAE30 \uB4F1 \uC790\uCCB4\uAC80\uC99D \uBD88\uAC00\uB2A5 \uC2DC\uD5D8 \uD56D\uBAA9\uC758 \uACBD\uC6B0 1\uCC28 \uD611\uB825\uC0AC \uB610\uB294 \uACF5\uC778\uAE30\uAD00\uC2DC\uD5D8 \uC778\uC815
          (\uC608 : 3\uCC28\uC6D0 \uCE21\uC815\uAE30, \uC131\uBD84\uBD84\uC11D\uAE30 \uB4F1)\uB418\uB098 \uC2DC\uD5D8\uACB0\uACFC \uC811\uC218 \uBC0F \uC774\uC0C1\uBC1C\uC0DD \uC5EC\uBD80 \uAC80\uD1A0 \uD544\uC694
    - \uACC4\uCE21\uAE30 \uAC80\uAD50\uC815 \uACC4\uD68D \uB300\uBE44 \uC2E4\uC801\uAD00\uB9AC \uC0C1\uD0DC (\uACC4\uCE21\uAE30 \uAC80\uAD50\uC815 \uC131\uC801\uC11C/\uD14C\uADF8 \uAD00\uB9AC)
      \u203B \uAC80\uAD50\uC815 \uC790\uACA9\uC778\uC99D \uC778\uC6D0 \uBCF4\uC720 \uD611\uB825\uC0AC\uB294 \uC790\uCCB4 \uAC80\uC99D \uADFC\uAC70 \uD655\uBCF4\uC2DC \uC778\uC815
      \u203B \uAC80\uAD50\uC815 \uC2E4\uC2DC \uD6C4 \uBD88\uD655\uB3C4 \uACE0\uB824 \uD569/\uBD80 \uD310\uC815 \uC2E4\uC2DC (\uD310\uC815 \uAE30\uC900 \uC218\uB9BD)
         \u2192 \uC2E0\uB8B0\uC218\uC900 95%\uAE30\uC900\uC73C\uB85C \uCE21\uC815\uB41C \uBD88\uD655\uB3C4 \uB300\uBE44 \uCE21\uC815\uB300\uC0C1 \uAD00\uB9AC \uACF5\uCC28\uAC00 4\uBC30 \uC774\uC0C1\uC2DC \uC0AC\uC6A9 \uAC00\uB2A5
             \uC608) \uC2E0\uB8B0\uC218\uC900 95% \uAE30\uC900 \uBD88\uD655\uB3C4 0.002mm\uC778 \uACC4\uCE21\uC7A5\uBE44\uB294 \uAD00\uB9AC\uACF5\uCC28 \xB10.008mm \uC774\uC0C1\uC774 \uBD80\uD488\uB9CC \uCE21\uC815\uAC00\uB2A5 (1:4 \uBE44\uC728 \uBC18\uC601)
    - \uC8FC\uC694 \uAC80\uC0AC\uAD6C \uC720\uD6A8\uC131 \uD655\uBCF4\uC5EC\uBD80 \uC810\uAC80\uACB0\uACFC(\uAC80\uC0AC\uAD6C \uC0AC\uC6A9\uC2DC \uB9C8\uBAA8,\uC720\uACA9 \uBC1C\uC0DD\uC5D0 \uB530\uB978 \uCE21\uC815 \uC720\uD6A8\uC131 \uD655\uC778 \uD544\uC694)
         \uC608) \uC0AC\uCD9C\uD488 \uCE21\uC815\uC6A9 \uAC80\uC0AC\uAD6C 3\uCC28\uC6D0 \uB370\uC774\uD130 \uCE21\uC815\uACB0\uACFC, \uCE58\uC218 \uBCF4\uC99D\uB41C \uC81C\uD488\uC744 \uD1B5\uD55C \uC790\uCCB4 \uBE44\uAD50\uAC80\uC99D \uB370\uC774\uD130 \uB4F1`,es:`\u25A3 Disponibilidad y confiabilidad de instrumentos/calibres (frecuencia de calibraci\xF3n, estado de calibraci\xF3n)
- Disponer de instrumentos para realizar las pruebas del acuerdo de inspecci\xF3n por cuenta propia (designar y cumplir instrumento por cada prueba peri\xF3dica de confiabilidad)
  \u203B Para pruebas que no pueden verificarse internamente (instrumentos costosos, p. ej. CMM, analizador de composici\xF3n), se acepta prueba del proveedor de 1er nivel u organismo acreditado, pero se debe recibir el resultado y revisar anomal\xEDas
- Control del plan vs real de calibraci\xF3n (certificados/etiquetas de calibraci\xF3n)
  \u203B Si el proveedor cuenta con personal acreditado para calibraci\xF3n, se acepta con evidencia de verificaci\xF3n propia
  \u203B Tras calibrar, juzgar aprobado/rechazado considerando la incertidumbre (definir criterio)
     \u2192 Se puede usar si, con nivel de confianza del 95 %, la tolerancia de control de lo medido es \u2265 4 veces la incertidumbre
         ej.) Un instrumento con incertidumbre 0.002 mm (95 %) solo puede medir piezas con tolerancia \xB10.008 mm o mayor (relaci\xF3n 1:4)
- Verificar la validez de los calibres de inspecci\xF3n principales (confirmar validez de medici\xF3n ante desgaste/holgura con el uso)
     ej.) resultados de medici\xF3n 3D del calibre para piezas inyectadas, datos de comparaci\xF3n propia con producto de dimensi\xF3n asegurada, etc.`},{id:"2_6",c:1,p:10,ko:`\u25A3 \uAC8C\uC774\uC9C0 R&R \uC2E4\uC2DC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218 \uC0C1\uD0DC
    - \uACC4\uCE21\uAE30 \uC6B4\uC601 \uAE30\uC900\uBCC4 R&R \uD3C9\uAC00 \uACC4\uD68D \uC218\uB9BD
       (\uC790\uCCB4\uC81C\uC791 \uC804\uC6A9 \uACC4\uCE21\uAE30\uB294 \uD544\uD788 \uC2E4\uC2DC\uD560 \uAC83. \uB2E8. \uC790\uB3D9 \uCE21\uC815 \uAC80\uC0AC \uC7A5\uBE44 \uC81C\uC678 : \uBE44\uCEE4\uC2A4\uACBD\uB3C4\uAE30, \uAC70\uCE60\uAE30 \uCE21\uC815\uAE30 \uB4F1)
    - \uACC4\uCE21 \uC7A5\uBE44\uBCC4 \uC2E4\uC81C \uC0AC\uC6A9\uC778\uB825(\uC791\uC5C5\uC790/\uAC80\uC0AC\uC6D0) \uACC4\uB7C9\uD615  R&R \uAC80\uC99D \uC9C4\uD589 \uB370\uC774\uD130`,es:`\u25A3 Criterios y cumplimiento de Gauge R&R
- Plan de evaluaci\xF3n R&R seg\xFAn el criterio de operaci\xF3n de cada instrumento
  (obligatorio para instrumentos dedicados de fabricaci\xF3n propia. Excepto equipos de medici\xF3n autom\xE1tica: dur\xF3metro Vickers, rugos\xEDmetro, etc.)
- Datos de R&R por variables con el personal que realmente usa cada equipo de medici\xF3n (operador/inspector)`},{id:"2_7",c:1,p:40,ko:`\u25A3 \uC790\uC8FC\uAC80\uC0AC \uAE30\uC900\uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC790\uC8FC\uAC80\uC0AC \uC2E4\uC2DC\uC8FC\uAE30/\uC218\uB7C9 \uC720\uD6A8\uC131 \uD655\uBCF4\uC5EC\uBD80 \uBC0F \uC900\uC218\uC0C1\uD0DC 
       \u21D2 \uCD08/\uC885\uD488 \uAC80\uC99D \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD, \uAE08\uD615 \uCE90\uBE44\uD2F0\uBCC4 \uAC80\uC0AC \uB4F1
    - \uC790\uC8FC\uAC80\uC0AC \uC810\uAC80\uD56D\uBAA9 \uC720\uD6A8\uC131(\uC678\uAD00, \uC911\uB7C9, \uCE58\uC218, \uC81C\uD488\uB0B4 \uC81C\uC870 LOT \uCE98\uB9B0\uB354 \uAC01\uC778 \uB4F1) \uD655\uBCF4\uC5EC\uBD80 \uAE30\uB85D\uBB3C \uAD00\uB9AC\uC0C1\uD0DC
       \u2192 \uC678\uAD00\uAC80\uC0AC \uD56D\uBAA9 : \uAC8C\uC774\uD2B8 \uC0AC\uC0C1\uBD88\uB7C9, \uD30C\uD305\uBA74 \uBC84 \uBC1C\uC0DD, \uBBF8\uC131\uD615, \uC6F0\uB4DC\uB77C\uC778 \uB4F1
    - \uC790\uC8FC\uAC80\uC0AC \uC810\uAC80\uACB0\uACFC \uC2E0\uB8B0\uB3C4 \uD655\uBCF4\uC5EC\uBD80 \uD604\uC7A5\uD655\uC778(\uC791\uC5C5\uC77C\uBCF4 \uB300\uBE44 \uC790\uC8FC\uAC80\uC0AC \uC77C\uCE58\uC131 \uC810\uAC80, \uCE21\uC815 \uAE30\uB85D\uBB3C\uACFC \uC2E4\uCE21\uAC12 \uBE44\uAD50 \uB4F1)
    - 3\uCC28\uC6D0 \uCE21\uC815\uAE30, \uD615\uC0C1 \uCE21\uC815\uAE30 \uB4F1 \uC804\uC0B0 \uC5F0\uB3D9\uB41C \uACC4\uCE21\uC7A5\uBE44 \uD65C\uC6A9\uC2DC \uC810\uAC80\uC774\uB825 \uC6D0\uBCF8\uB370\uC774\uD130 \uC800\uC7A5\uAD00\uB9AC`,es:`\u25A3 Criterios y cumplimiento de la autoinspecci\xF3n
- Validez de la frecuencia/cantidad de autoinspecci\xF3n y su cumplimiento
   \u21D2 Proceso de verificaci\xF3n de primera/\xFAltima pieza, inspecci\xF3n por cavidad del molde, etc.
- Validez de los \xEDtems de autoinspecci\xF3n (apariencia, peso, dimensi\xF3n, calendario/LOTE grabado en la pieza, etc.) y control de registros
   \u2192 \xCDtems de apariencia: rebaba de compuerta, rebaba en l\xEDnea de partici\xF3n, no llenado, l\xEDnea de soldadura, etc.
- Verificar en piso la confiabilidad de resultados de autoinspecci\xF3n (consistencia con el reporte diario, comparar registros con valores medidos, etc.)
- Si se usan instrumentos conectados a sistema (CMM 3D, medidor de forma, etc.), guardar los datos originales del historial`},{id:"2_8",c:1,p:50,ko:`\u25A3 \uC644\uC81C\uD488 \uAC80\uC0AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC \uC810\uAC80
    - \uAC80\uC0AC\uAE30\uC900 \uD45C\uC900\uD654 (\uAC80\uC0AC\uD611\uC815\uC11C/\uAC80\uC0AC\uAE30\uC900\uC11C\uB0B4 \uAC80\uC0AC\uD56D\uBAA9/\uBC29\uBC95/\uC2DC\uB8CC\uC218 \uBA85\uD655\uD654) \uBC0F \uC2E4\uC81C \uAC80\uC0AC\uBC29\uBC95 \uC77C\uCE58\uC131 \uD655\uC778
    - \uAC80\uC0AC\uD56D\uBAA9 \uC801\uD569\uC131 (\uC678\uAD00, \uCE58\uC218, \uC2E0\uB8B0\uC131 \uB4F1 \uB3C4\uBA74 \uC694\uAD6C\uD56D\uBAA9 \uC77C\uCE58\uC131) 
    - \uAC80\uC0AC\uC8FC\uAE30 \uBC0F \uC2DC\uB8CC\uC218 \uC77C\uCE58\uC131 \uC810\uAC80 (\uCE90\uBE44\uD2F0\uBCC4 \uBD80\uD488\uAC80\uC0AC \uD3EC\uD568)
    - \uC644\uC81C\uD488 \uAC80\uC0AC\uC2DC\uC810 \uD655\uC778 (LOT \uC0DD\uC0B0 \uC885\uB8CC\uC2DC \uCD5C\uC885\uAC80\uC0AC \uD6C4 \uC548\uC804\uC7AC\uACE0 \uD655\uBCF4\uD1A0\uB85D \uAE30\uC900\uC124\uC815 \uB4F1)
    - \uCD5C\uC885\uD488 \uAC80\uC0AC \uC644\uB8CC\uD488 \uC2DD\uBCC4\uC0C1\uD0DC \uD655\uC778(\uC0DD\uC0B0 LOT \uBC0F \uCD5C\uC885\uAC80\uC0AC \uC644\uB8CC \uC2DD\uBCC4)
    - \uC720\uB85C \uD640 \uBC18\uC601\uBD80 \uB4F1 \uAE30\uB2A5\uBD80\uB294 \uC721\uC548\uAC80\uC0AC \uC678 \uACE0\uB178\uAC8C\uC774\uC9C0 \uB4F1 \uCE58\uACF5\uAD6C \uD65C\uC6A9\uD55C \uD488\uC9C8\uBCF4\uC99D \uD544\uC694`,es:`\u25A3 Criterios y cumplimiento de la inspecci\xF3n de producto terminado
- Estandarizaci\xF3n de la inspecci\xF3n (\xEDtems/m\xE9todo/tama\xF1o de muestra claros en el acuerdo/est\xE1ndar) y coincidencia con el m\xE9todo real
- Adecuaci\xF3n de los \xEDtems (apariencia, dimensi\xF3n, confiabilidad, etc. conforme a lo requerido en el plano)
- Coincidencia de frecuencia y tama\xF1o de muestra (incluye inspecci\xF3n por cavidad)
- Momento de la inspecci\xF3n del producto terminado (p. ej. criterio de inspecci\xF3n final al terminar el LOTE y asegurar stock de seguridad)
- Identificaci\xF3n del producto con inspecci\xF3n final completada (LOTE de producci\xF3n y fin de inspecci\xF3n final)
- En zonas funcionales (p. ej. orificios de flujo) adem\xE1s de la inspecci\xF3n visual se requiere aseguramiento con calibres/dispositivos tipo pasa/no pasa`},{id:"2_9",c:1,p:20,ko:`\u25A3 \uC0AC\uCD9C\uD488 \uD6C4\uACF5\uC815(\uC735\uCC29) \uD22C\uC785\uC2DC \uAC80\uC0AC\uAE30\uC900 \uC124\uC815 \uC720\uD6A8\uC131 \uD655\uBCF4 \uBC0F \uC900\uC218\uC5EC\uBD80(\uC735\uCC29\uACF5\uC815 \uC5C6\uC744\uC2DC '\uD574\uB2F9\uC5C6\uC74C' \uCC98\uB9AC)
    - \uC790\uCCB4 \uC735\uCC29\uACF5\uC815 \uBBF8\uC2E4\uC2DC(\uACE0\uAC1D\uC0AC \uC735\uCC29\uC2DC)
        1) \uC815\uBC00\uC735\uCC29(\uAE30\uBC00\uC131\uB2A5 \uD655\uBCF4)  : \uC735\uCC29\uAD6C\uAC04 \uC804\uB458\uB808 \uC735\uCC29\uB3CC\uAE30 \uAC80\uC0AC(\uC735\uCC29\uBA74\uB2F9 1\uAC1C\uC18C \uC774\uC0C1 \uCE21\uC815) \uAE30\uC900\uBC18\uC601
        2) \uC77C\uBC18\uC735\uCC29(\uACE0\uC815\uBAA9\uC801) : \uC735\uCC29\uBD80 \uB3CC\uAE30 \uCE21\uC815\uAE30\uC900 \uBC18\uC601
    - \uC0AC\uB0B4 \uC735\uCC29\uACF5\uC815 \uBC18\uC601\uC2DC
        1) \uC815\uBC00 \uC735\uCC29(\uAE30\uBC00\uC131) : LEAK\uAC80\uC0AC \uC124\uBE44 \uB9AC\uD06C\uB7C9 \uB514\uC2A4\uD50C\uB808\uC774 \uC124\uC815 \uBC0F \uB9C8\uC2A4\uD130 \uD65C\uC6A9\uD55C \uC810\uAC80 \uBC0F \uCE98\uB9AC\uBE0C\uB808\uC774\uC158 \uC9C4\uD589 
        2) \uC77C\uBC18\uC735\uCC29 : \uC735\uCC29\uBD80 \uC774\uD0C8\uAC15\uB3C4 \uCE21\uC815 \uBC0F \uCD94\uC774\uB3C4 \uBD84\uC11D`,es:`\u25A3 Criterios de inspecci\xF3n en el post-proceso (fusi\xF3n) de piezas inyectadas (si no hay proceso de fusi\xF3n: 'No aplica')
- Si no se realiza fusi\xF3n propia (la hace el cliente)
   1) Fusi\xF3n de precisi\xF3n (hermeticidad): incluir inspecci\xF3n de la nervadura de fusi\xF3n en toda la circunferencia (medir al menos 1 punto por superficie)
   2) Fusi\xF3n general (fijaci\xF3n): incluir criterio de medici\xF3n de la nervadura de fusi\xF3n
- Si se refleja el proceso de fusi\xF3n interno
   1) Precisi\xF3n (hermeticidad): ajuste de la pantalla de fuga del equipo de prueba de fuga, revisi\xF3n y calibraci\xF3n con maestro
   2) General: medici\xF3n de resistencia al desprendimiento de la uni\xF3n y an\xE1lisis de tendencia`},{id:"3_1",c:2,p:30,ko:`\u25A3 \uC124\uBE44 \uC77C\uC0C1\uC810\uAC80 \uC5C5\uBB34\uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uC124\uBE44\uBCC4 \uC124\uBE44\uC77C\uC0C1 \uC810\uAC80\uBD80\uC704 \uBC0F \uC810\uAC80\uBC29\uBC95 \uB3C4\uC2DD\uD654 \uAD00\uB9AC\uC0C1\uD0DC 
    - \uC124\uBE44\uB0B4 \uBD80\uCC29 \uAC8C\uC774\uC9C0\uB958 \uC0C1/\uD558\uD55C \uC2DD\uBCC4 \uBC0F \uCE21\uC815 \uC2E4\uCE21\uAC12 \uC77C\uC0C1\uC810\uAC80\uD45C \uAE30\uB85D\uAD00\uB9AC
    - \uC124\uBE44\uB0B4 F/P\uC124\uBE44 \uACBD\uACE0\uB4F1/\uC54C\uB78C \uC815\uC0C1\uC791\uB3D9 \uBC0F \uC124\uBE44\uB0B4 \uC14B\uD305\uAC12/\uAD00\uB9AC\uACF5\uCC28 \uD45C\uC900\uACFC \uC77C\uCE58\uC5EC\uBD80
    - \uC124\uBE44 \uC14B\uD305\uAC12 \uC784\uC758\uC870\uC791 \uBC29\uC9C0\uB97C \uC704\uD55C \uC2DC\uAC74\uC7A5\uCE58/KEY-LOCK \uBC18\uC601\uC0C1\uD0DC
    - \uC8FC\uC694 \uD575\uC2EC\uC124\uBE44 \uC2DC\uC5C5\uC2DC \uC124\uBE44 \uC815\uC0C1\uC791\uB3D9 \uC5EC\uBD80 \uAC80\uC99D \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD(OK/NG \uB9C8\uC2A4\uD130 \uC810\uAC80 \uB610\uB294 \uACC4\uCE21\uAC12 \uC14B\uD305\uC6A9 \uAC8C\uC774\uC9C0 \uC810\uAC80) 
    - \uCE98\uB9AC\uBE0C\uB808\uC774\uC158\uC774 \uD544\uC694\uD55C \uC0DD\uC0B0 \uBC0F \uAC80\uC0AC\uC7A5\uBE44\uB294 \uC2DC\uC5C5\uC804 0\uC810 \uC870\uC815(\uD2F0\uCE6D)\uD6C4 \uC774\uC0C1\uC720\uBB34(OK/NG\uB9C8\uC2A4\uD130\uB97C \uD65C\uC6A9)\uB97C \uAC80\uC99D \uD544\uC694`,es:`\u25A3 Procedimiento y cumplimiento de la revisi\xF3n diaria de equipos
- Control gr\xE1fico de las zonas y m\xE9todo de revisi\xF3n diaria por equipo
- Identificaci\xF3n de l\xEDmites superior/inferior de los man\xF3metros/indicadores del equipo y registro de los valores medidos en la hoja de revisi\xF3n diaria
- Funcionamiento normal de luces de alerta/alarmas del a prueba de error (F/P) del equipo y coincidencia de valores de ajuste/tolerancias con el est\xE1ndar
- Candado/llave (KEY-LOCK) para evitar manipular a criterio los valores de ajuste del equipo
- Proceso de verificaci\xF3n del funcionamiento normal de equipos clave al inicio de turno (revisi\xF3n con maestro OK/NG o calibre de ajuste de valores de medici\xF3n)
- Equipos de producci\xF3n e inspecci\xF3n que requieren calibraci\xF3n: ajustar a cero (ense\xF1anza) antes del inicio y verificar su estado (con maestro OK/NG)`},{id:"3_2",c:2,p:30,ko:`\u25A3 \uC124\uBE44 \uC815\uAE30\uC810\uAC80 \uC5C5\uBB34\uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uC8FC\uC694 \uD575\uC2EC\uC124\uBE44 \uC815\uAE30\uC810\uAC80 \uACC4\uD68D\uC218\uB9BD \uBC0F \uC810\uAC80\uC0C1\uD0DC(\uC608, \uC124\uBE44 \uB4F1\uAE09\uBCC4 \uC810\uAC80 \uC8FC\uAE30 \uC124\uC815)
       1) \uC678\uC8FC\uC5C5\uCCB4 \uC815\uB3C4\uC810\uAC80 \uC131\uC801\uC11C \uD3EC\uD568, \uC790\uCCB4\uC810\uAC80\uC8FC\uAE30 \uBC18\uC601
       \u203B \uC678\uC8FC\uC5C5\uCCB4 \uB610\uB294 \uC790\uCCB4 \uC815\uB3C4\uC810\uAC80 \uAC00\uB2A5 \uC124\uBE44/\uC778\uB825\uC774 \uD655\uBCF4\uB41C\uACBD\uC6B0 \uC778\uC815
    - \uC124\uBE44\uB0B4 \uC18C\uBAA8\uC131 \uBD80\uC790\uC7AC\uB958 \uC810\uAC80/\uAD50\uCCB4\uC8FC\uAE30 \uC124\uC815 \uBC0F \uC900\uC218\uC5EC\uBD80 
        [\uD544\uC694\uC2DC \uC18C\uBAA8\uC131 \uBD80\uC790\uC7AC \uAD50\uCCB4\uC8FC\uAE30 \uC124\uC815\uADFC\uAC70 \uC81C\uC2DC \uD544\uC694, T/O \uC774\uB825 \uB4F1]
    - \uC124\uBE44 \uBD80\uCC29 \uC13C\uC11C \uBC0F \uAC8C\uC774\uC9C0\uB958\uC5D0 \uB300\uD55C \uC815\uB3C4 \uBCF4\uC99D \uBC29\uC548 \uC218\uB9BD \uBC0F \uC774\uD589 \uC0C1\uD0DC
      1) \uC124\uBE44\uB0B4 \uC8FC\uC694 \uC555\uB825\uACC4 \uC815\uAE30\uC810\uAC80 \uC815\uB3C4\uBCF4\uC99D \uB610\uB294 \uAC80\uAD50\uC815\uB41C \uB9C8\uC2A4\uD130\uAC8C\uC774\uC9C0 \uBE44\uAD50 \uAC80\uC99D\uD65C\uB3D9 \uC2E4\uC2DC
      2) \uAE08\uD615\uB0B4 \uB178\uC990\uC628\uB3C4 \uC13C\uC11C \uB4F1 \uC911\uC694 \uC13C\uC11C\uB958 \uACE0\uC7A5\uC5EC\uBD80 \uC815\uAE30\uC810\uAC80\uC2DC \uC815\uB3C4\uBCF4\uC99D \uD65C\uB3D9 \uD544\uC694
          (\uB2E8, \uBD80\uD488\uC0DD\uC0B0 \uAE08\uD615 \uBBF8\uBCF4\uC720 \uC5C5\uC885 \uC81C\uC678 - \uC608)\uC804\uAE30\uC870\uB9BD, \uC2A4\uD504\uB808\uC774\uB3C4\uC7A5, \uC0AC\uCD9C\uAE08\uD615, \uD504\uB808\uC2A4\uAE08\uD615, \uD504\uB808\uC2A4 \uB4F1)
      3) \uC804\uB3D9\uD234 \uBC0F \uB108\uD2B8\uB7F0\uB108 \uC810\uAC80\uC8FC\uAE30 \uC124\uC815 \uBC0F \uC815\uAE30\uC801 \uD1A0\uD06C \uAC80\uC0AC \uC9C4\uD589
      \u203B \uC124\uBE44 \uC77C\uC0C1\uC810\uAC80 \uD56D\uBAA9\uC744 \uC81C\uC678\uD55C \uC138\uBD80 \uC810\uAC80 \uD544\uC694\uBD80\uB9CC \uC815\uAE30\uC810\uAC80 \uACC4\uD68D \uC218\uB9BD \uBC0F \uC810\uAC80 \uD544\uC694`,es:`\u25A3 Procedimiento y cumplimiento de la revisi\xF3n peri\xF3dica de equipos
- Plan y estado de revisi\xF3n peri\xF3dica de equipos clave (ej. frecuencia seg\xFAn clasificaci\xF3n del equipo)
   1) Incluir reportes de revisi\xF3n de precisi\xF3n de proveedores externos y frecuencia de revisi\xF3n propia
   \u203B Se acepta si se cuenta con proveedor externo o con equipo/personal propio para revisi\xF3n de precisi\xF3n
- Frecuencia de revisi\xF3n/reemplazo de auxiliares consumibles del equipo y su cumplimiento
   [de ser necesario, presentar fundamento de la frecuencia de reemplazo, historial de T/O, etc.]
- Aseguramiento de precisi\xF3n de sensores y man\xF3metros del equipo y su implementaci\xF3n
  1) Revisi\xF3n peri\xF3dica de precisi\xF3n de man\xF3metros principales, o verificaci\xF3n comparando con man\xF3metro maestro calibrado
  2) Aseguramiento de precisi\xF3n en la revisi\xF3n peri\xF3dica de fallas de sensores importantes (p. ej. sensor de temperatura de boquilla en el molde)
      (excepto giros sin molde de producci\xF3n de piezas \u2014 ej. ensamble el\xE9ctrico, pintura por aspersi\xF3n, molde de inyecci\xF3n, molde de estampado, prensa, etc.)
  3) Definir frecuencia de revisi\xF3n de herramientas el\xE9ctricas y atornilladores (nut runner) y realizar inspecci\xF3n peri\xF3dica de torque
  \u203B Solo se requiere plan de revisi\xF3n peri\xF3dica para las partes que necesitan revisi\xF3n detallada, excluyendo los \xEDtems de revisi\xF3n diaria`},{id:"3_3",c:2,p:20,ko:`\u25A3 \uC6D0\uC18C\uC7AC \uAC74\uC870\uC7A5\uCE58 \uAD00\uB9AC\uAE30\uC900 \uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uAC74\uC870\uAE30, \uACF5\uAE09\uC7A5\uCE58 \uD544\uD130 \uAD50\uCCB4\uC774\uB825 \uAD00\uB9AC \uBC0F \uACF5\uAE09\uB77C\uC778 \uCCAD\uC18C, \uC6D0\uC7AC\uB8CC \uC794\uB7C9 \uAC10\uC9C0\uC13C\uC11C \uD65C\uC6A9\uC0C1\uD0DC 
    - \uC0AC\uCD9C\uAE30\uBCC4 \uCD5C\uB300\uC911\uB7C9 \uC0AC\uCD9C\uD488\uAE30\uC900 \uC6D0\uC18C\uC7AC \uAC74\uC870\uC2DC\uAC04 \uC900\uC218\uB97C \uC704\uD55C \uC794\uB7C9\uC2DD\uBCC4 \uC13C\uC11C \uBD80\uCC29\uC704\uCE58 \uC704\uCE58 \uC801\uD569\uC131 \uAC80\uD1A0 \uBC0F \uC900\uC218\uC2E4\uD0DC(\uD604\uC7A5\uC810\uAC80)
      \u203B \uC13C\uC11C \uC704\uCE58 \uC801\uD569\uC131 \uAC80\uD1A0
             1) \uC6D0\uB2E8\uC704 \uC911\uB7C9(\uC0AC\uCD9C\uD638\uAE30\uBCC4 \uCD5C\uB300 \uC911\uB7C9\uD488 \uAE30\uC900) * \uC0DD\uC0B0 UPH : \uC2DC\uAC04\uB2F9 \uC6D0\uC18C\uC7AC \uC18C\uC694\uB7C9 
             2) \uC6D0\uC18C\uC7AC \uC218\uBD84\uD568\uC720\uB7C9 \uB9CC\uC871 \uCD5C\uC18C \uAC74\uC870\uC2DC\uAC04 
             3) \uC794\uB7C9 \uC2DD\uBCC4\uC13C\uC11C \uC704\uCE58 \uC6D0\uC18C\uC7AC \uCD5C\uC18C \uAC74\uC870\uC2DC\uAC04 \uC720\uC9C0 \uC7A5\uC785 \uAE30\uC900[ 1) * 2) ]\uBCF4\uB2E4 \uB192\uAC8C \uC124\uC815\uC5EC\uBD80 \uD655\uC778`,es:`\u25A3 Criterios y cumplimiento del equipo de secado de materia prima
- Historial de reemplazo de filtros de secadora y alimentador, limpieza de l\xEDnea de suministro y uso del sensor de nivel remanente de materia prima
- Adecuaci\xF3n de la posici\xF3n del sensor de remanente para cumplir el tiempo de secado con el producto de peso m\xE1ximo de cada inyectora, y su cumplimiento (verificar en piso)
  \u203B Revisi\xF3n de la posici\xF3n del sensor
     1) Peso unitario (producto de mayor peso por inyectora) \xD7 UPH de producci\xF3n: consumo de materia prima por hora
     2) Tiempo m\xEDnimo de secado para cumplir el contenido de humedad
     3) Verificar que la posici\xF3n del sensor de remanente est\xE9 por encima de la carga necesaria para mantener el tiempo m\xEDnimo de secado [1) \xD7 2)]`},{id:"3_4",c:2,p:20,ko:`\u25A3 \uBC30\uD569\uAE30/\uBD84\uC1C4\uAE30 \uAD00\uB9AC\uAE30\uC900 \uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC (\uBD84\uC1C4 \uBC0F \uBC30\uD569\uACF5\uC815 \uC5C6\uC744\uC2DC '\uD574\uB2F9\uC5C6\uC74C' \uCC98\uB9AC)
 [\uBC30\uD569\uAE30]
   \u25B7 \uBC30\uD569\uAE30 \uC124\uBE44 \uAD00\uB9AC\uAE30\uC900 \uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC2E0\uC7AC/\uC2A4\uD06C\uB7A9/\uCCA8\uAC00\uC81C \uB4F1 \uD488\uBAA9/\uC7AC\uB8CC\uBCC4 \uBC30\uD569 \uAD00\uB9AC\uAE30\uC900\uD45C \uD604\uC7A5\uB0B4 \uAC8C\uC2DC\uC0C1\uD0DC
    - \uBC30\uD569\uC2DC\uAC04 \uBC0F RPM \uD45C\uC900\uACFC \uC2E4\uC81C\uACF5\uC815 \uC77C\uCE58\uC131 \uD604\uC7A5\uC810\uAC80
    - \uBC30\uD569\uC124\uBE44 \uC124\uBE44 \uC77C\uC0C1\uC810\uAC80 \uC2E4\uC2DC\uC0C1\uD0DC(\uD0C0\uC774\uBA38, \uC911\uB7C9\uACC4 \uB4F1)
    - \uBC30\uD569\uC124\uBE44 \uBC30\uD569\uBE44\uC728 \uC815\uD569\uC131 \uC815\uAE30\uC801 \uAC80\uC99D(\uBC30\uD569\uBE44\uC728 \uC14B\uC5C5\uB300\uBE44 \uC2E4\uCE21\uACB0\uACFC)
 [\uBD84\uC1C4\uAE30]
   \u25B7 \uBD84\uC1C4\uAE30 \uC124\uBE44 \uAD00\uB9AC\uAE30\uC900 \uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uBD84\uC1C4\uAE30 \uCE7C\uB0A0 \uB4F1 \uC124\uBE44 \uC77C\uC0C1\uC810\uAC80 \uD56D\uBAA9\uC120\uC815 \uBC0F \uC900\uC218\uC2E4\uD0DC(\uC77C\uC0C1\uC810\uAC80\uD45C)
    - \uC774\uC885 \uC6D0\uC18C\uC7AC \uB3D9\uC77C \uBD84\uC1C4\uAE30 \uC0AC\uC6A9 \uC7AC\uD22C\uC785\uC2DC \uBB3C\uC131\uC800\uD558 \uBB38\uC81C\uC810 \uBC1C\uC0DD \uAC00\uB2A5\uC131 \uC608\uBC29
    - \uC2A4\uD06C\uB7A9 \uBD84\uC1C4 \uC810\uAC80/\uCCAD\uC18C \uAD00\uB9AC \uBC0F \uBBF8\uBD84\uC1C4 \uC18C\uC7AC \uD22C\uC785\uBC29\uC9C0\uB97C \uC704\uD55C \uD544\uD130\uB9DD \uC124\uCE58 \uC6B4\uC601 
 [\uACF5\uD1B5\uD56D\uBAA9]
   \u25B7 \uBC30\uD569\uAE30/\uBD84\uC1C4\uAE30 \uC815\uAE30\uC810\uAC80 \uACC4\uD68D \uC218\uB9BD \uB300\uBE44 \uC2E4\uC801\uD655\uC778
    - \uC815\uAE30 \uC810\uAC80\uD56D\uBAA9 \uC720\uD6A8\uC131 \uD655\uBCF4\uC5EC\uBD80(\uC124\uBE44\uC77C\uC0C1\uC810\uAC80 \uAE30\uC900\uD45C\uC640 \uB3D9\uC77C\uD56D\uBAA9 \uC810\uAC80\uC2DC \uC720\uD6A8\uC131 \uC5C6\uC74C)`,es:`\u25A3 Criterios y cumplimiento de mezcladora/molino (si no hay proceso de molienda ni mezcla: 'No aplica')
 [Mezcladora]
   \u25B7 Criterios de gesti\xF3n del equipo de mezcla y su cumplimiento
    - Publicaci\xF3n en piso de la tabla de control de mezcla por producto/material (virgen/scrap/aditivos, etc.)
    - Revisi\xF3n en piso de coincidencia del tiempo de mezcla y RPM con el est\xE1ndar y el proceso real
    - Estado de la revisi\xF3n diaria del equipo de mezcla (temporizador, b\xE1scula, etc.)
    - Verificaci\xF3n peri\xF3dica de la proporci\xF3n de mezcla (resultado medido vs ajuste)
 [Molino]
   \u25B7 Criterios de gesti\xF3n del molino y su cumplimiento
    - Definici\xF3n y cumplimiento de \xEDtems de revisi\xF3n diaria (cuchillas, etc.) (hoja de revisi\xF3n diaria)
    - Prevenir degradaci\xF3n de propiedades por moler materiales de distinta resina en el mismo molino y reincorporarlos
    - Control de revisi\xF3n/limpieza del molido de scrap e instalaci\xF3n de malla filtrante para evitar que entre material sin moler
 [Com\xFAn]
   \u25B7 Verificar el plan de revisi\xF3n peri\xF3dica de mezcladora/molino contra lo realizado
    - Validez de los \xEDtems de revisi\xF3n peri\xF3dica (no tiene validez si son los mismos de la hoja de revisi\xF3n diaria)`},{id:"3_5",c:2,p:10,ko:`\u25A3 \uC9C0\uADF8 \uC81C\uC791/\uBCF4\uC804\uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC (\uC0AC\uCD9C\uC791\uC5C5 \uC678 \uC870\uB9BD/\uC735\uCC29\uACF5\uC815 \uC5C6\uC744\uC2DC '\uD574\uB2F9\uC5C6\uC74C' \uCC98\uB9AC)
    - JIG \uC81C\uC791 \uAE30\uC900 
      \u2192 \uC735\uCC29\uACF5\uC815 \uC735\uCC29\uBD80 \uC804\uBA74\uC801\uC774 \uB20C\uB9B4 \uC218 \uC788\uB3C4\uB85D JIG \uC124\uC815 \uC5EC\uBD80
      \u2192 \uC870\uB9BD \uBC0F \uC735\uCC29\uACF5\uC815 \uC0AC\uCD9C\uD488 \uAC70\uCE58\uC2DC \uC548\uCC29\uBA74 \uC720\uACA9\uBC1C\uC0DD \uC5EC\uBD80 \uBC0F \uC9C0\uADF8\uB0B4 \uD074\uB7A8\uD504 \uB4F1 \uACE0\uC815\uBD80 \uC720\uACA9/\uD234\uB9C1\uD540 \uB9C8\uBAA8\uC5EC\uBD80 \uC810\uAC80 `,es:`\u25A3 Proceso de fabricaci\xF3n/mantenimiento de dispositivos (JIG) (si no hay ensamble/fusi\xF3n adem\xE1s de la inyecci\xF3n: 'No aplica')
- Criterios de fabricaci\xF3n del JIG
  \u2192 \xBFEl JIG est\xE1 configurado para presionar toda el \xE1rea de la zona de fusi\xF3n?
  \u2192 Al colocar la pieza inyectada en procesos de ensamble/fusi\xF3n: revisar holguras en la superficie de asiento, holgura en abrazaderas/fijaciones del JIG y desgaste de pines de herramental`},{id:"4_1",c:3,p:20,ko:`\u25A3 \uAE08\uD615 \uC77C\uC0C1/\uC810\uAE30\uC810\uAC80 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uACFC\uAC70 \uC218\uB9AC\uC774\uB825 / \uD488\uC9C8\uBB38\uC81C \uBC1C\uC0DD\uC774\uB825 / \uC0AC\uC6A9\uBE48\uB3C4 \uB4F1 \uBA85\uD655\uD55C \uADFC\uAC70\uC5D0 \uC900\uD55C \uAE08\uD615 \uB4F1\uAE09\uAD00\uB9AC \uAE30\uC900 \uC218\uB9BD\uC5EC\uBD80
    - \uAE08\uD615\uBCC4 \uB4F1\uAE09\uAE30\uC900\uC5D0 \uB530\uB77C \uC77C\uC0C1\uC810\uAC80/\uC815\uAE30\uC810\uAC80 \uC8FC\uAE30\uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC (\uC77C\uC0C1\uC810\uAC80/\uC815\uAE30\uC810\uAC80 \uCCB4\uD06C\uC2DC\uD2B8 \uBCC4\uB3C4 \uC6B4\uC601)
        \u203B\uC911\uC694 \uC810\uAC80\uD56D\uBAA9 
           \uFF0A \uC77C\uC0C1\uC810\uAC80 : \uAE08\uD615 CAVITY\uBCC4 \uAC80\uC0AC\uC5EC\uBD80, \uAE08\uD615 T/O\uC2DC \uD488\uC9C8 \uCDE8\uC57D POINT (\uBBF8\uC131\uD615 \uBC1C\uC0DD \uC704\uCE58 \uB4F1) \uD655\uC778 \uB4F1
           \uFF0A \uC815\uAE30\uC810\uAC80 : \uAE08\uD615 \uC2AC\uB77C\uC774\uB4DC \uCF54\uC5B4 \uB9C8\uBAA8 \uB4F1 \uC11C\uBE0C\uD488 \uC190\uC0C1\uC5D0 \uB530\uB978 \uC77C\uC0C1\uC810\uAC80 \uBD80\uC704 \uC678 \uC678\uAD00/\uCE58\uC218 \uC774\uC0C1\uC5EC\uBD80 \uD655\uC778 \uB4F1  
    - \uAE08\uD615\uBCC4 \uD0C0\uBC1C\uC218 \uAE30\uB85D/\uAD00\uB9AC \uC0C1\uD0DC(\uC815\uAE30\uAC80\uC99D \uD544\uC694)
          \u21D2 \uC804\uC0B0\uAD00\uB9AC \uB610\uB294 \uC5D1\uC140 \uB4F1 \uD65C\uC6A9\uD55C \uD0C0\uBC1C\uC218 \uC2E4\uC801\uAD00\uB9AC \uB370\uC774\uD130 \uC720\uD6A8\uC131 \uD655\uBCF4\uC5EC\uBD80 \uC810\uAC80(\uC0DD\uC0B0 \uC2E4\uC801 \uAE30\uC900, \uD0C0\uBC1C\uC218 \uAD00\uB9AC \uD544\uC694)`,es:`\u25A3 Proceso y cumplimiento de la revisi\xF3n diaria/peri\xF3dica de moldes
- Definir criterio de clasificaci\xF3n de moldes con base clara en historial de reparaciones, de problemas de calidad, frecuencia de uso, etc.
- Frecuencia y cumplimiento de revisi\xF3n diaria/peri\xF3dica seg\xFAn la clasificaci\xF3n de cada molde (checklists de revisi\xF3n diaria y peri\xF3dica por separado)
   \u203B \xCDtems de revisi\xF3n importantes
      \uFF0A Diaria: si se inspecciona por CAVIDAD; puntos d\xE9biles de calidad detectados en el T/O (p. ej. posici\xF3n donde ocurre no llenado)
      \uFF0A Peri\xF3dica: verificar apariencia/dimensi\xF3n fuera de las zonas de revisi\xF3n diaria por da\xF1o de piezas (p. ej. desgaste de corazones deslizantes)
- Registro y control del conteo de disparos por molde (requiere verificaci\xF3n peri\xF3dica)
     \u21D2 Verificar la validez de los datos del conteo de disparos en sistema o Excel (controlar el conteo con base en la producci\xF3n real)`},{id:"4_2",c:3,p:20,ko:`\u25A3 \uAE08\uD615 \uC138\uCC99\uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uAE08\uD615\uBCC4 \uB4F1\uAE09\uAE30\uC900\uC5D0 \uB530\uB77C \uAE08\uD615\uC138\uCC99 \uC8FC\uAE30\uC124\uC815 \uBC0F \uC900\uC218\uC0C1\uD0DC (\uC138\uCC99\uAD00\uB9AC \uCCB4\uD06C\uC2DC\uD2B8 \uBC0F \uC2E4\uC2DC\uC774\uB825 \uD655\uC778 \uD544\uC694)
    - \uD611\uB825\uC0AC\uBCC4 \uC138\uCC99\uD504\uB85C\uC138\uC2A4 \uAE30\uC900\uC218\uB9BD (\uC808\uCC28\uC11C, \uC7A5\uBE44\uD604\uD669, \uC778\uC6D0 \uB4F1)
       \u203B\uC911\uC694 \uC810\uAC80\uD56D\uBAA9 : \uAE08\uD615\uC138\uCC99\uC2DC GAS VENT\uBD80 \uB4F1 \u5168POINT \uB204\uB77D\uC5C6\uC774 \uC2E4\uC2DC\uB418\uB294\uC9C0 \uD655\uC778(\uCD5C\uADFC \uC138\uCC99\uAE08\uD615 \uD604\uBB3C\uAC80\uC99D)`,es:`\u25A3 Proceso y cumplimiento de la limpieza de moldes
- Frecuencia de limpieza seg\xFAn la clasificaci\xF3n del molde y su cumplimiento (verificar checklist de limpieza e historial)
- Definir criterios del proceso de limpieza por proveedor (procedimiento, equipos, personal, etc.)
   \u203B \xCDtem importante: verificar que en la limpieza se realicen TODOS los puntos, como los respiraderos (GAS VENT), sin omisi\xF3n (verificar f\xEDsicamente un molde reci\xE9n limpiado)`},{id:"4_3",c:3,p:20,ko:`\u25A3 \uAE08\uD615 \uBCF4\uC804 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uAE08\uD615\uBCC4 \uC0AC\uB0B4\uC218\uB9AC/\uC678\uC8FC\uC218\uB9AC/\uC18C\uBAA8\uD488\uAD50\uCCB4 \uB4F1 \uBCF4\uC804\uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80 (\uB370\uC774\uD130 \uC99D\uBE59) 
    - \uAE08\uD615 \uBCF4\uC218\uC6A9 S/part \uAD00\uB9AC\uC0C1\uD0DC \uBC0F \uBC0F \uC810\uAC80\uC778\uC6D0 \uD655\uBCF4 \uC0C1\uD0DC. \uAE08\uD615 \uBCF4\uC218\uD6C4 \uC0DD\uC0B0\uBD80\uD488 \uAC80\uC99D\uC790\uB8CC 
    - \uAE08\uD615 \uC218\uC815\uC791\uC5C5 \uC9C4\uD589\uC2DC \uC2E0\uADDC\uC81C\uC791\uC5D0 \uC900\uD55C T/O\uC2E4\uC2DC \uBC0F \uC7AC\uACF5\uD488 \uD488\uC9C8 \uBCF4\uC99D\uD65C\uB3D9 \uC2E4\uC2DC
    - \uAE08\uD615 \uC218\uC815\uC0AC\uD56D \uBC1C\uC0DD\uC2DC \uD611\uB825\uC0AC \uC784\uC758\uC218\uC815 \uAE08\uC9C0 (\uAE08\uD615\uC81C\uC791\uC0AC\uC5D0 \uC815\uC2DD \uC218\uC815\uC694\uCCAD \u5FC5) 
        \u2192 \uAE08\uD615 \uC720\uC9C0\uAD00\uB9AC\uB97C \uC704\uD55C \uAE08\uD615 \uC218\uB9AC\uB294 \uD611\uB825\uC0AC\uC5D0\uC11C \uC9C4\uD589 \uAC00\uB2A5\uD558\uB098, \uC81C\uD488\uC758 \uCE58\uC218/\uD615\uC0C1 \uBCC0\uACBD\uACFC \uAD00\uB828\uB41C \uAE08\uD615 \uC218\uC815\uC740 \uAE08\uD615 \uC81C\uC791\uC0AC\uC5D0
            \uC815\uC2DD \uC218\uC815\uC694\uCCAD \uD544\uC694
    - \uAE08\uD615 \uC218\uC815 \uCD08\uD488\uC5D0 \uB300\uD55C \uAC80\uC0AC \uC774\uB825 \uAD00\uB9AC`,es:`\u25A3 Proceso y cumplimiento del mantenimiento de moldes
- Proceso de mantenimiento por molde (reparaci\xF3n interna/externa, cambio de consumibles, etc.) y su cumplimiento (evidencia con datos)
- Gesti\xF3n de refacciones (S/part) para reparaci\xF3n de moldes y disponibilidad de personal de revisi\xF3n; datos de verificaci\xF3n de piezas producidas tras la reparaci\xF3n
- Al modificar un molde: realizar T/O equivalente a uno nuevo y actividades de aseguramiento de calidad del producto en proceso
- Prohibido que el proveedor modifique el molde por su cuenta (se debe solicitar formalmente al fabricante del molde)
    \u2192 El proveedor puede realizar reparaciones de mantenimiento, pero las modificaciones que cambien dimensi\xF3n/forma del producto requieren solicitud formal al fabricante del molde
- Control del historial de inspecci\xF3n de la primera pieza tras modificar el molde`},{id:"4_4",c:3,p:10,ko:`\u25A3 \uAE08\uD615 \uBCF4\uAD00 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uAE08\uD615\uBCF4\uAD00\uB300 \uC81C\uC791 \uBC0F \uAE08\uD615\uC704\uCE58 \uD604\uD669\uD310 \uC8FC\uC18C\uD654 \uAD00\uB9AC(\uACF5\uC815\uD22C\uC785/\uC791\uC5C5\uB300\uAE30/\uC678\uC8FC\uC218\uB9AC \uB4F1 LOCATION\uBCC4 \uAD00\uB9AC\uC5EC\uBD80)
    - \uAE08\uD615 \uC2DD\uBCC4\uAD00\uB9AC \uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218(\uC591\uC0B0, A/S\uCC28\uC885 \uB4F1)
    - \uAE08\uD615 \uBCF4\uAD00\uC2DC \uC774\uBB3C\uC720\uC785 \uBC29\uC9C0 \uB300\uCC45 \uC218\uB9BD \uBC0F \uC138\uCC99/\uB0C9\uAC01\uC218 \uD0C8\uC218 \uC0C1\uD0DC \uBCF4\uAD00 \uB4F1 \uAD00\uB9AC\uC2E4\uD0DC \uD604\uC7A5 \uC810\uAC80`,es:`\u25A3 Proceso y cumplimiento del almacenamiento de moldes
- Fabricar racks de moldes y tablero de ubicaci\xF3n con direccionamiento (control por UBICACI\xD3N: en proceso/en espera/reparaci\xF3n externa, etc.)
- Procedimiento y cumplimiento de identificaci\xF3n de moldes (producci\xF3n en serie, modelos de servicio/A/S, etc.)
- Medidas para evitar ingreso de contaminantes al almacenar y verificaci\xF3n en piso del estado de limpieza y de drenado del agua de enfriamiento`},{id:"4_5",c:3,p:20,ko:`\u25A3 \uAE08\uD615 \uC774\uAD00 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC2E0\uADDC\uC81C\uC791 \uBC0F \uC591\uC0B0 \uAE08\uD615 \uC774\uAD00\uC2DC \uC2DC\uC0AC\uCD9C(T/OUT) \uBCF4\uACE0\uC11C \uBC0F \uC131\uD615/\uAC15\uB3C4\uD574\uC11D \uC790\uB8CC \uAC80\uC99D \uC2E4\uC2DC(\uC2E4\uC2DC\uACB0\uACFC \uC99D\uBE59\uAD00\uB9AC)
    - \uC2DC\uC0AC\uCD9C T/O \uBC1C\uCDCC \uBB38\uC81C\uC810 \uAC1C\uC120 \uC885\uB8CC\uD6C4 \uC774\uAD00 \uC2E4\uC2DC\uC5EC\uBD80 \uC774\uB825\uD655\uC778
    - \uC2DC\uC0AC\uCD9C T/O \uC911\uC694 \uBC1C\uCDCC POINT \uC77C\uC0C1/\uC815\uAE30\uC810\uAC80 \uCCB4\uD06C\uC2DC\uD2B8 \uBC18\uC601\uC5EC\uBD80`,es:`\u25A3 Proceso y cumplimiento del traslado de moldes
- En traslado de moldes nuevos y de producci\xF3n: verificar el reporte de prueba (T/OUT) y an\xE1lisis de moldeo/resistencia (evidencia de resultados)
- Verificar en el historial que el traslado se hizo despu\xE9s de cerrar la mejora de los problemas detectados en el T/O
- \xBFLos puntos importantes detectados en el T/O se reflejaron en los checklists de revisi\xF3n diaria/peri\xF3dica?`},{id:"4_6",c:3,p:10,ko:`\u25A3 \uAE08\uD615 \uC608\uC5F4 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uAE08\uD615 \uC608\uC5F4\uAD00\uB828 \uAE30\uC900\uC218\uB9BD \uC5EC\uBD80 : \uAE08\uD615\uC608\uC5F4\uAE30 \uC0AC\uC6A9 \uD544\uC694\uC5EC\uBD80 \uAC80\uD1A0\uC774\uB825
          \u21D2 \uC18C\uBB3C\uAE08\uD615 \uB4F1 \uC628\uC218\uAE30 \uD65C\uC6A9\uC73C\uB85C \uC2E0\uC18D\uD55C \uC628\uB3C4\uC0C1\uC2B9 \uAC00\uB2A5\uD560\uACBD\uC6B0 \uC608\uC5F4\uAE30 \uC0AC\uC6A9 \uBD88\uD544\uC694
          \u21D2 \uC0AC\uC6A9\uC911\uC778 \uAE08\uD615\uBCC4 \uC591\uC0B0 \uAD00\uB9AC\uC870\uAC74 \uC0DD\uC0B0\uC900\uBE44 \uC14B\uC5C5\uC2DC\uAC04 \uAC80\uD1A0\uC774\uB825 \uD655\uBCF4 \uD544\uC694
    - \uC7AC\uB8CC\uBCC4/\uD488\uBAA9\uBCC4 \uAE08\uD615 \uC608\uC5F4\uC2DC\uAC04 \uD45C\uC900 \uC124\uC815 \uBC0F \uC774\uB825\uAD00\uB9AC \uC0C1\uD0DC`,es:`\u25A3 Criterios y cumplimiento del precalentamiento de moldes
- \xBFExiste criterio de precalentamiento? Historial de an\xE1lisis de la necesidad del precalentador
     \u21D2 Si con calentador de agua (moldes peque\xF1os, etc.) se alcanza r\xE1pido la temperatura, no es necesario el precalentador
     \u21D2 Se requiere historial de an\xE1lisis del tiempo de preparaci\xF3n/ajuste seg\xFAn condiciones de producci\xF3n de cada molde en uso
- Est\xE1ndar de tiempo de precalentamiento por material/producto y su control de historial`},{id:"4_7",c:3,p:30,ko:`\u25A3 \uAE08\uD615 \uC628\uB3C4 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC6B4\uC601\uC2E4\uD0DC \uC810\uAC80(\uC2E4\uC2DC\uC774\uB825 \uC2E0\uB8B0\uB3C4 \uD655\uBCF4 \uD544\uC694, \uD604\uC7A5\uC810\uAC80\uC2DC \uC0D8\uD50C \uC2E4\uCE21 \uC694\uB9DD)
    - \uAE08\uD615\uC628\uB3C4 F/P \uCE21\uC815\uC13C\uC11C \uBC18\uC601\uC2DC : \uAE08\uD615\uC628\uB3C4 \uC124\uBE44 \uC720\uD6A8\uC131 \uBE44\uAD50\uAC80\uC99D \uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218
        : \uAE08\uD615 \uACE0\uC815\uCE21/ \uC774\uB3D9\uCE21\uBCC4 F/P \uACC4\uCE21\uC13C\uC11C \uC124\uBE44 \uC720\uD6A8\uC131 \uAC80\uC99D
          \u21D2 \uC124\uBE44 \uC14B\uD305\uAC12 \uB300\uBE44 \uC628\uB3C4\uC13C\uC11C \uD45C\uC2DC\uAC12/\uC2E4\uCE21\uAC12 \uBE44\uAD50\uAC80\uC99D \uC2E4\uC2DC(\uC790\uCCB4 \uC815\uAE30\uC810\uAC80 \uC8FC\uAE30 \uC124\uC815 \uBC0F \uC900\uC218)
      \u203B \uAD8C\uC7A5\uC0AC\uD56D [\uAD8C\uC7A5 \uC0AC\uD56D\uC73C\uB85C \uC790\uCCB4 \uD488\uC9C8\uC601\uD5A5\uC131 \uAC80\uC99D\uC744 \uD1B5\uD55C \uAD00\uB9AC\uACF5\uCC28 \uAC00\uB2A5]
                     600t\uC774\uD558 : \uC13C\uC11C 1\uAC1C\uC18C \uC774\uC0C1, \uC13C\uC11C\uB300\uBE44 \uC2E4\uCE21\uAC12 \uC628\uB3C4\uD3B8\uCC28 \xB13\u2103\uC774\uB0B4 \uAD8C\uC7A5 
                     600t\uC774\uC0C1 : \uC13C\uC11C 2\uAC1C\uC18C \uC774\uC0C1, \uC13C\uC11C\uB300\uBE44 \uC2E4\uCE21\uAC12 \uC628\uB3C4\uD3B8\uCC28 \uBC0F \uC13C\uC11C\uAC04 \uC628\uB3C4\uD3B8\uCC28 \xB15\u2103\uC774\uB0B4 \uAD8C\uC7A5   
    - \uAE08\uD615\uC628\uB3C4 F/P \uCE21\uC815\uC13C\uC11C \uBBF8\uBC18\uC601 \uC2DC
        : \uC0DD\uC0B0\uC911 \uC815\uAE30\uC801\uC778 \uAE08\uD615\uC628\uB3C4 \uC720\uD6A8\uC131 \uC810\uAC80\uD65C\uB3D9 \uC2E4\uC2DC \uD544\uC694(1\uD68C \uC774\uC0C1/SHIFT)  
          \u21D2 F/P \uBBF8\uBC18\uC601\uC2DC \uC0DD\uC0B0\uACFC\uC815\uC911 \uAE08\uD615\uC628\uB3C4 \uC0DD\uC0B0\uACFC\uC815\uC911 \uAD00\uB9AC\uAE30\uC900 \uB9CC\uC871\uC5EC\uBD80 \uC790\uC8FC \uBCF4\uC99D\uBC29\uC548 \uC218\uB9BD \uD544\uC694
               (\uCD08/\uC885\uD488 \uC0DD\uC0B0\uC2DC \uD45C\uBA74\uC628\uB3C4 \uAC80\uC99D \uB4F1) 
      \u203B \uC811\uCD09\uC2DD \uC628\uB3C4\uACC4 \uCE21\uC815\uC704\uCE58 \uC120\uC815 \uAE30\uC900 \uADFC\uAC70(\uAE08\uD615\uAD6C\uC870 \uAC80\uD1A0, \uCE21\uC815\uC704\uCE58 \uC801\uC815\uC131 \uD655\uBCF4) \uD655\uC778
    - \uAE08\uD615\uC628\uB3C4 \uC720\uC9C0/\uC870\uC808\uC7A5\uCE58(\uC628\uC218\uAE30, \uC628\uC720\uAE30, \uCE60\uB7EC) \uC801\uC6A9\uC0C1\uD0DC \uC810\uAC80`,es:`\u25A3 Criterios y operaci\xF3n del control de temperatura de molde (se requiere confiabilidad del historial; medir una muestra real en la revisi\xF3n de piso)
- Si hay sensor de medici\xF3n F/P de temperatura del molde: procedimiento y cumplimiento de verificaci\xF3n comparativa de validez
    : verificar la validez del sensor F/P por lado fijo/m\xF3vil del molde
      \u21D2 Comparar valor mostrado/medido del sensor contra el valor ajustado (definir y cumplir frecuencia propia de revisi\xF3n)
   \u203B Recomendado [se puede definir tolerancia propia con verificaci\xF3n de impacto en calidad]
        \u2264600 t: 1 sensor o m\xE1s; desviaci\xF3n de temperatura medida vs sensor dentro de \xB13\u2103
        \u2265600 t: 2 sensores o m\xE1s; desviaci\xF3n medida vs sensor y entre sensores dentro de \xB15\u2103
- Si no hay sensor F/P de temperatura de molde:
    : Realizar verificaci\xF3n peri\xF3dica de validez de la temperatura del molde durante producci\xF3n (1 vez o m\xE1s por TURNO)
      \u21D2 Definir medio de autoaseguramiento de que la temperatura cumple el criterio (p. ej. verificar temperatura superficial en primera/\xFAltima pieza)
   \u203B Verificar el fundamento de la posici\xF3n de medici\xF3n del term\xF3metro de contacto (revisi\xF3n de estructura del molde, adecuaci\xF3n de la posici\xF3n)
- Revisar la aplicaci\xF3n de equipos de mantenimiento/regulaci\xF3n de temperatura del molde (calentador de agua, de aceite, chiller)`},{id:"5_1",c:4,p:40,ko:`\u25A3 \uC6D0\uC790\uC7AC \uBC0F \uC7AC\uACF5\uD488, \uCD9C\uD558\uD488 LOT \uCD94\uC801\uC131 \uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
 [CASE1] LOT\uC218\uC791\uC5C5\uAD00\uB9AC - \uD30C\uB81B\uD2B8or \uBD80\uD488\uB2E8\uC704 
   \u25B7 \uBCF4\uC548/\uC548\uC804 \uBD80\uD488 \uBCC4\uB3C4 \uC2DD\uBCC4 \uD45C\uC2DC : LOT\uD0C0\uAC01, \uC2DD\uBCC4\uB9C8\uD06C \uB4F1
   \u25B7 \uC120\uC785/\uC120\uCD9C \uAD00\uB9AC\uAE30\uC900 \uC720\uBB34 (\uACF5\uC815~\uCD9C\uD558) - \uAD00\uB9AC \uB300\uC7A5, \uB808\uC774\uC544\uC6C3
   \u25B7 \uC120\uC785 \uC120\uCD9C \uC900\uC218 \uC5EC\uBD80 - \uC911\uC694 \uBD80\uD488 \uC0D8\uD50C\uB9C1 \uC810\uAC80, \uC778\uB77C\uC778 \uD22C\uC785 \uC81C\uD488, \uD22C\uC785 \uB300\uAE30 \uC81C\uD488, \uC790\uC7AC\uCC3D\uACE0 \uC801\uC7AC \uC81C\uD488 \uC0DD\uC0B0\uC77C \uC810\uAC80 
   \u25B7 \uBD80\uD488 LOT \uD45C\uAE30 \uC5EC\uBD80  (\uD45C\uC900\uB958 \uC9C0\uC815\uC2DC) - \uAC01\uC778, \uC2A4\uD2F0\uCEE4, \uD0C0\uAC01 \uB4F1
   \u25B7 \uBD80\uD488 LOT\uAE30\uB85D \uB9C8\uC2A4\uD130\uB9AC\uC2A4\uD2B8 \uAD00\uB9AC\uB418\uACE0 \uC5ED\uCD94\uC801 \uAC00\uB2A5 \uC5EC\uBD80
 [CASE2] LOT\uC804\uC0B0\uAD00\uB9AC - \uD30C\uB81B\uD2B8\uB2E8\uC704 
   \u25B7 \uD30C\uB81B\uD2B8 \uB0A9\uD488\uB2E8\uC704 \uC774\uC885 LOT \uC0DD\uC0B0\uD488 \uD63C\uC785 \uBC29\uC9C0 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD - \uD30C\uB81B\uD2B8 \uB0A9\uC785 \uC81C\uD488 \uD63C\uC785\uC5EC\uBD80 \uC2E4\uBB3C \uD655\uC778
   \u25B7 \uD30C\uB81B\uD2B8 \uBC14\uCF54\uB4DC \uB77C\uBCA8 \uBD80\uCC29 \uAD00\uB9AC \uC5EC\uBD80 (\uBC14\uCF54\uB4DC \uB77C\uBCA8 \uC720\uC2E4 \uBC29\uC9C0 \uB300\uCC45 \uD3EC\uD568) 
    - \uC0DD\uC0B0 LOT \uC815\uBCF4 \uD3EC\uD568, \uBCF4\uC548/\uC548\uC804 \uBD80\uD488 \uBCC4\uB3C4 \uC2DD\uBCC4 \uD45C\uC2DC
   \u25B7 \uD30C\uB81B\uD2B8 \uB2E8\uC704 \uACF5\uC815 \uD22C\uC785\uC2DC \uBC14\uCF54\uB4DC \uB9AC\uB529     - \uBBF8\uB9AC\uB529 \uC624\uB958 \uBC1C\uC0DD \uC54C\uB78C \uBC0F \uC120\uC785\uC120\uCD9C \uC778\uD130\uB77D \uC720\uBB34
   \u25B7 \uD30C\uB81B\uD2B8 \uB2E8\uC704 LOT \uC804\uC0B0 \uAD00\uB9AC\uB418\uACE0, \uC5ED\uCD94\uC801 \uAC00\uB2A5 \uC5EC\uBD80
[CASE3] LOT\uC804\uC0B0\uAD00\uB9AC - \uBD80\uD488\uB2E8\uC704 
   \u25B7 \uBD80\uD488 \uBC14\uCF54\uB4DC \uB77C\uBCA8 \uBD80\uCC29 \uAD00\uB9AC \uC5EC\uBD80 (\uBC14\uCF54\uB4DC \uB77C\uBCA8 \uC720\uC2E4 \uBC29\uC9C0 \uB300\uCC45 \uD3EC\uD568) 
    - \uC0DD\uC0B0 LOT \uC815\uBCF4 \uD3EC\uD568, \uBCF4\uC548/\uC548\uC804 \uBD80\uD488 \uBCC4\uB3C4 \uC2DD\uBCC4 \uD45C\uC2DC
    - \uB77C\uBCA8 \uBD80\uCC29 \uC704\uCE58\uB294 \uC815\uD574\uC838 \uC788\uC73C\uBA70, \uBD88\uC644\uC804 \uBD80\uCC29\uC5D0 \uC758\uD55C \uC0C1\uB300\uBB3C \uAC04\uC12D \uC5C6\uC744\uAC83
   \u25B7 \uBD80\uD488\uB2E8\uC704 \uACF5\uC815 \uD22C\uC785\uC2DC \uBC14\uCF54\uB4DC \uB9AC\uB529 - \uBBF8\uB9AC\uB529 \uC624\uB958 \uBC1C\uC0DD \uC54C\uB78C \uBC0F \uC120\uC785\uC120\uCD9C \uC778\uD130\uB77D \uC720\uBB34
   \u25B7 \uBD80\uD488 \uB2E8\uC704 LOT \uC804\uC0B0 \uAD00\uB9AC\uB418\uACE0, \uC5ED\uCD94\uC801 \uAC00\uB2A5 \uC5EC\uBD80`,es:`\u25A3 Proceso y cumplimiento de trazabilidad por LOTE de materia prima, producto en proceso y producto embarcado
 [CASO 1] Control manual de LOTE \u2013 por tarima o por pieza
   \u25B7 Identificaci\xF3n separada de piezas de seguridad: grabado de LOTE, marcas de identificaci\xF3n, etc.
   \u25B7 Criterio de PEPS (primeras entradas-primeras salidas) del proceso al embarque \u2013 registro, layout
   \u25B7 Cumplimiento del PEPS \u2013 muestreo de piezas importantes; revisar fecha de producci\xF3n de lo que va a l\xEDnea, lo que espera y lo almacenado
   \u25B7 Marcado del LOTE en la pieza (si lo define el est\xE1ndar) \u2013 grabado, etiqueta, golpe, etc.
   \u25B7 \xBFLa lista maestra de registro de LOTE de piezas se controla y permite trazabilidad hacia atr\xE1s?
 [CASO 2] Control por sistema de LOTE \u2013 por tarima
   \u25B7 Proceso para evitar mezcla de LOTES distintos en la tarima de entrega \u2013 verificar f\xEDsicamente
   \u25B7 Etiqueta de c\xF3digo de barras en tarima (con medidas contra p\xE9rdida de etiqueta)
    - Incluir informaci\xF3n de LOTE de producci\xF3n; identificaci\xF3n separada de piezas de seguridad
   \u25B7 Lectura de c\xF3digo de barras al entrar la tarima al proceso \u2013 alarma por error de no lectura e interlock de PEPS
   \u25B7 \xBFEl LOTE por tarima se controla en sistema y permite trazabilidad hacia atr\xE1s?
 [CASO 3] Control por sistema de LOTE \u2013 por pieza
   \u25B7 Etiqueta de c\xF3digo de barras en la pieza (con medidas contra p\xE9rdida de etiqueta)
    - Incluir informaci\xF3n de LOTE de producci\xF3n; identificaci\xF3n separada de piezas de seguridad
    - Posici\xF3n de etiqueta definida; sin interferencia con piezas de acople por pegado incompleto
   \u25B7 Lectura de c\xF3digo de barras al entrar la pieza al proceso \u2013 alarma por error de no lectura e interlock de PEPS
   \u25B7 \xBFEl LOTE por pieza se controla en sistema y permite trazabilidad hacia atr\xE1s?`},{id:"5_2",c:4,p:10,ko:`\u25A3 \uC218\uC785\uC790\uC7AC \uBCF4\uAD00\uC7A5 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uC790\uC7AC \uCC3D\uACE0 Lay Out \uD604\uD669\uB3C4 \uC791\uC131 \uBC0F \uC120\uC785\uC120\uCD9C \uAD00\uB9AC(\uC120\uC785\uC120\uCD9C \uB2E4\uC774 \uB4F1 \uAD6C\uC870\uC801 \uC2DC\uC2A4\uD15C, \uC785/\uBD88\uCD9C \uC808\uCC28 \uD6A8\uC728\uC131 \uD655\uBCF4 \uC5EC\uBD80)
    - \uC785\uACE0\uD488 \uC801\uC7AC/\uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218(\uC785\uACE0 \uC644\uB8CC\uD488 \uCC0D\uD798/\uBC1C\uCCAD, \uC774\uBB3C\uC9C8\uC624\uC5FC, \uAE30\uD0C0 \uC190\uC0C1 \uD655\uC778\uC2DC \uAC10\uC810)
    - \uC6D0\uC18C\uC7AC \uBCF4\uAD00 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC(\uD3EC\uC7A5\uC0C1\uD0DC \uBC0F \uAC1C\uBD09\uD6C4 \uC2DD\uBCC4\uBC29\uBC95 \uB4F1)
    - \uBBF8\uC0AC\uC6A9 \uC7A5\uAE30\uBCF4\uAD00 \uC790\uC7AC\uB958 \uCC98\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC774\uD589\uC0C1\uD0DC
    - \uC124\uBCC0\uC5D0 \uC758\uD55C \uBD88\uC6A9\uC790\uC7AC \uBC1C\uC0DD\uC2DC \uC790\uC7AC \uC2DD\uBCC4 \uBC0F \uD63C\uC785 \uBC29\uC9C0 \uAD00\uB9AC \uC0C1\uD0DC 
    - \uD56D\uC628/\uD56D\uC2B5\uBCF4\uAD00 \uD544\uC694 \uC790\uC7AC\uC758 \uACBD\uC6B0 \uBCF4\uAD00\uC7A5 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218 \uC0C1\uD0DC
