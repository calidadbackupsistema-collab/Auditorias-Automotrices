    - \uC6D0\uC18C\uC7AC \uBC0F \uC678\uC8FC\uD488 \uC548\uC804\uC7AC\uACE0 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC678\uC8FC\uD488 \uACB0\uD488\uC2DC \uC720\uC0AC\uC0AC\uC591 \uB300\uCCB4 \uD22C\uC785 \uAE08\uC9C0`,es:`\u25A3 Criterios y cumplimiento del almac\xE9n de materiales recibidos
- Elaborar el layout del almac\xE9n y controlar PEPS (sistema estructural como racks PEPS, eficiencia del procedimiento de entrada/salida)
- Definir y cumplir criterios de estiba/control de lo recibido (se descuenta si hay golpes/\xF3xido, contaminaci\xF3n u otros da\xF1os)
- Criterios y cumplimiento de almacenamiento de materia prima (estado del empaque, m\xE9todo de identificaci\xF3n tras abrir, etc.)
- Criterio e implementaci\xF3n para materiales sin uso y de larga estancia
- Control de identificaci\xF3n y prevenci\xF3n de mezcla de materiales obsoletos por cambio de ingenier\xEDa
- Criterios y cumplimiento del almac\xE9n para materiales que requieren temperatura/humedad constante
- Criterio de stock de seguridad de materia prima y piezas externas; prohibido usar sustituto de especificaci\xF3n similar ante faltante de pieza externa`},{id:"5_3",c:4,p:20,ko:`\u25A3 \uC785\uACE0\uD488 \uC2DD\uBCC4\uAD00\uB9AC \uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uAC80\uC0AC \uC804,\uD6C4 \uC2DD\uBCC4 \uBC0F \uBBF8\uAC80\uC0AC\uD488 \uC0AC\uC6A9 \uBC29\uC9C0 \uBCF4\uC99D \uBC29\uC548
    - \uC18C\uC7AC\uC0AC\uC591 \uBC0F GRADE \uC2DD\uBCC4\uC808\uCC28 
    - \uC7A5\uAE30/\uBD88\uC6A9/\uAC1C\uBC1C\uD488 \uC790\uC7AC \uC2DD\uBCC4\uC808\uCC28(\uC7A5\uAE30/\uBD88\uC6A9/\uAC1C\uBC1C\uC6A9 \uC6D0\uC7AC\uB8CC \uBCC4\uB3C4 \uAD6C\uBD84/\uC2DD\uBCC4\uAD00\uB9AC)
    - \uACF5\uC815 \uD22C\uC785\uD6C4 \uC794\uB7C9\uAD00\uB9AC(\uBCF4\uAD00\uC0C1\uD0DC/\uC2DD\uBCC4\uD45C\uC2DC/\uC720\uD6A8\uAE30\uAC04 \uC124\uC815 \uB4F1)
    - \uC5EC\uB7EC \uC0AC\uC591\uC758 \uBD80\uD488\uC744 \uB3D9\uC2DC \uC0DD\uC0B0\uD558\uB294 \uB77C\uC778\uC758 SUB\uD488 \uC870\uB9BD \uC791\uC5C5\uC2DC \uC0AC\uC591\uAD00\uB9AC \uBC29\uC548\uB9C8\uB828
     \u203B Barcode \uC778\uD130\uB77D \uB610\uB294 \uBD80\uD488 \uBCF4\uAD00\uBC15\uC2A4 LABEL \uAD6C\uBD84\uD6C4 \uC791\uC5C5\uC77C\uBCF4 SUB\uD488 \uC0AC\uC591(\uD488\uBC88\uAE30\uC785) \uD65C\uB3D9\uC73C\uB85C \uC815\uC0AC\uC591 \uC5EC\uBD80 \uC2DC\uC5C5\uC804 \uC810\uAC80`,es:`\u25A3 Criterios y cumplimiento de la identificaci\xF3n de lo recibido
- Identificaci\xF3n antes/despu\xE9s de inspecci\xF3n y medios que aseguren no usar producto sin inspeccionar
- Procedimiento de identificaci\xF3n de especificaci\xF3n y GRADO del material
- Procedimiento de identificaci\xF3n de materiales de larga estancia/obsoletos/de desarrollo (separar e identificar materia prima de larga estancia/obsoleta/de desarrollo)
- Control del remanente tras entrar al proceso (estado de almacenamiento, identificaci\xF3n, definici\xF3n de vigencia, etc.)
- En l\xEDneas que producen varias especificaciones a la vez: medida de control de especificaci\xF3n al ensamblar piezas SUB
  \u203B Verificar antes del inicio la especificaci\xF3n correcta mediante interlock de c\xF3digo de barras, o separando con ETIQUETA las cajas de piezas y anotando la especificaci\xF3n (n\xFAmero de parte) de la pieza SUB en el reporte diario`},{id:"5_4",c:4,p:20,ko:`\u25A3 \uC7AC\uACF5\uD488/\uC644\uC81C\uD488 \uC6A9\uAE30 \uD45C\uC900\uD654 \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC774\uD589\uC0C1\uD0DC
    - \uD488\uBAA9\uBCC4/\uACF5\uC815\uBCC4 \uC7A5\uC785(\uC801\uC7AC) \uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC/ \uACFC\uB2E4\uC801\uC7AC \uC608\uBC29\uC744 \uC704\uD55C \uC7A5\uC785 \uD55C\uACC4 \uAE30\uC900\uC124\uC815 \uB4F1
    - \uC678\uAD00\uD655\uC778\uC774 \uC5B4\uB824\uC6B4 \uACF5\uC815\uCC98\uB9AC \uC804/\uD6C4 \uC7AC\uACF5\uD488 \uBCF4\uAD00\uC6A9\uAE30 \uC2DD\uBCC4\uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
        (\uC608: \uD45C\uBA74\uCC98\uB9AC, \uC5F4\uCC98\uB9AC \uC804/\uD6C4, \uD15C\uD37C\uB9C1 \uC804/\uD6C4 \uC6A9\uAE30 \uC2DD\uBCC4\uAD00\uB9AC \uC808\uCC28\uC218\uB9BD, \uC5F4\uCC98\uB9AC\uD6C4 \uD15C\uD37C\uB9C1 \uC2DC\uAC04\uAD00\uB9AC)
    - \uC81C\uD488 \uD2B9\uC131\uC744 \uACE0\uB824\uD55C \uC6A9\uAE30 \uAD00\uB9AC\uAE30\uC900 \uC124\uC815(\uCCAD\uC815\uB3C4 \uAD00\uB9AC \uB300\uC0C1\uD488 \uC774\uBB3C\uC9C8\uC720\uC785 \uC608\uBC29\uBAA9\uC801 \uC6A9\uAE30 \uC138\uCC99, \uC624\uC5FC\uBC29\uC9C0 \uCEE4\uBC84 \uC801\uC6A9 \uB4F1)
    - \uD3EC\uC7A5 \uC6A9\uAE30 \uB2E4\uB2E8\uC801\uC7AC \uBC0F \uD604\uC7A5 \uC801\uC7AC\uC0C1\uD0DC (\uC885\uC774BOX, \uD504\uB77C\uC2A4\uD2F1BOX, \uC804\uC6A9\uC6A9\uAE30 \uB4F1 \uC801\uC7AC \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC774\uD589\uC0C1\uD0DC)
    - \uC644\uC81C\uD488 \uBCF4\uAD00\uAD00\uB9AC \uAE30\uC900 \uBC0F \uAD00\uB9AC\uC0C1\uD0DC
      : \uC131\uC801\uC11C \uAE30\uB85D\uC0C1\uD0DC, \uC644\uC81C\uD488 \uBCF4\uAD00\uAD00\uB9AC(\uBCC4\uB3C4\uACF5\uAC04/\uC2DD\uBCC4\uACF5\uAC04, \uCCAD\uACB0\uAD00\uB9AC, \uAC04\uC9C0\uC0AC\uC6A9 \uB4F1 \uC81C\uD488 \uC678\uAD00 \uBC0F \uAE30\uB2A5\uC5D0 \uD488\uC9C8\uBB38\uC81C \uBC1C\uC0DD \uAC00\uB2A5\uC5EC\uBD80)
    - \uC774\uB3D9 \uB610\uB294 \uBCF4\uAD00 \uB300\uCC28/\uD314\uB808\uD2B8\uC5D0 \uC758\uD55C \uBD80\uD488\uC190\uC0C1(\uBD80\uD488\uAC04 \uAC04\uC12D \uCC0D\uD798, \uC801\uC785\uC778\uCD9C\uC2DC \uB300\uCC28\uAC04\uC12D \uB4F1)\uBC29\uC9C0 \uC0AC\uC804 \uAC80\uD1A0\uD544\uC694`,es:`\u25A3 Criterios y cumplimiento de la estandarizaci\xF3n de contenedores de producto en proceso/terminado
- Criterios de carga (estiba) por producto/proceso y su cumplimiento; l\xEDmite de carga para evitar sobrecarga
- Procedimiento y cumplimiento de identificaci\xF3n de contenedores de producto en proceso antes/despu\xE9s de procesos cuya apariencia no permite distinguirlos
   (ej.: identificaci\xF3n de contenedores antes/despu\xE9s de tratamiento superficial, t\xE9rmico o revenido; control del tiempo de revenido tras tratamiento t\xE9rmico)
- Criterios de contenedores considerando las caracter\xEDsticas del producto (limpieza de contenedores y cubiertas anticontaminaci\xF3n para productos con control de limpieza, etc.)
- Estiba multinivel de contenedores y estado de estiba en piso (criterios y cumplimiento para cajas de cart\xF3n, cajas de pl\xE1stico, contenedores dedicados, etc.)
- Criterios y estado del almacenamiento de producto terminado
  : registro en reportes, almacenamiento (espacio separado/identificado, limpieza, uso de separadores, etc.; posibilidad de problemas de apariencia o funci\xF3n)
- Revisar previamente c\xF3mo evitar da\xF1os a las piezas por carros/tarimas de traslado o almacenamiento (golpes entre piezas, interferencia del carro al cargar/descargar, etc.)`},{id:"6_1",c:5,p:30,ko:`\u25A3 \uC548\uC804\uC0AC\uACE0 \uBC1C\uC0DD \uC608\uBC29\uC744 \uC704\uD55C \uC5C5\uBB34 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC2E4\uD0DC
    - \uC791\uC5C5\uC790 \uC548\uC804\uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC2E4\uD0DC(\uD604\uC7A5\uD655\uC778)
      : \uC0DD\uC0B0\uC911 \uD578\uB4DC\uD3F0 \uBBF8\uC0AC\uC6A9\uC744 \uC704\uD55C \uBCC4\uB3C4 \uBCF4\uAD00\uB300 \uC124\uCE58 \uBC0F \uC2DC\uAC74\uC7A5\uCE58, \uB77C\uC778\uD22C\uC785\uC804 \uD734\uB300\uD3F0 \uBBF8\uBC18\uB0A9\uD6C4 \uC0AC\uC6A9\uC2DC \uC870\uCE58\uBC29\uC548
       : \uC548\uC804 \uBCF4\uD638\uC7A5\uAD6C(\uBCF4\uC548\uACBD/\uD5EC\uBA67/\uC7A5\uAC11 \uB4F1) \uCC29\uC6A9 \uAE30\uC900\uC218\uB9BD \uBC0F \uC774\uD589\uC0C1\uD0DC \uC810\uAC80(\uC77C\uC0C1)
    - \uC5C5\uC885\uBCC4 \uC548\uC804\uC0AC\uACE0 \uBC1C\uC0DD \uC608\uBC29\uC744 \uC704\uD55C \uC124\uBE44/\uB808\uC774\uC544\uC6C3 \uBC18\uC601
          \u21D2 \uC608) \uD504\uB808\uC2A4 : \uC791\uC5C5\uC790 \uAC10\uC9C0\uC13C\uC11C(\uC548\uC804BAR), \uC591\uC218 \uC870\uC791\uBC84\uD2BC, \uD50C\uB77C\uC774\uD720 \uCEE4\uBC84 \uB4F1
                    \uB3C4\uAE08 : \uB9C8\uC2A4\uD06C \uCC29\uC6A9, \uC704\uD5D8\uBB3C(\uC57D\uD488) \uBCC4\uB3C4 \uBCF4\uAD00\uC7A5 \uB9C8\uB828 \uBC0F \uCDE8\uAE09\uAE30\uC900 \uC218\uB9BD
                    \uC6A9\uC811 : \uC548\uC804\uC7A5\uAC11 \uBC0F \uBCF4\uD638 \uC548\uACBD \uCC29\uC6A9, \uC6A9\uC811 \uC2A4\uD398\uD130 \uBE44\uC0B0 \uBC29\uC9C0\uC6A9 \uBCF4\uD638\uB9C9 \uC124\uCE58 \uB4F1 
                    \uB85C\uBD07, \uC790\uB3D9 \uAE30\uACC4 \uC124\uBE44(LOTO) : \uC804\uC6D0\uCC28\uB2E8(Lock-Out)\uACFC \uACBD\uACE0\uD45C\uC9C0 \uBD80\uCC29(Tag-Out) \uC2E4\uC2DC
    - \uC791\uC5C5 \uD604\uC7A5\uB0B4 \uC548\uC804\uD45C\uC9C0/\uC218\uCE59 \uAC8C\uC2DC \uBC0F \uC791\uC5C5\uC790 \uAD50\uC721
    - \uC791\uC5C5 \uD604\uC7A5\uB0B4 \uC704\uD5D8\uC694\uC18C(\uC704\uD5D8\uBB3C)\uC5D0 \uB300\uD55C \uC0AC\uACE0\uC608\uBC29 \uC7A5\uBE44/\uC2DC\uC124\uBB3C \uC124\uCE58 \uBC0F \uC2DD\uBCC4 \uD45C\uC900\uB958 \uBC18\uC601
      1) \uD45C\uC900\uB958 \uAC8C\uC2DC\uB41C \uD604\uC704\uCE58 \uAE30\uC900 \uC18C\uD654 \uBC29\uC7AC\uC2DC\uC124 \uC704\uCE58 \uBC0F \uBE44\uC0C1\uB300\uD53C \uB3D9\uC120 \uD45C\uAE30\uB41C \uD45C\uC900\uB958 \uC791\uC131/\uAC8C\uC2DC
      2) \uC124\uBE44 \uAC04\uC12D \uB4F1 \uACE0\uB824 \uC18C\uD654 \uBC29\uC7AC\uC2DC\uC124 \uC2DD\uBCC4\uD45C, \uBE44\uC0C1\uB300\uBE44 \uD45C\uC2DC\uB4F1 2\uCE35\uB192\uC774 \uBC18\uC601
    - \uC6B4\uC601\uC911\uC778 \uC124\uBE44\uC5D0 \uB300\uD55C \uC815\uAE30 \uC548\uC804\uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC774\uD589\uC0C1\uD0DC
    - \uC124\uBE44 \uC810\uAC80\uC2DC(\uACC4\uD68D/\uBE44\uACC4\uD68D) \uC5C5\uBB34 \uCC98\uB9AC\uC808\uCC28 \uC218\uB9BD : 2\uC778 1\uAC1C\uC870 \uC6B4\uC601, \uBE44\uC815\uC0C1 \uAC00\uB3D9 \uC608\uBC29\uC808\uCC28 \uB4F1`,es:`\u25A3 Proceso y cumplimiento de la prevenci\xF3n de accidentes de seguridad
- Proceso de seguridad del operador y su cumplimiento (verificar en piso)
  : instalar un resguardo con candado para guardar celulares durante la producci\xF3n; medida si se usa el celular sin haberlo entregado antes de entrar a l\xEDnea
  : criterio y revisi\xF3n (diaria) del uso del equipo de protecci\xF3n (lentes, casco, guantes, etc.)
- Reflejar en equipos/layout la prevenci\xF3n de accidentes seg\xFAn el giro
    \u21D2 ej.) Prensa: sensor de detecci\xF3n del operador (barra de seguridad), control a dos manos, cubierta de volante, etc.
            Recubrimiento: mascarilla, gabinete separado para sustancias peligrosas (qu\xEDmicos) y criterios de manejo
            Soldadura: guantes y lentes de seguridad, pantallas contra chispas de soldadura, etc.
            Robots/equipos autom\xE1ticos (LOTO): realizar bloqueo de energ\xEDa (Lock-Out) y colocaci\xF3n de aviso (Tag-Out)
- Publicar se\xF1ales/reglas de seguridad en el \xE1rea de trabajo y capacitar a los operadores
- Instalar equipos/instalaciones de prevenci\xF3n y reflejar en est\xE1ndares la identificaci\xF3n de riesgos (sustancias peligrosas) en el \xE1rea
  1) Elaborar y publicar est\xE1ndares con la ubicaci\xF3n de equipos contra incendio y rutas de evacuaci\xF3n desde la posici\xF3n actual
  2) Considerando interferencias con equipos, colocar los letreros de equipo contra incendio y luces de emergencia a la altura del segundo nivel
- Proceso de gesti\xF3n peri\xF3dica de seguridad de los equipos en operaci\xF3n y su implementaci\xF3n
- Procedimiento durante revisi\xF3n de equipos (planeada/no planeada): trabajo en pareja (2 personas), procedimiento para evitar operaci\xF3n anormal, etc.`},{id:"6_2",c:5,p:20,ko:`\u25A3 \uC124\uACC4\uBCC0\uACBD, 4M \uBCC0\uACBD\uCC98\uB9AC \uC5C5\uBB34\uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uC124\uACC4\uBCC0\uACBD/4M \uBCC0\uACBD \uC5C5\uBB34 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD\uC5EC\uBD80
        [\uC138\uBD80 \uC720\uD615\uBCC4 \uC5C5\uBB34 \uCC98\uB9AC\uC808\uCC28 \uBC0F \uAD00\uB9AC\uBD84\uB2F4, \uACE0\uAC1D\uC0AC ISIR \uC7AC\uC2B9\uC778 \uD544\uC694\uC5EC\uBD80 \uB4F1]
    - \uBCC0\uACBD\uC810 \uCD94\uC801\uC131 \uD655\uBCF4\uB97C \uC704\uD55C \uB9C8\uC2A4\uD130\uB9AC\uC2A4\uD2B8 \uC791\uC131\uAD00\uB9AC[\uB204\uB77D \uBC1C\uC0DD\uC2DC \uAC10\uC810 \uCC98\uB9AC]
    - \uBCC0\uACBD\uC810 \uB204\uB77D \uBC1C\uC0DD \uC608\uBC29\uC744 \uC704\uD55C \uC815\uAE30\uC801\uC778 \uC810\uAC80\uD65C\uB3D9 \uC2E4\uC2DC\uC5EC\uBD80[\uB2F4\uB2F9\uC790 \uC9C0\uC815 \uBC0F \uC810\uAC80\uC8FC\uAE30 \uC124\uC815\uAD00\uB9AC]
    - 4M \uBCC0\uACBD\uD488 \uC774\uC0C1\uC5EC\uBD80 \uD655\uC778\uC744 \uC704\uD55C \uCD08\uAE30\uC720\uB3D9\uAD00\uB9AC \uC5EC\uBD80
    - 4M \uBCC0\uACBD\uC774\uB825 \uACE0\uAC1D\uC0AC \uC2B9\uC778\uC5EC\uBD80 \uD655\uC778[\uACE0\uAC1D\uC0AC \uC2B9\uC778\uBCF8 \uC811\uC218\uAD00\uB9AC]`,es:`\u25A3 Procedimiento y cumplimiento de cambios de dise\xF1o y cambios 4M
- \xBFExiste un proceso de cambios de dise\xF1o/4M?
   [procedimiento y reparto de responsabilidades por tipo de cambio, necesidad de reaprobaci\xF3n ISIR del cliente, etc.]
- Elaborar y controlar una lista maestra para asegurar la trazabilidad de cambios [se descuenta si hay omisiones]
- Revisiones peri\xF3dicas para prevenir omisiones de cambios [designar responsable y definir frecuencia]
- Control de flujo inicial (contenci\xF3n inicial) para verificar anomal\xEDas en productos con cambio 4M
- Verificar la aprobaci\xF3n del cliente del historial de cambios 4M [recibir y controlar la versi\xF3n aprobada por el cliente]`},{id:"6_3",c:5,p:20,ko:`\u25A3 \uD488\uBAA9\uBCC4 \uB3C4\uBA74\uAE30\uC900 \uAC80\uC0AC\uD611\uC815 \uCCB4\uACB0 \uBC0F \uAD00\uB9AC\uAE30\uC900 \uC900\uC218\uC0C1\uD0DC (\uB3C4\uBA74 \uC77C\uCE58\uC131) 
   \u25B7 \uB3C4\uBA74\uC5D0 \uBA85\uC2DC\uB41C \uC678\uAD00, \uCE58\uC218, \uAE30\uB2A5, \uC8FC\uAE30\uB97C \uAC80\uC0AC\uD611\uC815 \uBC0F \uC0AC\uB0B4 \uAC80\uC0AC\uAE30\uC900 \uBC18\uC601
    - \uAC80\uC0AC\uD611\uC815\uC11C/\uAE30\uC900\uC11C/\uCD08\uB3C4\uD488 \uBCF4\uC99D\uC11C \uACE0\uAC1D \uC2B9\uC778\uBCF8 \uBCF4\uC720
    - \uB3C4\uBA74 \uC77C\uCE58\uC131 \uC810\uAC80 \uB2F4\uB2F9\uC790 \uC9C0\uC815\uD558\uC5EC \uC815\uAE30\uC801 \uB3C4\uBA74\uB300\uBE44 \uAC80\uC0AC\uD611\uC815/\uAE30\uC900\uC11C \uC77C\uCE58\uC131 \uC810\uAC80 \uBC0F \uC810\uAC80\uC774\uB825 \uAD00\uB9AC
    \u203B \uAE08\uD615 \uB178\uD6C4\uD654\uC5D0 \uB530\uB978 \uC131\uD615\uBD80 \uB9C8\uBAA8\uB85C \uC911\uC694\uCE58\uC218 \uBD88\uB9CC\uC871 \uBB38\uC81C\uC810 \uC0AC\uC804 \uAC80\uD1A0 (\uCE58\uC218 \uC815\uAE30\uAC80\uC0AC \uD56D\uBAA9 \u5916 \uAE08\uD615 \uB9C8\uBAA8 \uC608\uC0C1\uBD80 \uAC80\uC0AC\uD56D\uBAA9 \uCD94\uAC00) 
   \u25B7 \uAC80\uC0AC\uD611\uC815 \uBC0F \uAC80\uC0AC\uAE30\uC900\uC11C\uB0B4 \uBD80\uD488 \uAC80\uC0AC\uD56D\uBAA9(\uC815\uAE30\uC2E0\uB8B0\uC131 \uC2DC\uD5D8 \uD3EC\uD568)\uC758 \uC810\uAC80\uC8FC\uAE30 \uC900\uC218\uC5EC\uBD80`,es:`\u25A3 Acuerdo de inspecci\xF3n por plano de cada producto y cumplimiento de criterios (coincidencia con el plano)
   \u25B7 Reflejar apariencia, dimensiones, funci\xF3n y frecuencia indicadas en el plano en el acuerdo de inspecci\xF3n y en el est\xE1ndar interno
    - Contar con versi\xF3n aprobada por el cliente del acuerdo/est\xE1ndar de inspecci\xF3n y certificado de primera pieza
    - Designar responsable de revisar la coincidencia con el plano; revisar peri\xF3dicamente acuerdo/est\xE1ndar vs plano y llevar historial
    \u203B Prever el problema de dimensiones cr\xEDticas fuera de especificaci\xF3n por desgaste del molde (adem\xE1s de \xEDtems de inspecci\xF3n dimensional peri\xF3dica, agregar inspecci\xF3n de zonas con desgaste previsible)
   \u25B7 Cumplimiento de la frecuencia de inspecci\xF3n de las piezas en el acuerdo/est\xE1ndar de inspecci\xF3n (incluye pruebas peri\xF3dicas de confiabilidad)`},{id:"6_4",c:5,p:30,ko:`\u25A3 \uD488\uC9C8\uACBD\uC601\uCCB4\uC81C \uAD6C\uCD95/\uC720\uC9C0\uB97C \uC704\uD55C \uC870\uC9C1\uAD6C\uC131 \uBC0F \uC6B4\uC601\uC0C1\uD0DC
    - \uD488\uC9C8 \uB9E4\uB274\uC5BC/\uC808\uCC28\uC11C/\uC9C0\uCE68\uC11C \uAD6C\uBE44 \uBC0F \uC801\uC6A9\uC0C1\uD0DC
    - \uAD6C\uCCB4\uC801\uC778 \uC5C5\uBB34\uBD84\uC7A5 \uC218\uB9BD\uC0C1\uD0DC
    - SQ \uC778\uC99D\uC5C5\uC885 \uC790\uCCB4 \uB0B4\uBD80\uC2EC\uC0AC[\uD3C9\uAC00\uC11C \uAE30\uC900] \uD65C\uB3D9 \uC2E4\uC2DC \uBC0F \uBC1C\uCDCC \uBB38\uC81C\uC810\uC5D0 \uB300\uD55C \uAC1C\uC120\uD65C\uB3D9 \uCD94\uC9C4 
          \u21D2 \uC810\uAC80\uACB0\uACFC \uACBD\uC601\uC790/\uC784\uC6D0 \uBCF4\uACE0 \uBC0F \uD6C4\uC18D\uC870\uCE58 \uD65C\uB3D9 \uC774\uB825[\uC99D\uBE59\uBB3C \uAD00\uB9AC]`,es:`\u25A3 Organizaci\xF3n y operaci\xF3n para construir/mantener el sistema de gesti\xF3n de calidad
- Contar con manual/procedimientos/instrucciones de calidad y su aplicaci\xF3n
- Reparto de responsabilidades concreto
- Realizar auditor\xEDa interna propia del giro con certificaci\xF3n SQ [conforme a la hoja de evaluaci\xF3n] y mejorar los problemas detectados
     \u21D2 Reporte de resultados a la direcci\xF3n/ejecutivos e historial de acciones posteriores [control de evidencias]`},{id:"6_5",c:5,p:20,ko:`\u25A3 \uC790\uACA9\uC778\uC99D \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC900\uC218\uC0C1\uD0DC
    - \uACF5\uC815\uBCC4 \uC791\uC5C5\uC790/\uAC80\uC0AC\uC790 \uBC30\uCE58\uAE30\uC900 \uC218\uB9BD \uBC0F \uC790\uACA9\uC778\uC99D \uD3C9\uAC00 \uC2E4\uC2DC\uC5EC\uBD80 [\uD488\uC9C8 \uD45C\uC900\uB958\uB0B4 \uAC80\uC0AC\uC9C0\uC815 \uD56D\uBAA9\uBCC4 \uB2F4\uB2F9\uC790]
          \u21D2 \uC790\uACA9\uC778\uC99D \uC2E4\uC2DC \uAE30\uC900 [\uBD80\uC801\uD569 \uD310\uBCC4 \uC2E4\uAE30\uD3C9\uAC00, \uD488\uC9C8\uD2B9\uC131 \uAD50\uC721, \uB3D9\uC77C\uC5C5\uBB34 \uACBD\uB825, \uC0DD\uC0B0\uD488 \uD488\uC9C8\uC0B0\uD3EC \uBC1C\uC0DD \uAC00\uB2A5\uC131 \uAC80\uC99D \uB4F1] 
      \u203B \uBD80\uC801\uD569 \uD310\uBCC4 \uC2E4\uAE30\uD3C9\uAC00
          \u2192 \uC678\uAD00\uAC80\uC0AC : \uBD80\uC801\uD569 \uC720\uD615\uBCC4 \uAC80\uCD9C\uB2A5\uB825 \uC2E4\uAE30\uD3C9\uAC00
             \uCE58\uC218\uAC80\uC0AC : \uB2F4\uB2F9\uBCC4 \uC9C0\uC815 \uACC4\uCE21\uAE30 \uC0AC\uC6A9\uB2A5\uB825 \uD3C9\uAC00 [\uACC4\uCE21\uAE30 \uD65C\uC6A9\uB2A5\uB825 \uD3C9\uAC00\uB85C CpK \uC0B0\uCD9C \uBD88\uD544\uC694]
    - \uC790\uACA9\uC778\uC99D \uAC80\uC99D\uD3C9\uAC00 \uACB0\uACFC\uC5D0 \uB300\uD55C \uC2E0\uB8B0\uB3C4 \uD655\uBCF4 \uD544\uC694(\uC218\uAE30 \uC791\uC131 \uC6D0\uBCF8\uB370\uC774\uD130, \uAC80\uC99D\uC6A9 \uC2DC\uB8CC \uD655\uBCF4 \uB4F1)
    - \uC790\uACA9\uC778\uC99D\uC790 \uACB0\uC6D0/\uD734\uAC00\uC2DC \uB300\uC751\uC778\uC6D0 \uD655\uBCF4\uC0C1\uD0DC \uBC0F \uD6C4\uC18D\uC870\uCE58 \uAD00\uB9AC\uBC29\uC548/\uC2E4\uD589\uC0C1\uD0DC
    - \uC791\uC5C5\uC790 \uACB0\uC6D0\uC73C\uB85C \uB300\uCCB4\uC778\uC6D0 \uD22C\uC785 \uBD88\uAC00\uD53C\uC2DC, \uD22C\uC785\uC804 \uAD50\uC721/\uD488\uC9C8\uBCF4\uC99D \uBC29\uC548 \uB4F1 \uAD00\uB9AC \uADDC\uC815 \uC218\uB9BD \uBC0F \uAD00\uB9AC \uC0C1\uD0DC\uC810\uAC80
    - \uC0DD\uC0B0\uC791\uC5C5\uC790 \uC790\uACA9\uC778\uC99D : \uB3D9\uC77C\uC791\uC5C5 \uBC18\uBCF5 \uC0DD\uC0B0\uD6C4 \uBD80\uD488\uAC04 \uC0B0\uD3EC\uBC1C\uC0DD \uAC00\uB2A5\uC131 \uAC80\uC99D 
    - \uC911\uC694/\uD2B9\uBCC4 \uACF5\uC815\uC5D0 \uB300\uD55C \uD488\uC9C8\uAC80\uC0AC\uC6D0 \uD655\uBCF4 \uBC0F \uC790\uACA9\uC778\uC99D \uC2E4\uC2DC \uD544\uC694
          \u21D2 \uC5F4\uCC98\uB9AC/\uB2E8\uC870 : \uC870\uC9C1 \uD310\uB3C5\uB2A5\uB825, \uC804\uC790/\uC870\uB9BD : \uB9AC\uC6CC\uD06C \uAC80\uC0AC\uC6D0, \uB3C4\uAE08/\uB3C4\uC7A5 : \uC561\uBD84\uC11D \uAC80\uC0AC\uC6D0, \uC804\uC790(\uB0A9\uB55C) : AOI \uAC80\uC0AC \uB2F4\uB2F9\uC790 \uB4F1
      \u203B \uC911\uC694/\uD2B9\uBCC4\uD2B9\uC131 \uACF5\uC815 \uC790\uACA9\uC778\uC99D\uD3C9\uAC00 \uBBF8\uC2E4\uC2DC, \uD5C8\uC704\uC791\uC131 \uD655\uC778\uC2DC \uC774\uD589\uB3C4 '0'\uC810 \uCC98\uB9AC`,es:`\u25A3 Criterios y cumplimiento de la certificaci\xF3n de calificaci\xF3n (autorizaci\xF3n de personal)
- Criterio de asignaci\xF3n de operadores/inspectores por proceso y realizaci\xF3n de evaluaci\xF3n de calificaci\xF3n [responsable por \xEDtem de inspecci\xF3n definido en est\xE1ndares de calidad]
     \u21D2 Criterios de calificaci\xF3n [evaluaci\xF3n pr\xE1ctica de detecci\xF3n de no conformes, capacitaci\xF3n en caracter\xEDsticas de calidad, experiencia en la misma labor, verificaci\xF3n de posible dispersi\xF3n de calidad entre piezas, etc.]
   \u203B Evaluaci\xF3n pr\xE1ctica de detecci\xF3n de no conformes
      \u2192 Inspecci\xF3n de apariencia: evaluaci\xF3n pr\xE1ctica de capacidad de detecci\xF3n por tipo de no conformidad
         Inspecci\xF3n dimensional: evaluaci\xF3n de capacidad de uso del instrumento asignado [con evaluar el uso del instrumento no se requiere calcular CpK]
- Asegurar la confiabilidad de resultados de evaluaci\xF3n de calificaci\xF3n (datos originales manuscritos, muestras de verificaci\xF3n, etc.)
- Disponer de personal de reemplazo ante ausencia/vacaciones del personal calificado, y medidas/ejecuci\xF3n de seguimiento
- Si es inevitable asignar reemplazo por falta de personal: definir y verificar reglas de capacitaci\xF3n/aseguramiento de calidad previas a la asignaci\xF3n
- Calificaci\xF3n de operadores de producci\xF3n: verificar posible dispersi\xF3n entre piezas tras producir repetidamente el mismo trabajo
- Contar con inspectores de calidad calificados para procesos importantes/especiales
     \u21D2 Tratamiento t\xE9rmico/forja: lectura de microestructura; electr\xF3nica/ensamble: inspector de retrabajo; recubrimiento/pintura: inspector de an\xE1lisis de ba\xF1o; electr\xF3nica (soldadura): responsable de inspecci\xF3n AOI, etc.
   \u203B Si no se realiza evaluaci\xF3n de calificaci\xF3n en procesos de caracter\xEDsticas cr\xEDticas/especiales, o se detecta falsificaci\xF3n: el cumplimiento se califica con '0' puntos`},{id:"6_6",c:5,p:20,ko:`\u25A3 \uC218\uC785\uAC80\uC0AC/\uC0DD\uC0B0\uACF5\uC815/\uCD5C\uC885\uAC80\uC0AC \uBD80\uC801\uD569(\uCD94\uC815)\uD488\uC5D0 \uB300\uD55C \uACA9\uB9AC/\uC2DD\uBCC4\uC808\uCC28 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uBD80\uC801\uD569\uD488 \uD6C4\uACF5\uC815 \uC720\uCD9C \uBC29\uC9C0\uB97C \uC704\uD55C \uC2DD\uBCC4 \uBC0F \uACA9\uB9AC\uBC29\uC548 \uC138\uBD80 \uC791\uC131 \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uBD80\uC801\uD569(\uCD94\uC815)\uD488 \uCC98\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC5EC\uBD80
    - \uACF5\uC815\uB0B4 \uBD80\uC801\uD569\uD488 \uBCF4\uAD00\uC6A9 \uBCF4\uAD00\uBC15\uC2A4 \uBCC4\uB3C4 \uBE44\uCE58(RED BOX)  
    - \uC0DD\uC0B0\uC911 \uBD80\uC801\uD569\uD488 \uBC1C\uC0DD\uC218\uB7C9\uACFC \uC2E4\uC81C \uC218\uAC70\uB7C9 \uBE44\uAD50\uB97C \uD1B5\uD55C \uBD80\uC801\uD569\uD488 \uD6C4\uACF5\uC815 \uC720\uCD9C \uBC1C\uC0DD\uC5EC\uBD80 \uC810\uAC80\uD65C\uB3D9 \uC2E4\uC2DC[\uC810\uAC80\uC774\uB825 \uBCF4\uAD00]
    - \uAC1C\uBC1C\uB4F1 \uC2DC\uC81C\uD488 \uC0DD\uC0B0\uC2DC \uC591\uC0B0\uBD80\uD488\uACFC \uD63C\uC785 \uBC29\uC9C0\uB97C \uC704\uD55C \uC2DD\uBCC4 \uBC0F \uACA9\uB9AC \uC808\uCC28 \uC218\uB9BD/\uC900\uC218\uC0C1\uD0DC \uC810\uAC80
    - \uB099\uD558\uD488\uC740 \uCC98\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uCC98\uB9AC\uC774\uB825 \uAD00\uB9AC \uD544\uC694 (\uB099\uD558\uD488 \uC218\uB7C9 \uBC0F \uCC98\uB9AC\uACB0\uACFC \uAE30\uB85D)
       \uC608) \uB099\uD558\uD488\uC740 \uBCC4\uB3C4 \uACA9\uB9AC/\uC2DD\uBCC4\uC870\uCE58\uB97C \uD1B5\uD55C \uD63C\uC785\uBC29\uC9C0 \uBC0F \uD3D0\uAE30 \uB610\uB294 \uC7AC\uC0AC\uC6A9(REWORK) \uACB0\uC815
    \u203B \uC644\uC131\uD488 \uC678\uAD00/\uAE30\uB2A5 \uAC80\uC0AC\uC2DC \uBD80\uC801\uD569 \uCD94\uC815\uD488 \uC120\uBCC4\uB41C \uBD80\uD488\uC740 \uBCC4\uB3C4\uC758 \uC2DD\uBCC4 \uD45C\uAE30\uD6C4 \uB3D9\uC77C \uAC80\uC0AC\uC7A5\uBE44 \uB610\uB294 \uD488\uC9C8 \uC804\uBB38\uAC80\uC0AC\uC6D0\uC744 \uD1B5\uD55C \uC7AC\uAC80\uC0AC \uC9C4\uD589\uD558\uB418,
        2\uCC28 \uAC80\uC0AC NG\uB85C \uD310\uBCC4\uC2DC \uD3D0\uAE30\uCC98\uB9AC\uD558\uACE0 \uC7AC\uAC80\uC0AC \uBC0F \uD3D0\uAE30 \uC774\uB825\uAD00\uB9AC (\uC0DD\uC0B0LOT, \uC7AC\uAC80\uC0AC \uC0AC\uC720, \uC7AC\uAC80\uC0AC \uACB0\uACFC, \uD3D0\uAE30 \uC218\uB7C9 \uB4F1) 
        \uC608) \uC790\uB3D9 \uAC80\uC0AC\uC7A5\uBE44\uB97C \uD1B5\uD55C \uC678\uAD00(Vision)/\uAE30\uB2A5 \uAC80\uC0AC 1\uCC28 NG \u2192 \uB3D9\uC77C\uC7A5\uBE44 2\uCC28 \uC7AC\uAC80\uC0AC \u2192 \uC7AC\uAC80\uC0AC NG\uC2DC \uD3D0\uAE30
             \uC0DD\uC0B0\uB77C\uC778 \uAC80\uC0AC\uC6D0 \uC678\uAD00/\uAE30\uB2A5 \uAC80\uC0AC 1\uCC28 NG \u2192 \uD488\uC9C8\uB2F4\uB2F9 \uC804\uBB38 \uAC80\uC0AC\uC6D0 2\uCC28 \uC7AC\uAC80\uC0AC \u2192 \uC7AC\uAC80\uC0AC NG\uC2DC \uD3D0\uAE30  
              \uB2E8, Rework \uAC00\uB2A5 \uD56D\uBAA9\uC73C\uB85C \uACE0\uAC1D\uC0AC\uC640 \uD611\uC758\uB41C \uBD80\uC801\uD569 \uD56D\uBAA9\uC740 Rework \uC9C4\uD589\uC774 \uAC00\uB2A5\uD558\uB098, Rework \uC9C4\uD589\uD6C4 \uD544\uD788 \uB77C\uC778\uB0B4 \uAC80\uC0AC\uC7A5\uBE44 \uB610\uB294
              \uD488\uC9C8\uB2F4\uB2F9 \uC804\uBB38 \uAC80\uC0AC\uC6D0\uC758 \uC7AC\uAC80\uC0AC \uC9C4\uD589 \uD544\uC694`,es:`\u25A3 Procedimiento y cumplimiento de aislamiento/identificaci\xF3n de producto no conforme (presunto) en recepci\xF3n/proceso/inspecci\xF3n final
- Elaborar en detalle y cumplir los medios de identificaci\xF3n y aislamiento para evitar que el producto no conforme pase al siguiente proceso
- Proceso de manejo del producto no conforme (presunto) y su cumplimiento
- Contar con una caja separada en el proceso para producto no conforme (CAJA ROJA)
- Actividad de revisi\xF3n de fuga de no conformes al siguiente proceso, comparando la cantidad generada en producci\xF3n con la realmente recolectada [conservar historial]
- Procedimiento de identificaci\xF3n y aislamiento para evitar mezcla de prototipos (desarrollo, etc.) con piezas de producci\xF3n, y su cumplimiento
- Piezas ca\xEDdas: definir criterio de manejo y llevar historial (registrar cantidad y resultado)
   ej.) Las piezas ca\xEDdas se a\xEDslan/identifican por separado para evitar mezcla y se decide desecho o reuso (RETRABAJO)
\u203B En la inspecci\xF3n de apariencia/funci\xF3n del producto terminado, las piezas presuntamente no conformes se identifican por separado y se re-inspeccionan con el mismo equipo o un inspector especializado de calidad;
   si la 2\xAA inspecci\xF3n resulta NG se desecha, llevando historial de re-inspecci\xF3n y desecho (LOTE de producci\xF3n, motivo de re-inspecci\xF3n, resultado, cantidad desechada, etc.)
   ej.) Inspecci\xF3n de apariencia (visi\xF3n)/funci\xF3n con equipo autom\xE1tico 1\xAA NG \u2192 2\xAA re-inspecci\xF3n con el mismo equipo \u2192 si NG, desecho
        Inspector de l\xEDnea (apariencia/funci\xF3n) 1\xAA NG \u2192 2\xAA re-inspecci\xF3n por inspector especializado de calidad \u2192 si NG, desecho
        Sin embargo, los no conformes acordados con el cliente como retrabajables pueden retrabajarse, pero tras el retrabajo es obligatoria la re-inspecci\xF3n con equipo de la l\xEDnea o inspector especializado de calidad`},{id:"6_7",c:5,p:20,ko:`\u25A3 \uD488\uC9C8\uC2E4\uC801 \uC810\uAC80 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uAC1C\uC120\uD65C\uB3D9 \uC2E4\uC2DC\uC0C1\uD0DC
    - \uC804\uB144\uB3C4 \uD488\uC9C8 \uC2E4\uC801\uB300\uBE44 \uBAA9\uD45C\uC124\uC815 \uBC0F \uC2E4\uC801 \uC810\uAC80(1\uD68C/\uC6D4)\uC0C1\uD0DC 
          \u21D2 \uACF5\uC815\uBD88\uB7C9 (\uC0DD\uC0B0\uC218\uB7C9, \uBD88\uB7C9\uC218, PPM), \uACE0\uAC1D\uBD88\uB7C9 (\uB0A9\uD488\uC218\uB7C9, \uBD88\uB7C9\uC218, PPM), \uC678\uC8FC\uBD88\uB7C9(\uC785\uACE0\uC218\uB7C9, \uBD88\uB7C9\uC218, PPM)
       \u21D2 \uC804\uCCB4, \uACF5\uC815\uBCC4, \uD488\uBAA9\uBCC4, \uBD88\uB7C9 \uC720\uD615\uBCC4 \uBC0F \uC7A5\uBE44\uBCC4(\uD544\uC694\uC2DC) \uC9D1\uACC4
         \u21D2 \uACF5\uC815\uBD88\uB7C9\uB960 \uC9D1\uACC4 \uC2DC, \uC7AC\uC791\uC5C5 \uC218\uB7C9 \uD3EC\uD568
    - \uBAA9\uD45C \uBBF8\uB2EC\uC2DC \uC6CC\uC2A4\uD2B8 \uD56D\uBAA9\uC5D0 \uB300\uD55C \uADFC\uBCF8\uC801\uC778 \uC6D0\uC778\uBD84\uC11D \uBC0F \uAC1C\uC120\uB300\uCC45 \uC218\uB9BD/\uC720\uD6A8\uC131 \uD3C9\uAC00 \uC2E4\uC2DC\uC0C1\uD0DC
    - \uACE0\uAC1D \uBD88\uB7C9(\uD544\uB4DC \uD074\uB808\uC784) \uBB38\uC81C\uC810\uC5D0 \uB300\uD55C \uACE0\uD488\uBD84\uC11D \uBC0F \uC2DC\uC815\uC870\uCE58 \uD65C\uB3D9 \uC2E4\uC2DC\uC5EC\uBD80`,es:`\u25A3 Proceso de revisi\xF3n de resultados de calidad y mejora
- Metas contra los resultados de calidad del a\xF1o anterior y revisi\xF3n de resultados (1 vez/mes)
     \u21D2 Defecto de proceso (cantidad producida, cantidad de defectos, PPM), defecto de cliente (cantidad entregada, defectos, PPM), defecto de proveedor externo (cantidad recibida, defectos, PPM)
     \u21D2 Concentrar por total, por proceso, por producto, por tipo de defecto y por equipo (si es necesario)
     \u21D2 Al calcular la tasa de defecto de proceso, incluir la cantidad retrabajada
- Si no se alcanza la meta: an\xE1lisis de causa ra\xEDz de los peores \xEDtems, definici\xF3n de acciones de mejora y evaluaci\xF3n de su efectividad
- An\xE1lisis de piezas devueltas y acciones correctivas ante defectos de cliente (reclamos de campo)`},{id:"6_8",c:5,p:10,ko:`\u25A3 \uAC80\uC0AC \uC720\uD6A8\uC131 \uD655\uBCF4\uB97C \uC704\uD55C \uC870\uB3C4\uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC2E4\uD0DC
    - \uC815\uAE30\uC801\uC778 \uC791\uC5C5\uC7A5/ \uAC80\uC0AC\uC7A5 \uC870\uB3C4 \uAD00\uB9AC\uB97C \uC704\uD55C \uC6B4\uC601 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD[\uCE21\uC815\uC7A5\uC18C/\uC2DC\uAC04, \uC870\uB3C4 \uAD00\uB9AC\uAE30\uC900, \uCE21\uC815\uC7A5\uC18C \uC9C0\uC815]
    - \uD45C\uC900\uB958\uB0B4 \uC790\uC8FC/\uC21C\uD68C\uAC80\uC0AC \uC2E4\uC2DC\uAD6C\uAC04 \uC870\uB3C4\uAD00\uB9AC \uD3EC\uC778\uD2B8 \uB204\uB77D\uC5EC\uBD80
     \u203B \uC57C\uAC04\uC791\uC5C5 \uB4F1 \uACE0\uB824 \uC77C\uBAB0\uD6C4 \uC870\uB3C4\uCE21\uC815 \uC2E4\uC2DC, \uCE21\uC815\uC0B0\uD3EC \uCD5C\uC18C\uD654 \uBAA9\uC801 \uAC80\uC0AC\uC704\uCE58 \uC9C0\uC815 \uBC0F \uC190 \uBBF8\uAC70\uCE58 \uC870\uAC74 
        \uC870\uB3C4\uCE21\uC815 \uC2E4\uC2DC \uB4F1`,es:`\u25A3 Proceso y cumplimiento del control de iluminaci\xF3n para asegurar la validez de la inspecci\xF3n
- Definir proceso de operaci\xF3n para el control peri\xF3dico de iluminaci\xF3n en \xE1reas de trabajo/inspecci\xF3n [lugar/hora de medici\xF3n, criterio de iluminaci\xF3n, lugares de medici\xF3n designados]
- \xBFFaltan puntos de control de iluminaci\xF3n en las zonas de autoinspecci\xF3n/inspecci\xF3n de rondas de los est\xE1ndares?
  \u203B Considerando el trabajo nocturno, medir la iluminaci\xF3n despu\xE9s del atardecer; designar la posici\xF3n de inspecci\xF3n para minimizar dispersi\xF3n de medici\xF3n y medir sin apoyar la mano, etc.`},{id:"6_9",c:5,p:20,ko:`\u25A3 3\uC815 5\uD589 \uAD00\uB9AC \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD \uBC0F \uC900\uC218\uC2E4\uD0DC
    - \uC815\uAE30\uC801\uC778 3\uC8155\uD589 \uD604\uC7A5\uAC1C\uC120 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD 
      (\uC810\uAC80 \uCCB4\uD06C\uC2DC\uD2B8 \uC791\uC131, \uC810\uAC80 \uC8FC\uAE30, \uC5C5\uBB34 \uBD84\uB2F4, \uC9C0\uC801\uC0AC\uD56D \uAC1C\uC120 \uC2DC\uC815\uC870\uCE58 \uC644\uB8CC\uC5EC\uBD80] 
    - \uD604\uC7A5\uC810\uAC80\uC2DC 3\uC815 5\uD589 \uAD00\uB9AC\uC2E4\uD0DC`,es:`\u25A3 Proceso y cumplimiento de 3 Definiciones 5 Acciones (3\uC815 5\uD589 / 5S)
- Proceso peri\xF3dico de mejora en piso de 3\uC8155\uD589
  (elaboraci\xF3n de checklist, frecuencia de revisi\xF3n, reparto de tareas, cierre de acciones correctivas de lo observado)
- Estado de la gesti\xF3n de 3\uC8155\uD589 en la revisi\xF3n de piso`},{id:"6_10",c:5,p:10,ko:`\u25A3 \uBD88\uB7C9\uBD80\uD488 REWORK\uC2DC \uAD00\uB9AC\uAE30\uC900 \uC218\uB9BD \uBC0F \uC774\uD589 \uC0C1\uD0DC
    - \uB9AC\uC6CC\uD06C \uAC00\uB2A5\uBD80\uD488 \uC120\uC815\uAE30\uC900 \uC218\uB9BD \uBC0F \uAD00\uB9AC\uC0C1\uD0DC
    - \uB9AC\uC6CC\uD06C \uAE08\uC9C0\uBD80\uD488\uC740 \uD3D0\uAE30 \uCC98\uBD84 \uBC0F \uC774\uB825\uAD00\uB9AC
    - \uB9AC\uC6CC\uD06C\uD488 \uC0AC\uC591\uD655\uC778 LOT \uCD94\uC801\uC131 \uBC0F \uC120\uC785\uC120\uCD9C \uAD00\uB9AC\uC0C1\uD0DC 
    - \uBD88\uB7C9\uBD80\uD488 REWORK\uC2DC \uD488\uC9C8\uAC80\uC0AC\uD56D\uBAA9 \uC124\uC815 \uBC0F REWORK \uC804\uD6C4 \uAC80\uC0AC \uC774\uB825 \uC720\uC9C0 \uAD00\uB9AC\uC0C1\uD0DC
    - REWORK \uC804/\uD6C4 \uBD80\uD488\uC758 \uC2DD\uBCC4 \uAD00\uB9AC\uAE30\uC900 \uBC0F \uC900\uC218\uC0C1\uD0DC
    - REWORK \uC81C\uD488\uC758 \uCD9C\uD558 \uC808\uCC28 \uC900\uC218 \uC0C1\uD0DC
    - REWORK  \uC791\uC5C5\uC744 \uC704\uD55C \uBCC4\uB3C4 \uACF5\uAC04 \uC6B4\uC601\uC2DC \uC791\uC5C5\uC744 \uC704\uD55C TOOL \uBC0F \uC790\uC7AC\uC758 \uBE44\uCE58 \uC0C1\uD0DC`,es:`\u25A3 Criterios y cumplimiento del RETRABAJO (REWORK) de piezas defectuosas
- Criterio de selecci\xF3n de piezas retrabajables y su control
- Las piezas con retrabajo prohibido se desechan y se lleva historial
- Verificaci\xF3n de especificaci\xF3n del producto retrabajado, trazabilidad por LOTE y control PEPS
- \xCDtems de inspecci\xF3n de calidad en el retrabajo y mantenimiento del historial de inspecci\xF3n antes/despu\xE9s del retrabajo
- Criterio y cumplimiento de identificaci\xF3n de piezas antes/despu\xE9s del retrabajo
- Cumplimiento del procedimiento de embarque de productos retrabajados
- Si hay un espacio separado para retrabajo: disponibilidad de herramientas y materiales para el trabajo`},{id:"6_11",c:5,p:10,ko:`\u25A3 \uACF5\uC815 \uB204\uB77D \uBC29\uC9C0\uB97C \uC704\uD55C \uC791\uC5C5\uD658\uACBD \uC124\uC815 \uC0C1\uD0DC
    - \uC81C\uD488 \uC0DD\uC0B0\uC2DC \uACF5\uC815 \uB204\uB77D \uBC29\uC9C0\uB97C \uC704\uD55C \uC791\uC5C5\uD658\uACBD \uAD6C\uCD95 \uC0C1\uD0DC(\uACF5\uC815\uC774\uB3D9 \uC804\uD45C \uD65C\uC6A9 \uB4F1) 
    - \uC81C\uD488 \uC0DD\uC0B0\uC2DC \uC790\uC7AC \uC18C\uC9C4\uC5D0 \uC758\uD55C \uBD80\uD488 \uBC0F \uBD80\uC790\uC7AC\uB4F1 \uB204\uB77D \uBC29\uC9C0 \uBC29\uC548 \uC6B4\uC601 \uC0C1\uD0DC
        \u2192 \uC815\uAE30\uC801\uC778 \uBD80\uC790\uC7AC \uC785\uACE0/\uC18C\uC9C4\uB7C9\uACFC \uC644\uC81C\uD488 \uC0DD\uC0B0\uC2E4\uC801 \uBE44\uAD50\uAC80\uC99D \uD65C\uB3D9 \uC2E4\uC2DC \uB4F1 `,es:`\u25A3 Entorno de trabajo para prevenir omisi\xF3n de procesos
- Estado del entorno de trabajo para prevenir omisi\xF3n de procesos en la producci\xF3n (uso de vales de traslado entre procesos, etc.)
- Operaci\xF3n de medidas para evitar omisi\xF3n de piezas y auxiliares por agotamiento de material durante la producci\xF3n
    \u2192 ej.) verificaci\xF3n peri\xF3dica de entradas/consumo de auxiliares contra la producci\xF3n de producto terminado`},{id:"6_12",c:5,p:20,ko:`\u25A3 \u300E\uC815\uC131\uD488\uC9C8\u300F \uC6B4\uC601 \uD504\uB85C\uC138\uC2A4\uB294 \uB9C8\uB828\uB418\uC5B4 \uC788\uACE0, \uC810\uAC80 \uBC0F \uD3EC\uC0C1\uD65C\uB3D9\uC740 \uC2E4\uC2DC\uB418\uB294\uAC00?
   \u25B7\u300E\uC815\uC131\uD488\uC9C8\u300F \uD65C\uB3D9 \uAD00\uB828 \uC5C5\uBB34\uBD84\uC7A5(\uD0A4\uB9E8)
\xA0\xA0\xA0\xA0 - \u300E\uC815\uC131\uD488\uC9C8\u300F \uC218\uD3C9\uC804\uAC1C \uAD50\uC721 \uB2F4\uB2F9/ \uD488\uC9C8\uBB38\uC81C \uBC1C\uC0DD\uC2DC \uAC1C\uC120\uD65C\uB3D9 \uB2F4\uB2F9/ \uACE0\uAC1D\uC0AC \uD611\uC5C5 \uB2F4\uB2F9 \uB4F1
  \u25B7 \uC815\uC131\uD488\uC9C8 \uD1B5\uC2E0\uBB38 \uD488\uC9C8\uD604\uD669\uD310 \uAC8C\uC2DC \uBC0F \uC0AC\uB0B4 \uC784\uC9C1\uC6D0 \uC804\uD30C\uAD50\uC721 \uC2E4\uC2DC \uC774\uB825 \uAD00\uB9AC
  \u25B7\uC81C\uC870\uD604\uC7A5 \u300E\uC815\uC131\uD488\uC9C8\u300F\uAD00\uB828 \uC608\uBC29/\uAC1C\uC120 \uD504\uB85C\uC138\uC2A4 \uC218\uB9BD(\uC81C\uC870\uD604\uC7A5 \uBC18\uC601\uB0B4\uC5ED \uD655\uC778)
\xA0\xA0\xA0\xA0 - \uC608\uBC29\uD65C\uB3D9 : \uD734\uBA3C\uC5D0\uB7EC \uBC1C\uC0DD \uC608\uBC29\uC744 \uC704\uD55C \uC791\uC5C5\uC790/\uACF5\uC815/\uC124\uBE44 \uB4F1 \uC608\uBC29\uC810\uAC80 \uAC1C\uC120 \uC774\uB825
\xA0\xA0\xA0\xA0 - \uAC1C\uC120\uD65C\uB3D9 : \uC911\uC694 \uD488\uC9C8\uBB38\uC81C(\uC791\uC5C5\uC790 \uD734\uBA3C\uC5D0\uB7EC) \uBC1C\uC0DD\uC2DC \uD574\uB2F9 \uACF5\uC815 \uC2DC\uC815\uC870\uCE58 \uD65C\uB3D9 \uC774\uB825

      ej.) Al verificar en piso: dificultad de ensamble manual, horas-hombre poco claras, posibilidad de ensamble inverso/err\xF3neo, cumplimiento de est\xE1ndares por personal nuevo/temporal, etc.
           identificar \xEDtems por mejorar de \u300ECalidad Meticulosa\u300F
